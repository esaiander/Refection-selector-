rvices have automobile insurance; and\n\nR. Submit a provider renewal application at least 60 days before expiration of its existing approval. The renewal license is good for a 3 year period unless otherwise noted in the approval letter.\n\nStaff working for or contracted with the agency as well as volunteers utilized in providing any direct support services or spend any time alone with a participant must meet the following minimum standards:\n\nBe at least 18 years old;\n\nHave DDA required credentials, license, or certification;\n\nPossess current First Aid and CPR certification or Emergency Medical Technician (EMT);\n\nThe First Aid and CPR training must include a hands-on, in-person component.\n\nAt minimum, employees must participate in an in-person skills session that will require them to show that they are able to perform CPR and First Aid skills.\n\nWritten materials may be used online and at the employee's own pace.\n\nUnlicensed staff paid to administer medication and/or perform treatments must be certified by the MBON as Medication Technicians;\n\nPass a criminal background investigation and any other required background checks and credentials verifications as provided in Appendix C-2-a;\n\nComplete necessary pre/in-service training based on the PCP;\n\nSatisfactorily complete required orientation and training designated by DDA;\n\nPossess a valid driver’s license, if the operation of a vehicle is necessary to provide services; and\n\nHave automobile insurance for all automobiles that are owned, leased, and/or hired and used in the provision of services.\n\nMDH for approval of certified providers.\n\nProvider for verification of individual staff members’ licenses, certifications, and training.\n\nMDH Verification– Initially and at least every 3 years.\n\nProvider Verification – Prior to service delivery and continuing thereafter","url":"","verified":"","notes":"","row":4},{"id":"md-supported-employment-waiver","state":"MD","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"A. Supported Employment services include a variety of supports to help an individual identify career and employment interest, as well as to find and keep a job.\n\nB. Supported Employment activities include:\n\n1. Individualized job development and placement;\n\n2. On-the-job training in work and work-related skills;\n\n3. Facilitation of natural supports in the workplace;\n\n4. Ongoing support and monitoring of the individual's performance on the job;\n\n5. Training in related skills needed to obtain and retain employment such as using community resources and public transportation;\n\n6. Negotiation with prospective employers; and\n\n7. Self-employment supports.\n\nC. Supported Employment services include:\n\n1. Direct support services that enable the participant to gain and maintain competitive integrated employment, as provided in Sections A-B above;\n\n2. The following services provided in combination with, and incidental to, the provision of this Waiver program service:\n\na. Transportation to, from, and within this Waiver program service;\n\nb. Delegated nursing tasks, based on the participant’s assessed need;\n\nc. Personal care assistance, based on the participant’s assessed need; and\n\n3. Nursing Support Services. The scope of the Nursing Support Services is defined under the stand-alone service in Appendix C.","url":"","verified":"","notes":"","row":5},{"id":"md-supported-employment-service-requirement-waiver","state":"MD","title":"Supported Employment - Service Requirement (Waiver)","name":"Supported Employment - Service Requirement","source":"Waiver","category":"employment","topic":"provider","text":"A. The participant must be 18 years of age or older and no longer enrolled in primary or secondary school.\n\nB. Services and supports are provided for participants in finding and keeping jobs paid by a community employer including self-employment.\n\nC. The level of staffing and meaningful activities provided to the participant under this Waiver program service must be based on the participant’s assessed level of service need.\n\nD. Under the Traditional Service Delivery System, Supported Employment is paid based on a daily rate, requiring that a minimum of 4 hours of this Waiver program service be provided in order to be paid. Participants can engage in Supported Employment activities when they are unable to work 4 hours.\n\nE. Under the Traditional Service Delivery Model, a participant’s PCP may include a mix of employment and day related\n\ndaily Waiver services units such as Day Habilitation, Community Development Services, Career Exploration, and Employment Discovery and Customization provided on different days.\n\nF. Supported Employment services does not include:\n\n1. Volunteering, apprenticeships, or internships unless it is part of the discovery process and time limited; and\n\n2. Payment for supervision, training, supports and adaptations typically available to other workers without disabilities filling similar positions.\n\nG. Medicaid funds cannot be used to defray the expenses associated with starting up or operating a business.\n\nH. If transportation is provided as part of this Waiver program service, then:\n\n1. The participant cannot receive Transportation services separately at the same time as provision of this Waiver program service;\n\n2. The provider or participants self-directing their services must:\n\na. Provide, or arrange for provision of, transportation to meet the needs of the participant identified in the participant’s PCP;\n\nand\n\nb. Use the most cost-effective mode of transportation, with priority given to the use of public transportation; and\n\n3. Transportation services may not compromise the entirety of this Waiver program service.\n\nI. If direct support staff perform delegated nursing tasks as part of this Waiver program service, then:\n\n1. The participant must receive Nursing Support Services under this Waiver program; and\n\n2. The delegated nursing tasks:\n\na. Must be provided by direct support staff who are currently certified as a Medication Technician by the MBON; and\n\nb. May not compromise the entirety of this Waiver program service.\n\nJ. If personal care assistance services are provided as part of this Waiver program service, then the personal care assistance may not comprise the entirety of the service. For purposes of this Waiver program service, personal care assistance means the provision of supports to assist a participant in performing activities of daily living and instrumental activities of daily living.\n\nK. A relative of a participant (who is not a spouse) may be paid to provide this service, in accordance with the applicable requirements set forth in Appendix C-2.\n\nL. A relative of a participant may not be paid for more than 40-hours per week of services.\n\nM. Prior to accessing DDA funding for this service, all other available and appropriate funding sources, including those services offered by Maryland Medicaid State Plan, MSDE, DORS, DHS, or any other federal, or State government funding program must be explored and exhausted to the extent applicable.\n\nThese efforts must be documented in the participant’s file.\n\nIf these services are deemed by the participant's person-centered planning team to be inappropriate to meet the specific needs of the participant, the exploration efforts and reasons that these services do not meet the participant's needs shall be documented in the participant's PCP. The DDA has authority to determine if further efforts must be made, and documented, prior to authorization of funding for the service under the Waiver program.\n\nN. Documentation must be maintained in the file of each individual receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).\n\nO. Until the service transitions to the LTSSMaryland system, Supported Employment Services daily service units are not available:\n\n1. On the same day a participant is receiving Career Exploration, Community Development Services, Day Habilitation, Medical Day Care, or Employment Discovery and Customization services under the Traditional Services Delivery Model; and\n\n2. At the same time as the direct provision of Behavioral Support Services, Community Living—Enhanced Supports, Community Living-Group Homes, Nursing Support Services, Personal Supports, Respite Care Services, Shared Living, Supported Living, or Transportation services.\n\nA. Services which are provided virtually, must:\n\n1. Be provided in accordance with federal and State requirements, policies, guidance, and regulations, including HIPAA and the HITECH Act and their applicable regulations to protect the privacy and security of the participant’s protected health information;\n\n2. Support a participant to reach identified outcomes in their PCP;\n\n3. Not be used for the provider's convenience; and\n\n4. The Waiver program will not fund any costs associated with the provider obtaining, installing, implementing, or using virtual supports, such as equipment, internet, software applications, and other related expenses. These costs, in the delivery of new business models, are part of the provider's operating cost","url":"","verified":"","notes":"","row":6},{"id":"md-supported-employment-agency-specifications-waiver","state":"MD","title":"Supported Employment - Agency Specifications(Waiver)","name":"Supported Employment - Agency Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Agencies must meet the following standards:\n\nComplete the DDA provider application and be certified based on compliance with meeting all of the following standards:\n\nA. Be properly organized as a Maryland corporation, or, if operating as a foreign corporation, be properly registered to do business in Maryland;\n\nB. A minimum of 5 years demonstrated experience and capacity providing quality similar services;\n\n C. Have a governing body that is legally responsible for overseeing the management and operation of all programs conducted by the licensee including ensuring that each aspect of the agency’s programs operates in compliance with all local, State, and federal requirements, applicable laws, and regulations;\n\n D. Except for currently DDA licensed or certified Supported Employment providers, demonstrate the capability to provide or arrange for the provision of all services required by submitting, at a minimum, the following documents with the application:\n\n(1) A program service plan that details the agencies service delivery model;\n\n(2) A business plan that clearly demonstrates the ability of the agency to provide Supported Employment services;\n\n(3) A written quality assurance plan to be approved by the DDA;\n\n(4) A summary of the applicant's demonstrated experience in the field of developmental disabilities; and\n\n(5) Prior licensing reports issued within the previous 10 years from any in-State or out-of-State entity associated with the applicant, including deficiency reports and compliance records.\n\nE. If currently licensed or certified, produce, upon written request from the DDA, the documents required under D;\n\nF. Be in good standing with the IRS and MDAT;\n\nG. Have Workers’ Compensation Insurance;\n\nH. Have Commercial General Liability Insurance;\n\n I. Submit results from required criminal background checks, Medicaid Exclusion List, and child protective clearances as provided in Appendix C-2-a and per DDA policy;\n\nJ. Submit documentation of staff certifications, licenses, and/or trainings as required to perform services;\n\nK. Complete required orientation and training;\n\nL. Comply with the DDA standards related to provider qualifications; and\n\nM. Have a signed DDA Provider Agreement for Conditions for Participation.\n\nHave a signed Medicaid Provider Agreement\n\nHave documentation that all vehicles used in the provision of services have automobile insurance; and\n\nSubmit a provider renewal application at least 60 days before expiration of its existing approval as per DDA policy.\n\nThe DDA Deputy Secretary may waive the requirements noted above if an agency is licensed or certified by another State agency or accredited by a national accreditation agency, such as CQL or CARF for similar services for individuals with developmental disabilities, and be in good standing with the IRS and MDAT.\n\nStaff working for or contracted with the agency as well as volunteers utilized in providing any direct support services or spend any time alone with a participant must meet the following minimum standards:\n\nBe at least 18 years old;\n\nHave required credentials, license, or certification as noted below;\n\nPossess current First Aid and CPR certification;\n\nUnlicensed staff paid to administer medication and/or perform treatments must be certified by the MBON as Medication Technicians;\n\nPass a criminal background investigation and any other required background checks and credentials verifications as provided in Appendix C-2-a;\n\nComplete required orientation and training designated by the DDA;\n\nComplete necessary pre/in-service training based on the PCP;\n\nPossess a valid driver’s license, if the operation of a vehicle is necessary to provide services; and\n\nHave automobile insurance for all automobiles that are owned, leased, and/or hired and used in the provision of services.\n\nDDA for approval of certified provider - Initially and at least every 3 years\n\nProvider for verification of individual staff members’ licenses, certifications, and training - Prior to service delivery and continuing thereafter.","url":"","verified":"","notes":"","row":7},{"id":"md-supported-employment-professional-individual-provider-specif","state":"MD","title":"Supported Employment Professional Individual Provider Specifications","name":"Supported Employment Professional Individual Provider Specifications","source":"","category":"employment","topic":"provider","text":"Individual must complete the DDA provider application and be certified based on compliance with meeting the following standards:\n\nBe at least 18 years old;\n\nPossess current First Aid and CPR certification;\n\nUnlicensed staff paid to administer medication and/or perform treatments must be certified by the MBON as Medication Technicians;\n\nPass a criminal background investigation and any other required background checks and credentials verifications as provided in Appendix C-2-a;\n\nPossess a valid driver’s license, if the operation of a vehicle is necessary to provide services;\n\nHave automobile insurance for all automobiles that are owned, leased, and/or hired and used in the provision of services;\n\nComplete required orientation and training designated by the DDA;\n\nComplete necessary pre/in-service training based on the PCP;\n\nHave 3 professional references which attest to the provider’s ability to deliver the support/service in compliance with the Department’s values in Annotated Code of Maryland, Health General, Title 7;\n\nDemonstrate financial integrity through the IRS, Department, and Medicaid Exclusion List checks;\n\nHave a signed DDA Provider Agreement for Conditions for Participation; and\n\nHave a signed Medicaid Provider Agreement.\n\nDDA for approval of certified Supported Employment Professional - initially and at least every 3 years.","url":"","verified":"","notes":"","row":8},{"id":"md-employment-discovery-and-customization-waiver","state":"MD","title":"Employment Discovery & Customization (Waiver)","name":"Employment Discovery & Customization","source":"Waiver","category":"career","topic":"definition","text":"A. Employment Discovery and Customization services are time limited services to identify and develop customized employment options for participants working towards competitive integrated employment or self-employment.\n\nB. Employment Discovery is a time-limited comprehensive, person-centered, community-based employment planning process. The Employment Discovery process and activities include:\n\nCompleting assessment and employment-related profiles in a variety of community settings;\n\nAssessment of the community surrounding the participant’s home;\n\nWork skills and interest inventory;\n\nCommunity-based job trials and community-based situations in order to identify skills, interest, and learning style;\n\nIdentification of the ideal conditions for employment for the participant which may include self-employment; and\n\nDevelopment of an Employment Discovery Profile with all pertinent information about the participant’s skills, job preferences, possible contributions to an employer, and useful social networks. The profile may also include a picture or written resume.\n\nC. Customization is support to assist a participant to obtain a negotiated competitive integrated job or self-employment. The Customization process and activities include:\n\nThe use of the participant’s social network, community resources and relationships, the American Job’s Centers, and provider business contacts to identify possible employers.\n\nFlexible strategies designed to assist in obtaining a negotiated competitive integrated job including: (a) job development, (b) job carving, (c) job sharing, (d) self-employment; and other national recognized best practices, based on the needs of both the job seeker and the business needs of the employer.\n\nD. Employment Discovery and Customization does not include volunteering, apprenticeships, or internships unless it is part of the discovery process and time limited.\n\nE. This Waiver program service includes provision of:\n\nDirect support services, for provision of services as provided in Sections A-C above; and\n\nThe following services provided in combination with, and incidental to, the provision of this Wavier program service: a. Transportation to and from and within this Waiver program service; b. Personal care assistance, based on the participant’s assessed need.","url":"","verified":"","notes":"","row":9},{"id":"md-employment-discovery-and-customization-service-requirements-","state":"MD","title":"Employment Discovery & Customization – Service Requirements (Waiver)","name":"Employment Discovery & Customization – Service Requirements","source":"Waiver","category":"career","topic":"provider","text":"A. The participant must be 18 years of age or older and no longer enrolled in primary or secondary school.\n\nB. Employment Discovery and Customization services and supports are provided for participants wanting to work in\n\ncompetitive integrated jobs paid by a community employer or through self-employment.\n\nC. Until the service transitions to the LTSSMaryland system, under the traditional service delivery model, a participant’s PCP may include a mix of employment and day related daily  Waiver services such as Day Habilitation, Community Development Services, Career Exploration, and Supported Employment Services provided on different days.\n\nD. Beginning July 1, 2020, a participant’s PCP may include a mix of employment and day related hourly Waiver services such as Day Habilitation, Community Development Services, Career Exploration, and Employment Services provided at different times.\n\nE. If transportation is provided as part of this Waiver program service, then:\n\nThe participant cannot receive Transportation services separately at the same time as provision of this Waiver program service;\n\nThe Provider must:\n\na. Provide, or arrange for provision of, transportation to meet the needs of the participant identified in the participant’s PCP; and\n\nb. Use the most cost-effective mode of transportation, with priority given to the use of public transportation; and\n\nTransportation services may not compromise the entirety of this Waiver program service\n\nF. If personal care assistance services are provided as part of this Waiver program service, then the personal care assistance may not comprise the entirety of the service. For purposes of this Waiver program service, personal care assistance means the provision of supports to assist a participant in performing activities of daily living and instrumental activities of daily living.\n\nG. Until the service transitions to the LTSSMaryland system, Employment Discovery and Customization daily services units are not available:\n\nOn the same day a participant is receiving Career Exploration, Community Development Services, Day Habilitation, Medical Day Care, or Supported Employment services under the Traditional Services Delivery Model; and\n\nAt the same time as the direct provision of Behavioral Support Services, Community Living—Enhanced Supports, Community Living-Group Homes, Nursing Support Services, Personal Supports, Respite Care Services, Shared Living, Supported Living, or Transportation services\n\nH. Prior to accessing DDA funding for this service, all other available and appropriate funding sources, including those\n\nservices offered by Maryland Medicaid State Plan, MSDE, DORS, and DHS or any other federal, or State government funding program must be explored and exhausted to the extent applicable.\n\nThese efforts must be documented in the participant’s file.\n\nIf these services are deemed by the participant’s person-centered planning team to be inappropriate to meet the specific needs of the participant, the exploration efforts and reasons that these services do not meet the participant’s needs shall be documented in the participant’s PCP. The DDA has authority to determine if further efforts must be made, and documented, prior to authorization of funding for the service under the Waiver program.\n\nI. To the extent any listed services are covered under the Medicaid State Plan, the services under the waiver will be limited to additional services not otherwise covered under the Medicaid State Plan, but consistent with waiver objectives of avoiding institutionalization.\n\nJ. Documentation must be maintained in the file of each participant receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 USC 1401 et seq.).\n\nK. A legally responsible person, relative, or legal guardian of the participant cannot be paid by the Waiver program, either directly or indirectly, to provide this Waiver program service","url":"","verified":"","notes":"","row":10},{"id":"md-employment-discovery-and-customization-limits-waiver","state":"MD","title":"Employment Discovery & Customization - Limits (Waiver)","name":"Employment Discovery & Customization - Limits","source":"Waiver","category":"career","topic":"limits","text":"Employment Discovery and Customization activities must be completed within a 6 month period unless otherwise authorized by the DDA.\n\nEmployment Discovery and Customization services may not exceed a maximum of 8 hours per day or 40 hours per week, including in combination with any of the following other Waiver program services in a single day: Supported Employment, Career Exploration, Community Development Services, and Day Habilitation services.","url":"","verified":"","notes":"","row":11},{"id":"md-employment-discovery-and-customization-agency-specifications","state":"MD","title":"Employment Discovery & Customization – Agency Specifications (Waiver)","name":"Employment Discovery & Customization – Agency Specifications","source":"Waiver","category":"career","topic":"provider","text":"Agencies must meet the following standards:\n\nComplete the DDA provider application and be certified based on compliance with meeting all of the following standards:\n\nA. Be properly organized as a Maryland corporation, or, if operating as a foreign corporation, be properly registered to do\n\nbusiness in Maryland;\n\nB. A minimum of 5 years demonstrated experience and capacity providing quality similar services;\n\nC. Have a governing body that is legally responsible for overseeing the management and operation of all programs conducted by the licensee including ensuring that each aspect of the agency’s programs operates in compliance with all\n\nlocal, State, and federal requirements, applicable laws, and regulations;\n\nD. Except for currently DDA licensed or certified Employment Discovery and Customization providers, demonstrate the capability to provide or arrange for the provision of all services required by submitting, at a minimum, the following documents with the application:\n\n1. Be properly organized as a Maryland corporation, or, if operating as a foreign corporation, be properly registered to do business in Maryland;\n\n2.A minimum of 5 years demonstrated experience and capacity providing quality similar services;\n\n3. Have a governing body that is legally responsible for overseeing the management and operation of all programs\n\nconducted by the licensee including ensuring that each aspect of the agency’s programs operates in compliance with all local, State, and federal requirements, applicable laws, and regulations;\n\n4. Except for currently DDA licensed or certified Employment Discovery and Customization providers, demonstrate the capability to provide or arrange for the provision of all services required by submitting, at a minimum, the following documents with the application:\n\n5.Prior licensing reports issued within the previous 10 years from any in-State or out-of-State entity associated with the applicant, including deficiency reports and compliance records.\n\nE. If currently licensed or certified, produce, upon written request from the DDA, the documents required under D;\n\nF. Be in good standing with the IRS and MDAT;\n\nG. Have Workers’ Compensation Insurance;\n\nH. Have Commercial General Liability Insurance;\n\nI. Submit results from required criminal background checks, Medicaid Exclusion List, and child protective clearances as provided in Appendix C-2-a and per DDA policy;\n\nJ. Submit documentation of staff certifications, licenses, and/or trainings as required to perform services;\n\nK. Complete required orientation and training;\n\nL. Comply with the DDA standards related to provider qualifications; and\n\nM. Complete and sign any agreements required by the MDH or DDA.\n\nN. All new providers must meet and comply with the federal community settings regulations and requirements;\n\nO. Have a signed Medicaid Provider Agreement;\n\nHave documentation that all vehicles used in the provision of services have automobile insurance; and\n\nSubmit a provider renewal application at least 60 days before expiration of its existing approval as per DDA policy.\n\nThe DDA Deputy Secretary may waive the requirements noted above if an agency is licensed or certified by another State\n\nagency or accredited by a national accreditation agency, such as CQL or CARF for similar services for individuals with developmental disabilities, and be in good standing with the IRS and MDAT.\n\nStaff working for or contracted with the agency as well as volunteers utilized in providing any direct support services or spend any time alone with a participant must meet the following minimum standards:\n\nBe at least 18 years old;\n\nHave required credentials, license, or certification as noted below;\n\nPossess current First Aid and CPR certification;\n\nPass a criminal background investigation and any other required background checks and credentials verifications as provided in Appendix C-2-a;\n\nComplete necessary pre/in-service training based on the PCP;\n\nComplete required orientation and training designated by DDA;\n\nUnlicensed direct support professional staff who administer medication or perform delegable nursing tasks as part of this Waiver service must be certified by the MBON as Medication Technicians, except if the participant and their medication administration or nursing tasks qualifies for exemption from nursing delegation pursuant to COMAR 10.27.11;\n\nPossess a valid driver’s license, if the operation of a vehicle is necessary to provide services; and\n\nHave automobile insurance for all automobiles that are owned, leased, and/or hired and used in the provision of services\n\nDDA for approval of provider to provide service – verification initially and at least every 3 years\n\nProvider for verification of individual staff members’ licenses, certifications, and training – verification prior to service delivery and continuing thereafter.","url":"","verified":"","notes":"","row":12},{"id":"md-employment-discovery-and-customization-individual-profession","state":"MD","title":"Employment Discovery & Customization – Individual Professional Specifications (Waiver)","name":"Employment Discovery & Customization – Individual Professional Specifications","source":"Waiver","category":"career","topic":"provider","text":"Individual must complete the DDA provider application and be certified based on compliance with meeting the following standards:\n\nBe at least 18 years old;\n\nPossess current First Aid and CPR certification;\n\nPass a criminal background investigation and any other required background checks and credentials verifications as provided in Appendix C-2-a;\n\nPossess a valid driver’s license, if the operation of a vehicle is necessary to provide services;\n\nHave automobile insurance for all automobiles that are owned, leased, and/or hired and used in the provision of services;\n\nUnlicensed direct support professional staff who administer medication or perform delegable nursing tasks as part of this Waiver service must be certified by the MBON as Medication Technicians, except if the participant and their medication administration or nursing tasks qualifies for exemption from nursing delegation pursuant to COMAR 10.27.11;\n\nComplete required orientation and training designated by the DDA;\n\nComplete necessary pre/in-service training based on the PCP;\n\nHave 3 professional references which attest to the provider’s ability to deliver the support/service in compliance with the Department’s values in Annotated Code of Maryland, Health General, Title 7;\n\nDemonstrate financial integrity through IRS, Department, and Medicaid Exclusion List checks;\n\nComplete and sign any agreements required by the MDH or DDA; and\n\nHave a signed Medicaid Provider Agreement\n\nDDA for the approval of the certified professional – verification Initially and at least every 3 years.\n\nFMCS provider, as described in Appendix E, for participant’s self-directing services - Prior to service delivery and continuing thereafter.","url":"","verified":"","notes":"","row":13},{"id":"md-ongoing-individual-supported-employment-waiver","state":"MD","title":"Ongoing Individual Supported Employment (Waiver)","name":"Ongoing Individual Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Employment Services are designed to assist individuals identify, obtain, and maintain competitive and integrated employment positions within their community. Employment Services provides the participant with a variety of flexible supports to help the participant to identify career and employment interest, find and keep a job including:\n\nDiscovery – a process to assist the participant in finding out who they are, what they want to do, and what they have to offer;\n\nJob Development – supports finding a job including customized employment and self-employment;\n\nOngoing Job Supports – various supports a participant may need to successfully maintain and advance their job. This includes Nursing Support Services based on assessed need. The scope of the Nursing Support Services is defined under the stand-alone service in Appendix C;\n\nFollow Along Supports – periodic supports after a participant has transitioned into their job;\n\nSelf-Employment Development Supports – supports to assist a participant whose discovery activities and profile indicate a specific skill or interest that would benefit from resource ownership or small business operation; and\n\nCo-Worker Employment Support-supports in a situation when an employer has identified that an onsite job coach would not be optimal, yet the participant could still benefit from additional supports.","url":"","verified":"","notes":"","row":14},{"id":"md-discovery-waiver","state":"MD","title":"Discovery (waiver)","name":"Discovery","source":"waiver","category":"career","topic":"definition","text":"Discovery is a time limited, comprehensive, person-centered, and community-based employment planning support service to assist the participant to identify the participant’s abilities, conditions for success, and interests. Discovery includes:\n\nA visit to a participant’s home and/or community location, a review of community employers, job trials, interest inventory to create a profile and visual resume that includes the use of images and graphics to highlight a job seeker's skills and abilities;\n\nThe development of a Discovery Profile; and\n\nAn Employment Plan including a summary of all activities completed during the Discovery process, a visual resume, and a documentation of next steps and action items.","url":"","verified":"","notes":"","row":15},{"id":"md-job-development-waiver","state":"MD","title":"Job Development (waiver)","name":"Job Development","source":"waiver","category":"employment","topic":"definition","text":"Job Development is support for a participant to obtain an individual job or explore new employment alternatives in a competitive integrated employment setting in the general workforce, including:\n\nCustomized employment – a flexible process designed to personalize the employment relationship between a job candidate and an employer in a way that meets the needs of both. It is based on an individualized match between the strengths, conditions, and interests of a job candidate and the identified business needs of an employer;\n\nSelf-employment – including exploration of how a participant’s interests, skills and abilities might be suited for the development of business ownership; and\n\nDirect and Indirect Supports – Strategic combination of both direct and indirect services. Direct service job development should entail at least 50% of this service. Indirect service can entail up to 50% of this service but needs to be directly related to the person's job related outcomes.","url":"","verified":"","notes":"","row":16},{"id":"md-ongoing-job-supports-waiver","state":"MD","title":"Ongoing Job Supports (Waiver)","name":"Ongoing Job Supports","source":"Waiver","category":"employment","topic":"definition","text":"Ongoing Job Supports are supports in learning and completing job tasks either when beginning a new job, after a promotion, or after a significant change in duties or circumstances and individualized supports a participant may need to successfully maintain their job. Ongoing Job Supports include:\n\nJob coaching (e.g., job tasks analysis and adaptations, self-management strategies, natural and workplace supports facilitation, and fading assistance), needed to complete job tasks like setting up workstations;\n\nThe facilitation of natural supports in the workplace;\n\nSystematic instruction and other learning strategies based on the participant’s learning style and needs;\n\nTravel training to independently get to the job; and\n\nPersonal care assistance, behavioral supports, transportation, and delegated nursing tasks to support the employment activity.\n\nDirect support may be provided on and off the employment site.\n\nDirect support can be provided via remote technology (for example: Skype or Facetime) if preferred by the participant and outlined in their Person-Centered Plan. This support must still meet DDA billing requirements.","url":"","verified":"","notes":"","row":17},{"id":"md-following-along-supports-waiver","state":"MD","title":"Following Along Supports (Waiver)","name":"Following Along Supports","source":"Waiver","category":"employment","topic":"definition","text":"1. Occurs after the participant has transitioned into their competitive integrated employment job.\n\n2. Ensure the participant has the assistance necessary to maintain their jobs; and\n\n3. Follow-Along Supports include at least two direct face-to-face support contacts with the person in the course of the month, but may also include other types of interventions, such as, but not limited to:\n\na. Phone calls to the person and/or employer; and\n\nb. General coordination needed to support a person to maintain their employment.","url":"","verified":"","notes":"","row":18},{"id":"md-supported-employment-continued-waiver","state":"MD","title":"Supported Employment – Continued (Waiver)","name":"Supported Employment – Continued","source":"Waiver","category":"employment","topic":"definition","text":"Direct support contacts are not required to take place at the employment site if this is a preference of the participant and/or the employer\n\nDirect support contacts can be completed using virtual supports as indicated in the person's person-centered plan (for example: Skype or Facetime) if preferred by the person and outlined in the person's Person-Centered Plan.\n\nSelf-Employment Development Supports include assistance in the development of a business and marketing plan, including potential sources of business financing and other assistance in developing and launching a business. The completion of a business and marketing plan does not guarantee future funding to support a business outlined in the plans.\n\nCo-Worker Employment Supports are time-limited supports provided by the employer to assist the participant, upon employment, with extended orientation and training beyond what is typically provided for an employee.\n\nEmployment Services does not include:\n\nVolunteering, apprenticeships, or internships unless it is part of the discovery process and time limited; and\n\nPayment for supervision, training, supports and adaptations typically available to other workers without disabilities filling similar positions\n\nThis Medicaid waiver program service includes provision of:\n\nDirect support services, for provision of services as provided in Sections A-G above;\n\nThe following services provided in combination with, and incidental to, the provision of this Medicaid waiver program service:\n\na. Transportation to, from, and within this Medicaid waiver program service;\n\nb. Delegated nursing tasks or other Nursing Support Services covered by this Medicaid waiver program, based on the\n\nparticipant’s assessed need; and\n\nc. Personal care assistance, based on the participant’s assessed need.\n\nCompetitive Integrated Employment (CIE) means a position that has competitive wages and the same opportunities for advancement and benefits as individuals without a disability and requires that the individual work in an integrated location.\n\nWhen seeking service authorization and/or re-authorization for Employment Services through Follow-Along Job Supports and/or Ongoing Job Supports, a person’s job must have the qualities of competitive integrated employment. This means the position should have:\n\na.Competitive wages- minimum wage or above;\n\nb. Integrated location; and\n\nc. Same opportunities for advancement and benefits as other employees.\n\nWhether a position constitutes competitive integrated employment will be considered on a case by case basis. The position may or may not be approved depending on the job characteristics and the quality of the person’s experience.\n\nThe person-centered planning team shall use the Competitive Integrated Employment Checklist to assess whether an employment position has the qualities of competitive integrated employment","url":"","verified":"","notes":"","row":19},{"id":"md-supported-employment","state":"MD","title":"Supported Employment","name":"Supported Employment","source":"","category":"employment","topic":"definition","text":"The State Supported Employment Services program, authorized under Title VI of the Rehabilitation Act, as amended by the Workforce Innovation and Opportunity Act (WIOA), provides grants to assist States in developing and implementing collaborative programs with appropriate entities to provide programs of supported employment services for individuals with the most significant disabilities, including youth with the most significant disabilities, to enable them to achieve a supported employment outcome in competitive integrated employment (CIE).\n\nSupported employment should not automatically be considered the first choice for individuals with most significant disabilities. DORS supported employment program and supported employment services exist to assist individuals with the most significant disabilities who need intensive services and ongoing supports to maintain an employment outcome and should be considered after a comprehensive assessment of the rehabilitation needs of the individual when determining an individual’s employment goal consistent with their unique strengths, priorities, concerns, abilities, capabilities, interests, and informed choice.\n\nSupported employment means competitive integrated employment (CIE), including customized employment, or employment in an integrated work setting in which an individual with a most significant disability, including a youth with a most significant disability, is working on a short-term basis toward CIE that is individualized and customized, consistent with the unique strengths, abilities, interests, and informed choice of the individual, including with ongoing support services for individuals with the most significant disabilities:\na. For whom CIE has not historically occurred, or for whom CIE has been interrupted or intermittent as a result of a significant disability; and\nb. Who, because of the nature and severity of their disabilities, need intensive supported employment services and extended services after the transition from support provided by the designated State unit, in order to perform this work.\n\nFor purposes of this part, an individual with a most significant disability, whose supported employment in an integrated setting does not satisfy the criteria of CIE, is considered to be working on a short-term basis toward CIE so long as the individual can reasonably anticipate achieving CIE:\na. Within six months of achieving a supported employment outcome; or\nb. In limited circumstances, within a period not to exceed 12 months from the achievement of the supported employment outcome, if a longer period is necessary based on the needs of the individual, and the individual has demonstrated progress toward competitive earnings based on information contained in the service record\n\nSupported employment services shall be:\na. Governed by DORS policies and procedures and authorized under title VI of the Rehabilitation Act of 1973 (29 U.S.C. 701 et seq.), as amended by the Workforce Innovation and Opportunity Act (WIOA) (29 USC 3101).\nb. As appropriate, in accordance with cooperative agreements developed between DORS and those State, public or private organizations which fund and/or provide extended services following the provision of supported employment services, including the Behavioral Health Administration (BHA) and the Developmental Disabilities Administration (DDA).\nc. As appropriate, funded by DORS as the extended services provider for supported employment services, including extended services, to youth with the most significant disabilities, for up to four years, or until the youth reaches age 25, or until funding is available from a long-term provider (BHA or DDA) or via natural supports, whichever comes first.","url":"","verified":"","notes":"","row":21},{"id":"md-supported-employment-scope","state":"MD","title":"Supported Employment - Scope","name":"Supported Employment - Scope","source":"","category":"employment","topic":"activities","text":"Supported employment services include:\n1. Supports to maintain an employment outcome satisfying the criteria for CIE.\n2. Supports to maintain integrated employment while working on a short-term basis toward CIE.\n3. Extended services for youth with most significant disabilities.\nSupported employment services do not include the following services which must be paid for using funds other than supported employment funds:\n1.Job search, job placement services, and incentive payments\n2.Other rehabilitation services specified in RSM 2, Section 700 needed to maintain job stability\n\nSupported employment services may be provided once the individual has been placed in an employment setting, and are often provided at the work site, but may, at the request of the  individual, be provided off-site (usually to avoid disclosure of the disability to the employer and/or coworkers), and include but are not limited to the following\n1.Intensive on-site job skills training and other training provided by skilled job coaches, employment specialists, coworkers and other qualified individuals. This would involve the actual time spent observing, supervising, intervening and assisting the individual in the performance of his or her duties.\n3.Follow-up services, including:\na.Regular contact with employers, trainees, parents, guardians or other representatives of trainees, and other suitable professional and informed advisors in order to reinforce and stabilize the job placement.\nb.Off-site job coaching, as applicable. If off-site monitoring is requested by the individual or other special circumstances exist preventing provision of ongoing support services at the work site, DORS shall assure that the provider meets in-person at least twice per month with the individual and that necessary services are provided for consumer to maintain employment stability.\nc.Facilitation of natural supports at the work site (networking with employer to promote the development and use of natural supports, to include the actual time that the job coach spends working with the regular work-site supervisor, co-workers, parents or others to assist that person toward assuming the function of providing the regular or intermittent job coaching the individual needs in order to maintain the job).\nd.Social skills training, including the enhancement of those behaviors that are needed in order to get along with others at and away from the workplace. Areas of consideration include interpersonal skills; grooming; nutrition and hygiene; budgeting or banking.\n4.Related services, including:\na.Advocacy on behalf of the individual related to health and wellness, housing, legal issues, as appropriate\nb.Travel training, which teaches individuals how to use public transportation or other means of getting to and from the job\n\nOther supported employment services, including:\n1.Attendance at staffing (up to one hour per month prorated based on the number of consumers discussed during the staffing)\n2.Job coach travel time to and between alternate work sites when the travel is outside of regular work hours or the job coach’s regular catchment area. If more than one individual is seen at the same location, the job coach must split/prorate the travel time.\n3.Discrete post-employment services following transition to extended services, but prior to exit from the VR program, may be provided by DORS when necessary to maintain the job placement and not available from the extended services provider (see Section 814).","url":"","verified":"","notes":"","row":22},{"id":"md-job-development","state":"MD","title":"Job Development","name":"Job Development","source":"","category":"employment","topic":"definition","text":"Job Development – Job development/placement is individualized and shall include:\n1.Weekly person-to-person job search assistance\n2.Assistance with identifying job leads\n2.Interview coaching and support\n4.Maintaining a log of job search activities for the purposes of obtaining CIE\n5.By mutual consent of the consumer and the CRP, these services may be provided in-person or virtually using online video communication tools.\n\nJob development/placement may also include arranging job trials/job shadowing for individuals with a DORS Trial Work Experience Plan, assistance with completing applications, assistance with employer follow-up after interviews, use of personal employment networks in job search, and resume update. It would include time spent calling employers, visiting and educating employers, and similar activities.\nJob development/placement shall not be paid for using supported employment funding and shall not include the Discovery process, which is pre-vocational in nature and may be completed prior to job development.","url":"","verified":"","notes":"","row":23},{"id":"md-job-stabilization","state":"MD","title":"Job Stabilization","name":"Job Stabilization","source":"","category":"employment","topic":"definition","text":"Job Stabilization – Applicable to Supported Employment cases only, job stabilization is indicated in the AWARE™ record with entry of the “Stable Date” in the employment record, when:\n1. The individual is employed in CIE and has reached a maximum level of work performance, consistent with their unique strengths, priorities, concerns, abilities, capabilities, interests, and informed choice\n2. The hours worked per week is consistent with the individual’s preferred approximate number of work hours as agreed upon on the IPE\n3. The consumer’s need for benefits counseling and worksite accommodations have been addressed\n4. DORS services are no longer needed to “stabilize” the employment outcome or to address consumer and/or employer concerns\n5. Supported employment job coaching, specifically, has decreased to a predictable level of support which may be provided via extended services, including natural support.\n6. The individual has transitioned from intensive supported employment job coaching to either:\nI. Extended services for youth with most significant disabilities funded by DORS, or\nii. Extended services for either a youth or an adult with most significant disabilities funded by another provider, or\niii. Natural supports\n\nThe individual must maintain job stabilization (see Section 806.01) for a minimum of 90 days following this transition before the DORS case is closed","url":"","verified":"","notes":"","row":24}]},{"code":"MA","name":"Massachusetts","notes":[],"entries":[{"id":"ma-supported-employment-services-rfr","state":"MA","title":"Supported Employment Services (RFR)","name":"Supported Employment Services","source":"RFR","category":"employment","topic":"definition","text":"The Supported Employment Services purchased through this procurement are intended to provide an array of supports to individuals seeking to explore career opportunities, develop skills, and attain employment, with the ultimate goal of attaining competitive integrated employment.\n\nSupported Employment Core Service Elements:\nProviding person-centered career planning that identifies an individual’s career preferences, specific job goals and support needs which might include non-traditional employment options such as evening or weekend hours, self-employment, etc.\n\nDeveloping communication and maintaining ongoing cooperative relationships with the local business community and other employment resource agencies to create and maintain resources that will increase opportunities for long term and successful employment.\n\nAssisting individuals to acquire, get to and from, and maintain a job in an integrated setting within a reasonable distance from home receiving the same pay and benefits as co-workers.\n\nServing as an employment consultant and liaison for the individual worker and employer, providing supplemental job training, assistance with accommodations, and supports as needed, while working to optimize natural employer and co-worker supports.\n\nProviding training and consultation to individuals and families regarding public benefits programs such as Social Security and MassHealth and the impacts of employment and income on benefits. Staff should maintain ongoing competency in these programs and be knowledgeable of any statutory and regulatory changes.\n\nWorking collaboratively with the individual, her/his family, DDS, and other providers to ensure that supported employment services fit cohesively within the full array of supports the individual receives.","url":"","verified":"","notes":"","row":1},{"id":"ma-individual-supported-employment-rfr","state":"MA","title":"Individual Supported Employment (RFR)","name":"Individual Supported Employment","source":"RFR","category":"employment","topic":"definition","text":"Individual supported employment services provide a program of supports to enable an individual, for whom integrated individual employment is unlikely absent the provision of supports, to acquire and sustain employment in an integrated community setting. It may also include self-employment or temporary/seasonal employment which may assist a participant in securing an individual position within a business.\nIndividual supported employment programs will reflect an array of services designed to create and sustain opportunities for long term and successful employment.","url":"","verified":"","notes":"","row":2},{"id":"ma-individual-supported-employment-core-service-elements-rfr","state":"MA","title":"Individual Supported Employment Core Service Elements (RFR)","name":"Individual Supported Employment Core Service Elements","source":"RFR","category":"employment","topic":"definition","text":"Person-centered career planning:\nIdentify career goals and interests\nAssess skills and support needs\nHighlight barriers to independent employment\nPlan for reliable transportation to/from job\nProvide guidance on impacts of employment and income to public benefits\n\nAssistance to individuals in locating a job or developing jobs on behalf of individuals:\nDevelop ongoing relationships with local business community\nIdentify career opportunities that align with individuals’ stated interests and goals\nAssist individuals to develop opportunities through their own networks\nSupport a diverse array of employment opportunities and industries, including those with flexible hours such as evenings and weekends\nAssist in negotiation with prospective employers\n\nInitial employment supports:\nProvide training and systematic instruction complementary to the training resources offered by the employer to develop, maintain, and/or improve job skills and other skills directly related to maintaining employment\nJob coaching in the form of regular or periodic assistance\nProvide training and guidance to employer/co-workers regarding working with people with disabilities\nIdentify opportunities for utilization of assistive technology\nDevelop natural supports in the workplace\n\nOngoing Employment Supports:\nMaintain periodic check-ins with individual and respond to issues as they occur\nProvide ongoing training to facilitate job retention\nRespond to issues raised by employer\nContinue to develop natural supports and independence within the workplace\nFading of job coaching and direct assistance\n\nTransportation assistance:\nAssess availability of transportation resources to the individual\nProvide travel training\nProvide transportation services if not available from other sources\n\nIndividual Supported Employment services are conducted in a variety of settings, particularly in typical work sites where persons without disabilities are employed. Emphasis is on work in an environment with the opportunity for participants to have contact with co-workers, customers, supervisors and others without disabilities.","url":"","verified":"","notes":"","row":3},{"id":"ma-job-development-rfr","state":"MA","title":"Job Development (RFR)","name":"Job Development","source":"RFR","category":"employment","topic":"definition","text":"Job development is a core element of individual supported employment that includes assisting individuals to attain jobs as well as ongoing work by the provider to develop and maintain relationships within the local business community to facilitate future placements.\n\nCentral to a successful program is an individually customized employment approach that takes into account the individual’s goals, interests, skills, and other additional considerations based on their particular disability and cultural/linguistic needs. Based on this individualized planning process, providers should identify potential employment opportunities for individuals and assist them in acquiring positions. Potential jobs may be identified through the provider’s relationships with the local business community or through developing opportunities within the individual’s own network. Providers should also discuss with employers potential “carve-out” opportunities.\n\nWhen identifying positions, it is also important to consider transportation and potential work hours to ensure that the individual will be able to consistently get to/from work and that the hours are appropriate for their schedule. In some circumstances this may mean supporting positions with evening or weekend hours.\n\nOnce potential opportunities are identified, assistance should be provided in filling out job applications, interviewing, and negotiating with employers regarding wages, hours, and any accommodations the individual may require.","url":"","verified":"","notes":"","row":4},{"id":"ma-group-supported-employment-rfr","state":"MA","title":"Group Supported Employment (RFR)","name":"Group Supported Employment","source":"RFR","category":"employment","topic":"definition","text":"Group supported employment services support a small number of individuals (typically discrete groups of 2 to 8 at any given time), working in the community under the supervision of a provider agency. Emphasis is on work in an integrated environment, with the opportunity for individuals to have contact with co-workers, customers, supervisors, and others without disabilities.\n\nGroup supported employment programs will include an array of services designed to help individuals attain employment in a community setting, and to develop skills and independence that will allow them to transition into individual employment.","url":"","verified":"","notes":"","row":5},{"id":"ma-group-supported-employment-core-service-elements-rfr","state":"MA","title":"Group Supported Employment Core Service Elements (RFR)","name":"Group Supported Employment Core Service Elements","source":"RFR","category":"employment","topic":"definition","text":"Person-centered career planning:\nIdentification of career goals and interests\nAssessment of skills and support needs\n\nDeveloping Group Sites:\nDevelop opportunities for group employment with community businesses\nOperation of small business enterprise or social enterprise\n\nJob Coaching:\nSkill building; building competencies\nAssist individuals to maximize productivity and independence\nIdentify and develop natural supports in the workplace\nFacilitate engagement in workplace and interaction with people without disabilities\nAssist individuals in their social interactions\nMaximizing training opportunities\nTraining individuals/families on the financial and benefit impacts of income\n\nTransportation:\nProvide transportation to/from job sites","url":"","verified":"","notes":"","row":6}]},{"code":"MI","name":"Michigan","notes":[],"entries":[{"id":"mi-prevocational-services-provider-manual","state":"MI","title":"Prevocational Services (Provider Manual)","name":"Prevocational Services","source":"Provider Manual","category":"prevoc","topic":"definition","text":"NOTE: This is a habilitative service.\nPrevocational services involve the provision of learning and work experiences where a beneficiary can develop general, non-job-task-specific strengths and skills that contribute to individual CIE. Services are expected to occur over a defined period of time and provided in sufficient amount and scope to achieve the outcome, as determined by the beneficiary and their care planning team in the ongoing person-centered planning process. Services are expected to specifically involve strategies that enhance a beneficiary's employability. Individual competitive integrated employment (CIE) or supported employment are considered successful outcomes of prevocational services. However, participation in prevocational services is not a required prerequisite for individual CIE or receiving supported employment services.\n\nPrevocational services should enable each beneficiary to attain individual CIE in the community in which the beneficiary is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities, and matched to the beneficiary’s interests, strengths, priorities, abilities, and capabilities. Services are intended to develop and teach general skills that lead to employment including, but not limited to:\nability to communicate effectively with supervisors, co-workers and customers;\ngenerally accepted community workplace conduct and dress;\nability to follow directions;\nability to attend to tasks;\nworkplace problem solving skills and strategies;\ngeneral workplace safety; and\nmobility training","url":"","verified":"","notes":"","row":1},{"id":"mi-prevocational-services-ctnd-provider-manual","state":"MI","title":"Prevocational Services - CTND (Provider Manual)","name":"Prevocational Services - CTND","source":"Provider Manual","category":"prevoc","topic":"limits","text":"Support of employment outcomes is a part of the person-centered planning process and emphasizes informed consumer choice. This process specifies the beneficiary’s personal outcomes toward a goal of productivity, identifies the services and items, including prevocational services and other employment-related services that advance achievement of the beneficiary’s outcomes, and addresses the alternatives that are effective in supporting their outcomes. Prevocational services provide learning and work experiences, including volunteering, where the beneficiary can develop general, non-job task specific strengths and skills that contribute to employability in CIE\n\nBeneficiaries who receive prevocational services during some days or parts of days may also receive other waiver services, such as supported employment, out-of-home nonvocational habilitation, or CLS, at other times. Beneficiaries who are still attending school may receive prevocational training and other work-related transition services through the school system and may also participate in prevocational services designed to complement and reinforce the skills being learned in the school program during portions of their day that are not the educational system’s responsibility, e.g., after school or on weekends and school vacations.\n\nBeneficiaries participating in prevocational services may be compensated in accordance with applicable Federal laws and regulations, but the provision of prevocational services is intended to lead to permanent integrated employment.\n\nPrevocational services needed for each beneficiary are documented, coordinated, and non-duplicative of other services otherwise available under a program funded under Section 110 of the Rehabilitation Act of 1973 or Section 602(16) and (17) of IDEA (20 U.S.C. 1401(16 and 17)).\n\nPrevocational services may be provided to supplement, but may not duplicate, services provided under supported employment or out-of-home non-vocational habilitation services. Coordination with the beneficiary’s school is necessary to ensure that prevocational services provided in the waiver do not duplicate or supplant transition services that are the responsibility of the educational program. Transportation provided between the beneficiary’s place of residence and the site of the prevocational services, or between habilitation sites, is included as part of the prevocational and/or habilitation services.\n\nAssistance with personal care or other ADL that are provided to a beneficiary during the receipt of prevocational services may be included as part of prevocational services or may be provided as a separate Medicaid State Plan Home Help service or CLS service under the waiver, but the same activity cannot be reported as being provided to more than one service.\n\nOnly activities that contribute to the beneficiary's work experience, work skills, or work- related knowledge can be included in prevocational services.","url":"","verified":"","notes":"","row":2},{"id":"mi-supported-employment","state":"MI","title":"Supported Employment","name":"Supported Employment","source":"","category":"employment","topic":"definition","text":"Competitive integrated employment (CIE) is employment that is found in the typical labor market in the community that anyone can apply for and is the optimal outcome of supported employment services. Supported employment services seek to align with the Work Innovation and Opportunity Act (WIOA) to achieve desired outcomes for beneficiaries.\n\nSupported employment services support CIE in the general workforce where the beneficiary is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Supported employment services can be provided through many different service models. Federal Financial Participation (FFP) may not be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as:\nIncentive payments made to an employer to encourage or subsidize the employer’s participation in a supported employment program;\nPayments that are passed through to users of supported employment programs; or\nPayments for vocational training that is not directly related to a beneficiary supported employment program\nSupported employment service component(s) needed for each beneficiary are documented, coordinated, and nonduplicative of other services otherwise available under a program funded under Section 110 of the Rehabilitation Act of 1973, or under IDEA, MRS or BSBP. Documentation must be maintained by the PIHP that the beneficiary is not currently eligible for work activity or supported employment services provided by MRS. Information must be updated when MRS eligibility conditions change.","url":"","verified":"","notes":"","row":3},{"id":"mi-supported-employment-individual-provider-manual","state":"MI","title":"Supported Employment - Individual (Provider Manual)","name":"Supported Employment - Individual","source":"Provider Manual","category":"employment","topic":"definition","text":"Supported Individual Employment Services for Job Development/Career Planning support CIE that is found in the typical labor market in the community that anyone can apply for and is the optimal outcome of supported employment services. Such services may provide ongoing supports to beneficiaries who, because of their disabilities, need some fading level of supports to be successful. Additionally, this service array may include intensive on-going support to obtain or maintain an individual job in competitive or customized employment, or self-employment in CIE in the general workforce for which the beneficiary is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Self-employment refers to an individual-run business that nets the equivalent of a competitive wage, after a reasonable period for start-up, and is either home-based or takes place in regular integrated business, industry, or community based settings. This service supports sustained paid employment at or above the minimum wage in CIE in the general workforce in a job that meets personal and career goals.\n\nIndividual supported employment services are individualized and may include any combination of the following services:\nvocational/job-related discovery or assessment\n person-centered employment planning\njob placement/job development with prospective employers\njob analysis\ncustomized employment and job carving\ntraining and systematic instruction\nbenefits management, financial literacy, asset development and career advancement services\ntraining and planning\ntransportation\nother workplace support services, including services not specifically related to job skill training that enable the beneficiary to attain a job in a CIE setting of their choice","url":"","verified":"","notes":"","row":4},{"id":"mi-supported-employment-group-provider-manual","state":"MI","title":"Supported Employment - Group (Provider Manual)","name":"Supported Employment - Group","source":"Provider Manual","category":"employment","topic":"definition","text":"Supported Group Employment Services and training activities provided in regular business, industry, and community settings for groups of two (2) to six (6) workers with disabilities, paying at least minimum wage in an integrated setting. Examples include mobile crews and other business-based workgroups employing small groups of workers with disabilities in employment in the community. Group Employment Services must be provided in a manner that promotes integration into the workplace and interaction between beneficiaries and individuals without disabilities in those workplaces. Funding for this service is to support sustained paid employment and work experience leading to further career development in individual CIE-based employment for which the beneficiary is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Supported Group Employment Services does not include volunteer work or vocational services provided in facility-based work settings.\n\nSupported Group Employment Services may include any combination of the following services:\njob analysis\ntraining and systematic instruction\njob coaching\nbenefits management support and financial literacy\ntraining and planning\ntransportation\ncareer advancement services\nother workplace support services that may include services not specifically related to job skill training that enable the beneficiary to be successful in integrating into the workplace","url":"","verified":"","notes":"","row":5},{"id":"mi-supported-integrated-employment-services-provider-manual","state":"MI","title":"Supported/Integrated Employment Services (Provider Manual)","name":"Supported/Integrated Employment Services","source":"Provider Manual","category":"employment","topic":"definition","text":"NOTE: This service is a State Plan EPSDT service when delivered to children birth-21 years.\n\nSupported/integrated employment services are services that are provided in a variety of community settings for the purposes of supporting beneficiaries in obtaining and sustaining ICIE. ICIE refers to full- or part-time work at minimum wage or higher, with wages and benefits similar to workers without disabilities performing the same work, and fully integrated with co-workers without disabilities. Supported employment services promote self-direction, are often customized, and are aimed to meet a beneficiary’s personal and career goals and outcomes identified in the IPOS. Services may be provided continuously, intermittently, or on behalf of a beneficiary. Services may be delivered to promote community inclusion and competitive integrated employment.\n\nCoverage includes:\nJob-related discovery, person-centered employment/career planning, job placement, job development, negotiation with prospective employers, job analysis, job carving, training and systematic instruction, job coaching, benefits and work incentives planning and management, asset development, career advancement services, career planning that supports the beneficiary to make informed choices about ICIE or self-employment. The outcome of this service is sustained ICIE at or above the minimum wage in an integrated setting in the general workforce and in a job that meets personal and career goals as outlined in the beneficiary’s IPOS.\n\nSupported employment services include the following categories:\nIndividual supported employment supports to attain or sustain paid employment at or above the minimum wage, and career development in an integrated, competitive setting in the general workforce in a job that meets personal and career goals.\nSelf-employment refers to an individual-run business that nets the equivalent of a competitive wage, after reasonable period for start-up, and is either home-based or takes place in regular integrated business, industry or community-based settings.\nSmall group supported employment support are services and training activities, provided in typical business, industry and community settings for groups of two to six workers with disabilities, paying at least minimum wage that leads to ICIE. The purpose of funding for this service is to support sustained paid employment and work experience that leads to ICIE. Examples include mobile crews and other business-based workgroups employing small groups of workers with disabilities. Small group supported employment must promote integration into the workplace and interaction between workers with disabilities and people who do not have disabilities. Participation in small group supported employment is not a required prerequisite for ICIE or receiving supported employment services.\nSupported/integrated employment service components needed for each beneficiary are documented, coordinated, and non-duplicative of other services otherwise available under a program funded under IDEA (20 U.S.C. 1401 et seq.).\n\nIf a beneficiary has a need for transportation to participate, maintain, or access the supported/integrated employment services, the same service provider may be reimbursed for providing this transportation only after it is determined that it is not otherwise available (e.g., volunteer, family member) and is the least expensive available means suitable to the beneficiary’s need, in accordance with Medicaid non-emergency medical transportation policy outlined in the Non-Emergency Medical Transportation chapter.","url":"","verified":"","notes":"","row":6}]},{"code":"MN","name":"Minnesota","notes":[],"entries":[{"id":"mn-employment-exploration-definitions-community-based-services-","state":"MN","title":"Employment Exploration - Definitions (Community-Based Services Manual)","name":"Employment Exploration - Definitions","source":"Community-Based Services Manual","category":"career","topic":"definition","text":"Employment exploration services: Services that help a person gain a better understanding of competitive, integrated employment opportunities in their community. Exploration activities and experiences strengthen a person's knowledge, interests and preferences so they can make informed decisions about competitive employment. Employment exploration includes:\nIndividualized educational activities\nLearning opportunities\nWork experiences\nAdditional related services identified in the person's coordinated services and supports plan (CSSP).\n\nCompetitive, integrated employment: Employment that pays a minimum wage or an industry standard, customary or prevailing wage with comparable benefits (e.g., health insurance, leave time, etc.).","url":"","verified":"","notes":"","row":1},{"id":"mn-employment-exploration-eligibility-community-based-services-","state":"MN","title":"Employment Exploration - Eligibility (Community-Based Services Manual)","name":"Employment Exploration - Eligibility","source":"Community-Based Services Manual","category":"career","topic":"eligibility","text":"To receive employment exploration services, a person must both:\nBe eligible for Bl, CAC, CADI or DD waiver services.\nHave employment exploration services as an assessed need in their coordinated services and supports plan (CSSP).","url":"","verified":"","notes":"","row":2},{"id":"mn-employment-exploration-covered-services-community-based-serv","state":"MN","title":"Employment Exploration - Covered Services (Community-Based Services Manual)","name":"Employment Exploration - Covered Services","source":"Community-Based Services Manual","category":"career","topic":"activities","text":"Covered employment exploration services that require direct contact with the person may include:\n•Educational visits to community businesses to learn about various companies, products, services and employment opportunities.\n•Career education activities to learn about specific types of occupations, job positions and work opportunities.\n•Ongoing educational information and counseling assistance about jobs/careers that interest the person.\n•Peer-to-peer mentoring opportunities to meet and learn from people with disabilities who are employed in competitive, community jobs.\n•Job shadowing and try-out experiences for work involved in different occupations.\n•Employment education support groups (e.g., job clubs).\n•Individualized work experiences, including volunteer work experiences.\n•Education about post­secondary educational opportunities that enhance employment, community employment resources and use of transportation services.\n•In-service transportation.\n•Progress review and reporting meetings.\n\nCovered employment exploration services that do not require direct contact with the person may include:\n•Performing benefit(s) fact gathering, review and analysis to determine how benefits will interact with employment.\n•Planning and coordinating related to the person's needs for assistive technology (e.g., ergonomic workstations, magnifiers, speech-to-text or text-to-speech software, captioning, audio or visual cueing, etc.).\n•Planning and coordinating related to the person's needs for adaptive accommodations (e.g., modified work tasks or responsibilities, flexible schedules, telecommuting, etc.)","url":"","verified":"","notes":"","row":3},{"id":"mn-employment-exploration-limitations-community-based-services-","state":"MN","title":"Employment Exploration - Limitations (Community-Based Services Manual)","name":"Employment Exploration - Limitations","source":"Community-Based Services Manual","category":"career","topic":"limits","text":"Employment exploration services are time-limited and should end after a maximum of 12 months following the initial authorization of the services. In some circumstances, a person might need to receive continued employment exploration services after 12 months. The lead agency can reauthorize employment exploration services when the person:\n•Has not made an informed decision about competitive, integrated employment.\n•Experiences a debilitating health condition or life event that significantly interrupts service delivery.\n•Changes service providers.\nGroup sizes may not exceed five people for all activities provided under employment exploration services.","url":"","verified":"","notes":"","row":4},{"id":"mn-employment-exploration-non-covered-services-community-based-","state":"MN","title":"Employment Exploration -Non-Covered Services (Community-Based Services Manual)","name":"Employment Exploration -Non-Covered Services","source":"Community-Based Services Manual","category":"career","topic":"limits","text":"Employment exploration services do not cover:\nIncentive payments (e.g., payments to an employer to encourage or subsidize the employer's participation in an exploration program).\n•Payments for vocational training that is not directly related to the person's exploration program.\n•Direct compensation to supplement a person's wage.\n•Special education services av
