come of Service","source":"","category":"employment","topic":"activities","text":"Small-group supported employment services are expected to enable the member to make reasonable and continued progress toward individual employment.\n\nParticipation in small-group supported employment services is not a prerequisite for individual supported employment services. The expected outcome of the service is sustained paid employment and skill development which leads to individual employment in the community.","url":"","verified":"","notes":"","row":21},{"id":"ia-small-group-employment-setting","state":"IA","title":"Small Group Employment - Setting","name":"Small Group Employment - Setting","source":"","category":"employment","topic":"activities","text":"Small-group supported employment services shall take place in integrated, community-based nonresidential settings separate from the member’s residence.","url":"","verified":"","notes":"","row":22},{"id":"ia-small-group-employment-service-activities","state":"IA","title":"Small Group Employment - Service Activities","name":"Small Group Employment - Service Activities","source":"","category":"employment","topic":"activities","text":"Small-group supported employment services may include any combination of the following activities:\n-Employment assessment\n-Person-centered employment planning\n-Job placement (limited to service necessary to facilitate hire into individual employment paid at minimum wage or higher for a member in small-group supported employment who receives an otherwise unsolicited offer of a job from a business where the member has been working in a mobile crew or enclave)\n-Job analysis\n-On-the-job training and systematic instruction\n-Job coaching\n-Transportation planning and training\n-Benefits education\n-Career exploration services leading to career advancement outcomes\n-Other workplace support services may include services not specifically related to job skill training that enable the waiver member to be successful in integrating into the individual or community setting\n-Transportation of the member during service hours","url":"","verified":"","notes":"","row":23},{"id":"ia-small-group-employment-units-of-service","state":"IA","title":"Small Group Employment - Units of Service","name":"Small Group Employment - Units of Service","source":"","category":"employment","topic":"billing","text":"Small-group supported employment services are authorized for the number of units of service the member requires based on the number of individuals in the small group.\n\nTier 1 - Groups of 2 to 4 - H2023 U3\nTier 2 - Groups of 5 or 6 - H2023 U5\nTier 3 - Groups of 7 or 8 - H2023 U7","url":"","verified":"","notes":"","row":24},{"id":"ia-service-requirements-for-all-supported-employment-services","state":"IA","title":"Service Requirements for All Supported Employment Services","name":"Service Requirements for All Supported Employment Services","source":"","category":"employment","topic":"provider","text":"Community transportation options (e.g., transportation provided by family, coworkers, carpools, volunteers, self or public transportation) shall be identified by the member’s interdisciplinary team and utilized before the service provider provides the transportation to and from work for the member. If none of these options are available to a member, transportation between the member’s place of residence and the employment or service location may be included as a component part of supported employment services.\n\nPersonal care or personal assistance and protective oversight may be a component part of supported employment services but may not comprise the entirety of the service.\n\nActivities performed on behalf of a member receiving long-term job coaching or individual or small-group supported employment shall not comprise the entirety of the service.\n\nConcurrent services. A member’s individual service plan may include two or more types of nonresidential services (e.g., individual supported employment, long-term job coaching, small-group supported employment, prevocational services, and day habilitation); however, more than one service may not be billed during the same period of time (e.g., the same hour).\n\nIntegration requirements. In the performance of job duties, the member shall have regular contact with other employees or members of the general public who do not have disabilities, unless the absence of regular contact with other employees or the general public is typical for the job as performed by persons without disabilities.","url":"","verified":"","notes":"","row":25},{"id":"ia-service-requirements-for-all-supported-employment-services-c","state":"IA","title":"Service Requirements for All Supported Employment Services - Compensation","name":"Service Requirements for All Supported Employment Services - Compensation","source":"","category":"employment","topic":"provider","text":"Members receiving these services are compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nFor supported self-employment, the member earns income that is equal to or exceeds the average income for the chosen business within a reasonable period of time.\n\nFor small-group supported employment, if the member is not compensated at or above minimum wage, the compensation to the member shall be in accordance with all applicable state and federal labor laws and regulations.","url":"","verified":"","notes":"","row":26},{"id":"ia-service-requirements-for-all-supported-employment-services-l","state":"IA","title":"Service Requirements for All Supported Employment Services - Limitations","name":"Service Requirements for All Supported Employment Services - Limitations","source":"","category":"employment","topic":"limits","text":"Supported employment services are limited as follows:\n-In the absence of a monthly cap on the cost of waiver services, the total monthly cost of all supported employment services may not exceed the limit established in 441 IAC 79.1(2).\n-Individual supported employment is limited to 60 units per calendar year. The member may be initially authorized for 40 units and an extended authorization for an additional 20 units as needed by the member.\n-Long-term job coaching is limited to 40 hours per week and must be reauthorized every 90 days.\n-Small-group supported employment is limited to 160 (15 minute) units per week.","url":"","verified":"","notes":"","row":27},{"id":"ia-service-requirements-for-all-supported-employment-services-e","state":"IA","title":"Service Requirements for All Supported Employment Services - Exclusions","name":"Service Requirements for All Supported Employment Services - Exclusions","source":"","category":"employment","topic":"limits","text":"Supported employment services payments shall not be made for the following:\n-Services that are available to the individual under a program funded under Section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.).\n-Documentation that the service is not available to the individual under these programs shall be maintained in the service plan of each member receiving individual supported employment or long-term job coaching services.\n-Incentive payments, not including payments for coworker supports, made to an employer to encourage or subsidize the employer’s participation in a supported employment program.\n-Subsidies or payments that are passed through to users of supported employment programs.\n-Training that is not directly related to a member’s supported employment program.\n-Services involved in placing and stabilizing members in day activity programs, work activity programs, sheltered workshop programs or other similar types of vocational or prevocational services furnished in specialized facilities that are not a part of the general workplace.\n-Supports for placement and stabilization in volunteer positions or unpaid internships. Such volunteer learning and unpaid training activities that prepare a person for entry into the general workforce are addressed through prevocational services and career exploration activities.\n-Tuition for education or vocational training.\n-Individual advocacy that is not related to integrated individual employment participation or is not member-specific.\n-Medicaid funds may not be used to defray the expenses associated with starting up or operating a business.","url":"","verified":"","notes":"","row":28}]},{"code":"KS","name":"Kansas","notes":[],"entries":[{"id":"ks-supported-employment","state":"KS","title":"Supported Employment","name":"Supported Employment","source":"","category":"employment","topic":"definition","text":"Supported Employment services are ongoing support services for IDD participants to allow them to engage in\ncompetitive work in an integrated setting.\nCompetitive work is defined as work for which an individual is paid in accordance with the Fair Labor Standards\nAct.\nAn integrated work setting is defined as a job site that is similar to that of the general work force. Such work is\nsupported by an activity needed to sustain paid employment by persons with IDD.\nThe outcome of this service is sustained paid employment at or above the minimum wage in an integrated setting in\nthe general workforce, in a job that meets personal and career goals.\nSupported Employment will prioritize competitive integrated employment which can include work outside the home\nor work in a home environment.\nCompletion of Vocational Rehabilitation or a letter, from DCF, stating the participant is not eligible for Vocational\nRehabilitation is required prior to authorization of Supported Employment. In the event the participant is on a\nwaiting list for Vocational Rehabilitation services, Supported Employment activities may be authorized until the\npoint in time when Vocational Rehabilitation Services begin. Supported Employment activities shall not be\nauthorized until the individual has applied to the local Vocational Rehabilitation Services office.\nThe following supported employment activities by Supported Employment agency staff are designed to assist\nindividuals in acquiring and maintaining employment:\n1.Individualized assessment.\n2.Individualized job development and placement services that create an appropriate job match for the individual and\nthe employer.\n3.Ongoing support services necessary to assure job retention as identified in the Person-Centered Support Plan and\nPerson- Centered Service Plan.\n4.Training in related skills essential to secure and retain employment.","url":"","verified":"","notes":"","row":1},{"id":"ks-supported-employment-documentation","state":"KS","title":"Supported Employment - Documentation","name":"Supported Employment - Documentation","source":"","category":"employment","topic":"documentation","text":"Documentation is maintained in the file of each participant receiving this service that the service is not available\nunder a program funded under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities\nEducation Act, which includes Vocational Rehabilitation (20 U.S.C., 1401 et seq.).","url":"","verified":"","notes":"","row":2},{"id":"ks-supported-employment-transportation","state":"KS","title":"Supported Employment - Transportation","name":"Supported Employment - Transportation","source":"","category":"employment","topic":"definition","text":"Transportation between the participant's residence and the employment site is included in the rate paid to providers\nof Supported Employment services.","url":"","verified":"","notes":"","row":3},{"id":"ks-supported-employment-virtual-delivery","state":"KS","title":"Supported Employment - Virtual Delivery","name":"Supported Employment - Virtual Delivery","source":"","category":"employment","topic":"activities","text":"Kansas Virtual Delivery of HCBS Services.\nVirtual delivery of a service is an electronic method of service delivery. The purpose of virtual delivery of a service\nis to maintain or improve a participant’s functional abilities, enhance interactions, support meaningful relationships,\nand meaningfully participate in their community. Virtual delivery of services may be a service option to provide\nindependence in licensed group homes, therapies or agency-directed personal care services. The participant should\nhave other opportunities for integration in the community via other services the participant receives.\nVirtual Delivery of a service shall mean the provision of services through equipment with the capability for live realtime audio-visual connection that allows the staff member to both see and hear the participant. Text messaging and\ne-mailing do not constitute virtual services and, therefore, will not be considered provision of direct services under\nspecified HCBS Services.\nDirect service can be provided through the virtual delivery of the service when all of the following requirements are\nmet:\na. The virtual delivery of the service ensures the participant's rights of privacy, dignity and respect, and freedom\nfrom coercion and restraint.\nb. The virtual delivery of the service does not isolate the participant from the community or interacting with people\nwithout disabilities.\nc. The virtual delivery of the service has been agreed to by the participant and their team and outlined in the\nPerson-Centered Plan;\ni. Participants must have an informed choice between in person or the virtual delivery of the service;\nii. The virtual delivery of a service cannot be the only service delivery provision for a participant seeking the given\nservice; and\niii. Participants must affirmatively choose virtual delivery of the service over in-person services.\nd. Virtual delivery of a service is not, and will not be, used for the provider's convenience. The virtual delivery of\nthe service must be used to support a participant to reach identified outcomes in the participant’s Person-Centered\nPlan Virtual delivery of a service must be documented appropriately as any other service being delivered, including\nstart and end times.\nf. The virtual delivery of a service must comply with the requirements of the Health Insurance Portability and\nAccountability Act of 1996 (HIPAA), as amended by the Health Information Technology for Economic and Clinical\nHealth (HITECH) Act, and their applicable regulations to protect the privacy and security of the participant’s\nprotected health information.\ng. Virtual delivery of a service, including using phones, cannot be used to assess a participant for a medical\nemergency. The provider must develop and maintain written policies, train direct support staff on those policies, and\nadvise participants and their person-centered planning team regarding those policies that address:\nh. Identifying individuals to intervene (such as uncompensated caregivers present in the participant’s home), and\nensuring they are present during provision of virtual delivery of the service in case the participant experiences an\nemergency; and processes for requesting such intervention if the participant experiences an emergency during\nprovision of virtual services, including contacting 911 if necessary.\ni. The virtual services meets all federal and State requirements, policies, guidance, and complies with 42 CFR\n442.301 (c)(4)(vi)(A) through (D) related to privacy, control of schedule, activities, and access to visitors.\nj. Providers furnishing a HCBS waiver service via virtual delivery of service must include virtual delivery of a\nservice in their provider Program Service Plan prior to implementing.\nk. The provider must develop, maintain, and enforce written policies, approved by the MCO, which address:\ni. Identifying whether the participant’s needs, including health and safety, can be addressed safely via virtual\ndelivery of the service.\nii. How the provider will ensure the participant’s rights of privacy, dignity and respect, and freedom from coercion\nand restraint during virtual delivery of the service.\niii. How the provider will ensure the virtual delivery of the service meets applicable information security\nstandards; and\niv. iv. How the provider will ensure the provision of virtual delivery of the service complies with applicable laws\ngoverning individuals’ right to privacy.","url":"","verified":"","notes":"","row":4},{"id":"ks-supported-employment-virtual-delivery-instances","state":"KS","title":"Supported Employment - Virtual Delivery Instances","name":"Supported Employment - Virtual Delivery Instances","source":"","category":"employment","topic":"activities","text":"Virtual Delivery of a service will only be authorized when a waiver participant requests the service to be delivered\nvirtually and the technology or device appropriate to support the virtual delivery of the service is available.\nInstructions and Limitations\n• The program participant’s person-centered service plan must indicate the use of the virtual delivery of the\nservice.\n• The managed care organization must document the frequency of the virtual delivery of the service.\n• The provider must also document and track how the service is delivered. Documentation must be done in the\nsame manner as if it was delivered in person.\n• Virtual delivery of a service shall be provided in real-time, not via a recording.\n• When virtual delivery of the service is provided, the provider shall only render the service on a one-on_x0002_one/individualized basis.\n• The service provider shall be responsible for providing the device or technology required to support the virtual\ndelivery of the service. The Waiver program will not fund any costs associated with the provider’s virtual delivery\nof the service such as obtaining, installing, and implementing equipment, internet, software applications, and other\nrelated expenses. These costs, in the virtual delivery of the service are part of the provider's operating costs.","url":"","verified":"","notes":"","row":5},{"id":"ks-supported-employment-technology-and-devices","state":"KS","title":"Supported Employment - Technology & Devices","name":"Supported Employment - Technology & Devices","source":"","category":"employment","topic":"definition","text":"• Virtual delivery of a service may leverage the existing technologies or devices belonging to the waiver\nparticipant.\n• HCBS waiver funding shall NOT be used to purchase technologies or devices or internet connectivity for the\nprimary purpose of virtual delivery of a service.\n• The provider shall be responsible for the maintenance, upkeep and assurance the device is in working order.\nCommunity Integration and Participant’s Choice\n• Where virtual delivery of a service is requested by the participant and authorized by the managed care\norganization, the following requirements shall be met to ensure the delivery method does not lead to isolating or\nregimenting the participant from the greater community.\no The virtual delivery of the service shall be provided in the participant’s preferred setting.\n• The participant’s choice for virtual delivery of a service shall be documented and included in their service plan.\no The participant shall be able to rescind their choice of virtual delivery of a service at any time.\nWhen this occurs, the MCO shall ensure service continuity via a non-virtual delivery method and confirm that the participant’s service plan reflects the participant’s choice change.\no The managed care organization shall be responsible for ensuring that the provider is educating and informing the\nparticipant on the scope of the virtual delivery of the service prior to documenting the choice of the individual.\no The physical location where virtual services are provided, as well as the activities rendered as part of the service\nare monitored through KDADS licensing as well as the MCO.\nTraining Requirement\n• Where virtual delivery of a service is requested by the participant and authorized by the managed care\norganization, the provider shall train the participant to use the solution or application and device (where a new\ndevice is provided).\n• Training for the participant and staff must demonstrate trainees understands how the virtual services will ensure\nthe participant’s health, welfare, and independence.\n• Training must demonstrate that staff and participant have the competency after training to successfully utilize the\ntechnology.\no The training should assist the participant in attaining the knowledge required to operate technologies that\nfacilitate successful virtual delivery of the service.\no Staff training on the technology that will be utilized for the person in service. must be person-specific, mode of\ntechnology utilized for the participant. Training for both participant and staff must be documented with a plan for\ncontinuing education on the technology for participant and staff.\nUnits and delivery for virtual delivery is found in Main 8 b","url":"","verified":"","notes":"","row":6},{"id":"ks-supported-employment-limits","state":"KS","title":"Supported Employment - Limits","name":"Supported Employment - Limits","source":"","category":"employment","topic":"limits","text":"a. FFP cannot be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the\nfollowing: 1) Incentive payments made to an employer to encourage or subsidize the employer's participation in a\nsupported employment program, 2) Payments that are passed through to users of supported employment programs;\nor 3) Payments for training that is not directly related to an individual's supported employment program.\nb. Supported Employment must be provided in a place of business or a setting that has otherwise been approved by\nKDADS, and is compliant with the HCBS Settings Final Rule, and Employment First State and Federal policy.\nc. To avoid overlap of services, Supported Employment is limited to those services not covered through the\nMedicaid State Plan or other HCBS services and which cannot be procured from other formal or informal resources.\nWaiver funding shall be the funding source of last resort and requires prior authorization from the MCO via the\nparticipant's Person-Centered Service Plan.\n•The IDD waiver funded Supported Employment activities must not be provided simultaneously with activities\ndirectly reimbursed by Kansas Vocational Rehabilitation Services.\nd. Supported Employment cannot be provided in a sheltered work setting.\ne. Supported Employment must be provided away from the participant’s place of residence, unless an in-home\nbusiness exception has been granted or the Participant works competitively from their residence. Documentation of\nemployment in the home will be provided to KDADS for verification of the Participant's choice to work\ncompetitively in their residence. This exception will be requested by the CDDO to the IDD Program Manager.\nf. Supported Employment cannot be provided to anyone who is an inpatient of a hospital, nursing facility or an ICF_x0002_IID.","url":"","verified":"","notes":"","row":7}]},{"code":"KY","name":"Kentucky","notes":[],"entries":[{"id":"ky-supported-employment","state":"KY","title":"Supported Employment","name":"Supported Employment","source":"","category":"employment","topic":"definition","text":"Supported employment shall:\n\nBe services that enable a participant to engage in paid work that occurs in an integrated community setting with competitive wages and benefits commensurate to the job responsibilities;\n\nBe covered for a participant if no change in the impact of a participant's disability on the participant's employment has occurred and:\n-A Supported Employment Long-Term Support Plan has been completed, incorporated into the participant's person-centered service plan, and uploaded into the MWMA; or\n-There is documentation of the payment of the supported employment individual outcome placement fee indicating closure of the case by the Office of Vocational Rehabilitation;\n\nBe participant directed, if a participant chooses this option;\n\nBe provided:\n-In a variety of settings; and\n-By a supported employment specialist who:\n-Meets the personnel and training requirements established in Section 3 of this administrative regulation; and\n-Works for an SCL certified provider that is a vendor of supported employment services for the Office of Vocational Rehabilitation;\n\nBe delivered on a one (1) to one (1) basis with a participant or indirectly on behalf of a participant;\n\nExclude work performed directly for the supported employment provider or other service provider; and\n\nBe coordinated with other applicable 1915(c) home and community based waiver services, if applicable, in support of the participant's employment outcome.","url":"","verified":"","notes":"","row":1},{"id":"ky-supported-employment-delivery","state":"KY","title":"Supported Employment Delivery","name":"Supported Employment Delivery","source":"","category":"employment","topic":"activities","text":"Supported employment services delivered on a one-to-one basis and the hours spent by a participant performing paid employment and day training shall not exceed:\n-Forty (40) hours per week; or\n-160 units per week.\n\nA supported employment service shall:\n-Be provided and documented as required by this subsection; and\n-Include the components established in this subsection.","url":"","verified":"","notes":"","row":2},{"id":"ky-person-centered-job-discovery","state":"KY","title":"Person Centered Job Discovery","name":"Person Centered Job Discovery","source":"","category":"career","topic":"definition","text":"Supported employment shall include person-centered job selection discovery that shall:\n\nBe a respectful way to get to know a participant who is seeking a job and break past conceived notions about what a participant can or cannot do; and\n\nInclude developing a Person Centered Employment Plan based upon the participant's:\n-Life experiences;\n-Interests;\n-Talents;\n-Contributions;\n-Impact of disability;\n-Vulnerabilities; and\n-Support needs.\n\nThe Person-Centered Employment Plan shall be completed by the employment specialist, entered into the MWMA, and updated as needed.\n\nA participant may access up to 120 units of person-centered job selection funding. Prior to receiving employment services and job development, a participant and the participant's person-centered team shall review the content of the Person-Centered Employment Plan and ensure that the plan:\n-Represents an accurate description of the participant's interests, goals, and objectives;\n-Is based upon the development of a career rather than short-term employment;\n-Is incorporated into the participant's person-centered service plan.\n\nPerson-centered job selection shall conclude with a meeting at which parties supporting the participant provide:\n-Suggestions of places in the participant's area where the participant might be able to perform the job tasks identified in the Person-Centered Employment Plan in return for at least minimum wage; and\n-Contacts, if available, for the places referenced in subclause (i) of this clause.\n\nInformation gathered at the job planning meeting shall be documented in the participant's individual plan for employment","url":"","verified":"","notes":"","row":3},{"id":"ky-job-development","state":"KY","title":"Job Development","name":"Job Development","source":"","category":"employment","topic":"definition","text":"Job development and analysis shall:\n-Be conducted to determine the skills that the participant will need to successfully contribute in a specific workplace;\n-Include deciding how to talk about the impact of the participant's disability in relation to the contributions that the participant can offer the employer;\n-Include facilitating the development of natural supports based on ordinary social relationships at work; and\n-Include matching job tasks that need to be completed for potential employers with the interests, skills, and abilities established in the participant's Person-Centered Employment Plan beginning with the leads provided during the job planning meeting.","url":"","verified":"","notes":"","row":4},{"id":"ky-supported-employment-waiver","state":"KY","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported employment is paid, competitive employment at or above minimum wage for an SCL recipient who has demonstrated an inability to gain and maintain traditional employment. Supported Employment occurs in a variety of integrated business environments. Phases of Supported Employment include: Person-Centered Job Selection, Job Development, Job Acquisition with support and stabilization, Successful Placement, and Long Term Follow up. Supported employment is a one-to-one service that shall be person specific.\n\nSupported Employment must begin with Discovery (Person-Centered Job Selection), where job goal/features of desired employment are selected based on spending time with the person in non-standardized/non-testing situations to learn about the person’s gifts, talents and support needs.\n\nPerson Centered Job Selection concludes with the completion of a “Person Centered Employment Plan” (PCEP)\n\nJob development - job planning meetings and job analysis. The job planning meetings involve convening and networking with trusted people; matching job characteristics with job tasks and then with types of employers and finally with specific employers - mapping a way for effective job development. Job analysis is conducted to determine the culture of the business, possibilities for customized employment, how people typically learn their jobs, who teaches them and how long training typically takes. Job development may also focus on interviewing skills/interview support, resume development and assistance with filling out applications. Customized employment is essential to individualize the employment relationship between the employer and the supported employee in ways that meet the needs for both.\n\nJob acquisition with Support and Stabilization begins with the actual acceptance of a position by the participant. During this phase, the participant will receive training on how to perform the job tasks. Natural Supports available in the workplace should be developed and utilized from the beginning. Other training could include, but is not limited to the following: social interaction, medication scheduling, chain of command, documentation of time (timesheets, clocks) hygiene issues, mobility, conflict resolution, when and from whom it is appropriate to seek assistance, and personnel policies. Additional training in exploring transportation options, utilization and schedule may also beneeded. These trainings can occur both on and off the job site. The training is beyond what is typically provided as part of supervision or training to employees. The expectation is for systemic fading of the Employment Specialist to begin as soon as possible without jeopardizing the person’s job. Successful employment shall be when natural supports are relied on more fully and fading of the employment specialist from the worksite makes the person substantially responsible for their own performance in the workplace. Additionally, before successful employment can be determined there must be confirmation that the employee is functioning well at the job. Consideration should include not only the person’s general satisfaction, but also the number of hours worked, performance of job duties and other basics, comfort level on the job, and interaction with coworkers and supervisors. Other less visual, but essential aspects of the job, which if unattended, could jeopardize the employee’s future must also be considered. The development of natural supports in the work environment is a critical role of the Employment Specialist during this phase and it may be necessary to write Impairment Related Work Expense (IRWE) plans or Plans for Achieving Self Support (PASS) for the employee or access other waiver services to address individualized needs. The expectation is for systemic fading of the Employment Specialist to begin as soon as possible without jeopardizing the job. The outcome of this service is sustained paid employment at or above the minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals.","url":"","verified":"","notes":"","row":5},{"id":"ky-supported-employment-ctnd-waiver","state":"KY","title":"Supported Employment CTND (Waiver)","name":"Supported Employment CTND","source":"Waiver","category":"employment","topic":"limits","text":"Long Term Follow-up is support provided to maintain the job and continued success after the person is fully integrated into the workplace and the Employment Specialist is no longer needed at the job site on a regular basis. The Employment Specialist must continue to be available, if and when needed for support or assistance with job changes/job advancements. Activities could include, but are not limited to the following: problem-solving, retraining, regular contact with employer, employee, family, co-workers, other SCL staff and reassessment of an employee with regard to career changes or position upgrades. During this phase the Employment Specialist is required to make the number of contacts per month necessary for the person to maintain employment. Services do not include services that are available under Section 110 of the Rehabilitation Act of 1973 (or, in the case of youth, under the provisions of IDEA, (20 U.S.C.1401 et seq.). The state will determine that such services are not available to the participant before authorizing their provision as a waiver service. Documentation that services are not otherwise available is maintained in the file of each participant receiving this service.\n\nWaiver funding is not available for the provision of Supported Employment services (e.g., sheltered work performed in a facility) where participants are supervised in producing goods or performing services under contract to third parties.\n\nTransportation provided through Supported Employment service is included in the cost of doing business and incorporated in the administrative overhead cost.\n\nThese services may not supplant educational services available under the IDEA (20 U.S.C. 1401 et seq.).","url":"","verified":"","notes":"","row":6},{"id":"ky-supported-employment-limits-waiver","state":"KY","title":"Supported Employment - Limits (Waiver)","name":"Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Unit of service:15 minutes\n\nFor SCL Person Centered Job Selection funding, the participant may access up to 120 units\n\nFor SCL Job Development Services, the participant and their employment specialist may access up to 90 units.\n\nFor SCL Job Acquisition and Stabilization Services, the participant and their SE Specialist may access up to 800 units\n\nFor SCL Long-Term Employment Supports, the participant and their SE Specialist may access up to twenty-four (24) units of SE per month\n\nAny combination of day training, community access, personal assistance, or any hours of paid community employment or on-site supported employment service, shall not exceed sixteen (16) hours per day.","url":"","verified":"","notes":"","row":7},{"id":"ky-supported-employment-qualified-participant-approved-provider","state":"KY","title":"Supported Employment – Qualified Participant Approved Provider Specifications (Waiver)","name":"Supported Employment – Qualified Participant Approved Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Individuals who come into direct contact with waiver participants must meet the following qualifications:\n\nBe at least eighteen (18) years of age;\n\nand\n\n• Be previously qualified or credentialed to provide supported employment services; or\n\n• Have at least a bachelor’s degree from an accredited college or university and one (1) year of experience in the field of developmental disabilities; or\n\n• Have at least one (1) year of experience in the field of intellectual or developmental disabilities; and\n\n• Has completed a department approved credential within one (1) year of application while providing supported employment services under the direct supervision of a qualified supported employment specialist; and\n\n• Sequentially completes the Kentucky Supported Employment Training Project curriculum from the Human Development Institute at the University of Kentucky within eight (8) months of the date of employment as an employment specialist.\n\n• Completes Department-approved, waiver-specific training and is monitored for competency on topics including, but not limited to: abuse, neglect, exploitation and incident reporting, professional boundaries, trauma-informed care, and person-centered thinking.\n\n• Has the ability to:\n\no Communicate effectively with a participant in the participant’s preferred manner of communication and with the participant’s family;\n\no Read, understand, and implement written and oral instructions;\n\no Perform required documentation;\n\no Participate as a member of the participant’s person-centered team if requested by the participant;\n\no Demonstrate competence and knowledge of topics required to safely support the participant as described in the participant’s PCSP; and\n\n• Undergoes pre-employment screenings as described in C-2.a and b of this appendix.\n\n• If the employee provides transportation, the employee must be legally licensed to operate the transporting vehicle and obeys all applicable State laws while operating the vehicle.","url":"","verified":"","notes":"","row":8},{"id":"ky-supported-employment-certified-waiver-provider-specification","state":"KY","title":"Supported Employment – Certified Waiver Provider Specifications (Waiver)","name":"Supported Employment – Certified Waiver Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The agency must meet certified waiver provider qualifications as defined in 907 KAR 7:005 and 907 KAR 12:010.\n\nAgency staff who come into direct contact with waiver participants must meet the following qualifications:\n\n• Be at least eighteen (18) years of age;\n\nand\n\n• Have at least one (1) year of experience in the field of intellectual or developmental disabilities; and\n\n• Has completed a department approved credential within one (1) year of application while providing supported employment services under the direct supervision of a qualified supported employment specialist; and\n\n• Sequentially completes the Kentucky Supported Employment Training Project curriculum from the Human Development Institute at the University of Kentucky within eight (8) months of the date of employment as an employment specialist.\n\n• Completes Department-approved, waiver-specific training and is monitored for competency on topics including, but not limited to: abuse, neglect, exploitation and incident reporting, professional boundaries, trauma-informed care, and person-centered thinking.\n\n• Has the ability to:\n\no Communicate effectively with a participant in the participant’s preferred manner of communication and with the participant’s family;\n\no Read, understand, and implement written and oral instructions;\n\no Perform required documentation;\n\no Participate as a member of the participant’s person-centered team if requested by the participant;\n\no Demonstrate competence and knowledge of topics required to safely support the participant as described in the participant’s PCSP; and\n\n• Undergoes pre-employment screenings as described in C-2.a and b of this appendix.\n\n• If the employee provides transportation, the employee must be legally licensed to operate the transporting vehicle and obeys all applicable State laws while operating the vehicle.","url":"","verified":"","notes":"","row":9}]},{"code":"LA","name":"Louisiana","notes":[],"entries":[{"id":"la-supported-employment-manual","state":"LA","title":"Supported Employment (Manual)","name":"Supported Employment","source":"Manual","category":"employment","topic":"definition","text":"Supported employment (SE) are services that are designed to support a beneficiary in community based employment, who because of their disability, require ongoing support and extended follow along to obtain and maintain a job in an integrated competitive work setting, including:\nCustomized employment or self- employment;\nWhere the person is compensated at or above the minimum wage but not less than the customary wage; and\nLevel of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nSupported employment services significantly expand available options for a beneficiary who requires services to achieve and maintain integrated, competitive employment in the community. These services include ongoing support and follow-along services, either through paid services, unpaid natural supports such as co-workers, family, friends, and/or other comparable services as appropriate. Beneficiaries who have the most significant disabilities may require long-term employment supports to successfully maintain a job due to the ongoing nature of the waiver beneficiary’s support needs, changes in life situations or evolving and changing job responsibilities and where natural supports would not meet this need.\n\nCompetitive employment is defined as work performed on a full time or part time basis in an integrated setting which an individual is compensated at or above minimum wage, but not less than the customary wage and level of benefits paid by an employer for the same or similar work performed by individuals without disabilities.\n\nIntegrated work setting is defined as job sites in the community where most employees do not have a disability and individuals with significant disabilities interact on a regular basis with individuals without disabilities in performing their job duties. On-going supports and follow-along are services that are needed to support or maintain a beneficiary with a disability in employment based upon the needs of the beneficiary and continue indefinitely.","url":"","verified":"","notes":"","row":1},{"id":"la-supported-employment-ctnd-manual","state":"LA","title":"Supported Employment - CTND (Manual)","name":"Supported Employment - CTND","source":"Manual","category":"employment","topic":"limits","text":"Supported employment services may be utilized to:\nSupport an individual in an employment opportunity in the community;\nSupport an individual in establishing and/or maintaining self- employment, including home based self-employment; and\nSupport a group of no more than eight beneficiaries in an employment opportunity in the community.\n\nSupported employment services are:\nNOT meant to support a beneficiary in a volunteer job. This should be completed under prevocational services or day habilitation services; and\nDo NOT include facility-based employment furnished in specialized facilities that are not a part of the general work place and do NOT include people who do not have a disability.","url":"","verified":"","notes":"","row":2},{"id":"la-supported-employment-categories-manual","state":"LA","title":"Supported Employment - Categories (Manual)","name":"Supported Employment - Categories","source":"Manual","category":"employment","topic":"activities","text":"Individual employment, including Self-Employment or Microenterprise;\nor Job assessment, discovery and development\nInitial job support and job retention\n\nGroup Employment\nJob assessment, discovery and development; and\nInitial job support and job retention.","url":"","verified":"","notes":"","row":3},{"id":"la-job-assessment-discovery-and-development-is-the-process-of-m","state":"LA","title":"Job assessment, discovery & development is the process of (Manual)","name":"Job assessment, discovery & development is the process of","source":"Manual","category":"career","topic":"definition","text":"Identifying specific career interests of a beneficiary;\nIdentifying appropriate community employment options that match information gained from a beneficiary’s assessment, profile and/or plan;\nEnsuring the identified position will meet the occupational, physical and financial requirements of the beneficiary; and\nAssisting the beneficiary and employer in achieving a successful job match, placement, and sustaining employment.\n\nThe outcome of job assessment, discovery and development is sustained paid employment in an integrated setting in the general workforce in the community in a job that meets personal and career goals.","url":"","verified":"","notes":"","row":4},{"id":"la-job-assessment-and-career-planning-manual","state":"LA","title":"Job Assessment & Career Planning (Manual)","name":"Job Assessment & Career Planning","source":"Manual","category":"career","topic":"definition","text":"Job assessment is the evaluation of a beneficiary’s skills and interests, and consists of a combination of assessment activities:\nVocational assessments to determine a person’s career interests;\nJob analysis for each job the individual is interested in obtaining;\nCommunity-based situational assessments;\nFacility-based situational assessments;\nPlacement plan;\nAssisting with personal care in activities of daily living; and\nOngoing career planning.\n\nExamples of Career Planning activities include, but are not limited to, the following:\nOn-going Career Counseling;\nOn-going discussions should be conducted with the beneficiary to help answer their questions and/or to assist them in any aspect of defining a career goal.\nBenefits Planning; Benefit planning should be completed by a certified work incentive coordinator to assist the beneficiary in answering questions regarding Social Security benefits and working.\n\nFinancial Literacy;\nFinancial literacy is intended to assist the beneficiary in gaining skills and knowledge in the area of their personal finances which will help them in making more cost-conscious decisions.\n\nAssistive Technology (AT) assessments; and\nThese assessments are conducted as needed to enhance a beneficiary’s employability.\n\nOther activities that may assist the beneficiary in increasing their knowledge in areas that enhance their decision-making to obtain an employment goal and career path.\nJob assessment will not be authorized for services that include teaching concepts such as compliance, attendance, task completion, problem-solving and safety that are associated with performing compensated work, as well as, activities aimed at a generalized outcome.\n\nNote: These activities should be completed under prevocational services.","url":"","verified":"","notes":"","row":5},{"id":"la-job-assessment-documentation-requirements-manual","state":"LA","title":"Job Assessment - Documentation Requirements(Manual)","name":"Job Assessment - Documentation Requirements","source":"Manual","category":"career","topic":"documentation","text":"To receive post-authorization for job assessment, one or more of the following documents must be submitted to the beneficiary’s support coordinator for approval:\nCompleted vocational assessment;\nCompleted job analysis;\nNotes from community-based/ situational assessments;\nPlacement plan;\nCareer planning activities documentation;\nAssistive technology (AT) assessments;\nBenefits planning documentation;\nDocumentation of job internship;\nDocumentation of job shadowing experience; and\nAdditional documentation that substantiates other assessment activity.\n\nApproval of job assessment documents submitted will be based on the following information: The objectives and time lines outlined in the Individualized Service Plan (ISP) were met timely;\nthe written assessment that includes, at a minimum, the following information The identification of:\nSpecific career interest(s);Assets and abilities regarding employment;\nPotential targeted job tasks;\nJob conditions; • Anticipated support needs;\nPotential employers;\nMaximum hours per week and times of day the beneficiary will consider working;\nMinimum rate of pay the beneficiary will accept;\nBenefits that might impact the beneficiary’s earnings, in particular Supplemental Security Income (SSI) and/or Social Security Disability Insurance (SSDI) benefits;\nAreas of town, city or parish(s) the beneficiary will consider working;\nTransportation options and selection;\nIdentification of current work strengths/skills of the beneficiary to achieve their jog choice; Identification of current barriers to the beneficiary job choice; and\nIdentification of the anticipated support needs for the beneficiary.","url":"","verified":"","notes":"","row":6},{"id":"la-job-discovery-and-development-manual","state":"LA","title":"Job Discovery & Development (Manual)","name":"Job Discovery & Development","source":"Manual","category":"career","topic":"definition","text":"Marketing agency services to employers that match the beneficiary’s interest in order to establish business relationships that could result in job opportunities for the beneficiary;\nAssisting the beneficiary to make use of all available job services through one-stop career centers;\nContacting specific employers whose business matches the beneficiary’s career interests, or who are advertising for open positions through newspaper advertisements, websites, or word of mouth;\nAssisting the beneficiary in creating a resume;\nAssisting the beneficiary in preparing for a job interview;\nTransporting the beneficiary to a job interview;\nAccompanying the beneficiary to a job interview, if requested;\nReferring beneficiary to work incentives, planning and assistance representatives when necessary, or as requested;\nReconfiguring an existing position to fit the employer and beneficiary’s needs, also known as job restructuring;\nConsulting and/or negotiating as needed and/or requested with employer on rate of pay, benefits, and employment contracts;\nRestructuring a work site to maximize a beneficiary’s ability to perform the job, also known as job accommodations;\nTraining to enable a beneficiary to independently travel from his/her home to place of employment;\nProviding employee education and training as requested by employer on disability issues;\nProviding employers with information on benefits available when hiring a person with a developmental disability such as on the job training (OJT) or Work Opportunities Tax Credit (WOTC);\nAssisting with personal care activities of daily living; and\nPlanning ongoing career activities.\n\nThe following activities, in addition to the activities listed above may be included for self employment/microenterprise:\nCoordinating access to grants and other resources needed to begin and/or sustain the enterprise;\nIdentifying equipment and supplies needed;\nFacilitating consultation with groups able to offer guidance such as Louisiana Economic Development and the Small Business Administration;\nAssisting with creation of a business plan;\nFacilitating interactions with required legal entities such as necessary business licensing agencies, fire marshals and building inspectors; and\nAssisting with hiring, training and retaining appropriate employees.\n\nNOTE: Funds for self-employment may not be used to defray any expenses associated with setting up or operating a business.","url":"","verified":"","notes":"","row":7},{"id":"la-individual-initial-job-support-retention-and-follow-along-ma","state":"LA","title":"Individual Initial Job Support, Retention, & Follow-Along (Manual)","name":"Individual Initial Job Support, Retention, & Follow-Along","source":"Manual","category":"employment","topic":"definition","text":"Initial job support is provided to the beneficiary on or off the job site by provider staff. It may be intensive, intermittent, short-term and/or ongoing.\n\nInitial job support and retention consists of one or more of the following activities:\n1.Provision of support at a job site by provider staff that ensures the beneficiary can maintain and meet the expectations of the employer;\n2.Assisting with personal care activities of daily living in the employment setting by provider staff;\n3.Face-to-face support off the job site by provider staff that is necessary for the beneficiary to maintain gainful employment. Examples of this kind of contact include, but are not limited to:\na..A beneficiary needing travel re-training to the work site due to changes in transportation;\nb.A beneficiary needing assistance in setting up an alarm clock system at home in order to be at work on time; The beneficiary wishing to discuss a problem that involves personal issues that could affect his/her ability to retain the job at a place other than the work site;\n4.The beneficiary needing assistance with completing documentation required by the employer or by an agency providing benefits that are affected by work income, such as SSI.\n5.Communications with the beneficiary by telephone, e-mail or fax that is necessary for the beneficiary to maintain gainful employment.\n6.Meetings with the community employer without the beneficiary present are limited to five days per service year; which are counted as part of the total maximum number of standard units available. Examples of when such a meeting might occur include, but are not limited to:\na.Explanation and/or demonstration of significant change in job duties which the employer feels may require re-training for the beneficiary to remain successfully employed; or\nb.Discussion of a behavioral issue that may adversely impact the beneficiary’s ability to remain successfully employed.\n\nIf the beneficiary is not present at a meeting with the community employer, the provider will be expected to have the following documentation available upon request of the support coordinator, Office of Citizens with Developmental Disabilities (OCDD)/Waiver Supports and Services (WSS) or Health Standards (HSS) staff:\n1.Date, time, names of persons in attendance at meeting;\n2.Location and method of meeting (i.e. face-to-face with employer, by phone, or internet/videoconference);\n3.Reason for meeting without beneficiary and results of meeting;\n4.Written documentation through applicable confidentiality release forms in the beneficiary’s native language that the beneficiary approved contacts and/or meetings to occur in his/her absence; and\n5.Transportation to or from a community business site by provider staff in a staff or provider-owned vehicle. However, the provider must produce documentation upon\n6.Request of the support coordinator or OCDD, WSS or HSS staff that all other possible sources of transportation, including those incurring a charge or without charge, have been exhausted.","url":"","verified":"","notes":"","row":8},{"id":"la-individual-initial-job-support-retention-and-follow-along-ct","state":"LA","title":"Individual Initial Job Support, Retention, & Follow-Along CTND (Manual)","name":"Individual Initial Job Support, Retention, & Follow-Along CTND","source":"Manual","category":"employment","topic":"limits","text":"Initial job support is provided to the beneficiary on or off the job site by provider staff. It may be intensive, intermittent, short-term and/or ongoing. These activities can include, but are not limited to the following activities:\n1.Provision of support by provider staff at their job site that ensures the beneficiary can maintain and meet the expectations of the job;\n2.Assistance with personal care activities of daily living in the employment setting by provider staff;\n3.Face-to-face support off the job site by provider staff that is necessary for the beneficiary to maintain gainful employment. Examples of this kind of contact include, but are not limited to:\na.A beneficiary needing travel re-training to the work site due to changes in transportation;\nb.A beneficiary needing assistance in setting up an alarm clock system at home in order to be at work on time; The beneficiary wishing to discuss a problem that involves personal issues that could affect his/her ability to retain the job at a place other than the work site;\nc.The beneficiary needing assistance with completing documentation required by the job or by an agency providing benefits that are affected by work income, such as SSI; and\nd.Communications with the beneficiary by telephone, e-mail or fax that is necessary for the beneficiary to maintain their employment.\n4.Assistance acquisition of skills necessary for operation of the business including clerical, payroll, tax functions, and inventory tracking system;\n5.Assistance with interviewing, hiring or terminating employees;\n6.Assistance with communications with vendors and customers; and\n7.Assistance with all functions of business operations.\n\nInitial job support and retention will be authorized for a job a beneficiary holds in a provider owned facility when:\n1.The beneficiary is paid the same wage as a regular employee of that provider, but at least minimum wage;\n2.There is a job description for the position that would be utilized by the provider for a person without a disability; and\n3.The beneficiary is paid all benefits, including holidays, absentee and vacation time that other employees without disabilities would receive in a comparable position.\n\nInitial job support and retention will only be authorized for individual job, self employment/microenterprise or group employment for which the beneficiary is paid in accordance with the United States Fair Labor Standards Act of 1985 as amended.","url":"","verified":"","notes":"","row":9},{"id":"la-group-employment-initial-job-support-retention-and-follow-al","state":"LA","title":"Group Employment Initial Job Support, Retention & Follow-Along","name":"Group Employment Initial Job Support, Retention & Follow-Along","source":"","category":"employment","topic":"definition","text":"Group employment initial job support, retention and follow-along activities may be authorized in a provider-owned or leased facility when:\n1.The building in which business is conducted is in a separate physical location from the rest of the provider facility; and\n2.Members of the public are the primary customers who utilize the services of the business.\n\nExamples of this include, but are not limited to:\n1.Laundry/ironing services;\n2.Restaurants; and\n3.Retail shops.\n\nInitial job support and retention will only be authorized for the individual job, self employment/microenterprise or group employment for which the beneficiary is paid in accordance with the United States Fair Labor Standards Act of 1985 as amended.","url":"","verified":"","notes":"","row":10},{"id":"la-additional-requirements-for-supported-employment-manual","state":"LA","title":"Additional Requirements for Supported Employment (Manual)","name":"Additional Requirements for Supported Employment","source":"Manual","category":"employment","topic":"provider","text":"Prior to receiving individual or group SE services, the beneficiary must apply for, and exhaust any similar services available through Louisiana Rehabilitation Services (LRS) or the Individuals with Disabilities Education Act (IDEA) if the beneficiary is still attending high school. Services will be considered unavailable if a beneficiary applies, is eligible and qualifies for LRS services but is put on a waiting list. However, if there is no waiting list, the beneficiary must utilize LRS services prior to receiving individual supported employment services through the waiver., There must be documentation in the beneficiary’s file that supported employment services are not available from programs funded under the Rehabilitation Act of 1973, the IDEA or Medicaid State Plan.","url":"","verified":"","notes":"","row":11},{"id":"la-prevocational-services-manual","state":"LA","title":"Prevocational Services (Manual)","name":"Prevocational Services","source":"Manual","category":"prevoc","topic":"definition","text":"Prevocational services are intended for those beneficiaries who want to work and have the end goal of individual integrated community employment, integrated community group employment or self-employment. Prevocational Services are expected to last no longer than four years. Prevocational services are to be provided in a variety of locations in the community alongside individuals without disabilities. Activities are NOT to be limited to a fixed site facility. Beneficiaries receiving prevocational services may choose to pursue employment opportunities at any time and do not have to participate the entire 4 years.\n\nPrevocational services are intended to assist the individual in developing general, non-job-task specific strengths and skills that contribute to employability success in paid employment in integrated community settings and to assist them in developing a career path with an employment goal that is matched to the beneficiary’s interests, skills, strengths, priorities, abilities and capabilities.\n\nPrevocational services may include, but are not limited to:\n1.Activities to increase the beneficiary’s ability to communicate effectively and appropriately when in a work environment;\n2.Activities to increase the beneficiary’s ability to problem solve as independently as possible;\n3.Activities to increase their ability to be a ‘team player’ and understand the importance of working as part of a team in a work environment;\n4.Activities to assist the beneficiary in understanding the importance of having a good attitude when at work;\n5.Activities to assist the beneficiary in engaging in appropriate work conversations and activities with fellow co-workers;\n6.Participation in a class to increase their employability at the local technical college;\n7.Participation in a job readiness programs available through the local One Stop or other agencies;\n8.Activities to teach the beneficiary how to use general work related equipment;\n9.Activities to teach the beneficiary basic work-related personal safety skills;\n10.Assistance and prompting in the development of personal skills needed to gain independence at work. This may include assistance with personal hygiene, dressing, grooming, eating, toileting, ambulation or transfers, behavioral support needs and any medical task, which can be delegated. However, personal care assistance may not comprise the entirety of this service; and\n10.Any other activity that increases the beneficiary’s employability. The end goal of prevocational services, whether it’s the beneficiary’s choice to move to the next phase or the four year time limit is up, the beneficiary should have an employment goal and be prepared to enter into the next phase of the career path, the job search.\n\nThe end goal of prevocational services, whether it’s the beneficiary’s choice to move to the next phase or the four year time limit is up, the beneficiary should have an employment goal and be prepared to enter into the next phase of the career path, the job search.If at any point the beneficiary has decided that employment is not their end goal, the beneficiary should be referred to their support coordinator and be given the option to choose other day services, such as becoming part of a community group or day habilitation.","url":"","verified":"","notes":"","row":12},{"id":"la-prevocation-services-career-planning-manual","state":"LA","title":"Prevocation Services - Career Planning (Manual)","name":"Prevocation Services - Career Planning","source":"Manual","category":"prevoc","topic":"definition","text":"Every beneficiary MUST have a Career Plan and should include activities focused on the participant becoming employed to their highest ability. All career planning activities should be focused on building a plan for a path to community employment at the highest level for each participant with an employment goal.\n\nExamples of Career Plan activities include but are not limited to the following:\n1.Self- exploration activities- This is to include activities that helps the beneficiary become aware of their interests, skills, and values that can help guide the career exploration/development.\n2.Vocational Assessments- Assessments can be used to further develop the career goal.\n3.Career Exploration- Activities that helps the beneficiary learn how to identify career and life goals that are consistent with their interests, skills and values. It also involves opportunities to learn about the skills and qualities required to be successful in various career and the education and training needed to pursue the career.\n4.Volunteering- to be done in the community in the areas identified in career exploration activities. This will help to further define a career.\n5.Ongoing career counseling- on-going discussions should be had with the beneficiary to help them answer questions they may have or to assist them in any aspect of defining a career goal\n6.Benefits planning- should be completed by a Certified Work Incentive Coordinator to assist the beneficiary in answering any questions regarding Social Security benefits and working\n7.Financial literacy -is intended to assist the beneficiary in gaining skills and knowledge in the area of their personal finances which will help them in making more cost-conscious decisions\n8.Assistive technology (AT) assessments as needed to enhance a beneficiaries’ employability\n9.Job shadowing- type of work based learning which allows beneficiaries to ‘shadow’ someone who works in a particular area of interests for a short period of time to gain a better understanding of what the duties are of a specific type of job.\n10.Tours of businesses and meetings to learn about what businesses do and career opportunities- type of work-based learning which allows beneficiaries to meet with employers in specific businesses to find out more about a business that they may be interested in working.\n11.Internships– type of work-based learning which allows beneficiaries to secure internships (either paid or unpaid) in a business in order to learn more in depth aspects of the particular job they are interested in doing.\n12.Apprenticeships- Type of work-based learning which allows beneficiaries to secure apprenticeships that will help them develop skills in a particular area and further define a career goal; and\n13.Any other activities that may assist the beneficiary in increasing their knowledge in areas that can assist the beneficiary in making decisions which leads to an employment goal and career path","url":"","verified":"","notes":"","row":13},{"id":"la-prevocation-services-career-planning-manual-2","state":"LA","title":"Prevocation Services - Career Planning (Manual)","name":"Prevocation Services - Career Planning","source":"Manual","category":"prevoc","topic":"definition","text":"Every beneficiary MUST volunteer in the community. Volunteering will provide a beneficiary especially someone who has never worked, an opportunity to gain insight into being a responsible employee, provides them with valuable knowledge and experience which will allow them to add skills to their resume’ as well as help them to decide the type of job they desire.\n\nVolunteer activities are to be provided under the guidelines of the United States Fair Labor Standards Act of 1985 as amended. In the event beneficiaries are compensated, pay must be in accordance with the United States Fair Labor Standards Act of 1985 as amended. If beneficiaries are paid in excess of 50% of minimum wage, the provider must:\n1.Conduct productivity time studies on the beneficiaries every six months;\n2.Do six month formal reviews of the beneficiary’s ISP to determine the appropriateness of continued prevocational services as opposed to supported employment; and\n3.Provide the support coordinator with documentation of both the productivity time studies and ISP reviews at the beneficiary’s annual POC meeting.","url":"","verified":"","notes":"","row":14}]},{"code":"ME","name":"Maine","notes":[],"entries":[]},{"code":"MD","name":"Maryland","notes":[],"entries":[{"id":"md-career-exploration-waiver","state":"MD","title":"Career Exploration (Waiver)","name":"Career Exploration","source":"Waiver","category":"career","topic":"definition","text":"A. Career Exploration are time limited services to help participants learn skills to work toward competitive integrated employment.\n\n1. Teaching methods based on recognized best practices are used such as systematic instruction.\n\n2. Career Exploration provides the participant with opportunities to develop skills related to work in a competitive employment position in an integrated community environment including learning:\n\na. Skills for employment, such as time-management and strategies for completing work tasks;\n\nb. Socially acceptable behavior in a work environment;\n\nc. Effective communication in a work environment; and\n\nd. Problem-solving for a work task.\n\nB. Career Exploration includes: (1) Facility-Based Supports; (2) Small Group Supports; and (3) Large Group Supports.\n\n1. Facility-Based Supports can be at a fixed site that is owned, operated, or controlled by a licensed provider or an off-site location. It also includes doing work under a contract being paid by a licensed provider.\n\n2. Small Group Supports are provided in groups of between 2 and 8 individuals (including the participant) where the group completes work tasks on a contract-basis. This work must be conducted at another site in the community not owned, operated, or controlled by the licensed provider. Small Group Supports models include enclaves, mobile work crews, and work tasks on a contract-basis. The licensed provider is the employer of record and enters into the contract on behalf of the group.\n\n3. Large Group Supports are provided in groups of between 9 and 16 individuals (including the participant) where the group completes work tasks on a contract-basis. This work must be conducted at another site in the community not owned, operated, or controlled by the licensed provider. The licensed provider is the employer of record and enters into the contract on behalf of the group.\n\nC. Career Exploration services include:\n\n1. Direct support services that enable the participant to learn skills to work toward competitive integrated employment, as described in Sections A-B above;\n\n2. The following services provided in combination with, and incidental to, the provision of this Waiver program service:\n\na. Transportation to and from and within this Medicaid waiver program service;\n\nb. Delegated nursing tasks or other nursing support services covered by this Medicaid waiver program based on assessed need; and\n\nc. Personal care assistance, based on the participant’s assessed need.\n\nd. Nursing Support Services based on assessed need. The scope of the Nursing Support Services is defined under the stand_x0002_alone service in Appendix C.","url":"","verified":"","notes":"","row":1},{"id":"md-career-exploration-service-requirements-waiver","state":"MD","title":"Career Exploration – Service Requirements (Waiver)","name":"Career Exploration – Service Requirements","source":"Waiver","category":"career","topic":"provider","text":"A. The participant must be 18 years of age or older and no longer enrolled in primary or secondary school.\n\nB. Career Exploration services must be provided in compliance with all applicable federal, State, and local laws and regulations.\n\nC. Participants must have an employment goal within their PCP that outlines how they will transition to community integrated employment (such as participating in discovery and job development) or another service.\n\nD. The level of staffing and meaningful activities provided to the participant under this Medicaid waiver program service must be based on the participant’s assessed level of service need.\n\nE. If transportation is provided as part of this Medicaid waiver program service, then:\n\n1. The participant cannot receive Transportation services separately at the same time as provision of this Medicaid waiver program service;\n\n2. The provider must:\n\na. Provide, or arrange for provision of, transportation to meet the needs of the participant identified in the participant’s PCP;\n\nand\n\nb. Use the most cost-effective mode of transportation, with priority given to the use of public transportation;\n\n3. Transportation services may not compromise the entirety of this Medicaid waiver program service.\n\nF. If direct support staff perform delegated nursing tasks as part of this Medicaid waiver program service, then:\n\n1. The participant must receive Nursing Support Services under this Medicaid waiver program service;\n\n2. The delegated nursing tasks:\n\na. Must be provided by direct support staff who are certified as a Medication Technician by the Maryland Board of Nursing\n\n(MBON); and\n\nb. May not compromise the entirety of this Medicaid waiver program service.\n\nG. If personal care assistance services are provided as part of this Medicaid waiver program service, then the personal care assistance may not comprise the entirety of the service. For purposes of this Medicaid waiver program service, personal care assistance means the provision of supports to assist a participant in performing activities of daily living and instrumental activities of daily living.\n\nH. A participant’s PCP may include a mix of employment and meaningful day type services such as Day Habilitation, Community Development Services, and Employment Services provided at different times under both service delivery models.\n\nI. Career Exploration services are not available at the same time as the direct provision of Day Habilitation, Community\n\nDevelopment Services, Community Living-Enhanced Supports, Community Living-Group Homes, Employment Services, Medical Day Care, Personal Supports, Respite Care Services, Shared Living, Supported Living, or Transportation services.\n\nJ. Prior to accessing DDA funding for this service, all other available and appropriate funding sources which may include as applicable, private insurance, services offered by Maryland Medicaid State Plan, MSDE, DORS, DHS, and any other federal or State government funding program must be explored and exhausted to the extent applicable.\n\nThese efforts must be documented in the participant’s file.\n\nIf these services are deemed by the participant's person-centered planning team to be inappropriate to meet the specific needs of the participant, the exploration efforts and reasons that these services do not meet the participant's needs shall be documented in the participant's file.\n\nThe DDA has authority to determine if further efforts must be made, and documented, prior to authorization of funding for the service under the Medicaid waiver program.\n\nK. To the extent any listed services are covered under the Medicaid State Plan, the services under the waiver will be limited to additional services not otherwise covered under the Medicaid State Plan, but consistent with waiver objectives of receiving community-based services and avoiding institutionalization.\n\nL. Nursing Support Services, as applicable, can be provided during services so long as it is not the primary or only service provided. The scope of the Nursing Support Services are defined under the stand-alone service in Appendix C.\n\nM. In the event that additional Nursing Support Services Delegation training supports are needed as indicated in the HRST because of a change in the participant’s health status or after discharge from a hospital or skilled nursing facility, the request is reviewed by DDA’s Regional Office and additional standalone Nursing Support Services hours can be authorized.\n\nN. A legally responsible person, relative, or legal guardian of the participant cannot be paid by the Medicaid waiver program, either directly or indirectly, to provide this Medicaid waiver program service\n\nO. Anyone paid to provide a Medicaid waiver service, including participant's employees, are considered a MedicaidProvider, subject to all laws and regulations associated with a Medicaid Provider","url":"","verified":"","notes":"","row":2},{"id":"md-career-exploration-limits-waiver","state":"MD","title":"Career Exploration – Limits (Waiver)","name":"Career Exploration – Limits","source":"Waiver","category":"career","topic":"limits","text":"Career Exploration may not exceed a maximum of 8 hours per day or 40 hours per week including in combination with any of the following other Medicaid waiver program services in a single day: Community Development Services, Employment Service – Job Development, and Day Habilitation services.\n\nCareer Exploration services for participants accessing this service for the first time is limited to up to 720 hours for the plan year.","url":"","verified":"","notes":"","row":3},{"id":"md-career-exploration-provider-specifications-waiver","state":"MD","title":"Career Exploration - Provider Specifications (Waiver)","name":"Career Exploration - Provider Specifications","source":"Waiver","category":"career","topic":"provider","text":"Agencies must meet the following standards:\n\n1. Complete the MDH provider application and be certified based on compliance with meeting all of the following standards:\n\nA. Be properly organized as a Maryland business entity, or, if operating as a foreign corporation, be properly registered to do business in Maryland;\n\nB. A minimum of 5 years demonstrated experience and capacity providing quality developmental disability employment services;\n\nC. Have a governing body that is legally responsible for overseeing the management and operation of all programs conducted by the licensee including ensuring that each aspect of the agency’s programs operates in compliance with all local, State, and federal requirements, applicable laws, and regulations;\n\nD. Demonstrate the capability to provide or arrange for the provision of all services required by submitting, at a minimum, the following documents with the application:\n\n(1) A program service plan that details the agency's service delivery model;\n\n(2) A business plan that clearly demonstrates the ability of the agency to provide Career Exploration;\n\n(3) A written quality assurance plan to be approved by the DDA;\n\n(4) A summary of the applicant's demonstrated experience in the field of developmental disabilities; and\n\n(5) Prior licensing reports issued within the previous 10 years from any in-State or out-of-State entity associated with the applicant, including deficiency reports and compliance records.\n\nE. If currently licensed or certified, produce, upon written request from the DDA, the documents required under D;\n\nF. Be in good standing with the IRS and SDAT;\n\nG. Have Workers’ Compensation Insurance;\n\nH. Have Commercial General Liability Insurance;\n\nI. Submit results from required criminal background checks, Medicaid Exclusion List, and child protective clearances as provided in Appendix C-2-a and per DDA policy;\n\nJ. Submit documentation of staff certifications, licenses, and/or trainings as required to perform services;\n\nK. Complete required orientation and training;\n\nL. Comply with the DDA standards related to provider qualifications; and\n\nM. Complete and sign any agreements required by the MDH or DDA.\n\nN. Be licensed by the OHCQ;\n\nO. All providers must meet and comply with the federal community settings regulations and requirements;\n\nP. Have a signed Medicaid Provider Agreement;\n\nQ. Have documentation that all vehicles used in the provision of se
