ch will be transitioning the individual's supports to the workplace assistance. Individual supported employment and workplace assistance may be provided concurrently for a limited time as defined in the individual's plan for supports in order to assure stability on the job site.\nb. Individual supported employment and WPA may also occur together for the purpose of follow along services as defined by DARS. During follow along, the job coach would oversee the plan implementation as well as continue to interface with the employment provider and the individual's systems to ensure continuity of employment services.\n7. Individual ineligibility for supported employment service through DARS or IDEA shall be documented in the individual's record, as applicable. If the individual is ineligible to receive service through IDEA, documentation is required only for lack of DARS funding. Acceptable documentation for the lack of DARS or IDEA funding would include either written documentation from DARS or the school system or a progress note that records the content of a communication that includes a name, date, and person contacted, documented either in the individual's file maintained by the support coordinator, on the ISP, or the supported employment provider's supporting documentation. Unless the individual's circumstances change, for example, the individual is seeking a new job, the original verification may be forwarded into the current record or repeated on the supporting documentation on an annual basis.","url":"","verified":"","notes":"","row":5}]},{"code":"WA","name":"Washington","notes":[],"entries":[{"id":"wa-supported-employment-overview","state":"WA","title":"Supported Employment Overview","name":"Supported Employment Overview","source":"","category":"employment","topic":"definition","text":"Supported Employment services assist those individuals who want to work and meet FCS criteria to become employed in integrated community employment. Activities are intended to ensure successful employment outcomes through the utilization of collateral contacts, skills training, cueing, modeling and supervision as identified by the person-centered employment plan.\n\nIndividualized Supported Employment services include identifying career and occupational targets, developing ongoing relationships with prospective employers, assisting with the interviewing and hiring process, and once employed, support with maintaining employment. Coaching and skill-building of interpersonal relationships in the work setting as well as education for self-advocacy and support with the American with Disabilities Act are also included.\n\nThe focus is on obtaining competitive employment that reflects the interests and desires of the individual through:\n1.Pre-employment services — activities that assist an individual with obtaining employment.\n2.Employment-sustaining services — activities that support the individual in retaining and maintaining employment.\n3.Pre-employment services support an individual’s ability to prepare for and transition to competitive employment, including direct face-to-face contact with the client as well as collateral service.","url":"","verified":"","notes":"","row":1},{"id":"wa-pre-employment-services","state":"WA","title":"Pre-Employment Services","name":"Pre-Employment Services","source":"","category":"employment","topic":"definition","text":"1.Prevocational/job-related discovery or assessment\n2.Person-centered employment planning\n3.Individualized job development and placement\n4.Job carving — defined as working with the client and employer to modify an existing job description so it contains one or more, but not all, of the tasks from the original job description when a potential applicant for a job is unable to perform all the duties identified in the job description\n5.Benefits education and planning — defined as counseling to assist the client in fully understanding the range of state and federal benefits he or she might be eligible for, the implications that work and earnings would have for continued receipt of these benefits, and the client’s options for returning to work\n6.Transportation (only in conjunction with the delivery of an authorized service)","url":"","verified":"","notes":"","row":2},{"id":"wa-employment-sustaining-services","state":"WA","title":"Employment Sustaining Services","name":"Employment Sustaining Services","source":"","category":"employment","topic":"definition","text":"1.Career advancement services — defined as services that expand opportunities for professional growth, assist with enrollment in higher education or credentialing and certificate programs to expand job skills or enhance career development, and assist the individual in monitoring his/her satisfaction with employment and determining the level of interest and opportunities for advancement with the current employer, and/or changing employers for career advancement\n2.Negotiation with employers — defined as services where a provider identifies and addresses job accommodations or assistive technology needs with the employer on behalf of the individual\n3.Job accommodations can include the following:\na.Adjusting work schedule to reduce exposure to triggering events (i.e., heavy traffic triggering symptoms of agoraphobia)\nb.Providing a private area for individuals to take breaks if they experience an increase in symptoms\nc.Access to a telephone to contact a support person if needed while at work\nd.Adjusting job schedule to accommodate scheduled appointments\ne.Small, frequent breaks as opposed to one long one\n4.Assistive technology can include the following\na.Bedside alarms\nb.Electronic medication reminders while at work or at home\nc.Use of headset/iPod to block out internal or external distractions\n5.Job analysis — defined as gathering, evaluating and recording accurate, objective data about the characteristics of a particular job to ensure the specific matching of skills and amelioration of maladaptive behaviors.\n6.Job coaching\n7.Benefits education and planning — defined as counseling to assist the client in fully understanding the range of state and federal benefits he or she might be eligible for, the implications that work and earnings would have for continued receipt of these benefits, and the client’s options for returning to work\n8.Transportation (only in conjunction with the delivery of an authorized service)\n9.Asset development — defined as services supporting clients’ accrual of assets that have the potential to help clients improve their economic status, expand opportunities for community participation and positively impact their quality-of-life experience\na.Assets are defined as something with value owned by an individual, such as money in the bank, property and retirement accounts\n10.Follow along supports — defined as the ongoing supports necessary to assist an eligible client to sustain competitive work in an integrated setting of his or her choice.\n11.This service is provided for, or on behalf of, a client and can include communicating with the client’s supervisor or manager, whether in the presence of the client or not (if authorized and appropriate). There is regular contact and follow-up with the client and employer to reinforce and stabilize job placement. Follow-along support and/or accommodations are negotiated with an employer prior to the client starting work or as circumstances arise.","url":"","verified":"","notes":"","row":3},{"id":"wa-individual-employment","state":"WA","title":"Individual Employment","name":"Individual Employment","source":"","category":"employment","topic":"definition","text":"Helps you find and keep competitive employment. Support for employment opportunities and career development is based on your needs, interests and abilities.","url":"","verified":"","notes":"","row":4},{"id":"wa-group-supported-employment","state":"WA","title":"Group Supported Employment","name":"Group Supported Employment","source":"","category":"employment","topic":"definition","text":"You work in small groups in the community with supervision and shared supports. Services are intended to lead to individual jobs in the community. Crew examples include janitorial, landscaping or other work that can be done by a small group.","url":"","verified":"","notes":"","row":5}]},{"code":"WV","name":"West Virginia","notes":[],"entries":[{"id":"wv-prevocational-services-waiver","state":"WV","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational services are designed to create a path to integrated community-based employment for which a person is compensated at or above the minimum wage, but no less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. These services should enable each person who receives services to attain the highest level of work in a setting matched to the person’s strengths, interests, priorities, and abilities. Meals provided as part of this service shall not constitute a full nutritional regimen of 3 meals per day.\n\nPre-vocational Services include, but are not limited to, such concepts as:\n\nAttendance;\n\n• Task completion;\n\n• Problem solving;\n\n• Interpersonal relations;\n\n• Safety;\n\n• Appropriate attitudes and work habits, such as socially appropriate behaviors on the worksite;\n\n• Adjusting to production and performance standards of the workplace;\n\n• Following directions;\n\n• Compliance in workplace rules or procedures;\n\n• Appropriate use of work-related facilities, such as restrooms, cafeterias/lunchrooms, and break areas; and\n\nPersons receiving pre-vocational services must have employment-related goals on the IPP and general habilitation activities must be designed to support such employment goals.\n\nPre-vocational Direct Support Professionals may attend and participate in IDT meetings and the annual functional assessment for eligibility conducted by the UMC if requested by the person who receives services or their legal representative.","url":"","verified":"","notes":"","row":1},{"id":"wv-prevocational-services-limits-waiver","state":"WV","title":"Prevocational Services – Limits (Waiver)","name":"Prevocational Services – Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"The maximum annual units of Pre-Vocational Services cannot exceed 6,240 units/1,560 hours (average 6 hours/weekday), in combination with other day habilitation services, per the person's IPP year.\n\nPre-Vocational services may not be accessed by anyone under the age of 18 or who is enrolled in a public school setting.\n\nThe amount of service is limited by the individualized budget of the person who receives services.","url":"","verified":"","notes":"","row":2},{"id":"wv-prevocational-services-licensed-behavioral-health-center-idd","state":"WV","title":"Prevocational Services – Licensed Behavioral Health Center IDDW Provider Specifications (Waiver)","name":"Prevocational Services – Licensed Behavioral Health Center IDDW Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"Agency must have a current WV Behavioral Health License issued by the WV DoHS Office of Health Facility Licensure and Certification (OHFLAC). The site must be listed on the agency's Behavioral Health License from OHFLAC.\n\nAgency must be an approved IDDW Provider and an enrolled WV Medicaid Provider\n\nAgency staff must have current CPR and First Aid cards, have acceptable state and federal fingerprint-based checks, acceptable Federal Office of the Inspector General (OIG) Medicaid Exclusion List check, be over the age of 18, be able to perform the tasks and meet training requirements as mandated by Office of Health Facility Licensure and Certification and the Bureau for Medical Services.\n\nAgency is verified by the Office of Health Facility Licensure and Certification. Agency staff is verified by the Licensed Behavioral Health Provider and the UMC. The UMC will perform certification validation during on-site reviews.\n\nAgency behavioral health license is verified biennially.\n\nStaff credentials are verified initially and annually, including state and federal fingerprint-based checks which are checked initially and every 5 years. Monthly OIG checks are no longer required as the WV CARES criminal background check database features a “rap back” system that provides continues monitoring of criminal histories and issues alert when there is a subsequent change in an individual's criminal history.","url":"","verified":"","notes":"","row":3},{"id":"wv-supported-employment-waiver","state":"WV","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment Services provided by awake and alert Direct Support Professionals are services that enable people to engage in paid, competitive employment in integrated community settings. The services are for people who have barriers to obtaining employment due to the nature and complexity of their disabilities. The services are designed to assist people for whom competitive employment at or above the minimum wage is unlikely without such support and services and need ongoing support based upon the level of need of the person who receives services.\n\nSupported Employment services include, but are not limited to:\n\n• Vocational counseling (Example: Discussion of on-the-job work activities);\n\n• Job development and placement for a specific person who receives IDDW services with the person present;\n\n• On-the-job training in work and work-related skills;\n\n• Accommodation of work performance tasks;\n\n• Supervision and monitoring by a job coach;\n\n• Intervention to replace inappropriate work behaviors with adaptive work skills and behaviors;\n\n• Retraining as jobs change or job tasks change;\n\n• Training in skills essential to obtain and retain employment, such as the effective use of community resources; and\n\n• Transportation to and from job sites when other forms of transportation are unavailable or inaccessible.\n\nNatural work setting supports are to be considered prior to the utilization of Supported Employment.\n\nSupported Employment Services must be supervised by a Behavior Support Professional. In addition to the standard training requirements, Direct Support Professionals providing Supported Employment services must have documented training or experience in implementation of Supported Employment plans of instruction.\n\nSupported Employment Direct Support Professionals may attend and participate in IDT meetings and the annual assessment of functioning for eligibility conducted by the UMC if requested by the person who receives services or their legal representative (if applicable).\n\nDocumentation is maintained in the file of each person who receives Supported Employment IDDW services that a referral was made to a program funded under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.) before this service was provided.","url":"","verified":"","notes":"","row":4},{"id":"wv-supported-employment-limits-waiver","state":"WV","title":"Supported Employment - Limits (Waiver)","name":"Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"The maximum annual units of Supported Employment Services cannot exceed 8,320 units/2,080 hours (average 8 hours/5 days per week) the person's IPP year. Supported Employment services may not be accessed by anyone under the age of 18 or who is enrolled in a public school setting.\n\nThe amount of service is limited by the individualized budget of the person who receives services.","url":"","verified":"","notes":"","row":5},{"id":"wv-supported-employment-licensed-behavioral-health-center-iddw-","state":"WV","title":"Supported Employment - Licensed Behavioral Health Center IDDW Provider Specifications (Waiver)","name":"Supported Employment - Licensed Behavioral Health Center IDDW Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Agency must have a current WV Behavioral Health License issued by the WV DoHS Office of Health Facility Licensure and Certification (OHFLAC).\n\nAgency must be an approved IDDW Provider and an enrolled WV Medicaid Provider\n\nAgency staff must have current CPR and First Aid cards, have acceptable state and federal fingerprint-based checks, acceptable Federal Office of the Inspector General (OIG) Medicaid Exclusion List check, be over the age of 18, be able to perform the tasks and meet training requirements as mandated by Office of Health Facility Licensure and Certification and the Bureau for Medical Services.\n\nAgency is verified by the Office of Health Facility Licensure and Certification. Agency staff is verified by the Licensed Behavioral Health Provider and the UMC. The UMC will perform certification validation during on-site reviews.\n\nAgency behavioral health license is verified biennially.\n\nStaff credentials are verified initially and annually, including state and federal fingerprint-based checks which are checked initially and every 5 years. Monthly OIG checks are no longer required as the WV CARES criminal background check database features a “rap back” system that provides continues monitoring of criminal histories and issues alert when there is a subsequent change in an indvidual's criminal history.","url":"","verified":"","notes":"","row":6}]},{"code":"WI","name":"Wisconsin","notes":[],"entries":[{"id":"wi-prevocational-services-waiver","state":"WI","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational services are designed to create a person-centered path for participants to achieve or maintain at least part-time participation in competitive integrated employment (CIE). CIE is defined in the SMA program resources. This service involves community-based learning, paid work training experiences, and community-based volunteering where the participant can develop general, non-job-task-specific strengths, skills, knowledge, and experience that contribute to employability within CIE. Services are expected to occur over a defined period of time as determined by the participant and their IRIS consultant. The expected outcome of this service is measurable gains in knowledge, skills, personal strengths, and experiences that contribute to the member’s engagement to obtain or maintain CIE with the highest possible wage. When this service is authorized for a participant already working in CIE, the service must focus on goals related to ensuring the member’s success in, and ability to sustain CIE. Any participant who utilizes this service must have a documented outcome of CIE on their service plan. This service cannot be authorized or reauthorized for a participant who has indicated that they do not wish to pursue CIE.\n\nPrevocational services include:\n\n• Community-based exploration and experiential opportunities that facilitate a participant’s desire for, and ongoing participation in CIE at the highest possible wage;\n\n• Services and skill-building opportunities that are matched to the participant’s interests, strengths, priorities, abilities, and conditions for success in CIE (including programs such as Project SEARCH);\n\n• Development of general skills that lead to CIE, including:\n\no Communicating effectively with supervisors, co-workers, and customers;\n\no Expressing and understanding expectations;\n\no Adhering to generally accepted community workplace conduct;\n\no Following directions and completing tasks;\n\no Utilizing workplace problem-solving skills and strategies;\n\no Learning to network;\n\no Developing interview skills;\n\no Creating resumes and portfolios;\n\no Managing conflicts;\n\no Learning and applying general workplace safety; and\n\no Mobility training.\n\n• Volunteering opportunities; and\n\n• Completion of a six-month progress report and service plan documentation. The purpose of this is to ensure and document that prevocational services are assisting the participant  in progressing toward a goal of at least part-time, integrated employment. Timely completion of this document is required for reauthorization of prevocational services.\n\nUnless used to support Project SEARCH, community-based prevocational services are expected to be provided in small groups no larger than three (3). This service can be provided on an individual basis as appropriate for participant’s needs.\n\nPersonal care services and transportation between the participant's place of residence and the prevocational setting may be\n\nprovided as a component of this service (transportation between the service setting and any community site is always included in this service and provider’s rate). The cost of these services is included in the rate paid to providers of these services.\n\nThis service may be provided in a disability-specific, provider owned and controlled (facility-based) setting or a non-disability-specific (community-based) setting. When this service is provided in a provider owned or controlled setting for any portion of the service delivery, the setting is considered facility-based. However, a portion of facility-based setting services must involve community-based service opportunities for participants. When this service is provided in a community setting 100% of the time, the setting is considered community-based. Community-based service delivery may use a provider owned or controlled setting as a primary address but cannot provide services in that setting.\n\nWaiver funding is not available for vocational services (paid work as opposed to time-limited paid training) delivered in facility-based settings where participants are supervised for the primary purpose of producing goods or performing services.\n\nWhen a participant’s service plan includes a prevocational service, there must be documented opportunities for participation in community-based activities consistent with the intended outcome of this service and which facilitate the participant’s\n\ninteractions with people from the broader community who are not receiving waiver services. This includes opportunities and support specific to pursuing CIE in the community.\n\nPrevocational services are not considered outcomes in and of themselves, nor is any prevocational service, including paid training, considered to be employment if service authorization is required to ensure the continued availability for the participant’s participation in the paid training.\n\nParticipation in prevocational services is not a prerequisite for participation in CIE or authorization of any other employment services provided under the waiver. Participants who receive prevocational services may also receive educational services, supported employment, and/or day services. The participant’s service plan may include two or more types of non-residential services. However, different types of non-residential services may not be billed for the same period of time. These services also may not overlap or be blended with other employment services or residential services.\n\nPrevocational services may be provided to supplement, but not duplicate services that are available and provided to a participant as part of an approved Individualized Plan for Employment (IPE), funded under the Rehabilitation Act of 1973, as amended, or under an approved Individualized Education Plan (IEP), under the Individuals with Disabilities Education Act (IDEA). Prior to authorizing this service, the participant’s record documents that this service is not otherwise available to the participant through a program funded by Vocational Rehabilitation under section 110 of the Rehabilitation Act of 1973, as amended, and, for participants ages 18-22, not available through a program funded under the Individuals with Disabilities Education Act (IDEA) (20 U.S.C.1401 et seq).\n\nParticipants who participate in paid training as part of prevocational services shall be compensated in accordance with applicable Federal and State laws and regulations. Compensation at sub-minimum wage shall comply with the Fair Labor Standards Act and the Workforce Investment and Opportunity Act (WIOA) including WIOA provision for youth with disabilities under age 26. If a member’s calculated wage for paid training in this service under Section 14(c) of the FLSA is minimum wage or higher, the member is not eligible to receive facility-based prevocational services during the time this paid training is occurring. This service cannot involve volunteering for a service provider on their service plan or volunteering in situations where a participant must be paid under state and federal labor laws.\n\nPrevocational services may only be funded through the waiver when otherwise not available through the State Plan, Medicare, or a responsible private or public entity. Waiver funds may not be used to purchase this service if it is otherwise provided to the general public for free. This service may not be duplicated or bundled with any service that is provided under another waiver service category.","url":"","verified":"","notes":"","row":1},{"id":"wi-prevocational-services-community-based-prevocational-service","state":"WI","title":"Prevocational Services - Community-Based Prevocational Services Provider Specifications (Waiver)","name":"Prevocational Services - Community-Based Prevocational Services Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"Service delivery is 100% community-based, and\n\nAt least one of the following:\n\n• Accreditation by a nationally recognized accreditation agency, or\n\n• A DVR contracted provider of Supported Employment Services, or\n\n• A minimum of two years of experience working with the target population providing employment-related services.\n\nIf transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nThe provider must comply with all applicable occupational health and safety standards of the Federal Occupational Safety and Health Administration (OSHA).\n\nVerification occurs annually by the Fiscal Employer Agency","url":"","verified":"","notes":"","row":2},{"id":"wi-prevocational-services-facility-based-prevocational-services","state":"WI","title":"Prevocational Services - Facility-Based Prevocational Services Provider Specifications (Waiver)","name":"Prevocational Services - Facility-Based Prevocational Services Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"Facility is HCBS compliant per 42 CFR § 441.301(c)(4), and\n\nAt least one of the following:\n\n• Accreditation by a nationally recognized accreditation agency, or\n\n• A DVR contracted provider of Supported Employment Services, or\n\n• A minimum of two years of experience working with the target population providing employment-related services\n\nIf transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nThe provider must comply with all applicable occupational health and safety standards of the Federal Occupational Safety and Health Administration (OSHA).\n\nVerification occurs annually by the Fiscal Employer Agent","url":"","verified":"","notes":"","row":3},{"id":"wi-cie-exploration-waiver","state":"WI","title":"CIE Exploration (Waiver)","name":"CIE Exploration","source":"Waiver","category":"career","topic":"definition","text":"Competitive integrated employment (CIE) Exploration is intended to help participants make an informed choice about whether they would like to pursue CIE, including self-employment. CIE is defined in the SMA program resources. CIE Exploration is appropriate for a participant who is not currently employed in CIE and needs more information to make informed choice about whether they want to pursue CIE, including self-employment.\n\nCIE Exploration includes:\n\n• Arrangement of career exploration opportunities and assistance in participation of at least 3 business tours, informational interviews, and/or job shadows;\n\n• Debriefing with the participant after career exploration experiences;\n\n• Introductory education on supported employment services;\n\n• An initial conversation about work incentives available to minimize the impact of CIE on public benefits and identification of need for personalized, in-depth Work Incentives Benefits Analysis;\n\n• Documentation in the participant’s plan regarding their choice about pursuing CIE following the completion of the service;\n\n• Person-centered exploration planning; and\n\n• Completion of the required reporting documentation related to this service, as detailed in SMA policy.\n\nCIE Exploration may not be provided in a small group format. The ratio is always 1:1 for this service.\n\nCIE Exploration may only be provided in non-disability specific settings typically found in the community or the participant’s residence, which is not a provider-controlled setting. The only exception is if the participant lives in a residential setting that is leased, owned, operated, or controlled by a provider and this setting is the most appropriate setting for this service.\n\nParticipants who are receiving CIE exploration services may not receive individual supported employment services or vocational futures planning and support services. This service does not include Work Incentives Benefits Analysis, which is covered under individual supported employment.\n\nCIE Exploration services may be provided to supplement, but not duplicate, services that are available and provided to a participant as part of an approved Individualized Plan for Employment (IPE), funded under the Rehabilitation Act of 1973, as amended, or under an approved Individualized Education Plan (IEP), under the Individuals with Disabilities Education Act (IDEA). Prior to authorizing this service, the participant’s record documents that this service is not otherwise available to the participant through a program funded by Vocational Rehabilitation under section 110 of the Rehabilitation Act of 1973, as amended, and, for participants ages 18-22, not available through a program funded under the Individuals with Disabilities Education Act (IDEA) (20 U.S.C.1401 et seq).\n\nTransportation between the participant's place of residence and the service setting may be provided as a component of this service (transportation between the service setting and any community site is always included in this service and provider’s rate). The cost of these services is included in the rate paid to providers of these services.\n\nCIE Exploration may only be funded through the waiver when otherwise not available through the State Plan, Medicare, or a responsible private or public entity. Waiver funds may not be used to purchase this service if it is otherwise provided to the general public for free. This service may not be duplicated or bundled with any service that is provided under another waiver service category.","url":"","verified":"","notes":"","row":4},{"id":"wi-cie-exploration-limits-waiver","state":"WI","title":"CIE Exploration – Limits (Waiver)","name":"CIE Exploration – Limits","source":"Waiver","category":"career","topic":"limits","text":"CIE Exploration may not be authorized on a participant’s service plan for longer than a 365-day period and only when the participant is not actively receiving service(s) to obtain CIE or already engaged in CIE.","url":"","verified":"","notes":"","row":5},{"id":"wi-cie-exploration-individual-provider-specifications-waiver","state":"WI","title":"CIE Exploration Individual Provider Specifications (Waiver)","name":"CIE Exploration Individual Provider Specifications","source":"Waiver","category":"career","topic":"provider","text":"services; or\n\n• CESP certification from National APSE; or\n\n• ACRE Basic Employment Certificate in Supported Employment, Community Employment or Customized Employment;\n\nor\n\n• At least 2 years of experience working with the target population providing employment-related services.\n\nIf transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nVerification occurs annually by the Fiscal Employer Agent","url":"","verified":"","notes":"","row":6},{"id":"wi-cie-exploration-supported-employment-agency-provider-specifi","state":"WI","title":"CIE Exploration – Supported Employment Agency Provider Specifications (Waiver)","name":"CIE Exploration – Supported Employment Agency Provider Specifications","source":"Waiver","category":"career","topic":"provider","text":"• A DVR contracted provider of Supported Employment or Customized Employment services; or\n\n• Accreditation by a nationally recognized accreditation agency; or\n\n• A minimum of two years of experience working with the target population providing employment-related services.\n\nIf transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nVerification occurs annually by the Fiscal Employer Agent","url":"","verified":"","notes":"","row":7},{"id":"wi-individual-supported-employment-waiver","state":"WI","title":"Individual Supported Employment (Waiver)","name":"Individual Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Individual Supported Employment services that consist of six separate service components which assist participants with obtaining and maintaining competitive integrated employment (CIE). CIE is defined in the SMA program resources. For each service covered under this category, the completion of all applicable documentation is a requirement of service provision as detailed in SMA policy.","url":"","verified":"","notes":"","row":8},{"id":"wi-individual-supported-employment-discovery-waiver","state":"WI","title":"Individual Supported Employment - Discovery (Waiver)","name":"Individual Supported Employment - Discovery","source":"Waiver","category":"career","topic":"definition","text":"CIE discovery is a time-limited practice for participants who have decided to pursue CIE. This service is appropriate when a participant requires further assessment to guide successful job development efforts after they have determined they would like to pursue CIE. The decision to pursue CIE must be documented in the plan prior to utilizing this service category. CIE Discovery includes:\n\na. Person-centered discovery assessment process as part of CIE planning;\n\n b. An application to the Division of Vocational Rehabilitation (DVR) for assistance with obtaining CIE, including sharing the participant’s completed assessment profile with their DVR counselor;\n\nc. Clarifying specific conditions necessary for the participant to achieve a successful CIE outcome by:  i. Observing the participant in familiar and novel situations with an emphasis on familiar situations and activities where participant’s specific interests, skills, and competencies will be most apparent; ii. Interviews with family, friends, and others with close relationships to the participant to gain additional understanding of the participant’s specific interests, skills, strengths, abilities, and conditions for success in CIE; iii. Translating interests, skills, and strengths exhibited in the participant’s daily life into possibilities for CIE; iv. Completion of an individualized summary of the CIE discovery process and outcomes; and v. Documentation of each date of service, the activities performed, and the duration of each activity in the CIE discovery service.\n\nd. Determining participant interest toward aspects of the labor market;\n\ne. Recognizing skills, strengths, and other contributions valuable to employers or to the community; and\n\nf. Identify and effectively match participant’s interests, skills, strengths, personality, and conditions for success to a prospective employer and job.","url":"","verified":"","notes":"","row":9},{"id":"wi-individual-supported-employment-job-development-waiver","state":"WI","title":"Individual Supported Employment - Job Development (Waiver)","name":"Individual Supported Employment - Job Development","source":"Waiver","category":"employment","topic":"definition","text":"CIE Job Development is designed to support a participant through job development with the goal to obtain CIE. CIE resulting from job development must be consistent with the participant’s person-centered employment outcomes, including type of work, preferred hours, and income desired. Job development includes:\n\na. Written goals, preferences, and conditions for success prior to the start of the service;\n\nb. Obtaining sufficient knowledge from the participant’s CIE Discovery process to effectively match their interests, skills, strengths, personality, and conditions for success to a prospective employer and job;\n\nc. Direct and indirect time networking with businesses on behalf of the participant to find and create CIE opportunities;\n\nd. Job duty negotiation and representation on behalf of the participant with prospective employers; and\n\ne. Assessing and negotiating the types of assistance and accommodations a participant may need to fully perform and maintain their job.\n\nCIE Job Development may not be authorized for a participant already engaged in CIE, except when specific criteria is met, as detailed in policy.","url":"","verified":"","notes":"","row":10},{"id":"wi-individual-supported-employment-job-coaching-waiver","state":"WI","title":"Individual Supported Employment - Job Coaching (Waiver)","name":"Individual Supported Employment - Job Coaching","source":"Waiver","category":"employment","topic":"definition","text":"CIE job coaching consists of job training and performance-related supports for a participant. CIE job coaching includes:\n\n a. Task analysis of the job;\n\nb. Structured intervention techniques, including job site training via systematic instruction, to assist the participant in learning to perform job tasks;\n\nc. Teaching and modeling appropriate work ethics, interpersonal skills, and other soft skills necessary to ensure success in CIE, including travel and mobility skills;\n\nd. Engagement with the participant’s supervisor and co-workers;\n\ne. Evaluation and facilitation of necessary job accommodations;\n\nf. Performance assessments to measure progress in learning tasks and skills required to successfully sustain CIE;\n\ng. Assisting the participant to develop self-advocacy skills at work; and h. A job coach fading plan.","url":"","verified":"","notes":"","row":11},{"id":"wi-individual-supported-employment-workplace-personal-assistanc","state":"WI","title":"Individual Supported Employment - Workplace Personal Assistance (Waiver)","name":"Individual Supported Employment - Workplace Personal Assistance","source":"Waiver","category":"employment","topic":"definition","text":"Workplace Personal Assistance (WPA) Workplace personal assistance provides on-going employment supports and personal assistance at the workplace for the participant to sustain CIE when job coaching for independence is no longer needed. This service is used to assist a participant in tasks where independent mastery has been determined not possible due to physical, behavioral health, and/or emotional challenges. CIE Workplace Personal Assistance includes:\n\na. Assistance with personal care while at work;\n\nb. Assistance during paid and unpaid breaks;\n\nc. Motivational and behavioral supports;\n\nd. Physical supports using the concept of partial participation;\n\ne. Supervision supports to maintain safety in the workplace;\n\nf. Assisting the participant to maintain employment by working with the employer and co-workers on scheduling, performance expectations, transportation, communication, and promoting skill acquisition; and\n\ng. Check-ins with the employer regarding work performance and expectations. Workplace personal assistance can be provided in addition to CIE job coaching only when a participant has a portion of their job where they are expected to become independent through assistance from a job coach and has another portion of the job where they are not expected to be able to become independent. Job coaching and WPA services may not be provided for the same unit of time.","url":"","verified":"","notes":"","row":12},{"id":"wi-individual-supported-employment-partners-with-business-waive","state":"WI","title":"Individual Supported Employment -Partners with Business (Waiver)","name":"Individual Supported Employment -Partners with Business","source":"Waiver","category":"employment","topic":"definition","text":"PwB enables a participant to maintain CIE with a combination of informal and paid employment supports provided directly by their employer. The supported employment provider reimburses the employer for the co-worker(s) support that is beyond what is typically available to workers without disabilities filling the same or similar positions. PwB includes: a. Facilitating and establishing the PwB arrangement, including: i. Utilization of the PwB support analysis; ii. Negotiation of PwB supports with the employer; iii. Implementation of co-worker background checks; iv. Implementation of a PwB agreement; and v. Development of a co-worker support plan, that outlines the direct support provided by a co-worker that a job coach/WPA would otherwise provide. b. Training for the co-worker(s) providing PwB support, including: i. Training specific to the participant, including the support plan, communication style, learning style, and specific needs related to performing and maintaining their job; and ii. Ensuring the co-worker completes the DHS WPA web-based training if providing assistance with personal care. c. Supporting the employer, supervisor, and co-workers supporting the participant, including: i. On and off-site follow-along back-up supports; ii. Providing assistance with supports typically provided by the co-worker when temporarily unavailable; and iii. Monthly check-ins with the employer and participant, at minimum. d. Fading expectations should be in place to maximize the independence of the employed participant while also ensuring that the participant can successfully maintain CIE. The employer may only be reimbursed for supports identified through the PwB support analysis that would otherwise be provided by a job coach or WPA. Reimbursement is based on units of service that would otherwise need to be provided by a Supported Employment provider, as determined through the PwB support analysis. Informal supports for the participant, already negotiated with, and provided by, the employer prior to the implementation of PwB are not reimbursable under\n PwB.","url":"","verified":"","notes":"","row":13},{"id":"wi-individual-supported-employment-work-incentives-benefits-cou","state":"WI","title":"Individual Supported Employment -Work Incentives Benefits Counseling (Waiver)","name":"Individual Supported Employment -Work Incentives Benefits Counseling","source":"Waiver","category":"employment","topic":"definition","text":"Work Incentive Benefits Counseling (WIBC) WIBC provides the participant individualized information about their benefits and how earnings could affect them. The information offers the participant guidance to make informed choices about employment. WIBC services includes:\n\na. Verifying the participant’s current benefits;\n\nb. Identifying benefits that may change as a result of increased work earnings;\n\nc. Identifying options and costs for health and long-term care benefits;\n\nd. Predicting foreseeable points of benefit changes;\n\ne. Providing contact information for agencies to which the participant will need to report earnings;\n\nf. Providing accurate and appliable information regarding Social Security work incentives; g. Developing a written summary of an individualized person-centered work incentive benefits analysis; h. Holding an in-person meeting with the participant to explain the individualized written work incentive benefits analysis; and i. Providing follow-along services for up to one year for questions and clarifications about benefits.","url":"","verified":"","notes":"","row":14},{"id":"wi-individual-supported-employment-ctnd-waiver","state":"WI","title":"Individual Supported Employment CTND (Waiver)","name":"Individual Supported Employment CTND","source":"Waiver","category":"employment","topic":"limits","text":"Individual supported employment services may be provided only in non-disability-specific settings in the community, whichare not leased, owned, operated, or controlled by a service provider. The only exceptions are during the observation element of the CIE discovery component, where a disability-specific setting is a familiar place for the participant.\n\nIndividual supported employment services may not be provided in a small-group format. The ratio is always 1:1 for this service. Supported employment services may not include volunteer work, regardless of the setting. These services do not\ninclude payment for supervision, training, support, and adaptations typically available to other non-disabled workers in similar positions at their place of employment.\n\nParticipants working, regardless of what individual supported employment services are selected or provided, shall be compensated in accordance with applicable Federal and State laws and regulations and shall earn no less than the federal minimum wage or a higher minimum wage if established in the locality where the participant works. Individual supported employment services do not include incentive payments, subsidies, or unrelated vocational training expenses, such as: (a) incentive payments made to an employer to encourage or subsidize the employer’s participation in supported employment, or (b) wages or other payments that are passed through to users of supported employment services.\n\nPersonal care services and transportation between the participant's place of residence and the setting may be provided as a component of this service (transportation between the service setting and any community site is always included in this service and provider’s rate). The cost of these services is included in the rate paid to providers of these services.\n\nThese services may be provided to supplement, but not duplicate services that are available and provided to a participant as part of an approved Individualized Plan for Employment (IPE), funded under the Rehabilitation Act of 1973, as amended, or under an approved Individualized Education Plan (IEP), under the Individuals with Disabilities Education Act (IDEA). Prior to authorizing this service, the participant’s record documents that this service is not otherwise available to the participant\nthrough a program funded by Vocational Rehabilitation under section 110 of the Rehabilitation Act of 1973, as amended, and, for participants ages 18-22, not available through a program funded under the Individuals with Disabilities Education Act (IDEA) (20 U.S.C.1401 et seq).\n\nIndividual supported employment services may only be funded through the waiver when otherwise not available through the State Plan, Medicare, or a responsible private or public entity. Waiver funds may not be used to purchase this service if it is otherwise provided to the general public for free. This service may not be duplicated or bundled with any service that is provided under another waiver service category.","url":"","verified":"","notes":"","row":15},{"id":"wi-individual-supported-employment-work-incentive-benefits-spec","state":"WI","title":"Individual Supported Employment-Work Incentive Benefits Specialist Provider Specifications Waiver)","name":"Individual Supported Employment-Work Incentive Benefits Specialist Provider Specifications Waiver)","source":"","category":"employment","topic":"provider","text":"• DVR contracted provider of Work Incentive Benefits Services, or\n\n• Community Work Incentive Coordinator (CWIC) certification or completion of a similar comprehensive training program.\n\nVerification happens annually be the Fiscal Employer Agent","url":"","verified":"","notes":"","row":16},{"id":"wi-on-the-job-support-person-or-job-developer-specifications-wa","state":"WI","title":"On-the-Job Support Person or Job Developer Specifications (Waiver)","name":"On-the-Job Support Person or Job Developer Specifications","source":"Waiver","category":"employment","topic":"provider","text":"• A DVR contracted provider of Supported Employment or Customized Employment services; or\n\n• CESP certification from National APSE; or\n\n• ACRE Basic Employment Certificate in Supported Employment, Community Employment or Customized Employment;\n\nor\n\n• At least 2 years of experience working with the target population providing employment-related services.\n\nIf transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nVerification happens annually by the Fiscal Employer Agent","url":"","verified":"","notes":"","row":17},{"id":"wi-supported-employment-agency-provider-specifications-waiver","state":"WI","title":"Supported Employment Agency Provider Specifications (Waiver)","name":"Supported Employment Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"At least one of the following:\n\n• Division of Vocational Rehabilitation (DVR) contracted provider of Supported Employment or Customized Employment;\n\nor\n\n• Accreditation by a nationally recognized accreditation agency; or\n\n• A minimum of two years of experience working with the target population providing employment-related services in the community.\n\nIf transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nVerification happens annually by the Fiscal Employer Agent","url":"","verified":"","notes":"","row":18},{"id":"wi-work-incentive-benefits-counseling-agency-specifications-wai","state":"WI","title":"Work Incentive Benefits Counseling Agency Specifications (Waiver)","name":"Work Incentive Benefits Counseling Agency Specifications","source":"Waiver","category":"employment","topic":"provider","text":"DVR contracted provider of Work Incentive Benefits Services\n\nVerification happens annually by the Fiscal Employer Agent","url":"","verified":"","notes":"","row":19},{"id":"wi-group-supported-employment-waiver","state":"WI","title":"Group Supported Employment (Waiver)","name":"Group Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Small group supported employment services provide a combination of person-centered career exploration, career planning, and employment training activities in integrated community settings. This service is provided alongside the general\n\nworkforce in regular business or industry for groups of two to six workers. Small group supported employment must be provided in a manner that promotes integration into the workplace and integration between participants and people without disabilities in those workplaces. Examples include mobile crews, enclaves, and other business-based workgroups who employ small groups of workers with disabilities in a community setting. Small group supported employment does not include services provided in facility-based work settings.\n\nParticipants must have a goal or outcome of at least part-time competitive integrated employment (CIE) in their service plan to receive this service. The expected outcome of this service includes gains in knowledge, skills, personal strengths, and experiences, which contribute to the participant pursuing, achieving, or sustaining CIE. CIE is defined in the SMA program resources.\n\n Small group supported employment services include:\n\n• Career exploration and development leading to at least part-time participation in CIE. Career exploration activities must be provided in integrated community settings where such activities typically take place for individuals not receiving waiver services. Activities include:\n\no Business tours and informational interviews;\n\no Small group discovery;\n\no Meeting with prospective employers;\n\no Small group educational opportunities focused on key aspects of CIE;\n\no Division of Vocational Rehabilitation (DVR) orientation;\n\no Soft skill education and training opportunities;\n\no Developing transportation and mobility skills; and\n\no Identification of need and referral for work incentive benefits analysis.\n\n• Work experiences matched to a participant’s interest, strengths, skills, abilities, and conditions for success while being transferable to CIE;\n\n• Supports expected to maximize participant independence and skill acquisition, utilizing systematic instruction based on job analysis, along with individualized assistive or adaptive devices and support; and\n\n• Other workplace support services that are not specifically related to job skill training that enable the participant to be successful in work and other community settings where this service is provided\n\nSmall group supported employment does not include payment for supervision, training, support, or adaptations that are typically available to workers without disabilities who fill similar positions in the business.\n\nSmall group supported employment services may only be provided in non-disability-specific settings in the community, which are not leased, owned, operated, or controlled by a service provider. These services may not include volunteer work\n\nParticipants receiving small group supported employment may also receive educational, pre-vocational, career planning, and day services. However, different types of non-residential services may not be billed for the same period of time.\n\n These services may be provided to supplement, but not duplicate services that are available and provided to a participant as part of an approved Individualized Plan for Employment (IPE), funded under the Rehabilitation Act of 1973, as amended, or under an approved Individualized Education Plan (IEP), under the Individuals with Disabilities Education Act (IDEA). Prior to authorizing this service, the participant’s record documents that this service is not otherwise available to the participant through a program funded by Vocational Rehabilitation under section 110 of the Rehabilitation Act of 1973, as amended, and, for participants ages 18-22, not available through a program funded under the Individuals with Disabilities Education Act (IDEA) (20 U.S.C.1401 et seq).\n\nThis service does not include incentive payments, subsidies, or unrelated vocational training expenses, including the following:\n\n• Incentive payments made to an employer to encourage or subsidize the employer’s participation in supported employment,\n\nor\n\n• Wages or other payments that are passed through to users of supported employment services.\n\nParticipants engaged in elements of this service that involve work shall be compensated in accordance with applicable Federal and State laws and regulations.\n\nPersonal care services and transportation between the participant's place of residence and the setting may be provided as a component of this service (transportation between the service setting and any community site is always included in this service and provider’s rate). The cost of these services is included in the rate paid to providers of these services.\n\nSmall group supported employment services may only be funded through the waiver when otherwise not available through the State Plan, Medicare, or a responsible private or public entity. Waiver funds may not be used to purchase this service if it is otherwise provided to the general public for free. This service may not be duplicated or bundled with any service that is provided under another waiver service category.","url":"","verified":"","notes":"","row":20},{"id":"wi-small-group-supported-employment-agency-specifications-waive","state":"WI","title":"Small Group – Supported Employment Agency Specifications (Waiver)","name":"Small Group – Supported Employment Agency Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Setting is HCBS compliant per 42 CFR § 441.301(c)(4), and\n\nAt least one of the following:\n\n• Division of Vocational Rehabilitation (DVR) contracted provider of Supported Employment or Customized Employment;\n\nor\n\n• Accreditation by a nationally recognized accreditation agency; or\n\n• A minimum of two years of experience working with the target population providing employment-related services in the community. If transportation services are provided, the provider must meet the qualifications for Community Transportation.\n\nVerification occurs annually by the Fiscal Employer Agent.","url":"","verified":"","notes":"","row":21}]},{"code":"WY","name":"Wyoming","notes":[],"entries":[{"id":"wy-supported-employment-waiver","state":"WY","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment Services are intended to help a participant find and maintain a job that meets their personal and career goals. Supported Employment Services offer a variety of supports to assist a participant who is age 18 or older and, because of their disability, needs intensive support to find and maintain self-employment or a job in a competitive, integrated work setting for which the participant is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by an individual without a disability.\n\nServices are conducted in a variety of settings, particularly work sites where people without disabilities are employed. Services include activities needed in order for a participant to sustain paid work, including supervision and training. Payment is made only for the adaptations, supervision, and training required by participants as a result of their disability, but does not include payment for the supervisory activities rendered as a normal part of doing business.\n\nConsistent with the Olmstead decision and with person-centered planning, a participant’s IPC must be developed in a manner that reflects individual choice and goals relating to employment, and ensures provision of services in the most integrated setting appropriate. Objectives that support the need for continued job coaching with a plan to lessen the job coaching over time, if possible, should be identified in the participant's IPC.\n\nSmall Group Supported Employment: Small Group Supported Employment may be provided under a group rate for groups ranging from 2 to 8 participants, and include mobile work crews or enclaves. Group employment for groups larger than 8 people will not be reimbursed by the waiver.\n\nThe job coach must be in the immediate vicinity and available for immediate intervention and support. Services will ideally be provided in a manner that promotes integration into the workplace and interaction between participants and people without disabilities in these workplaces. Small Group Supported Employment may include employment in community businesses or businesses that are part of a provider organization.\n\nIndividual Supported Employment: Individual Supported Employment services are 1:1 supports available to a participant, and include customized and self-employment. Individual Supported Employment also includes 1:1 career planning and discovery support services that focus on individualized determination of the strengths, needs, and interests of the participant, and are designed to meet the specific needs of the employee and employer relationship. These services include employment developed through job carving, self-employment or entrepreneurial initiatives, or other job development or restructuring strategies that result in job responsibilities being customized and individually negotiated to fit the needs of participants. These services presume the provision of reasonable accommodations and supports necessary to perform functions of a job that is individually negotiated and developed.\n\nA final component of Individual Supported Employment is a direct follow along service, which enables a participant who is paid at or above minimum wage to maintain employment in an integrated community employment setting. This service is provided for a participant through job support and communication with the participant’s supervisor or manager, while the participant is present. Reimbursable activities include teaching job tasks and monitoring performance to ascertain the success of the job placement, support services not specifically related to job skill training that enable the participant to be successful in integrating into the job setting, and time spent at the participant’s work site conducting observation and supervision of the participant.\n\nIndividual Supported Employment must be provided in a community employment setting, unless the support is to address issues necessary to maintain a current job, or to develop customized employment, self-employment, or home-based employment, subject to prior approval of DHCF.\n\nSupported Employment Follow Along: Supported Employment Follow Along (SEFA) services enable a participant, who is paid at or above the federal minimum wage, to maintain employment in an integrated community employment setting. SEFA is intended to be an indirect service, meaning the service is provided for, or on behalf of, a participant through intermittent and occasional job support and communication with the participant’s supervisor or manager, while the participant is not present. However, this definition does not preclude the participant from being present during the provision of this service. SEFA may include phone calls between support staff and the participant’s managerial staff. SEFA reimburses up to 100 units annually; approved units are based upon the participant’s need in order to maintain employment. SEFA services shall be specifically outlined in the IPC.\n\nSEFA reimbursable activities include:\n\n- Regular contact and follow-up with the employer in order to reinforce and stabilize the job placement\n\n- Facilitation of natural supports at the work site\n\n- Individual program development, writing tasks analyses, monthly reviews, termination reviews and behavioral intervention programs\n\n- Advocacy on behalf of the participant, but only with people at the employment site (i.e., employers, co-workers, customers) and only for purposes directly related to employment\n\n- Staff time to travel to and from a work site\n\nSEFA non-reimbursable activities include:\n\n- Transportation of a participant\n\n- Observations of activities taking place in a group, i.e., work crews or enclaves\n\n- Public relations\n\n- Community education\n\n- In-service meetings, department meetings, individual staff development\n\nSEFA non-reimbursable activities include:\n\n- Transportation of a participant\n\n- Observations of activities taking place in a group, i.e., work crews or enclaves\n\n- Public relations\n\n- Community education\n\n- In-service meetings, department meetings, individual staff development\n\nApproved services must be directly related to a participant’s employment needs and fit within the participant’s assigned budget","url":"","verified":"","notes":"","row":1},{"id":"wy-supported-employment-limits-waiver","state":"WY","title":"Supported Employment – Limits (Waiver)","name":"Supported Employment – Limits","source":"Waiver","category":"employment","topic":"limits","text":"Documentation that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 (Vocational Rehabilitation or Workforce Services) or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.) must be maintained in the case manager and provider file. Services cannot be provided during the same timeframes that a participant is receiving services through an Individualized Educational Plan (IEP). A third party liability form may be required by DHCF unless the participant is using the first 100 units of this service to help access assistance from the Division of Vocational Rehabilitation (DVR), to complete a career planning assessment tool, or for indirect SEFA services.\n\nThis service cannot be used to fund incentive payments including:\n\n- Payments made to an employer to encourage or subsidize the employer's participation in a supported employment\n\nprogram;\n\n- Payments that are passed through to users of supported employment programs; or\n\n- Payments for training that is not directly related to a participant's supported employment program.\n\nRelative providers (defined as a biological, adoptive, or step parent), spouses, and legally authorized representatives cannot provide these services.\n\nTransportation is included in the reimbursement rates for a direct service, but cannot be used for SEFA services or solely for the purpose of transporting a participant to and from work.","url":"","verified":"","notes":"","row":2},{"id":"wy-supported-employment-individual-hired-by-the-participant-spe","state":"WY","title":"Supported Employment - Individual hired by the participant specifications","name":"Supported Employment - Individual hired by the participant specifications","source":"","category":"employment","topic":"provider","text":"Prior to providing services, and individual being hired by the participant shall:\n\n• Be at least 18 years of age;\n\n• Successfully pass a criminal history background screening;\n\n• Be able to effectively communicate with the participant and other stakeholders;\n\n• Be able to complete record keeping as required by the employer;\n\n• Hold a current driver’s license and automobile insurance, if providing transportation during the provision of services;\n\n• Hold a current CPR and First Aid certification;\n\n• Hold a current Medications Assistance Training certification, if applicable; and\n\n• Hold a certificate in crisis intervention and restraint usage (CPI, Mandt), if applicable for the participant’s needs.\n\nThe participant or legally authorized representative, with assistance as needed from the case manager, shall verify that, prior to working alone with the participant, the individual being hired has received training on the participant’s IPC and has received training on the following DHCF policies and procedures:\n\n• Participant choice;\n\n• Recognizing abuse and neglect;\n\n• Incident reporting;\n\n• Participant rights and confidentiality;\n\n• Emergency drills and situations; and\n\n• Documentation standards.\n\nThe Fiscal Employer Agent will conduct an initial and quarterly review on a random sample of files to ensure that all required documents are submitted and logged correctly in its system. The Agency will provide a weekly status report to case managers and the participant or legally authorized representative regarding provider certifications, paperwork, status of trainings, and whether or not the provider has met all requirements to work for a participant.","url":"","verified":"","notes":"","row":3},{"id":"wy-supported-employment-individual-provider-specifications-waiv","state":"WY","title":"Supported Employment – Individual Provider Specifications (Waiver)","name":"Supported Employment – Individual Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"A provider who does not designate wages and does not employ staff members other than themselves. This provider typically does not have a business tax identification number, but instead uses their social security number as a business tax identification number. An individual provider is required to attain and maintain a certification for this service from DHCF. If an individual provider meets the criteria outlined in Section 25 of Chapter 45 of Wyoming Medicaid Rules, they must attain and maintain accreditation by a nationally recognized accreditation entity for human services as specified.\n\nA provider must ensure that services occur in settings that are community based, and facilitate opportunities for participants to access the community and community resources to the same degree as people who do not receive HCBS. A participant must have choice in with whom they spend their time, the activities and events in which they are involved, and from whom they receive assistance and support. A participant must have choice and decision making authority over how they budget, manage, and spend money. A participant must be treated with dignity and respect, have their privacy respected to the extent possible for health and safety, and be free from coercion and restraint. Any restriction of a participant’s rights must meet federal requirements and include an assessed need and a restoration plan.\n\nProviders of this service must have procedures in place to assure participants are involved in making informed employment-related decisions, participants are linked to services and community resources that enable them to achieve their employment objectives, participants are given information on local job opportunities, and participants’ satisfaction with employment services is assessed on a regular basis.\n\nDHCF will initially certify a new provider for one year. Renewal of that certification, which may include an on-site visit, will be conducted at least once every three (3) years. DHCF has the authority to conduct an on-site visit when a concern is identified during a complaint, incident report, internal referral, or at the agency’s discretion.","url":"","verified":"","notes":"","row":4},{"id":"wy-agency-certified-by-dhcf-to-provide-service-specifications-w","state":"WY","title":"Agency certified by DHCF to provide service Specifications (Waiver)","name":"Agency certified by DHCF to provide service Specifications","source":"Waiver","category":"employment","topic":"provider","text":"A provider that employs one or more individuals other than themselves, and otherwise does not meet the definition of an individual provider. An agency provider is required to attain and maintain a certification for this service from DHCF, and demonstrate the legal payment of employee compensation (e.g., IRS Form 1096 that proves the issuance of one or more Form 1099, IRS Form W-3 that proves the issuance of one or more Form W-2) upon request. If a provider meets the criteria outlined in Section 25 of Chapter 45 of Wyoming Medicaid Rules, it must attain and maintain accreditation by a nationally recognized accreditation entity for human services as specified.\n\nA provider of this service must meet the requirements in Chapter 45 of Wyoming Medicaid Rules. Requirements for providers and provider direct care staff include, but are not limited to: a successful criminal history background screening; a current CPR and First Aid certification; a current Medication Assistance certification for direct care staff assisting participants with medications; a current crisis intervention and restraint usage certification, if applicable; and a current driver’s license and vehicle insurance, if providing transportation. Direct care staff must complete participant specific training prior to providing services to the participant. In addition to Chapter 45 requirements, providers must adhere to the standards and requirements of all applicable Medicaid rules and regulations, all sub-regulatory guidance, and the Wyoming Medicaid Provider Agreement.\n\nA provider must ensure that services occur in settings that are community based and facilitate opportunities for participants to access the community and community resources to the same degree as people who do not receive HCBS. A participant must have choice in with whom they spend their time, the activities and events in which they are involved, and from whom they receive assistance and support. A participant must have choice and decision making authority over how they budget, manage, and spend money. A participant must be treated with dignity and respect, have their privacy respected to the extent possible for health and safety, and be free from coercion and restraint. Any restriction of a participant’s rights must meet federal requirements and include an assessed need and a restoration plan.\n\nAgencies providing this service must have procedures in place to assure participants are involved in making informed employment-related decisions, participants are linked to services and community resources that enable them to achieve their employment objectives, participants are given information on local job opportunities, and participants’ satisfaction with employment services is assessed on a regular basis.\n\nDHCF will initially certify a new agency providing this service for one year. Renewal of that certification, which may include an on-site visit, will be conducted at least once every three (3) years. DHCF has the authority to conduct an on-site visit when a concern is identified during a complaint, incident report, internal referral, or at the agency’s discretion.","url":"","verified":"","notes":"","row":5}]}]};
/* SELN State Waiver Definitions — UI logic. Data arrives as the global DEFS
   (built by build-definitions.js). Definition text is rendered exactly as
   imported; nothing here rewrites it. */
(function () {
  'use strict';

  var STORE = 'seln-defs-v1';
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* ---------- data ---------- */
  var states = DEFS.states;
  var byCode = {}, byId = {}, all = [];
  states.forEach(function (s) {
    byCode[s.code] = s;
    s.entries.forEach(function (e) { e.stateName = s.name; byId[e.id] = e; all.push(e); });
  });
  var CATS = DEFS.categories, TOPICS = DEFS.topics;
  var catLabel = {}, catShort = {}, topicLabel = {};
  CATS.forEach(function (c) { catLabel[c.key] = c.label; catShort[c.key] = c.short; });
  TOPICS.forEach(function (t) { topicLabel[t.key] = t.label; });
  var withEntries = states.filter(function (s) { return s.entries.length; });

  /* ---------- persisted ui state ---------- */
  var ui = { state: withEntries[0] ? withEntries[0].code : '', cat: 'all', topic: 'all', pins: [], theme: 'auto',
             cmp: [withEntries[0] ? withEntries[0].code : '', withEntries[1] ? withEntries[1].code : '', '', ''],
             cmpCat: 'all', cmpTopic: 'all', cmpMode: 'states', view: 'lookup', q: '', sCat: 'all', sort: 'state', expanded: false };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    Object.keys(saved).forEach(function (k) { if (k in ui) ui[k] = saved[k]; });
  } catch (e) { /* storage unavailable */ }
  ui.pins = ui.pins.filter(function (id) { return byId[id]; });
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(ui)); } catch (e) { /* ignore */ }
  }

  /* ---------- helpers ---------- */
  function applyTheme() {
    if (ui.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', ui.theme);
    $('themeBtn').textContent = ui.theme === 'auto' ? 'Theme: auto' : ui.theme === 'dark' ? 'Theme: dark' : 'Theme: light';
  }

  var toastTimer;
  function toast(msg) {
    var t = document.querySelector('.toast');
    if (!t) { t = el('div', 'toast'); document.body.appendChild(t); }
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 1800);
  }

  function citation(e) {
    var parts = [e.stateName, e.title];
    var line = parts.join(' — ');
    if (e.url) line += '\n' + e.url;
    if (e.verified) line += '\nVerified ' + e.verified;
    return line;
  }
  function copyEntry(e) {
    var text = e.text + '\n\nSource: ' + citation(e);
    var done = function () { toast('Copied with citation'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  function staleClass(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d)) return '';
    return (Date.now() - d.getTime()) > 365 * 86400000 ? ' stale' : '';
  }

  function termRe(terms) {
    return new RegExp('(' + terms.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
  }
  /* Paragraphs that contain a search term, with ellipses where paragraphs were skipped. */
  function snippetHtml(text, terms) {
    var paras = text.split(/\n{2,}/);
    var re = termRe(terms);
    var keep = paras.map(function (p) { re.lastIndex = 0; return re.test(p); });
    if (paras.length < 3 || keep.every(Boolean)) return null;
    var out = [], shown = 0, gap = false;
    for (var i = 0; i < paras.length && shown < 3; i++) {
      if (keep[i]) { if (gap) out.push('<p class="gap">[…]</p>'); out.push('<p>' + esc(paras[i]).replace(re, '<mark>$1</mark>') + '</p>'); shown++; gap = false; }
      else gap = true;
    }
    if (shown < keep.filter(Boolean).length || gap) out.push('<p class="gap">[…]</p>');
    return out.join('');
  }
  function highlightHtml(text, terms) {
    var html = esc(text);
    if (terms && terms.length) {
      html = html.replace(termRe(terms), '<mark>$1</mark>');
    }
    return html.split(/\n{2,}/).map(function (p) { return '<p>' + p + '</p>'; }).join('');
  }

  function isPinned(id) { return ui.pins.indexOf(id) >= 0; }
  function togglePin(id) {
    var i = ui.pins.indexOf(id);
    if (i >= 0) ui.pins.splice(i, 1); else ui.pins.push(id);
    save(); renderPins();
    document.querySelectorAll('[data-id="' + id + '"]').forEach(function (n) {
      n.classList.toggle('is-pinned', isPinned(id));
      var b = n.querySelector('.pin-btn'); if (b) b.textContent = isPinned(id) ? 'Unpin' : 'Pin';
    });
    if (ui.view === 'compare' && ui.cmpMode === 'pinned') renderCompare();
  }
  function renderPins() {
    var n = ui.pins.length;
    $('pinCount').textContent = n; $('pinCount').hidden = !n;
    $('pinCount2').textContent = n;
    $('tray').hidden = !n || ui.view === 'compare';
    $('trayText').textContent = n + ' pinned';
  }

  /* ---------- card ---------- */
  function card(e, opts) {
    opts = opts || {};
    var snippet = opts.terms && opts.terms.length ? snippetHtml(e.text, opts.terms) : null;
    if (snippet) opts.clamp = false;
    var a = el('article', 'def' + (isPinned(e.id) ? ' is-pinned' : '') + (opts.clamp ? ' is-clamped' : '') + (snippet ? ' is-snippet' : ''));
    a.dataset.id = e.id; a.dataset.cat = e.category;
    var meta = '<span class="badge" data-cat="' + e.category + '">' + esc(catShort[e.category]) + '</span>' +
      '<span class="badge">' + esc(topicLabel[e.topic] || e.topic) + '</span>' +
