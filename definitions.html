<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELN State Waiver Definitions</title>
<style>
/* SELN State Waiver Definitions — shares the Prompt Studio design tokens */

:root {
  --paper: #F5F4EE;
  --card: #FFFFFF;
  --ink: #20302C;
  --mute: #5E6E69;
  --line: #DCDAD0;
  --accent: #0E6E5C;
  --accent-strong: #0A5546;
  --accent-soft: rgba(14, 110, 92, 0.09);
  --amber: #B0641C;
  --danger: #A6432C;
  --mark: #FFE9A8;
  --c-employment: #0E6E5C;
  --c-prevoc: #7A4FB3;
  --c-career: #B0641C;
  --c-general: #5E6E69;
  --shadow: 0 1px 2px rgba(32, 48, 44, 0.06), 0 6px 20px rgba(32, 48, 44, 0.05);
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-size: 15.5px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141917; --card: #1D2523; --ink: #E6ECE9; --mute: #93A39D; --line: #303B37;
    --accent: #4FBFA4; --accent-strong: #79D3BC; --accent-soft: rgba(79, 191, 164, 0.13);
    --amber: #D89A5A; --danger: #D97F66; --mark: #5A4A14;
    --c-employment: #4FBFA4; --c-prevoc: #B497E3; --c-career: #D89A5A; --c-general: #93A39D;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.28);
  }
}
:root[data-theme="dark"] {
  --paper: #141917; --card: #1D2523; --ink: #E6ECE9; --mute: #93A39D; --line: #303B37;
  --accent: #4FBFA4; --accent-strong: #79D3BC; --accent-soft: rgba(79, 191, 164, 0.13);
  --amber: #D89A5A; --danger: #D97F66; --mark: #5A4A14;
  --c-employment: #4FBFA4; --c-prevoc: #B497E3; --c-career: #D89A5A; --c-general: #93A39D;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.28);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-strong); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.shell { max-width: 1180px; margin: 0 auto; padding: 0 16px 110px; }

/* ---------- header ---------- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 2px 14px; flex-wrap: wrap; }
.brand-name { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.brand-name em { font-style: italic; font-weight: 400; color: var(--accent-strong); }
.brand-sub { font-size: 12.5px; color: var(--mute); margin-top: 2px; }
.top-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tab {
  appearance: none; border: 0; background: none; padding: 10px 14px; font-weight: 600; font-size: 14.5px;
  color: var(--mute); cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.is-active { color: var(--accent-strong); border-bottom-color: var(--accent); }
.tab-count { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--paper); font-size: 11.5px; line-height: 20px; text-align: center; }

/* ---------- controls ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px;
  padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
  transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-ghost { border-color: transparent; background: none; color: var(--accent-strong); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }

.select { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; max-width: 100%; }
.select-lg { font-size: 16px; font-weight: 600; padding: 9px 12px; min-width: 240px; }
.search {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px 14px;
  font-size: 15px; box-shadow: var(--shadow);
}
.search::placeholder { color: var(--mute); }

.control-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
.control-row .grow { flex: 1 1 auto; }
.lbl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); font-weight: 600; }
.state-meta { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 4px; scrollbar-width: thin; align-items: center; }
.chips-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); font-weight: 700; flex: 0 0 auto; margin-right: 2px; min-width: 62px; }
.chip {
  --ed: var(--mute); flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--mute); white-space: nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.chip .n { opacity: 0.7; font-weight: 500; margin-left: 4px; }
.chip.is-on { background: color-mix(in srgb, var(--ed) 16%, var(--card)); border-color: color-mix(in srgb, var(--ed) 55%, var(--card)); color: color-mix(in srgb, var(--ed) 62%, var(--ink)); }
.chip[data-cat="employment"] { --ed: var(--c-employment); }
.chip[data-cat="prevoc"] { --ed: var(--c-prevoc); }
.chip[data-cat="career"] { --ed: var(--c-career); }
.chip[data-cat="general"] { --ed: var(--c-general); }

.result-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 12px; flex-wrap: wrap; }
.result-count { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }

.note { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; margin: 8px 0 12px; }
.empty { color: var(--mute); padding: 36px 12px; text-align: center; font-size: 14.5px; }
.empty strong { color: var(--ink); }

/* ---------- definition cards ---------- */
.group-title {
  font-family: var(--serif); font-size: 19px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--gc, var(--line));
  display: flex; align-items: baseline; gap: 10px;
}
.group-title .n { font-family: var(--sans); font-size: 12.5px; color: var(--mute); font-weight: 600; }
.group-title[data-cat="employment"] { --gc: var(--c-employment); }
.group-title[data-cat="prevoc"] { --gc: var(--c-prevoc); }
.group-title[data-cat="career"] { --gc: var(--c-career); }
.group-title[data-cat="general"] { --gc: var(--c-general); }

.defs { display: flex; flex-direction: column; gap: 12px; }
.def {
  background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--cc, var(--line)); border-radius: 12px;
  padding: 16px 20px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.def[data-cat="employment"] { --cc: var(--c-employment); }
.def[data-cat="prevoc"] { --cc: var(--c-prevoc); }
.def[data-cat="career"] { --cc: var(--c-career); }
.def[data-cat="general"] { --cc: var(--c-general); }
.def.is-pinned { outline: 2px solid var(--amber); outline-offset: -1px; }
.def-head { display: flex; flex-direction: column; gap: 4px; }
.def-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.state-tag { font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.def-title { font-family: var(--serif); font-size: 19px; margin: 0; line-height: 1.3; font-weight: 700; }
.def-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--mute); }
.badge { --ed: var(--mute); display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; background: color-mix(in srgb, var(--ed) 14%, var(--card)); color: color-mix(in srgb, var(--ed) 70%, var(--ink)); }
.badge[data-cat="employment"] { --ed: var(--c-employment); }
.badge[data-cat="prevoc"] { --ed: var(--c-prevoc); }
.badge[data-cat="career"] { --ed: var(--c-career); }
.badge[data-cat="general"] { --ed: var(--c-general); }
.src { font-style: italic; }
.verified { font-variant-numeric: tabular-nums; }
.verified.stale { color: var(--amber); font-weight: 600; }

.def-text { font-size: var(--text-size); line-height: 1.62; }
.def-text p { margin: 0 0 0.75em; white-space: pre-wrap; overflow-wrap: anywhere; }
.def-text p:last-child { margin-bottom: 0; }
.def-text p.gap { color: var(--mute); font-size: 0.9em; margin: 0 0 0.5em; }
.def-text mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.def.is-clamped .def-text { max-height: 11.5em; overflow: hidden; position: relative; }
.def.is-clamped .def-text::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3.5em; background: linear-gradient(to bottom, transparent, var(--card)); }
.def-notes { font-size: 13px; color: var(--mute); border-top: 1px dashed var(--line); padding-top: 6px; }
.def-actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.def-actions .sp { flex: 1; }

/* ---------- compare ---------- */
.compare-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 10px; }
.compare-controls .select { width: 100%; }
.columns { display: grid; gap: 14px; align-items: start; }
.columns[data-n="1"] { grid-template-columns: 1fr; }
.columns[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.columns[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.columns[data-n="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.col-head { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 8px 0 8px; margin-bottom: 4px; border-bottom: 2px solid var(--accent); }
.col-head h3 { font-family: var(--serif); font-size: 20px; margin: 0; }
.col-head .n { font-size: 12.5px; color: var(--mute); }
.column .def { padding: 14px 16px 10px; }
.column .def-title { font-size: 17px; }
@media (max-width: 860px) { .columns[data-n="3"], .columns[data-n="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .columns { grid-template-columns: 1fr !important; } .col-head { position: static; } }

/* ---------- pin tray ---------- */
.tray {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20;
  background: var(--card); border: 1px solid var(--amber); border-radius: 999px; box-shadow: var(--shadow);
  padding: 8px 10px 8px 16px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
}

/* ---------- data view ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat .v { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--mute); margin-top: 4px; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.grid th, .grid td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.grid th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); background: var(--paper); }
.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.grid th.num { text-align: right; }
.grid tr:last-child td { border-bottom: 0; }
.grid tr.is-empty td { color: var(--mute); }
.grid a.state-link { font-weight: 600; text-decoration: none; }
.grid a.state-link:hover { text-decoration: underline; }
.data-section { margin: 26px 0 0; }
.data-section h3 { font-family: var(--serif); font-size: 19px; margin: 0 0 8px; }
.data-section ol, .data-section ul { padding-left: 22px; }
.data-section li { margin: 4px 0; }
code { font-family: var(--mono); font-size: 0.92em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
details.review { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin: 6px 0; }
details.review summary { padding: 8px 12px; cursor: pointer; font-weight: 600; }
details.review table { border: 0; border-radius: 0; }
.warn { color: var(--amber); }

/* ---------- focus overlay ---------- */
.focus { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--paper) 92%, transparent); overflow: auto; padding: 24px 16px; }
.focus-card { max-width: 980px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 36px 24px; }
.focus-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.focus-bar .sp { flex: 1; }
.focus-state { font-family: var(--serif); font-size: 16px; color: var(--accent-strong); font-weight: 700; letter-spacing: 0.01em; }
.focus-title { font-family: var(--serif); font-size: 30px; margin: 4px 0 6px; line-height: 1.2; }
.focus-meta { font-size: 13.5px; color: var(--mute); margin-bottom: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.focus-text { font-size: calc(var(--text-size) + 4px); line-height: 1.65; }
.focus-text p { margin: 0 0 0.8em; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 600px) { .focus-card { padding: 18px; } .focus-title { font-size: 24px; } }

.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); }

/* ---------- present mode ---------- */
html.present { --text-size: 19px; }
html.present .shell { max-width: 1400px; }
html.present .tabs, html.present .brand-sub, html.present .def-actions, html.present .chips, html.present .result-row,
html.present .tray, html.present .hide-present { display: none !important; }
html.present .def { padding: 22px 28px 18px; }
html.present .def-title { font-size: 24px; }
html.present .def.is-clamped .def-text { max-height: none; }
html.present .def.is-clamped .def-text::after { display: none; }
html.present .brand-name { font-size: 30px; }
html.present .col-head h3 { font-size: 24px; }

/* ---------- print ---------- */
@media print {
  body { background: #fff; color: #000; font-size: 12.5px; }
  .shell { max-width: none; padding: 0; }
  .tabs, .top-actions, .chips, .def-actions, .tray, .control-row, .result-row, .compare-controls { display: none !important; }
  .def { box-shadow: none; break-inside: avoid; border-color: #bbb; }
  .def.is-clamped .def-text { max-height: none; }
  .def.is-clamped .def-text::after { display: none; }
  .columns { display: block; }
  .col-head { position: static; }
}

</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand-name">SELN <em>State Waiver Definitions</em></div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost btn-sm hide-present" id="themeBtn" title="Switch light / dark">Theme</button>
      <a class="btn btn-ghost btn-sm hide-present" href="index.html" title="Open the SELN Prompt Studio">Prompt Studio</a>
      <button type="button" class="btn btn-sm" id="presentBtn" title="Large type for screen sharing (Esc to exit)">Present</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Views" id="tabs">
    <button type="button" class="tab is-active" data-view="lookup">Lookup</button>
    <button type="button" class="tab" data-view="compare">Compare<span class="tab-count" id="pinCount" hidden>0</span></button>
    <button type="button" class="tab" data-view="search">Search</button>
    <button type="button" class="tab" data-view="data">Data</button>
  </nav>

  <main>
    <section id="view-lookup" class="view">
      <div class="control-row">
        <button type="button" class="btn btn-sm" id="prevState" title="Previous state">&larr;</button>
        <select id="stateSel" class="select select-lg" aria-label="State"></select>
        <button type="button" class="btn btn-sm" id="nextState" title="Next state">&rarr;</button>
        <span class="state-meta" id="stateMeta"></span>
        <span class="grow"></span>
        <button type="button" class="btn btn-sm hide-present" id="expandAll">Expand all</button>
        <button type="button" class="btn btn-sm hide-present" id="pinState" title="Pin every definition shown">Pin shown</button>
      </div>
      <div class="chips" id="catChips" role="group" aria-label="Filter by category"></div>
      <div class="chips" id="topicChips" role="group" aria-label="Filter by topic"></div>
      <div id="stateNotes"></div>
      <div id="lookupList"></div>
    </section>

    <section id="view-compare" class="view" hidden>
      <div class="control-row">
        <button type="button" class="btn btn-sm is-on" id="modeStates" data-mode="states">By state</button>
        <button type="button" class="btn btn-sm" id="modePinned" data-mode="pinned">Pinned <span id="pinCount2">0</span></button>
        <span class="grow"></span>
        <button type="button" class="btn btn-sm hide-present" id="clearPins">Clear pinned</button>
      </div>
      <div class="compare-controls" id="compareControls">
        <select class="select cmp-state" data-slot="0" aria-label="State 1"></select>
        <select class="select cmp-state" data-slot="1" aria-label="State 2"></select>
        <select class="select cmp-state" data-slot="2" aria-label="State 3"></select>
        <select class="select cmp-state" data-slot="3" aria-label="State 4"></select>
        <select class="select" id="cmpCat" aria-label="Category"></select>
        <select class="select" id="cmpTopic" aria-label="Topic"></select>
      </div>
      <div class="columns" id="compareCols"></div>
    </section>

    <section id="view-search" class="view" hidden>
      <input id="q" class="search" type="search" placeholder="Search all definitions… (e.g. “customized employment”, “fading”, “group of two to eight”)" aria-label="Search definitions">
      <div class="chips" id="searchCatChips" role="group" aria-label="Filter results by category"></div>
      <div class="result-row">
        <span class="result-count" id="searchCount"></span>
        <label class="lbl">Sort
          <select id="searchSort" class="select">
            <option value="state">State</option>
            <option value="category">Category</option>
            <option value="title">Title</option>
          </select>
        </label>
      </div>
      <div id="searchList"></div>
    </section>

    <section id="view-data" class="view" hidden></section>
  </main>

  <div class="tray" id="tray" hidden>
    <span id="trayText">0 pinned</span>
    <button type="button" class="btn btn-sm btn-primary" id="trayCompare">Compare</button>
    <button type="button" class="btn btn-sm btn-ghost" id="trayClear">Clear</button>
  </div>
</div>

<div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-label="Definition">
  <div class="focus-card">
    <div class="focus-bar">
      <button type="button" class="btn btn-sm" id="focusPrev" title="Previous (←)">&larr;</button>
      <button type="button" class="btn btn-sm" id="focusNext" title="Next (→)">&rarr;</button>
      <span class="sp"></span>
      <button type="button" class="btn btn-sm" id="focusCopy">Copy with citation</button>
      <button type="button" class="btn btn-sm" id="focusPin">Pin</button>
      <button type="button" class="btn btn-sm btn-primary" id="focusClose" title="Close (Esc)">Close</button>
    </div>
    <div id="focusBody"></div>
  </div>
</div>

<script>
var DEFS = {"meta":{"built":"2026-11-06","source":"waiver_definitions.xlsx","states":51,"statesWithEntries":49,"entries":477,"issues":[{"state":"MD","row":20,"title":"Supported Employment – Service Limits (Waiver)","problem":"No definition text"}],"warnings":["CT row 4: duplicate title \"Individual Supported Employment\"; both kept, check whether one should be deleted.","IL row 6: duplicate title \"Individual Employment Support - Self-Employment (Waiver)\"; both kept, check whether one should be deleted.","LA row 14: duplicate title \"Prevocation Services - Career Planning (Manual)\"; both kept, check whether one should be deleted.","MD row 20: \"Supported Employment – Service Limits (Waiver)\" has no definition text; left out of the tool until text is added.","TX row 3: text with no title; kept as a state note (\"No documents for the EF Program\")."]},"categories":[{"key":"employment","label":"Employment Services","short":"Employment"},{"key":"prevoc","label":"Prevocational Services","short":"Prevocational"},{"key":"career","label":"Career Planning & Discovery","short":"Career Planning"},{"key":"general","label":"General & Policy","short":"General"}],"topics":[{"key":"limits","label":"Limits"},{"key":"documentation","label":"Documentation"},{"key":"billing","label":"Billing & Rates"},{"key":"eligibility","label":"Eligibility"},{"key":"provider","label":"Provider Specifications"},{"key":"activities","label":"Activities & Scope"},{"key":"definition","label":"Definition"}],"states":[{"code":"AL","name":"Alabama","notes":[],"entries":[{"id":"al-individual-supported-employment-services-provider-operations","state":"AL","title":"Individual Supported Employment Services (Provider Operations Manual)","name":"Individual Supported Employment Services","source":"Provider Operations Manual","category":"employment","topic":"definition","text":"Purpose/Intent: Job developer services are available to support an individual in obtaining integrated, competitive employment.\n\nProcedures: When an individual expresses interest in obtaining a job, a referral should be made to the Alabama Department of Rehabilitation Services (VR). Once the referral is made to VR, the individual, along with the Support Coordinator and/or service provider should maintain contact with the VR Counselor to ensure follow through with eligibility determination. This VR eligibility determination should be made as soon as possible, but no later than 60 days from the initial application date. The individual is encouraged to provide a signed release to VR, so the VR Counselor can speak with the Service Coordinator and/or provider agency representative if necessary for additional information and/or monitor progress towards eligibility determination. Historically, VR has been hesitant to speak with anyone other than the individual due to HIPAA regulations.\n\nIf deemed eligible by VR, the individual is expected to receive the job development service which is necessary for competitive and integrated employment. However, if VR determines that individual does not meet eligibility criteria or services through VR are otherwise not available, the Job Developer service is available through the Waiver.\n\nThe Individualized Job Developer primarily markets the supported employment service and the person's skills with potential employer(s). This might include employer negotiation related to waiver recipient’s skills, negotiating hours or location to meet needs of the waiver recipient, job carving, job placement, etc. Often the job developer will be out in the community performing the activities with or without the waiver recipient.\n\nThis Job Developer service will be limited to 40 hours per year. An employment plan is required initially, and subsequent updates can request modifications to the above limitations based on the observations of the professionals involved and approved by the RO Employment Specialist/Coordinator.\n\nTraining Requirements: A job developer must complete an ADMH approved training curriculum. Examples of approved curriculums include the bi-annual Customized/Supported Employment training taught by consultants from Virginia Commonwealth University, or an approved web-based certification available through such entities as ACRE, Griffin Hammis, etc. Please contact the Office of Supported Employment with any questions related to approved certifications.","url":"","verified":"","notes":"","row":1},{"id":"al-supported-employment-small-group-provider-operations-manual","state":"AL","title":"SUPPORTED EMPLOYMENT SMALL GROUP (Provider Operations Manual)","name":"SUPPORTED EMPLOYMENT SMALL GROUP","source":"Provider Operations Manual","category":"employment","topic":"definition","text":"Statement: Services and training activities provided in a regular business or industry in community settings for groups of two (2) to four (4) workers.\n\nPurpose/Intent: This intent of this service is sustained paid employment and work experience leading to further career development and community-based individualized employment.\n\nProcedures: Supported Employment Small Group must be provided in a manner that promotes integration into the workplace and interaction between participants and individuals without disabilities in those workplaces. The outcome of this service is sustained paid employment and work experience that leads to further career development and community-based employment for which the compensation is at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nThe supported employment small group works in community-based integrated settings in groups from 1:2-3 or 1:4 workers. This service should not occur in facility-based settings or other similar types of vocational settings that are not part of the general workplace. These workgroups should only perform work in integrated community-based settings with competitive wages.\n\nSupported Employment Small Group providers must meet the same standards as Day Habilitation providers. The staffing pattern should be appropriate to the type and scope of program services and should include staff members who meet the experience and educational qualifications set forth in the job coaching service. No individual in this service should ever be left unsupervised unless the activity is part of a structured activity outlined in the person-centered plan.","url":"","verified":"","notes":"","row":2},{"id":"al-discovery-assessment-profile-provider-operations-manual","state":"AL","title":"Discovery Assessment/Profile (Provider Operations Manual)","name":"Discovery Assessment/Profile","source":"Provider Operations Manual","category":"career","topic":"definition","text":"Statement: Employment should be a first option for individuals receiving waiver services.\n\nPurpose/Intent: DD Waiver services should be utilized to assist individuals with obtaining and maintaining employment.\n\nProcedures: A community-based assessment to develop a profile to pursue competitive employment.\n\nDiscovery/Assessment is limited to no more than ninety (90) days and should not overlap other services and is available for individual participants interested in employment. The expectation is that much of the process be performed outside of a facility and off the grounds of the facility. The Discovery process should be individualized.\n\nDiscovery shall be limited to no more than 120 units (30 hours) of service. The provider shall document each date of service, the activities performed that day, and the duration of each activity completed. Reimbursement for discovery/assessment should be billed at three distinct intervals during the process.\n\nThe first billing for services occurs after one third, no more than 10 hours or 40 units of the discovery/assessment process and requires documentation of activities performed that support the billing during the first period of the assessment process.\n\nThe second billing for services occurs at the two thirds, no more than 10 hours or 40 units of discovery/assessment process and requires documentation of activities performed that support the billing during the second period of the assessment process.\n\nThe information developed through Discovery allows for activities of typical life to be translated into possibilities for integrated employment. Discovery results in the production of a detailed written Profile summarizing the process, learning and recommendations for next steps. The written Profile is due no later than ninety (90) days after the service commences.\n\nThe final payment for discovery/assessment is billed after the completion of the report and can include no more than 10 hours or 40 units of service. This service is limited to two assessments per each waiver participant, with the second assessment being conducted only if the participant changes service providers. To exceed the capped amount, documented justification should be sent to the Employment Coordinator at the Central Office, or the Employment Specialist at the Regional office.\n\nApprovals will then follow the established request for service procedures. No waiver participant can receive more than four discovery/assessment services over the lifetime of the waiver.\n\nParticipation in Pre-Vocational services is not a requirement for Discovery. If the same agency that completes the Discovery is also the agency that provides other employment services, i.e., job development, job coaching, etc., VR should not be billed for an additional Discovery service.","url":"","verified":"","notes":"","row":3},{"id":"al-pre-vocational-services-pathway-to-employment-provider-opera","state":"AL","title":"Pre-Vocational Services- Pathway to Employment (Provider Operations Manual)","name":"Pre-Vocational Services- Pathway to Employment","source":"Provider Operations Manual","category":"prevoc","topic":"definition","text":"Statement: Individuals receiving prevocational services must have employment-related goals in their Person- Centered Plan\n\nPurpose/Intent: Prevocational services are utilized to prepare an individual for paid employment and are not job-task oriented, but instead aimed at a generalized result.\n\nProcedures: The Prevocational habilitation service under the Waiver is designed to create a path to integrated, competitive employment in which an individual is compensated at or above the minimum wage, but no less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nPre-vocational services include teaching such concepts as attendance, task completion, problem solving, interpersonal relations and safety, as outlined in the individual's person-centered plan. Prevocational services provide learning and work experiences, including volunteer work, where the individual can develop general, non- job-task specific strengths and skills that contribute to employability in paid employment in integrated community settings. Pre-vocational services should occur as much as possible outside the facility and off the grounds of the agency. A best practice would include a minimum of 50% of the service occurring in the community.\n\nServices are expected to occur within a period not to exceed 2470 units, with employment (integrated and competitive salary/wage) being the specific outcome. A pre-vocational unit is defined as one hour.\n\nDuring participation in pre-vocational services, the expectation is that a referral will be made to the Alabama Department of Rehabilitation Services/VR when the individual is ready to move forward with obtaining a competitive job.\n\nIf, after the 2470 hours of service, a person has not been referred to ADRS, obtained competitive employment or moved into other waiver services, the provider must justify why additional Prevocational habilitation services would be beneficial to continue the individual on a “pathway to employment”. The request for continuing this service must be made in writing, along with supporting documentation to the Office of Supported Employment in the Central Office or to the designated Employment Specialist working in the Regional Office. The Employment Coordinator and/or Employment Specialists will review the request and notify the Support Coordinator of the decision to approve or deny the request. If approved, the Support Coordinator will begin the RFA process to the Regional Office.\n\nIndividuals receiving prevocational services must have employment-related goals in their Person-Centered Plan; the general habilitation activities must be designed to support such employment goals. If the beneficiaries are compensated, they are compensated at less than 50 percent of the minimum wage; 42CFR 440.180 (c) (2) (i)\n\nParticipation in prevocational habilitation services is not a required pre-requisite for individual or small group supported employment services under the waiver.","url":"","verified":"","notes":"","row":4},{"id":"al-job-coach-provider-operations-manual","state":"AL","title":"Job Coach (Provider Operations Manual)","name":"Job Coach","source":"Provider Operations Manual","category":"employment","topic":"definition","text":"Statement: A distinct service to support individuals at worksite – Job Coach\n\nPurpose/Intent: The job coach service is provided to teach skills and provide support at a worksite to enable individuals to achieve the highest level of independence possible.\n\nProcedures: The job coach works directly with an individual that desires to work in competitive integrated employment. The minimal requirement for an individual providing the job coach service is graduation from high school or its equivalent and two years of work experience. A Bachelor's Degree with a major concentration in rehabilitation, industrial arts, vocational education, psychology or a related field is preferred. Work experience of a supervisory or training nature as well as knowledge of individuals with disabilities would be particularly desirable.\n\nThe job coach service covers a variety of assistance that supports an individual in obtaining and maintaining employment. The hours worked by the job coach must be flexible to meet needs as they arise. The amount of job coach support will depend on the needs of the individual being supported, which will also influence the number of job coaching hours that should be authorized. It is expected that the job coach will fade his or her support as the individual becomes more integrated into the employer's workforce and grasps work tasks. It is also acceptable to supplant some of the job coach's faded hours thorough the utilization of personal care at the worksite. The overall goal of job coaching is to develop independence at the worksite\n\nOverall, the Job Coach is responsible to the Program Director for the training and associated support services necessary to ensure the success for individuals involved in Supported Employment. These services might include:\n\nCompletion of job analysis’s and/or task analyses through employer interviews, actual job performance to ensure a thorough understanding of the specific job and general job rules prior to placement of the individual;\n\nTeaching work skills/tasks, responsibilities and behaviors not related to the specific job being performed, such as how to complete a timecard, when and where to take bathroom and lunch breaks;\n\nEnsuring that each individual placed into employment receives the necessary support to become an integrated member of the work force. This may happen in the general course of the job but could require activity such as encouragement of the individual worker or other employees to communicate with each other, or the provision of disability awareness training to workers of the company;\n\nWorking with the individual to be placed in employment and/or with family or service provider to ensure that the individual has reliable transportation to and from work, adequate housing, and emotional support for his or her job efforts;\n\nMaking every effort to ensure that the individual in supported employment is matched to an appropriate job using a comprehensive vocational assessment (Situational Assessment and/or Discovery) prior to job placement. Part of the assessment may include reviewing current progress notes in individual's present placement, studying referral information, and working with the individual to assess work skills;\n\nCommunicating through written and oral reports on the progress of individuals in supported employment to the Program Director and other program staff: follow oral or written instructions (such as the care plan or rehabilitation plan);\n\nProviding continued ongoing support to individuals in supported employment;\n\nPerforming other job duties necessary to ensure the success of individuals in supported employment as well as any additional tasks assigned by the Program Director that will be of benefit to other individuals in the program.\n\nFacilitating job accommodations and use of assistive technology;\n\nEducating the person and others on the job site regarding rights and responsibilities and the role of self-advocacy in the workplace.\n\nIndividuals providing job coaching services should complete the ADMH recognized training on customized/supported employment. Currently, the 3-day certificate-based training taught by consultants from Virginia Commonwealth University is recommended. Other curriculums must be approved by the ADMH Office of Employment Services.","url":"","verified":"","notes":"","row":5},{"id":"al-vocational-rehabilitation-provider-operations-manual","state":"AL","title":"Vocational Rehabilitation (Provider Operations Manual)","name":"Vocational Rehabilitation","source":"Provider Operations Manual","category":"general","topic":"definition","text":"Statement: Individuals that express interest in competitive integrated employment should be referred to the Alabama Department of Rehabilitation Services (ADRS), Vocational Rehabilitation (VR).\n\nPurpose/Intent: VR is funded by the Rehabilitation Act of 1973 or P.L. 94-142. These services should be accessed prior to waiver funding for supported employment services.\n\nProcedures: Vocational Rehabilitation Service (VRS), the largest division within the Alabama Department of Rehabilitation Services that assists Alabamians with disabilities achieve independence through employment.\n\nVR provides specialized employment- and education-related services and training to assist teens and adults with disabilities in becoming employed.\n\nThe types of services available through VR are varied and designed specifically to meet the needs of each individual. Available through any of the 20 VRS offices statewide, services can include pre-employment services, transition services, educational services; vocational assessments and evaluations, guidance and counseling; job training; assistive technology; orientation and mobility training; and job placement and retention.\n\nTo be eligible for services, individuals must have a physical or mental impairment which results in a substantial barrier to employment, and there must be a reasonable expectation that he or she can benefit from rehabilitation services in terms of becoming employed.\n\nTo determine the appropriate VR office in your area, please visit www.rehab.alabama.gov/ and click on office locations.\n\nWhen an individual receiving ADMH funded waiver supports expresses interest in competitive employment, the plan to support this goal should include a referral to VR. There are several steps that should be taken to ensure the appropriate referral process is followed, along with making sure the individual is interested in competitive integrated employment.\n\n1. Once an individual expresses interest in working in competitive employment, an initial “Discovery” assessment should be provided. The Discovery process is an evidence-based alternative to comparative, standardized assessments, and evaluations completed by a qualified employment supervisor professional. Discovery is a person-centered planning process that involves getting to know a person before supporting them in developing a plan for employment. (See Operational Guideline A.9.2.a. for more information on Discovery)\n\n2. Once the Discovery assessment is complete and the individual continues to express interest in working, additional steps should be taken to assist the individual. These steps include:\n\na. A meeting held with the individual to complete benefits planning. The benefits planning can be provided by either the ADMH funded Community Work Incentives Coordinator or a provider agency with an “approved and certified” benefits planner. (See operational Guideline 9.5. for more information on Benefits Planning).\n\nb. A meeting either in person or via conference call should be held with the individual and team which may include provider agencies, the support coordinator, family members, etc. During this meeting, the plan for work is finalized so an appropriate referral to VR is made.\n\nTransportation options should be discussed so that once the employment goal is achieved, the individual encounters no difficulty getting to and from work.\n\nA determination is made regarding the individual/agency responsible for assisting with ongoing benefits reporting. (See operational guideline A.9.5. for more information on benefits reporting).\n\nContact should be made with the local VR office and an appointment scheduled so individual can officially apply for VR services.\n\nA release form should be signed by the individual to grant permission for referring agencies (day and/or residential, support coordinator, etc.) to provide records to VR to determine eligibility. This release form should also grant permission for VR to discuss eligibility, need for additional information, etc. with the service coordinator or whoever the individual chooses. With provision of appropriate records, eligibility should be determined within 60 days. See Alabama Department of Mental Health Alabama Department of Rehabilitation Services Authorization/Consent for Use or Disclosure\n\nc. Once an individual is determined eligible for VR services, the ADRS Counselor will refer the individual to an authorized supported employment service provider (funded by ADRS utilizing a Milestones payment system). The service provider will complete the following milestones:\n\nDetermination of Need: 2 Situational Assessments, PCP (vocational) Plan, or the Discovery Profile. (Milestone I/Discovery/PCP) should not be needed if agency has completed the Discovery utilizing Waiver funding).\n\nHire: The individual is placed into competitive employment and completes 3 days on the job.\n\nJob Retention: The individual receives onsite job coaching to ensure that satisfactory job performance is achieved to maintain employment.\n\nClosure: After initial job coaching (retention services) is provided to achieve stabilization, VR will provide an additional 90 days of post stabilization follow up. Once the 90 days are complete, the VR case is closed as successfully rehabilitated (employed).\n\nd. Waiver services should be utilized throughout this process to support the individual working in competitive employment. Services that could be utilized to support long-term needs include:\n\nOngoing benefits planning and/or reporting services\n\nPersonal Care and/or Personal Care at the Worksite\n\nEmployment Transportation\n\nJob Coaching\n\n3. If VR determines that an individual isn’t eligible for services for any reason, waiver support can be utilized to provide the job developer service. (Please see Operational Guideline A.9.2.d.1. for more information on job developer).\n\na. If the VR counselor, after trial work experiences determines that the consumer cannot benefit from SE services, or that SE services are not available in their area, VR should provide a letter explaining the findings and this should be provided to ADMH provider. This documentation allows an ADMH agency to provide supported employment under the waiver.\n\nb. If VR fails to provide a written statement regarding ineligibility, the support coordinator, provider agency, etc. should document the efforts that were made to access VR services. This documentation should include the dates the individual met with the VR Counselor, the name of the VR Counselor, any verbal feedback that was provided by VR to the individual or referring agency or support coordinator, etc. This documentation should be included in the individuals file that confirms that reasonable attempts were made to access VR prior to utilizing any waiver funds. If individual refuses to pursue VR services (choice) this should also be clearly documented in the file. Reasons for refusal should be detailed.","url":"","verified":"","notes":"","row":6}]},{"code":"AK","name":"Alaska","notes":[],"entries":[{"id":"ak-supported-employment-waiver","state":"AK","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Employment services assist recipients to acquire and maintain gainful employment (including self-employment) in a  job that meets their career goals. Employment services include pre-employment and supported employment services  that are provided over a specified period of time, are based on a defined outcome documented on the recipients  person-centered support plan, and are planned to decrease over time as recipient work-related goals and objectives  are achieved. Consistent with the person-centered approach to these services, individuals accessing employment  services should be encouraged, on an ongoing basis, to explore their interests, strengths, and abilities relating to  employment or career advancement.\n\nEmployment services may be offered in a variety of settings, but, because independence and community integration  are goals for these services, they may not be provided in sheltered workshops or other similar specialized vocational  facilities, or any other setting that has the effect of isolating individuals who receive home and community-based  waiver services from the broader community of individuals not receiving waiver services. Employment services may  be provided in settings chosen by the recipient if self-employed (including subsistence) or at the recipient’s residence or other location if the recipient has an agreement with their employer to work remotely.\n\nEmployment services include Pre-employment as a sub-type separate from Supported Employment sub-type. Pre-employment services provide time-limited habilitation that allow recipients to develop general work readiness and  non-job-specific strengths and skills that are applicable to all work settings. Pre- employment services are  distinguished in nature from noncovered vocational services by the intent of the habilitative goals that are presented  through the support plan, to foster readiness for community-based employment. Pre-employment services are  designed to assist a recipient to determine individual strengths, interests, abilities, and support needs, and to ensure  that the person has the underlying skills necessary to locate, secure and sustain gainful employment per 42 CFR  §440.180(c)(2)(i).\n\nPre-employment services may also assist a recipient to determine individual strengths, interests, abilities, and  support needs, or locate and secure gainful employment. If an individual identifies self-employment as their desired  outcome, pre-employment services may include supporting the recipient as they determine the concept of their business and develop a business plan, as well as referring the recipient to the appropriate community resources for  additional guidance in identifying potential sources of financing and additional assistance in developing and  launching a business. While the service can assist recipients working toward self-employment, the majority of the  work that needs to be done, from research to writing a business plan, will be the responsibility of the recipient.\n\nSupported employment services include the progressive phases of job-specific training, job coaching, ongoing  intermittent support to assist with keeping a job or career advancement, and support to maintain self-employment.\n\nDocumentation is maintained in the file of each individual receiving this service that the service is not available  under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).  Federal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training  expenses such as the following: 1. Incentive payments made to an employer to encourage or subsidize the  employer's participation in supported employment; or 2. Payments that are passed through to users of supported  employment services.","url":"","verified":"","notes":"","row":1},{"id":"ak-certified-hcbs-agency-employment-services-specifications-wai","state":"AK","title":"Certified HCBS Agency: Employment Services Specifications (Waiver)","name":"Certified HCBS Agency: Employment Services Specifications","source":"Waiver","category":"employment","topic":"provider","text":"SDS certified employment services provider under 7 AAC 130.220, Provider certification and 7 AAC  130.270, Employment services and the relevant Conditions of Participation adopted by reference in 7  AAC 160.900\n\nAll certified providers must meet the requirements contained in the Provider Conditions of Participation,  listed in Main A: Additional Information Needed (Optional) and the relevant service Conditions of  Participation. Below are the Employment Services Conditions of Participation, Personnel and Training  excerpts:\n\nA. Personnel.\n\n1.  Employment Services program administrator.\n\na. The provider agency must designate an employment services program administrator who is\n\nresponsible for day-to-day management of the program.\n\nb. The provider may use a term other than program administrator for this position (e.g., program\n\ndirector, program manager, or program supervisor).\n\nc. The program administrator must be at least 25 years of age and qualified through experience and\n\neducation in a human services field or setting.\n\ni.Required experience: one year of full-time or equivalent part-time experience providing services to  individuals in a human services setting in a position with responsibility for planning, development, and  management or operation of programs involving service delivery, fiscal management, needs assessment,  program evaluation, or similar tasks.\n\nIi.  Required education and additional experience or alternatives to formal education:\n\n(A) Bachelor of Arts or Bachelor of Science degree from an accredited college or university in social  work, psychology, rehabilitation, nursing or a closely related human services field; or\n\n(B) Associate of Arts degree from an accredited college or university in psychology, rehabilitation,  nursing or a closely related human services field, and two years of full-time, or equivalent part- time  experience working with human services recipients; or\n\n(C) four years of full-time or equivalent part-time experience working with human services recipients  in social work, psychology, rehabilitation, nursing, or a closely related human services field or setting;\n\nor\n\n(D) certification as a rural community health aide or practitioner and one year of full-time, or equivalent part-time experience working with human services recipients.\n\nd. In addition to possessing the skill set of an employment services specialist, and meeting education  and experience requirements, the administrator must possess the knowledge base and skills necessary to  carry out the employment services program.\n\ni. The administrator knowledge base must include:\n\n(A) the medical, behavioral, and habilitative conditions and requirements of the population to be  served;\n\n(B)supported employment philosophy, state regulations and emerging service delivery techniques;\n\nand\n\n(C) the applicable laws, regulations and policies related to governing services for individuals with  disabilities.\n\nii. The administrator skill set must include:\n\n(A)the ability to develop and evaluate a support plan to meet the needs of each recipient to be served;\n\nand\n\n(B) the ability to effectively supervise and support employment services specialists.\n\ne. Prior to appointment as the employment services program administrator, the administrator must  receive and maintain National Certification in Employment Services, or an equivalent certification in employment services\n\n2.Employment services specialist.\n\na. Employment services specialists must be at least 18 years of age, qualified through education or experience, and possess, or develop before providing services, the skills necessary to perform the tasks included in the employment services plan.\n\nb.Required education:\n\ni.high school or general education development (GED) diploma; and\n\nii. demonstration to the provider of the ability to communicate in English, including reading written instructions and making appropriate entries regarding services in the recipient record or file.\n\nc. Required skill set:\n\ni. Job exploration and discovery for individuals with disabilities;\n\nii. benefits counseling, including the impact of wages on state and federal disability benefits;\n\niii.Researching employment opportunities;\n\niv.job development and job matching;\n\nv.identifying and teaching required employment-related skills; and\n\nvi. job coaching and support.\n\nB. Training.\n\n1.The provider must provide orientation and ongoing training for employment services specialists to  ensure they are qualified to perform, and to maintain a safe environment while providing, employment  services.\n\n2.In addition to training requirements outlined in the Provider Conditions of Participation, the  employment services program administrator must provide and document in employee records, training  on the following topics, at a minimum, for employment services specialists:\n\na.state policy and regulations governing the provision of employment services;\n\nb. understanding the needs of the population to be served;\n\nc. current best practices on the delivery of employment services;\n\nd.universal precautions and basic infection control procedures;\n\ne.personal care skills for those recipients who require assistance while receiving supported  employment services; and\n\nf.workplace safety including proper use of tools and equipment and fall prevention.\n\n3. Within one year of employment, the employment services specialist must receive and maintain  documentation in their employee record of the National Certification in Employment Services, or an  equivalent certification in employment services.\n\nSDS Provider Certification and Compliance Unit\n\nUp to four years per 7 AAC 130.220(c)","url":"","verified":"","notes":"","row":2},{"id":"ak-supported-employment-overview-website","state":"AK","title":"Supported Employment Overview (Website)","name":"Supported Employment Overview","source":"Website","category":"employment","topic":"definition","text":"Supported Employment (SE) is a specialized service delivery system specifically designed for individuals with the most significant disabilities who require assistance in acquiring and maintaining the work-related skills necessary for competitive, integrated employment or to become self-employed. SE is for individuals who have not historically had stable competitive integrated employment and, because of the severity of their disability, need ongoing intensive supports, such as Extended Services, in order to maintain employment.\n\nUnder Title I and Title VI of the Rehabilitation Act, special funding is available to provide SE services to those eligible individuals who, because of the significance of their disability, require intensive services to obtain employment and require Extended Services to maintain employment.\n\nThe critical identifier in SE is the need for Extended Services, which are long-term supports in the community, beyond Alaska Division of Vocational Rehabilitation (ADVR) case closure. The essential aspect of the Supported Employment model is that without intensive support services, these individuals with a most significant disability would be unable to obtain and maintain competitive integrated employment.\n\nOnce an individual has reached job stabilization, ADVR transitions the individual from Ongoing Support Services to another agency or a natural support source that will provide the E>' Services needed to maintain employment. The ADVR case remains open for at least 90 calendar days after stable employment is achieved and the case is closed at the transfer to long-term Extended Services, funded by an entity other than ADVR, to ensure a smooth transition. If long-term supports are not available to a youth with a most significant disability, ADVR may provide Extended Services to the youth for up to 4 years or until the youth turns 25, whichever occurs first.\n\nOngoing Support Services are time-limited services, up to a maximum of 24 months, which are identified and included on an Individualized Plan for Employment. Comparable benefits for Ongoing Support Services are taken into consideration, and if no other funding source is available, are funded by ADVR from the time of job placement until the transition to Extended Services. Ongoing Support Services shall include an assessment of employment stability and provision and coordination of specific services at or away from the worksite that are needed in order for the individual to maintain stability. This is based on a minimum of twice-monthly monitoring at the worksite of an individual, or if under specific circumstances, off-site monitoring. Offsite monitoring may occur at the request of the individual, but meetings between the individual and the counselor should occur at least twice a month.\n\nAt times and under special circumstances, the individual and the VR Counselor, along with VR Manager approval, may jointly agree to extend the 24 months to achieve the employment outcome identified in the IPE.\n\nExtended Services are long-term support services and other appropriate services that are needed to support and maintain an individual with a most significant disability (including a youth with a most significant disability) in supported employment. They are provided and funded by an entity or person other than ADVR, which may include Senior and Disability Services, mental health providers, private nonprofit organizations, the employer/co-workers, or any other appropriate resource including family members. When no other funding source is available, ADVR may fund Extended Services for a youth with a most significant disability for a period of time not to exceed four years, or until such time that a youth reaches the age of 25, thus no longer meeting the definition of a \"youth with a disability\", whichever occurs first. In all other situations, funding for Extended Services shall come from sources other than ADVR.","url":"","verified":"","notes":"","row":3},{"id":"ak-supported-employment-services-website","state":"AK","title":"Supported Employment Services (Website)","name":"Supported Employment Services","source":"Website","category":"employment","topic":"definition","text":"Ongoing support services, including customized employment, and on-the-job supports needed to support and maintain an individual with a most significant disability, including a youth with a most significant disability, in supported employment that are:\n1.Organized and made available singly or in combination in such a way as to assist an individual to maintain competitive integrated employment\n2.Based on a determination of the needs of an individual as specified in an IPE\n3.Provided by ADVR for a period of time not to exceed 24 months unless, under special circumstances, the individual and the VR Counselor jointly agree to extend the time to achieve the employment outcome identified in the IPE.\n4.Youth with a Disability:\nAn individual with a disability who is not younger than 14 years of age and not older than 24years of age, and for purposes of this policy, is a youth with a most significant disability.","url":"","verified":"","notes":"","row":4},{"id":"ak-supported-employment-delivery-website","state":"AK","title":"Supported Employment Delivery (Website)","name":"Supported Employment Delivery","source":"Website","category":"employment","topic":"activities","text":"Supported Employment has been referred to as a \"place and train\" model, whether with job coaches or through natural supports. Individuals who may not possess all the necessary or social skills required for immediate employment success are placed into employment \"place and train\" model matches individuals to jobs that are consistent with their unique strengths, resources, priorities, concerns, abilities, capabilities, interests, and informed choice. Placement is more rapid as there is no delay due to pre-placement training or skill requirements; however, vocational assessment activities should still occur to help determine the most appropriate vocational goal.\n\nProviders develop the best job match for an individual, using flexible strategies to meet the individual's needs and the employer's unmet business needs. Providers then provide ongoing supports and training at the work site on the specific skills and/or behaviors required for the job so that the individual can develop the skills needed to maintain long-term employment with the use of Extended Services.","url":"","verified":"","notes":"","row":5},{"id":"ak-supported-employment-eligiblity-website","state":"AK","title":"Supported Employment Eligiblity (Website)","name":"Supported Employment Eligiblity","source":"Website","category":"employment","topic":"eligibility","text":"Supported Employment (SE) services can be provided to any individual if that individual has been determined eligible for VR services, has a most significant disability, and for whom SE has been identified as the appropriate service delivery method on the basis of a comprehensive assessment of rehabilitation needs. The VR Counselor should also have a reasonable expectation that the individual will require Extended Services in order to maintain employment, whether the individual is currently receiving such services or not.","url":"","verified":"","notes":"","row":6},{"id":"ak-competitive-integrated-employment-website","state":"AK","title":"Competitive Integrated Employment (Website)","name":"Competitive Integrated Employment","source":"Website","category":"general","topic":"definition","text":"Competitive integrated employment means work that is performed on a full-time or part-time basis (including self-employment) and the individual is compensated at a rate that:\n1.In Alaska, is not less than minimum wage\n2.Is not less than the customary rate paid by the employer for the same or similar work performed by other employees without disabilities who are similarly situated in similar occupations by the same employer and who have similar training, experience, and skills\n3.In the case of an individual who is self-employed, yields an income that is comparable to the income received by other individuals without disabilities who are self-employed in similar occupations with similar tasks and who have similar training, experience, and skills\n4.Is eligible for the level of benefits provided to other employees.\n\nIs at a location:\n1.Typically found in the community\n2.Where the employee with a disability interacts with other employees and other persons without disabilities to the same extent as co-workers in similar positions without disabilities\n3.That provides opportunities for advancement that are similar to those offered to other employees without disabilities.","url":"","verified":"","notes":"","row":7},{"id":"ak-customized-employment-website","state":"AK","title":"Customized Employment (Website)","name":"Customized Employment","source":"Website","category":"employment","topic":"definition","text":"Customized employment means competitive integrated employment, for an individual with a significant disability, that is:\n1.Based on an individualized ADVR determination of the unique strengths, needs, and interests of the individual with a significant disability\n2.Designed to meet the specific abilities of the individual with a significant disability and the business needs of the employer\n\nCarried out through flexible strategies, such as:\n1.Job exploration by the individual\n2.Working with an employer to facilitate placement, including:\na.Customizing a job description based on current employer needs or on previously unidentified and unmet employer needs\nb.Developing a set of job duties, a work schedule and job arrangement, and specifics of supervision (including performance evaluation and review), and determining a job location\nc.Using a professional representative chosen by the individual or, if elected, self-representation to work with an employer to facilitate placement\n3.Providing services and supports at the job location","url":"","verified":"","notes":"","row":8}]},{"code":"AZ","name":"Arizona","notes":[],"entries":[{"id":"az-competitive-integrated-employment-policy-manual","state":"AZ","title":"Competitive Integrated Employment (Policy Manual)","name":"Competitive Integrated Employment","source":"Policy Manual","category":"general","topic":"definition","text":"work that is performed on a full-time or part-time basis for which an individual is compensated at or above minimum wage and comparable to the customary rate paid by the employer to employees without disabilities performing similar duties and with similar training and experience; receiving the same level of benefits provided to other employees without disabilities in similar positions; at a location where the employee interacts with other individuals without disabilities; and presented opportunities for advancement similar to other employees without disabilities in similar positions.","url":"","verified":"","notes":"","row":1},{"id":"az-group-supported-employment-policy-manual","state":"AZ","title":"Group Supported Employment (Policy Manual)","name":"Group Supported Employment","source":"Policy Manual","category":"employment","topic":"definition","text":"a service that provides employment and training activities to support a successful transition to Competitive Integrated Employment or to self-employment to Members employed in integrated businesses and industries in the community using mobile crews, small enclaves, and other small groups.","url":"","verified":"","notes":"","row":2},{"id":"az-integrated-community-work-setting-policy-manual","state":"AZ","title":"Integrated Community Work Setting (Policy Manual)","name":"Integrated Community Work Setting","source":"Policy Manual","category":"general","topic":"activities","text":"a worksite that is located in a naturally occurring community of residential, business, social, or educational environments.","url":"","verified":"","notes":"","row":3},{"id":"az-work-incentive-consultation-policy-manual","state":"AZ","title":"Work Incentive Consultation (Policy Manual)","name":"Work Incentive Consultation","source":"Policy Manual","category":"general","topic":"definition","text":"a meeting with a work incentive consultant trained in Social Security, Medicare, AHCCCS, and other government programs, who can help a Member understand Social Security work incentives, disability benefit programs, and how they are impacted by work.","url":"","verified":"","notes":"","row":4},{"id":"az-policy-integrated-community-work-settings-where-the-qualifie","state":"AZ","title":"Policy - Integrated Community Work Settings where the Qualified Vendor (Policy Manual)","name":"Policy - Integrated Community Work Settings where the Qualified Vendor","source":"Policy Manual","category":"general","topic":"activities","text":"i. Requires Members work alongside workers without disabilities, other than paid staff who are providing services to that individual;\n\nii. Requires Members perform the same tasks with the same expectations that a non-disabled peer would perform for pay; and\n\niii. Requires Members freely participate in the social aspects common to the workplace, including:\n\na) Having access to all common areas of the enterprise,\n\nb) Eating lunch, and\n\nc) Taking breaks together.","url":"","verified":"","notes":"","row":5},{"id":"az-policy-center-based-employment-where-the-qualified-vendor-po","state":"AZ","title":"Policy-Center-Based Employment where the Qualified Vendor (Policy Manual)","name":"Policy-Center-Based Employment where the Qualified Vendor","source":"Policy Manual","category":"employment","topic":"definition","text":"i. Requires that Members have the opportunity to engage with others including individuals with and without disabilities who are not paid staff;\n\nii. Provides services in a service site located in a community setting that includes:\n\na) Planned opportunities for interaction with community members,\n\nb) Information about resources, and\n\nc) Ability to participate in community events based on individual preferences.\n\niii. Requires that the setting supports Members' access to daily activities, the physical work or program environment, and that Members choose with whom they wish to interact;\n\nProvides support for transportation training or mobility training as outlined in the Member’s Person-Centered service plan (PCSP);\n\nv. Provides Members with the opportunity to explore, observe, or participate in a variety of work opportunities, including integrated work environments to evaluate appropriateness for progressive employment moves including Competitive Integrated Employment or self employment;\n\nvi. Requires that the Member has the opportunity to participate in productive and meaningful work and that the job is aligned with the Member’s capacities and interests;\n\nvii. Provides orientation, training, and skill development to Members, along with teaching general work skills;\n\nviii. Incorporates Arizona Disability Benefits 101 (DB 101) and Work Incentive Consultation into the Member’s plan to reach employment outcomes;\n\nix. Maintain ongoing assessments of strengths, areas for improvement, and overall job performance;\n\nx. Consults at least annually with the Member’s planning team to assess with their Support Coordinator whether:\n\n1) The service is still applicable for the Member, is meeting the Member's needs, and is advancing the Member’s employment outcomes or vision for employment;\n\n2) The Member’s employment needs could be better supported, additionally coordinated, through other programs, such as school or with a referral to vocational rehabilitation for employment services;\n\n3) The Member’s needs could be met through natural supports, independent volunteer experiences, technology, or adaptive equipment; or\n\nThe Member could participate in other employment services to further advance their vision for employment.","url":"","verified":"","notes":"","row":6},{"id":"az-policy-group-supported-employment-where-the-qualified-vendor","state":"AZ","title":"Policy-Group Supported Employment where the Qualified Vendor (Policy Manual)","name":"Policy-Group Supported Employment where the Qualified Vendor","source":"Policy Manual","category":"employment","topic":"definition","text":"i. Provides vocational or job related discovery or assessment by providing ongoing monitoring of the performance and general job-related skills of Members to identify both strengths and barriers to maintain and advance employment;\n\nii. Incorporates DB 101 and Work Incentive Consultation into the Member’s PCSP to reach employment outcomes;\n\niii. Refers Members at their request for a progressive move into Competitive Integrated Employment; and\n\niv. Provides transportation within the Member’s scheduled workday from worksite to worksite and provides support for transportation training or mobility training as outlined in the Member’s PCSP.","url":"","verified":"","notes":"","row":7},{"id":"az-policy-community-residential-settings-where-the-qualified-ve","state":"AZ","title":"Policy-Community Residential Settings where the Qualified Vendors (Policy Manual)","name":"Policy-Community Residential Settings where the Qualified Vendors","source":"Policy Manual","category":"employment","topic":"activities","text":"i. Refer Members who want to work or gain work-related skills to the Planning Team to consider adding an employment service; ii. Require that Member responsibilities and expectations are explained to Members prior to service delivery; and iii. Require Members are provided information about rights in their home as outlined in Division Operations Policy Manual 1001-A.","url":"","verified":"","notes":"","row":8}]},{"code":"AR","name":"Arkansas","notes":[],"entries":[{"id":"ar-spported-employment-ces-agency-standards","state":"AR","title":"Spported Employment (CES Agency Standards)","name":"Spported Employment","source":"CES Agency Standards","category":"employment","topic":"definition","text":"Supported employment services are a tailored array of services offering ongoing support to beneficiaries in their goal of working in competitive integrated work settings for at least minimum wage. Supported employment services may include any combination of the following services:\n\nJob assessment and discovery;\nPerson centered employment planning;\nJob placement;\nJob development;\nJob coaching;\nBenefits support;\nTraining and planning:\nTransportation to and from a beneficiary’s home and employment site (when no other transportation is available);\nAsset development;\nCareer advancement services; and\nOther workplace support services not specifically related to job skill training that enable a beneficiary to successfully integrate into a job setting.\n\nSupported employment services include services utilized to support beneficiaries who are self-employed. A Provider of supported employment services must maintain the following documentation in a beneficiary’s service record:\n\nJob development or transition plan for job supports;\nCopy of beneficiary remuneration statements or paycheck stubs, if available; and\nCopy of beneficiary’s recent work schedule, if applicable","url":"","verified":"","notes":"","row":1},{"id":"ar-supported-employment-ar-code-of-rules","state":"AR","title":"Supported Employment (AR Code of Rules)","name":"Supported Employment","source":"AR Code of Rules","category":"employment","topic":"definition","text":"\"Supported employment\" means competitive integrated employment, including customized employment, or employment in an integrated work setting in which an individual with a most significant disability, including a youth with a most significant disability, is working on a short-term basis toward competitive integrated employment that is individualized and customized, consistent with the unique strengths, abilities, interests, and informed choice of the individual:\n\nFor whom competitive integrated employment has not historically occurred, or for whom competitive integrated employment has been interrupted or intermittent as a result of a significant disability; and\nWho, because of the nature and severity of their disabilities, need intensive supported employment services and extended services after the transition from support provided by the designated state unit, in order to perform this work.","url":"","verified":"","notes":"","row":2},{"id":"ar-suppported-employment-waiver","state":"AR","title":"Suppported Employment (Waiver)","name":"Suppported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment is a tailored array of services that offers ongoing support to members with the most significant disabilities to assist in their goal of working in competitive integrated work settings for at least minimum wage. It is intended for individuals for whom competitive employment has not traditionally occurred, or has been interrupted or intermittent as a result of a significant disability, and who need ongoing supports to maintain their employment.\n\nSupported employment services may include any combination of the following services: vocational/job related discovery and assessment, person centered employment planning, job placement, job development, negotiation with prospective employers, job analysis, job carving, training and systematic instructions, job coaching, benefits support, training and planning, transportation, asset development, and career advancement services, extended supported employment supports, and other workplace support services including services not specifically related to job skill training that enable the waiver client to be successful in integrating into the job setting. The service array may also be utilized to support individuals who are self-employed.\n\nTransportation between the member's place of residence and the employment site is included as a component of supported employment services when there is no other resource for transportation available.\n\nThe service provider must maintain the following documents to demonstrate compliance and delivery of this service any job development plan or transition plan for job supports, remuneration statement (paycheck stub) and member's work schedule","url":"","verified":"","notes":"","row":3},{"id":"ar-supported-employment-provider-specifications-waiver","state":"AR","title":"Supported Employment - Provider Specifications (Waiver)","name":"Supported Employment - Provider Specif
