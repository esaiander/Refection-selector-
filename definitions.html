. Commensurate wages must be based on the prevailing wage paid to experienced workers without disabilities doing the same job.\n\n\"Competitive integrated employment\" means work in the competitive labor market performed on a full-time or part-time basis in integrated community settings. The individual is compensated at or above minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Competitive employment is an individual placement.\n\n\"Employment assessment\" means the evaluation that identifies the unique preferences, strengths, and needs of members in relation to work. The assessment determines work skills and work behaviors, is supplemented by personal interviews and behavioral observations, and incorporates information that addresses the member's desired medical, physical, psychological, social, cultural, and educational outcomes, as well as present and future employment options. The assessment is updated annually or more frequently as needed, and includes support needs, environmental preferences, and possible accommodations.\n\n“Enhanced rate\" means a differential rate established to provide an incentive to provider agencies to provide community employment services to members with significant needs\n\n\"Group placement\" means either two (2) to three (3) workers with disabilities making minimum wage or four (4) to five (5) workers with disabilities who may earn less than minimum wage situated close together, who are provided continuous, long-term training and support in an integrated job site. Members may be employed by the company or by the provider agency. The terms \"work crew\" and \"enclave\" also describe a group placement.\n\n\"Individual placement in community-based services\" means the member is provided supports that enable him or her to participate in approved community-based activities per Oklahoma Administrative Code 317:40-7-5, individually and not as part of a group placement.\n\n\"Individual placement in job coaching services\" means one member receiving job coaching services, who:\n1.Works in an integrated job setting;\n2.Receives minimum wage or more;\n3.Does not receive services from a job coach who is simultaneously responsible for continuous job coaching for a group;\n4.Is employed by a community employer or the provider agency; and\n5.Has a job description that is specific to his or her work.\n\n“Integrated employment site\" means an activity or job that provides regular interaction with people without disabilities, excluding service providers, to the same extent that a worker without disabilities in a comparable position interacts with others.\n\n\"Job coach\" means an individual who holds a DDS-approved training job coach certification and provides ongoing support services to eligible persons in supported employment placements. Services directly support the member's work activity including marketing and job development, job and work site assessment, training and worker assessment, job matching procedures, development of co-worker natural and paid supports, and teaching job skills.\n\n\"Job sampling\" means a paid situational assessment whereby a member performs a job at a prospective employer's integrated job site in order to determine the member's interests and abilities. Situational assessments adhere to the Department of Labor (DOL) regulations regarding wages. The Personal Support Team determines the appropriate type and number of situational assessments for each member.\n\n\"On-site supports\" means a situation in which the job coach is physically at the job site providing job training to a member.\n\n\"Situational assessment\" means a comprehensive community-based evaluation of the member's functioning in relation to the supported job including the job site, community through which the member must travel to and from the job, and those at the job site, such as the job coach, co-workers, and supervisors.\n\n\"Sub-contract with industry\" means the provider agency enters into a sub-contract with an industry or business to pay industry employees to provide supports to members. When the industry agrees, the provider agency may contract directly with an industry employee(s) to provide the services. The state continues to pay the provider agency and the agency provides all pertinent information required for persons served by the agency. The Team determines what, if any, training is required for the employees of the industry providing services.\n\n\"Supported employment\" means competitive work in an integrated work setting with ongoing support services for members for whom competitive employment has not traditionally occurred or was interrupted or intermittent as a result of the member's disabilities.\n\n\"Unpaid training\" means unpaid experience in integrated employment sites per Sections 785.27 through 785.32 of Title 29 of the Code of Federal Regulations (29 C.F.R. \" 785.27 through 785.32). Members do a variety of tasks that do not equal the full job description of a regular worker.\n\n\"Volunteer job\" means an unpaid activity in which a member freely participates.","url":"","verified":"","notes":"","row":4}]},{"code":"OR","name":"Oregon","notes":[],"entries":[{"id":"or-employment-service-requirements","state":"OR","title":"Employment Service Requirements","name":"Employment Service Requirements","source":"","category":"employment","topic":"provider","text":"The delivery of employment services provided under these rules presumes all individuals eligible for services can succeed in a job and career in a competitive integrated employment setting in the general workforce and earn minimum wage or better.\n\nEmployment is the preferred activity for individuals receiving services under these rules. Competitive integrated employment is the highest priority over unemployment, segregated or sheltered employment, small group employment support, or non-work day activities.\n\nEmployment services must be individually planned based on person-centered planning principles. Consistent with the person-centered approach to these services, individuals accessing employment services under these rules must be encouraged, on an ongoing basis, to explore their interests, strengths, and abilities relating to employment or career advancement.","url":"","verified":"","notes":"","row":1},{"id":"or-individual-supported-employment-job-development","state":"OR","title":"INDIVIDUAL SUPPORTED EMPLOYMENT -JOB DEVELOPMENT","name":"INDIVIDUAL SUPPORTED EMPLOYMENT -JOB DEVELOPMENT","source":"","category":"employment","topic":"definition","text":"Job development includes support for an individual to obtain an individualized job in a competitive integrated employment setting in the general workforce, including customized employment or self-employment.\n\nPersonal care or attendant care provided as an incidental part of job development is considered a component part of the employment service.\n\nThe job developed must provide compensation at a rate that is not less than:\n1.The higher of the rate specified in federal, state, or local minimum wage law; and\n2.The customary rate and benefits paid by an employer for the same or similar work performed by other employees who do not experience a disability, who are similarly situated in similar occupations by the same employer, and who have similar training, experience, and skills.\n3.The job developed must meet criteria established in a Career Development Plan or Individual Plan for Employment (I PE) including, but not limited to, criteria regarding the number of hours the individual will work in the job.\n4.The Career Development Plan must document either a goal or discussion regarding opportunities for maximizing work hours and other career advancement opportunities. The recommended standard for planning job coaching and job development is the opportunity to work at least 20 hours per week.\n5.Individualized planning must ultimately be based on person-centered planning principles, including individual choice, preferences, and circumstances, and recognize that some individuals may choose to pursue working full time, part time, or another goal identified by the individual.\n6.Job development may be authorized in the limited circumstances where the service is not available through Vocational Rehabilitation, and the Department has approved authorization.\n7.Transportation provided within the course of job development is a component part of the employment service.","url":"","verified":"","notes":"","row":2},{"id":"or-small-group-employment-support","state":"OR","title":"SMALL GROUP EMPLOYMENT SUPPORT","name":"SMALL GROUP EMPLOYMENT SUPPORT","source":"","category":"employment","topic":"definition","text":"Small group employment support:\n1.May be provided in groups of two to eight individuals.\n2.Must be provided in a manner that promotes integration into the workplace and interaction with people who do not experience a disability in those workplaces.\nSmall group employment support does not include:\n1.Vocational services delivered in a provider owned, operated, or controlled setting, or a facility-based work setting.\n2.Support in volunteer or unpaid work.\n\nIndividuals utilizing small group employment support must be compensated at a rate that is not less than:\n1.The higher of the rate specified in federal, state, or local minimum wage law; and\n2.The customary rate and benefits paid by the employer for the same or similar work performed by other employees who do not experience a disability, who are similarly situated in similar occupations by the same employer, and who have similar training, experience, and skills.\n\nPersonal care or attendant care provided as an incidental part of small group employment support is considered a component part of the employment service.\n\nTransportation provided within the course of small group employment support is a component part of the employment service.","url":"","verified":"","notes":"","row":3},{"id":"or-discovery","state":"OR","title":"DISCOVERY","name":"DISCOVERY","source":"","category":"career","topic":"definition","text":"A comprehensive and person-centered employment planning support service to better inform an individual seeking competitive integrated employment in the general workforce and develop a Discovery Profile.\n\nDiscovery must include\n1.A series of individualized work or volunteer related activities, completed in integrated employment settings, to inform an individual and their job developer about the individual's strengths, interests, abilities, skills, experiences, and support needs.\n2.Analyzing detailed information from an individual's novel and past experiences in order to identify conditions or integrated employment settings for the individual's success.\n\nTo identify transferable skills and job or career interests, discovery may include job and task analysis activities, assessment for use of assistive technology.job shadowing, informational interviewing, employment preparation, resume development, and volunteerism.\n\nDiscovery must be completed within a three-month period. A three-month extension may be authorized if an individual and the individual's case manager determines there is a legitimate reason. Legitimate reasons may include, but are not limited to, any of the following:\n1.The individual had a medical event that delayed completing discovery.\n2.A medical event significantly changed the individual's strengths, interests, and abilities.\n3.An opportunity to participate in particular work trials or volunteer positions may only be scheduled outside of the three-month period.\n\nDiscovery must have an outcome of a Discovery Profile. The Discovery Profile must meet requirements established by the Department.\n\nDiscovery most often results in a referral to vocational rehabilitation services.\n\nPersonal care or attendant care provided as an incidental part of discovery is considered a component part of the employment service.\n\nTransportation provided within the course of discovery is a component part of the employment service","url":"","verified":"","notes":"","row":4}]},{"code":"PA","name":"Pennsylvania","notes":[],"entries":[{"id":"pa-prevocational-services-waiver","state":"PA","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Community Participation Support (CPS) provides opportunities & support for community inclusion & building interest in & developing skills & potential for competitive integrated employment. CPS should result in active, valued participation in a broad range of integrated activities that build on the participant's interests, preferences, gifts, & strengths while reflecting their desired outcomes related to employment, community involvement & membership. To achieve this, each participant must be offered opportunities & needed support to participate in community activities that are consistent with the participant’s preferences, choices & interests. Each participant’s preferences, choices, etc. may change based on their experiences & as a result, providers must have conversations at least quarterly about community activities in which the participant would like to participate. The CPS provider is required to complete & update an analysis of the participant in relation to the following at least annually:\n\n•Strongest interests & personal preferences for community activities,\n\n•Skills, strengths, & other contributions likely to be valuable to employers or the community, &\n\n•Conditions necessary for successful community inclusion and/or competitive integrated employment. CPS is intended to flexibly wrap around or otherwise support community life secondary to employment, as a primary goal. This service involves participation in integrated community settings, in activities that involve persons without disabilities who are not paid or unpaid caregivers. Providers with service locations where more than 10% of individuals who are receiving services are spending less than 25% of their time in community settings on average are required to describe the following for the service location in the provider’s Quality Management Plan required in §6100.45 & its Action Plan:\n\n•The # or % of individuals not receiving at least 25% of their services in community settings,\n\n•The # of individuals who want to increase the amount of time they spend in the community,\n\n•Action steps for increasing time in the community for each participant (stated in bullet above) including timeframes for achieving each action step,\n\n•Barriers to supporting the participant with engaging in community activities, including action steps to address the barriers & timeframes for achieving each action step,\n\n•Methods used by the provider to offer options to receive services in integrated community settings in-line with each participant’s preferences, choices, & interests for community activities & the frequency such options will be offered,\n\n•Successful community experiences, such as building relationships, employment opportunities and natural supports for individuals served,&\n\n•The staff position responsible for reviewing & updating the information demonstrating the efforts to provide exposure & opportunities to participate in community activities in the Action Plan of the Quality Management Plan (at least quarterly) & Quality Management Plan (at least annually). CPS is expected to result in the participant developing & sustaining a range of valued social roles & relationships; building natural supports; increasing independence; increasing potential for employment; & experiencing meaningful community participation & inclusion. Activities include supports for:\n\n•Developing skills & competencies necessary to pursue competitive integrated employment;\n\n•Assisting participants with contacting agencies & obtaining documents needed to access employment supports & services that educate participants on the impact of employment on current benefits;\n\n•Participating in community activities, organizations, groups, or clubs to develop social networks;\n\n•Identifying & participating in activities that provide purpose & responsibility;\n\n•Fine & gross motor development & mobility;\n\n•Participating in community opportunities related to the development of hobbies or leisure/cultural interests or to promotepersonal health & wellness;\n\n•Participating in volunteer opportunities or community adult learning opportunities;\n\n•Opportunities focused on training & education for self-determination & self-advocacy;\n\n•Learning to navigate their community, including learning the options & use of public/private transportation in the localarea;\n\n•Developing or maintaining social networks & reciprocal relationships with members of the broader community (neighbors,\n\ncoworkers, & other community members who do not have disabilities & who are not paid or unpaid caregivers) through natural opportunities & invitations that may occur;\n\n•Assisting participants, caregivers, & providers with identifying & utilizing supports not funded through the waiver that are\n\navailable from community service organizations, such as churches, schools, colleges/universities & other post-secondary institutions, libraries, neighborhood associations, clubs, recreational entities, businesses & community organizations focused on exchange of services (e.g time banks);&\n\n•Assisting participants & caregivers with providing mutual support to one another (through service/support exchange) & contributing to others in the community. CPS includes planning & coordination for:\n\n•Developing skills & competencies necessary to pursue competitive integrated employment;\n\n•Promoting personal reliance & contribution, mutual support & community connection;\n\n•Developing social networks & connections within local communities;\n\n•Emphasizing, promoting & coordinating the use of unpaid supports to address participant & family needs in addition to paid services;&\n\n•Planning & coordinating a participant's daily/weekly schedule for CPS.","url":"","verified":"","notes":"","row":1},{"id":"pa-prevocational-services-cntd-waiver","state":"PA","title":"Prevocational Services CNTD (Waiver)","name":"Prevocational Services CNTD","source":"Waiver","category":"prevoc","topic":"limits","text":"For participants age 18+, fading of the service & less dependence on paid support for ongoing participation in community activities & relationships is expected. Fading strategies should be utilized whenever appropriate. Fading support increases independence for participants & is a component of the fading strategy where access to provider staff & immediate teleservices are needed as a back-up. Fading support is used when a participant is engaged in a community activity that was arranged by the CPS provider but where the CPS provider staff is not physically present, & the participant is supported by unpaid supports. In these circumstances, CPS staff are on-call or providing teleservices as a back-up to the unpaid support. A staff person cannot render fading support & direct services at the same time. The use of fading support can address the health & safety of the participant to support the unpaid support in a circumstance when the unpaid support needs additional guidance to address a participant’s health & safety or care needs. The Supports Coordinator is responsible for verifying that fading supports are appropriate to meet the participant’s needs (Appendix D-2-a). Additional information is contained in the Main Module-Additional Needed Information.\n\nPersonal care assistance is included as a component of CPS but does not comprise the entirety of the service. The service also includes transportation as an integral component of the service; for example, transportation to a community activity. The CPS provider is not responsible for transportation to & from a participant's home.\n\nThis service may be provided in the following settings that meet all federal standards for home & community-based settings:\n\n•Community locations: Locations must be non-disability specific, not in a licensed facility, or any type of facility owned, leased or operated by a provider of other ODP services. Services are provided in a variety of integrated community locations that offer opportunities for the participant to achieve their personal identified goals for through CPS. A maximum of 3 participants can be served simultaneously by any 1 provider at a community location at any 1 time.\n\n•Community hubs: These settings primarily serve as a gathering place prior to & after community activities. Participants' time will be largely spent outside of the community hub. Community hubs should be non-disability specific, accessible, provide shelter in inclement weather, & be locations used by the general public. Community hubs could be locations that are focused on a specialty area of interest for participants served, such as employment interest area, volunteer site, related to arts, outdoors, etc. A community hub could be a private home but is not the home of support staff or any individual employed by, or on the board or similar committee responsible for executive decisions of the provider of the service. The participant's home may only serve as a hub on an occasional & incidental basis. The use of a community hub must be driven by the interest of the participants served. A maximum of 6 participants can be served by any 1 provider at any 1 point in time in a community hub.\n\n•Adult Training Facilities (subject to licensure under 55 Pa. Code Chapter 2380).\n\n•Older Adult Daily Living Centers (OADLC) (subject to licensure under 6 Pa. Code Chapter 11): For participants 60 years+, or participants with dementia or dementia-related conditions. Participants under 60 years of age receiving services in an OADLC prior to 7/1/17 may continue to receive services in these settings.\n\n•Vocational Facilities (subject to licensure under 55 Pa. Code Chapter 2390): Facility-based prevocational services focus on the development of competitive worker traits through work as the primary training method. The service may be provided as:\n\no Occupational training to teach skills for a specific occupation in the competitive labor market & includes personal & work adjustment training designed to develop appropriate worker traits & teach understanding work environment expectations.\n\no Work related evaluation involving use of planned activities, systematic observation, & testing to formally assess the participant, including identification of service needs, potential for employment, & employment objectives. CPS may be used to provide prevocational services in Licensed Adult Training and Vocational facilities & community locations. All participants receiving prevocational services, which includes participants receiving subminimum wage in any setting, must have a competitive integrated employment outcome included in their service plan.\n\nThere must be documentation in the service plan regarding how & when the provision of prevocational services is expected to lead to competitive integrated employment. Prevocational services assist participants in vocational skill development, which means developing basic skills & competencies necessary for a participant to pursue competitive integrated employment & includes:\n\n•The development & implementation of a preliminary plan for employment that identifies:\n\no The participant's basic work interests,\n\no Skills & gaps in skills for the participant’s work interests, including how those will be addressed,\n\n•Situational assessments: spending time at an employer's place of business to explore vocational interests & develop vocational skills,&\n\n•Identifying available transportation to help the participant get to & from work & teaching the participant & others (as appropriate) about basic financial opportunities & benefits information for a move into competitive integrated employment.\n\nMore information about CPS requirements is located in the Additional Needed Information Section of the Main Module.","url":"","verified":"","notes":"","row":2},{"id":"pa-prevocational-services-limits-waiver","state":"PA","title":"Prevocational Services - Limits (Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"Handicapped employment as defined in Title 55, Chapter 2390 may not be funded through the Waiver.\n\nA participant may be authorized for a maximum of 40 units of fading support per week. Only activities completed by direct service professionals as specified in the service definition are compensable as CPS services. The cost of purchasing devices, maintenance of the devices & service fees may not be billed under this service definition.\n\nPrevocational services may not be funded through the Waiver if they are available to participants through program funding under the IDEA. Documentation must be maintained in the participant’s file to satisfy assurances that the service is not otherwise available through a program funded under the IDEA. Prevocational services may be provided without referring a participant to the Office of Vocational Rehabilitation (OVR) unless the participant is under the age of 25. When a participant is under the age of 25, prevocational services may only be authorized as a new service in the service plan when documentation has been obtained that OVR has closed the participant’s case or that the participant has been determined ineligible for OVR services. Participants who are under the age of 25 may not receive prevocational services that pay subminimum wage unless they have been referred to OVR and OVR has closed the case or the participant has been determined ineligible for OVR services. Participants who are under the age of 25 are not required to be referred to OVR when they will be working on skill development and/or participating in activities for which they will not receive subminimum wage. It is not allowable, however, for these prevocational activities to occur in a licensed vocational facility unless OVR has closed their case or they have been determined ineligible for OVR services.\n\nCPS services may not be provided at the same time as the direct provision of any of the following: Companion; In-Home And Community Supports; Small Group Employment; Job Finding or Development and Job Coaching and Support in Supported Employment; job acquisition and job retention in Advanced Supported Employment; Transportation; 15-minute unit Respite; Therapies; Education Support; Shift Nursing; Music, Art and Equine Assisted Therapy and Consultative Nutritional Services. The direct provision of CPS as well as fading support shall not be rendered on the same days and times that the Remote Supports service is rendered.\n\nThis service is generally provided between 8am to 5pm but is not restricted to those hours of the day. Alterations from typical day/work hours should be based on the participant’s natural rhythms, preferred activities (not for convenience of a provider).\n\nThis service can be delivered in Pennsylvania and in states contiguous to Pennsylvania.\n\nWhen CPS services are not provided with any other employment service (Small Group Employment, Supported\n\nEmployment or Advanced Supported Employment) and the participant is not competitively employed, the hours of authorized CPS cannot exceed 40 hours (160 15-minute units) per participant per calendar week.\n\nWhen the participant is competitively employed, the total number of hours for CPS, Supported Employment and/or Small Group Employment (whether utilized alone or in conjunction with one another) cannot exceed 50 hours (200 15-minute units) per participant per calendar week.\n\nParticipants may receive a maximum of 520 hours (2080 15-minute units) of Community Participation Support teleservices per fiscal year.","url":"","verified":"","notes":"","row":3},{"id":"pa-prevoc-services-prevocational-facility-provider-specificatio","state":"PA","title":"Prevoc Services – Prevocational Facility Provider Specifications","name":"Prevoc Services – Prevocational Facility Provider Specifications","source":"","category":"prevoc","topic":"provider","text":"Providers of facility-based prevocational services with a waiver service location in Pennsylvania must be licensed under 55 Pa. Code Chapter 2390 relating to Vocational Facilities. A comparable license is required for providers with waiver service locations in states contiguous to Pennsylvania.\n\nAt least one staff person (direct, contracted, or in a consulting capacity) who provides enhanced levels of service must be a Registered Nurse (RN) or Licensed Practical Nurse (LPN) when the participant has been assessed to have medical needs that require a RN or LPN.\n\nProgram specialists and supervisors of direct service professionals must have one of the following within nine months of hire:\n\nHold a Certified Employment Support Professional (CESP) credential from the Association of People Supporting Employment First (APSE), or\n\nHave been awarded a Basic Employment Services Certificate of Achievement or a Professional Certificate of Achievement in Employment Services from an Association of Community Rehabilitation Educators (ACRE) organizational member that has ACRE-approved training.\n\nAll new hires must complete the Department approved training on Community Participation Support within 60 days of hire and during that time they must be supervised by someone who has completed the training.\n\nEnhanced levels of service are based on the participant's behavioral or medical support needs. At least one staff person must have one of the following certifications or degrees to provide enhanced levels of service to participants who do not require a nurse to provide the enhanced level of service:\n\n• NADD Competency-Based Clinical Certification.\n\n• NADD Competency-Based Dual Diagnosis Certification.\n\n• NADD Competency-Based Direct-Support Professional Certification.\n\n• Registered Behavior Technician.\n\n• Certified Nursing Assistant.\n\n• Board Certified Assistant Behavior Analyst.\n\n• Bachelor’s Degree or higher in Psychology, Education, Special Education, Counseling, Social Work Gerontology or Therapeutic Recreation\n\nAgencies must meet the following standards regardless of provider service location:\n\nHave a waiver service location in Pennsylvania or a state contiguous to Pennsylvania.\n\nHave a signed ODP Provider Agreement on file with ODP which requires the provider to comply with all applicable federal and state statutes, regulations, and policies, including but not limited to confidentiality and HIPAA requirements. Providers are required to develop and implement written privacy policies and procedures that are consistent with the Privacy Rule. ODP reviews these policies and procedures when complaints are received regarding privacy or as part of licensing or QA&I when warranted.\n\nEffective 1/1/27, be an approved vendor for OVR Supported Employment services and provide documentation of acceptance of OVR referrals for OVR funded Supported Employment.\n\nComplete standard ODP required orientation and training.\n\nNew providers demonstrate compliance with ODP standards through completion of a self-assessment and validation of required documentation, policies and procedures.\n\nHave Commercial General Liability Insurance.\n\nHave documentation that all vehicles used in the provision of Community Participation Support have automobile insurance.\n\nHave documentation that all vehicles used in the provision of Community Participation Support have current State motor vehicle registration and inspection.\n\nHave Workers' Compensation Insurance in accordance with state law.\n\nEnsure that staff (direct, contracted, or in a consulting capacity) have been trained to meet the needs of the participant such as with communication, mobility and behavioral needs.\n\nComply with Department standards related to provider qualifications.\n\nProviders newly enrolling to render Community Participation Support, In-Home and Community Support, and/or Companion must provide ODP home and community-based services to a minimum of 3 separate and distinct participants in the first fiscal year after enrollment. Starting 7/1/26, currently enrolled providers must render ODP home and community based services to a minimum of 3 separate and distinct participants each fiscal year. ODP will use the provider’s Master Provider Index number to determine if the provider is rendering any ODP waiver services to a minimum of 3 separate and distinct participants. Additionally, the provider must render ODP home and community-based services each quarter.\n\nStaff working for or contracted with agencies as well as volunteers utilized in providing this service if they will spend any time alone with a participant must meet the following standards:\n\nBe at least 18 years of age.\n\nComplete necessary pre/in-service training based on the service plan.\n\nHave at least a 4 year degree when providing enhanced levels of Community Participation Support and the participant's assessed needs require the degree.\n\nHave a Pennsylvania State Police criminal history record check prior to the date of hire. If the prospective employee is not a resident of the Commonwealth of Pennsylvania or has not been a resident of the Commonwealth of Pennsylvania for at least two years prior to the date of employment, a Federal Bureau of Investigation criminal history record check must be obtained prior to the date of hire. If a criminal history clearance and/or the criminal history record check identifies a criminal record, providers must make a case-by-case decision about whether to hire the person that includes consideration of the following factors: •The nature of the crime;\n\nFacts surrounding the conviction;\n\nTime elapsed since the conviction;\n\nThe evidence of the individual’s rehabilitation; and\n\nThe nature and requirements of the job. Documentation of the review must be maintained for any staff that were hired whose criminal history clearance results or criminal history check identified a criminal record.\n\nHave a valid driver's license if the operation of a vehicle is necessary to provide Community Participation Support\n\nVerification occurs at least once during a 3-year monitoring cycle and more frequently when deemed necessary by ODP. New providers may be qualified more frequently depending on which monitoring cycle they are assigned to.","url":"","verified":"","notes":"","row":4},{"id":"pa-supported-employment-waiver","state":"PA","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment services are direct and indirect services that are provided in a variety of community settings for the purposes of supporting participants in obtaining and sustaining competitive integrated employment (CIE). Supported Employment teleservices may be provided in accordance with the requirements in Appendix C-1-d. CIE refers to full or part-time work at minimum wage or higher, with wages and benefits similar to workers without disabilities performing the same work, and fully integrated with coworkers without disabilities.\n\nSupported Employment services include activities such as training and additional supports including worksite orientation, job aide development, coordination of accommodations, assisting participants with contacting relevant agencies and obtaining documents needed to access employment supports and services that educate participants on the impact of employment on current benefits, and ensuring assistive technology that may be needed by the participant to obtain and sustain CIE is utilized as specified in the plan. Payment will be made only for the training and supports required by the participant and will not include payment for the training or supervisory activities that should be rendered as a normal part of the job.\n\nFederal Financial Participation through the Waiver may not be claimed for incentive payments, subsidies, or unrelated vocational expenses such as the following:\n\n• Incentive payments made to an employer of participants receiving services to encourage or subsidize the employer's\n\nparticipation in a supported employment program;\n\n• Payments that are passed through to participants receiving Supported Employment; or\n\n• Payments for vocational training that are not directly related to a participant's Supported Employment program.\n\nSupported Employment services consist of three components: career assessment, job finding or development, and job coaching and support.","url":"","verified":"","notes":"","row":5},{"id":"pa-supported-employment-career-assesment-waiver","state":"PA","title":"Supported Employment - Career Assesment(Waiver)","name":"Supported Employment - Career Assesment","source":"Waiver","category":"career","topic":"definition","text":"Career assessment is a person-centered, individualized employment assessment used to assist in the identification of potential career options, including self-employment, based upon the interests and strengths of the participant. Career assessment may include discovery activities and may be provided within a variety of settings including Life Sharing or Supported Living settings when identified as a need in the service plan or vocational facilities and adult training facilities when these facilities are where the person’s employment or volunteer experience occurred that is being assessed and when identified as a need in the service plan. Career assessment activities, on average, should be authorized no longer than 6 consecutive months and should result in the development of a career assessment report. When a participant requires career assessment activities in excess of 6 consecutive months, an explanation of why the activities are needed for an extended period of time should be included in the service plan.\n\nCareer assessment includes:\n\n• Gathering and conducting a review of the participant’s interests, skills, and work or volunteer history.\n\n• Conducting situational assessments to assess the participant’s interest and aptitude in a particular type of job.\n\n• Conducting informational interviews.\n\n• Identifying types of jobs in the community that match the participant’s interests, strengths and skills.\n\n• Developing a career assessment report that specifies recommendations regarding the participant’s needs, interests, strengths, and characteristics of potential work environments. The career assessment report must also specify training or skills development necessary to achieve the participant’s career goals.","url":"","verified":"","notes":"","row":6},{"id":"pa-supported-employment-job-finding-or-development-waiver","state":"PA","title":"Supported Employment - Job Finding or Development (Waiver)","name":"Supported Employment - Job Finding or Development","source":"Waiver","category":"employment","topic":"definition","text":"Job finding or development includes employer outreach and orientation, job searching, job development, resume preparation and interview assistance. Other activities may include participation in individual planning for employment, development of job-seeking skills, development of job skills specific to a job being sought, job analysis, consulting with the Office of Vocational Rehabilitation (OVR), benefits counseling agencies, or Ticket to Work employment networks on behalf of a participant, or self-employment assistance. Job finding or development may be provided in a variety of settings including Life Sharing or Supported Living settings when identified as a need in the service plan. The direct portion of job finding or development may not be provided in a vocational facility or adult training facility.\n\nJob finding or development may include customized job development. Customized job development means individualizing the employment relationship between employees and employers in a way that matches the needs of the employer with the assessed strengths, skills, needs, and interests of the participant, either through task reassignment, job carving, or job sharing. Job finding or development may also include negotiating the conditions for successful employment with a prospective employer including tasks, wages, hours and support.","url":"","verified":"","notes":"","row":7},{"id":"pa-supported-employment-job-coaching-and-support-waiver","state":"PA","title":"Supported Employment - Job Coaching and Support (Waiver)","name":"Supported Employment - Job Coaching and Support","source":"Waiver","category":"employment","topic":"definition","text":"Job coaching and support consists of training the participant on job assignments, periodic follow-up, or ongoing support with participants and their employers. This may include systematic instruction. The service must be necessary for participants to maintain acceptable job performance and work habits, including assistance in learning new work assignments, maintaining job skills, and achieving performance expectations of the employer. Other examples of activities include direct intervention with an employer, employment-related personal skills instruction, support to re-learn job tasks, training to assist participants in using transportation to and from work, worksite orientation, job aide development, coordination of accommodations, ensuring assistive technology is utilized as specified in the plan, maintenance of appropriate work and interpersonal behaviors on the job, follow-along services at the work site after OVR-funded services are discontinued or OVR referral requirements are satisfied, and technical assistance and instruction for the participant’s coworkers that will enable peer support.\n\nJob coaching and support may not be provided in a vocational facility, adult training facility, Child Residential and Day Treatment Facilities (55 Pa. Code Chapter 3800), Community Residential Rehabilitation Services for the Mentally Ill residential programs (55 Pa. Code Chapter 5310) or any licensed or unlicensed home that provides residential habilitation services funded by ODP.\n\nAs part of a participant’s ongoing use of job coaching and support, the provider will develop a fading plan or fading schedule within 6 months of the first day of service delivery. The fading plan or fading schedule will address how use of this service will decrease as the participant’s productivity and independence on the job increases and as unpaid supports through coworkers and other on-the-job resources are developed. Ongoing use of job coaching and support is limited to providing supports for participants not otherwise available through the employer such as support offered through regular supervisory channels, reasonable accommodation required under the Americans with Disabilities Act, available and appropriate natural supports, or on-the-job resources available to employees who do not have a disability.\n\nCareer assessment and job finding or development may be provided at the following levels:\n\n• Basic - The provision of the service at a staff-to-individual ratio of 1:1.\n\nJob coaching and support may be provided at the following levels:\n\n• Basic - The provision of the service at a staff-to-individual ratio range of 1:2.\n\n• Level 1 - The provision of the service at a staff-to-individual ratio of 1:1.\n\nSupported Employment services may not be rendered under the Waiver until it has been verified that:\n\n• The services are not available in the student’s (if applicable) complete and approved Individualized Education Program (IEP) developed pursuant to IDEA;\n\n• OVR has closed the participant’s case or has stopped providing services to the participant;\n\n• The participant is determined ineligible for OVR services; or\n\n• It has been determined that OVR services are not available. If OVR has not made an eligibility determination within 120 days of the referral being sent or a participant has received an offer of CIE prior to OVR making an eligibility determination, then OVR services are considered to not be available to the participant. A participant does not need to be referred to OVR if:\n\n• The participant is competitively employed and solely needs extended supports to maintain the participant’s current job.\n\n• The participant is competitively employed and is seeking job assessment or job finding services to find a new job, unless the purpose is job advancement which can be provided by OVR\n\nWhen OVR is utilizing an order of selection with a wait list for any priority category in effect, participants on the wait list may receive Supported Employment or Advanced Supported Employment through this waiver in accordance with ODP policy.\n\nDocumentation referenced above must be maintained in the file of each participant receiving Supported Employment services.\n\nIt is not allowable for providers of Supported Employment services to also be the employer of the participant to whom they provide Supported Employment services.\n\nBehavioral Support may be provided at the same time as Supported Employment if the need is documented in the service plan.\n\nThe direct portion of Supported Employment may not be provided at the same time as any of the following: In-Home and Community Support; Community Participation Support; 15-minute unit Respite; Small Group Employment; Benefits Counseling; Transportation; Therapies; Education Support; Music, Art and Equine Assisted Therapy and Consultative Nutritional Services. Transportation costs associated with driving the participant to and from activities related to Supported Employment are included in the rate for this service. As such, providers of Supported Employment services are responsible for any needed transportation of the participant to complete Supported Employment activities, with the exception of driving the participant to their place of employment.\n\nCompanion services may be provided at the same time as Supported Employment for the purpose of supporting the participant with non-skilled activities, supervision, and/or incidental personal care that cannot, or would be inappropriate to, be provided with the support from coworkers or other natural supports and is outside the scope of the Supported Employment service. Documentation must be maintained in the service plan about the methods that were considered and/or tried to support the non-skilled activities, supervision, and/or incidental personal care at the job site before it was determined that Companion services were necessary to enable the participant to sustain CIE.\n\nParticipants authorized to receive Supported Employment services may not be authorized to receive Advanced Supported Employment.\n\nSupported Employment services can be delivered in Pennsylvania and in states contiguous to Pennsylvania. The direct portion of this service may be delivered in any state when a participant is traveling out of state for work-related trips such as for training, conferences, or business trips.","url":"","verified":"","notes":"","row":8},{"id":"pa-supported-employment-limits-waiver","state":"PA","title":"Supported Employment - Limits (Waiver)","name":"Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"When Supported Employment services are not provided with any other employment service (Small Group Employment, Advanced Supported Employment or Community Participation Support) and the participant is not competitively employed, the hours of authorized Supported Employment cannot exceed 40 hours (160 15-minute units) per participant per calendar week based on a 52-week year.\n\nWhen Supported Employment services are provided in conjunction with Community Participation Support and/or Small Group Employment the total number of hours for these services (whether utilized alone or in conjunction with one another) cannot exceed 50 hours (200 15-minute units) per participant per calendar week based on a 52-week year.\n\nWhen the participant is competitively employed, the total number of hours for Supported Employment, Community Participation Support and/or Small Group Employment (whether utilized alone or in conjunction with one another) cannot exceed 50 hours (200 15-minute units) per participant per calendar week based on a 52-week year.","url":"","verified":"","notes":"","row":9},{"id":"pa-supported-employment-agency-provider-specifications-waiver","state":"PA","title":"Supported Employment – Agency Provider Specifications (Waiver)","name":"Supported Employment – Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Staff working directly with the participant must have one of the following within 9 months of hire if hired after 1/1/19:\n\n• Hold a Certified Employment Support Professional (CESP) credential from the Association of People Supporting Employment First (APSE); or\n\n• Have been awarded a Basic Employment Services Certificate of Achievement or a Professional Certificate of Achievement in Employment Services from an Association of Community Rehabilitation Educators (ACRE) organizational member that has ACRE-approved training.\n\nNewly hired staff who do not have the required certification when hired must work under the supervision or mentorship of someone who is certified. This can occur no longer than nine months from the date of hire to allow the new staff time to obtain the certification.\n\nAgencies must meet the following standards regardless of provider service location:\n\n1. Have a waiver service location in Pennsylvania or a state contiguous to Pennsylvania.\n\n2. Have a signed ODP Provider Agreement on file with ODP.\n\n3. Complete standard ODP required orientation and training.\n\n4. New providers demonstrate compliance with ODP standards through completion of a self-assessment and validation of required documentation, policies and procedures.\n\n5. Have Commercial General Liability Insurance.\n\n6. Have documentation that all vehicles used in the provision of the Supported Employment have automobile insurance.\n\n7. Have documentation that all vehicles used in the provision of the Supported Employment service have current State motor vehicle registration and inspection.\n\n8. Have Workers' Compensation Insurance in accordance with state law.\n\n9. Ensure that staff (direct, contracted, or in a consulting capacity) have been trained to meet the needs of the participant to carry out the service plan such as with communication, mobility and behavioral needs.\n\n10. Comply with Department standards related to provider qualifications.\n\nStaff working for or contracted with agencies as well as volunteers utilized in providing this service if they will spend any\n\ntime alone with a participant must meet the following standards:\n\n1. Be 18 years of age.\n\n2. Complete necessary pre/in-service training based on the service plan.\n\n3. Have a Pennsylvania State Police criminal history record check prior to the date of hire. If the prospective employee is not a resident of the Commonwealth of Pennsylvania or has not been a resident of the Commonwealth of Pennsylvania for at least two years prior to the date of employment, a Federal Bureau of Investigation criminal history record check must be obtained prior to the date of hire. If a criminal history clearance and/or the criminal history record check identifies a criminal record, providers must make a case-by-case decision about whether to hire the person that includes consideration of the following factors:\n\n•The nature of the crime;\n\n•Facts surrounding the conviction;\n\n•Time elapsed since the conviction;\n\n•The evidence of the individual’s rehabilitation; and\n\n•The nature and requirements of the job.\n\nDocumentation of the review must be maintained for any staff that were hired whose criminal history clearance results or criminal history check identified a criminal record.\n\nHave child abuse clearance (when the participant is under age 18) per 23 Pa. C.S. Chapter 63.\n\nHave a valid driver's license if the operation of a vehicle is necessary to provide Supported Employment services\n\nVerification occurs at least once during a 3-year monitoring cycle and more frequently when deemed necessary by ODP. New providers may be qualified more frequently depending on which monitoring cycle they are assigned to.","url":"","verified":"","notes":"","row":10},{"id":"pa-supported-employment-support-service-professional-provider-s","state":"PA","title":"Supported Employment - Support Service Professional Provider Specifications (Waiver)","name":"Supported Employment - Support Service Professional Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Support Service Professionals must have one of the following within 9 months of hire if hired after 1/1/19:\n\n• Hold a Certified Employment Support Professional (CESP) credential from the Association of People Supporting Employment First (APSE); or\n\n• Have been awarded a Basic Employment Services Certificate of Achievement or a Professional Certificate of Achievement in Employment Services from an Association of Community Rehabilitation Educators (ACRE) organizational member that has ACRE-approved training.\n\nNewly hired Support Service Professionals who do not have the required certification when hired must work under the supervision or mentorship of someone who is certified. This can occur no longer than nine months from the date of hire to allow the new Support Service Professional time to obtain the certification.\n\nSupport Service Professionals must meet the following standards:\n\nBe 18 years of age.\n\nComplete necessary pre/in-service training based on the service plan.\n\nHave a Pennsylvania State Police criminal history record check prior to the date of hire. If the prospective employee is not a resident of the Commonwealth of Pennsylvania or has not been a resident of the Commonwealth of Pennsylvania for at least two years prior to the date of employment, a Federal Bureau of Investigation criminal history record check must be obtained prior to the date of hire. If a criminal history clearance and/or the criminal history record check identifies a criminal record, providers must make a case-by-case decision about whether to hire the person that includes consideration of the following factors: •The nature of the crime; •Facts surrounding the conviction; •Time elapsed since the conviction; •The evidence of the individual’s rehabilitation; and •The nature and requirements of the job.\n\nDocumentation of the review must be maintained for any staff that were hired whose criminal history clearance results or criminal history check identified a criminal record.\n\nHave child abuse clearance (when the participant is under age 18) per 23 Pa. C.S. Chapter 63.\n\nHave documentation that all vehicles used in the provision of the Supported Employment service have automobile insurance.\n\nHave documentation that all vehicles used in the provision of the Supported Employment service have current State motor vehicle registration and inspection.\n\nHave a valid driver's license if the operation of a vehicle is necessary to provide Supported Employment services.\n\nBe trained to meet the needs of the participant to carry out the service plan such as with communication, mobility and behavioral needs.\n\nComply with Department standards related to provider qualifications.\n\nVerifications occurs at least once during a 3-year monitoring cycle and more frequently when deemed necessary by ODP. New providers may be qualified more frequently depending on which monitoring cycle they are assigned to.","url":"","verified":"","notes":"","row":11},{"id":"pa-supported-employment-individual-provider-specifications-waiv","state":"PA","title":"Supported Employment – Individual Provider Specifications (Waiver)","name":"Supported Employment – Individual Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Individuals must have one of the following within 9 months of hire if hired after 1/1/19:\n\n• Hold a Certified Employment Support Professional (CESP) credential from the Association of People Supporting Employment First (APSE); or\n\n• Have been awarded a Basic Employment Services Certificate of Achievement or a Professional Certificate of Achievement in Employment Services from an Association of Community Rehabilitation Educators (ACRE) organizational member that has ACRE-approved training.\n\nNewly hired individuals who do not have the required certification when hired must work under the supervision or mentorship of someone who is certified. This can occur no longer than nine months from the date of hire to allow the new individual time to obtain the certification.\n\nIndividuals must meet the following regardless of provider service location:\n\n1. Have a waiver service location in Pennsylvania or a state contiguous to Pennsylvania.\n\nHave a signed ODP Provider Agreement on file with ODP.\n\nComplete standard ODP required orientation and training.\n\nNew providers demonstrate compliance with ODP standards through completion of a self-assessment and validation of required documentation, policies and procedures.\n\nBe at least 18 years of age.\n\nComplete necessary pre/in-service training based on the service plan.\n\nHave a Pennsylvania State Police criminal history record check prior to the date of hire. If the prospective employee is not a resident of the Commonwealth of Pennsylvania or has not been a resident of the Commonwealth of Pennsylvania for at least two years prior to the date of employment, a Federal Bureau of Investigation criminal history record check must be obtained prior to the date of hire. If a criminal history clearance and/or the criminal history record check identifies a criminal record, providers must make a case-by-case decision about whether to hire the person that includes consideration of the following factors: •The nature of the crime;\n\nFacts surrounding the conviction;\n\nTime elapsed since the conviction;\n\nThe evidence of the individual’s rehabilitation; and\n\nThe nature and requirements of the job. Documentation of the review must be maintained for any staff that were hired whose criminal history clearance results or criminal history check identified a criminal record.\n\nHave child abuse clearance (when the participant is under age 18) per 23 Pa. C.S. Chapter 63.\n\nHave documentation that all vehicles used in the provision of the Supported Employment service have automobile insurance.\n\nHave documentation that all vehicles used in the provision of the Supported Employment service have current State motor vehicle registration and inspection.\n\nHave a valid driver's license if the operation of a vehicle is necessary to provide Supported Employment services.\n\nHave Workers' Compensation Insurance in accordance with state law.\n\nBe trained to meet the needs of the participant to carry out the service plan such as with communication, mobility and behavioral needs.\n\nComply with Department standards related to provider qualification\n\nVerification occurs at least once during a 3-year monitoring cycle and more frequently when deemed necessary by ODP. New providers may be qualified more frequently depending on which monitoring cycle they are assigned to","url":"","verified":"","notes":"","row":12}]},{"code":"RI","name":"Rhode Island","notes":[],"entries":[{"id":"ri-job-exploration-summary-billing-manual","state":"RI","title":"Job Exploration - Summary (Billing Manual)","name":"Job Exploration - Summary","source":"Billing Manual","category":"career","topic":"definition","text":"Job Exploration is a service to support individuals at the start of their employment journey. The intended target for this service are individuals (usually with moderate-significant support needs) who have had minimal (if any) exposure to work. It is meant to assist an individual in making choices about work and identifying their path to employment","url":"","verified":"","notes":"","row":1},{"id":"ri-job-exploration-service-characteristics-billing-manual","state":"RI","title":"Job Exploration - Service Characteristics (Billing Manual)","name":"Job Exploration - Service Characteristics","source":"Billing Manual","category":"career","topic":"definition","text":"This service will engage the individual in exercising choice and determining their preferred conditions of work while developing their interests and identifying a path to employment. Activities that are part of this service include:\n• Assist in determining work tolerance\n• Build or engage in employment exploration through volunteerism (limited opportunities to expand knowledge of opportunities and/or to try out certain skills)\n• Engage in Community and Relationship Mapping\n• Engage in Travel Training\n• Explore technology that can assist in securing or maintaining employment\n• Requires trained staff\nNote: Job Exploration is not part of a pre-employment customized employment process, is not pre-vocational services, and does not need to be provided by a certified employment specialist.","url":"","verified":"","notes":"","row":2},{"id":"ri-job-exploration-included-in-rate-billing-manual","state":"RI","title":"Job Exploration - Included in Rate (Billing Manual)","name":"Job Exploration - Included in Rate","source":"Billing Manual","category":"career","topic":"billing","text":"• Provider program and administrative costs, wages and fringe benefits of the staff who provide the support, supervisory staff when the services are delivered by staff\n• Includes staff mileage reimbursement for participant transportation and travel to service location, missed appointments, training time, and attendance at support coordination meetings","url":"","verified":"","notes":"","row":3},{"id":"ri-discovery-summary-billing-manual","state":"RI","title":"Discovery - Summary (Billing Manual)","name":"Discovery - Summary","source":"Billing Manual","category":"career","topic":"definition","text":"The initial step in a customized approach to employment for someone with significant challenges aimed to better understand the individuals by understanding their strengths, needs, and interests.","url":"","verified":"","notes":"","row":4},{"id":"ri-discovery-service-characteristics-billing-manual","state":"RI","title":"Discovery - Service Characteristics (Billing Manual)","name":"Discovery - Service Characteristics","source":"Billing Manual","category":"career","topic":"definition","text":"• Requires certified staff\n• Qualitative process aimed to better understand individuals by getting to know their strengths (potential contributions to employers), needs (the features that need to be in place for success, i.e. ideal work environment), and interests (providing a direction to the type of work that the individual wants to do)\n• Meant to be a focused process, so there should be an Employment Plan that describes what the focus will entail with detailed goals and objectives and timeframes associated with the task.","url":"","verified":"","notes":"","row":5},{"id":"ri-discovery-included-in-rate-billing-manual","state":"RI","title":"Discovery - Included in Rate (Billing Manual)","name":"Discovery - Included in Rate","source":"Billing Manual","category":"career","topic":"billing","text":"• Wages and fringe benefits of the staff who provide the support and their Supervisors\n• Transportation costs incurred by the Job Developer to fulfill job duties\n• Provider administrative costs\n• Includes staff mileage reimbursement for participant transportation and travel to service location, missed appointments, training time, reporting time, and attendance at support coordination meetings","url":"","verified":"","notes":"","row":6},{"id":"ri-job-development-summary-billing-manual","state":"RI","title":"Job Development - Summary (Billing Manual)","name":"Job Development - Summary","source":"Billing Manual","category":"employment","topic":"definition","text":"Activities to assist individuals in securing employment consistent with their vocational goals.","url":"","verified":"","notes":"","row":7},{"id":"ri-job-development-service-characteristics-billing-manual","state":"RI","title":"Job Development - Service Characteristics (Billing Manual)","name":"Job Development - Service Characteristics","source":"Billing Manual","category":"employment","topic":"definition","text":"Requires certified staff\n• Activities to assist individuals in securing employment consistent with their vocational goals, including:\no Job search and matching\no Coordination of opportunities on behalf of an individual (such as contacting potential employers)\no Assistance with obtaining a job (such as helping with resumes or planning for \tinterviews)\no Detailed in an Employment Plan","url":"","verified":"","notes":"","row":8},{"id":"ri-job-development-included-in-rate-billing-manual","state":"RI","title":"Job Development - Included in Rate (Billing Manual)","name":"Job Development - Included in Rate","source":"Billing Manual","category":"employment","topic":"billing","text":"Wages and fringe benefits of the certified staff who provide the support\n• Transportation costs incurred by the Job Developer to fulfill job duties\n• Provider administrative costs (i.e. services on behalf of job seeker)","url":"","verified":"","notes":"","row":9},{"id":"ri-job-coaching-summary-billing-manual","state":"RI","title":"Job Coaching - Summary (Billing Manual)","name":"Job Coaching - Summary","source":"Billing Manual","category":"employment","topic":"definition","text":"Support and structured training for individuals to learn job tasks and adjust to their new role, including learning interpersonal skills necessary to be successful as an employee.","url":"","verified":"","notes":"","row":10},{"id":"ri-job-coaching-service-characteristics-billing-manual","state":"RI","title":"Job Coaching - Service Characteristics (Billing Manual)","name":"Job Coaching - Service Characteristics","source":"Billing Manual","category":"employment","topic":"definition","text":"• Job analysis to identify the job duties, followed by developing specifics and detailing them in the supported employment plan as to how they can best train the employee to work more and more on his/her own until completely self-sufficient and able to perform job duties accurately and effectively without assistance.\n• Identifying natural supports or other assistance such as technology to support the individual to be as independent as possible.\n• Job coaching occurs on the job during the individual’s shift\n• Requires certified staff","url":"","verified":"","notes":"","row":11},{"id":"ri-job-coaching-included-in-rate-billing-manual","state":"RI","title":"Job Coaching - Included in Rate (Billing Manual)","name":"Job Coaching - Included in Rate","source":"Billing Manual","category":"employment","topic":"billing","text":"• Wages and fringe benefits of the Supervisory staff, and certified job coaches that provide support\n• Includes training, attendance at Support Coordination meetings, travel time between individuals being supported, record-keeping/reporting, and supervision\n• Provider program and administrative costs","url":"","verified":"","notes":"","row":12},{"id":"ri-job-coaching-service-rates-notes-billing-manual","state":"RI","title":"Job Coaching - Service Rates Notes (Billing Manual)","name":"Job Coaching - Service Rates Notes","source":"Billing Manual","category":"employment","topic":"billing","text":"• The job coach must be present at the place of employment to bill for this service; service is delivered face-to-face on the job with individual and job coach\n• When provided at work site in which persons without disabilities are employees, payment will be made only for the adaptations, supervision, and training required by individuals receiving waiver services because of their disabilities and will not include payment for the supervisory activities rendered as a normal part of the business\n• Cannot be provided or reimbursed at the same time as Job Retention or Group Supported Employment\n• Job coaching cannot be billed while providing transportation or at any time other than during the individual’s shift\n• To access the annual rates, visit the BHDDH website under the “Forms, Policies, and Brochures” tab (Financial Resources: Rate Table).","url":"","verified":"","notes":"","row":13},{"id":"ri-job-retention-summary-billing-manual","state":"RI","title":"Job Retention - Summary (Billing Manual)","name":"Job Retention - Summary","source":"Billing Manual","category":"employment","topic":"definition","text":"An employment outcome and support service necessary for a person to maintain or  advance in employment consistent with the person’s strengths, abilities, capabilities, and interests.","url":"","verified":"","notes":"","row":14},{"id":"ri-job-retention-service-characteristics-billing-manual","state":"RI","title":"Job Retention - Service Characteristics (Billing Manual)","name":"Job Retention - Service Characteristics","source":"Billing Manual","category":"employment","topic":"definition","text":"• Includes supports necessary to maintain or advance in employment, including communication with the individual and his/her supervisor to ensure job satisfaction and/or promoting employment enhancement\n• Includes short-term or intermittent job coaching in response to a change in job duties or in how a job is to be done\n• Requires certified staff","url":"","verified":"","notes":"","row":15},{"id":"ri-job-retention-included-in-rate","state":"RI","title":"Job Retention - Included in Rate","name":"Job Retention - Included in Rate","source":"","category":"employment","topic":"billing","text":"• Wages and fringe benefits of the certified staff who provide job retention support.\n• Wages and fringe benefits of the Job Coaches that provide support at the individual’s job site.\n• Wages and fringe benefits of all staff that provide supports where they are not face-to-face with individuals, such as travel time to and from appointments, missed appointments, training and attendance at Support Coordination meetings.\n• Support Coordination activities.\n• Mileage reimbursement to staff while performing job duties.\n• Provider program costs and provider administrative costs.","url":"","verified":"","notes":"","row":16},{"id":"ri-job-retention-service-rate-notes-billing-manual","state":"RI","title":"Job Retention-Service Rate Notes (Billing Manual)","name":"Job Retention-Service Rate Notes","source":"Billing Manual","category":"employment","topic":"billing","text":"• If the individual should secure additional job responsibilities or require increased job coaching support, the provider should cease billing job retention and bill job coaching\n• Retention cannot be billed at the same time as Job Coaching or Group Supported  Employment\n• To access the annual rates, visit the BHDDH website under the “Forms, Policies, and Brochures” tab (Financial Resources: Rate Table)","url":"","verified":"","notes":"","row":17},{"id":"ri-personal-support-in-the-workplace-summary-billing-manual","state":"RI","title":"Personal Support in the Workplace - Summary (Billing Manual)","name":"Personal Support in the Workplace - Summary","source":"Billing Manual","category":"employment","topic":"definition","text":"A range of personal care and supports during paid competitive community employment hours to enable individuals to be successful in a work environment. The service is available for individuals who do not need job related support but do need assistance with activities of daily living at the job site","url":"","verified":"","notes":"","row":18},{"id":"ri-personal-support-in-the-workplace-service-characteristics-bi","state":"RI","title":"Personal Support in the Workplace - Service Characteristics (Billing Manual)","name":"Personal Support in the Workplace - Service Characteristics","source":"Billing Manual","category":"employment","topic":"definition","text":"• A range of personal care and supports during paid competitive community employment hours to enable individuals to be successful in a work environment\n\n• The service is available for individuals who do not need job related support, but do need assistance with activities of daily living (ADLs) (eating, personal hygiene, etc.) at the job site or require 1:1 eyes-on (court orders)","url":"","verified":"","notes":"","row":19},{"id":"ri-personal-support-in-the-workplace-included-in-rate-billing-m","state":"RI","title":"Personal Support in the Workplace - Included in Rate (Billing Manual)","name":"Personal Support in the Workplace - Included in Rate","source":"Billing Manual","category":"employment","topic":"billing","text":"• Wages and fringe benefits of the DSP that provide the support, Supervisory staff when the services are delivered by DSPs\n▪ Includes DSP mileage reimbursement for participant transportation and travel to service location, training time, and attendance at support coordination meetings\n• Provider program and administrative costs","url":"","verified":"","notes":"","row":20},{"id":"ri-group-supported-empoyment-summary-billing-manual","state":"RI","title":"Group Supported Empoyment - Summary (Billing Manual)","name":"Group Supported Empoyment - Summary","source":"Billing Manual","category":"employment","topic":"definition","text":"Shared supports and structured training for individuals to find employment, learn job  tasks and adjust to their new role, including learning interpersonal skills necessary to be  successful as an employee.","url":"","verified":"","notes":"","row":21},{"id":"ri-group-supported-empoyment-service-characteristics-billing-ma","state":"RI","title":"Group Supported Empoyment - Service Characteristics (Billing Manual)","name":"Group Supported Empoyment - Service Characteristics","source":"Billing Manual","category":"employment","topic":"definition","text":"• Billing will continue to be based on the staffing ratio for groups\n• Job coaching occurs on the job during the shift supporting more than one individual\n• Requires certified staff","url":"","verified":"","notes":"","row":22},{"id":"ri-group-supported-empoyment-included-in-rate-billing-manual","state":"RI","title":"Group Supported Empoyment - Included in Rate (Billing Manual)","name":"Group Supported Empoyment - Included in Rate","source":"Billing Manual","category":"employment","topic":"billing","text":"• Wages and fringe benefits of the Supervisory staff and certified job coaches who provide support\n• Includes training, attendance at Support Coordination meetings, travel time between idividuals being supported, record-keeping/reporting, and supervision\n• Provider program and administrative costs","url":"","verified":"","notes":"","row":23},{"id":"ri-group-supported-empoyment-service-rates-notes-billing-manual","state":"RI","title":"Group Supported Empoyment - Service Rates Notes (Billing Manual)","name":"Group Supported Empoyment - Service Rates Notes","source":"Billing Manual","category":"employment","topic":"billing","text":"• The job developer/coach must be present at the place of employment to bill for this service; service is delivered face-to-face on the job with individuals\n• When provided at work site in which persons without disabilities are employees,  payment will be made only for the adaptations, supervision, and training required by individuals receiving waiver services because of their disabilities and will not include payment for the supervisory activities rendered as a normal part of the business\n• Cannot be provided or reimbursed for the same hours on the same day as Job Coaching or Job Retention\n• To access the annual rates, visit the BHDDH website under the “Forms, Policies, and Brochures” tab (Financial Resources: Rate Table).","url":"","verified":"","notes":"","row":24}]},{"code":"SC","name":"South Carolina","notes":[],"entries":[{"id":"sc-career-preparation-services-waiver","state":"SC","title":"Career Preparation Services (Waiver)","name":"Career Preparation Services","source":"Waiver","category":"career","topic":"definition","text":"Career Preparation Services are time-limited and aimed at preparing individuals for competitive employment. These services can include experiences and exposure to careers and teach such concepts as attendance, task completion, problem solving, interpersonal relations and safety as outlined in the individual's person-centered plan. Services are designed to create a path to integrated community-based employment for which an individual is compensated at or above minimum wage. On site attendance at the licensed facility is not required to receive services that originate from the facility. The cost for transportation is included in the rate paid to the provider.\n\nProviders are permitted to employ enabling technologies to assist with optimizing independence and autonomy, while maintaining health and safety. Use of these technologies is in preparation for eventually leveraging them in competitive, integrated employment settings. These technologies (e.g., smartphone/tablet applications, wearable smart devices, communication systems) are not disability specific, but rather are technologies leveraged by people with and without disabilities. Training on their use enables waiver participants to work as independently as possible.\n\nTransportation will be provided from the individual’s residence to the habilitation site when the service start time is before 12:00 Noon. Transportation will be available from the individual’s habilitation site to their residence when the service start time is after 12:00 Noon.","url":"","verified":"","notes":"","row":1},{"id":"sc-career-preparation-services-provider-specifications-waiver","state":"SC","title":"Career Preparation Services – Provider Specifications (Waiver)","name":"Career Preparation Services – Provider Specifications","source":"Waiver","category":"career","topic":"provider","text":"OIDD Career Preparation Standards\n\nVerification occurs initially; Annually; OIDD QIO Reviews are conducted on a 24 month cycle depending on past provider performance.","url":"","verified":"","notes":"","row":2},{"id":"sc-supported-employment-waiver","state":"SC","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Employment Services (Individual) are the ongoing supports to individuals who, because of their disabilities, need intensive on-going support to obtain and maintain an individual job in competitive or customized employment, or self-employment, in an integrated work setting in the general workforce for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nTransportation is not included as part of the service or the rate paid for individual job placement.\n\nEmployment - Group are the on-going supports to individuals who, because of their disabilities, need intensive ongoing support to obtain and maintain an individual job in competitive or customized employment, or self-employment, in an integrated work setting in the general workforce for which an individual is compensated at or above minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Employment Services – Gro
