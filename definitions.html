ications","source":"Waiver","category":"employment","topic":"provider","text":"Certification as DDS CES Waiver provider or Community Systems Support Provider (CSSP) by DHS is required\n\nMust be:\n\n(1) Credentialed by the PASSE to provide HCBS services to persons with Developmental Disabilities and Behavioral Health Diagnoses.\n\n(2) Permitted by the PASSE to perform these services.\n\n(3) Cannot be on the National or State Excluded Provider List.\n\nIndividuals who perform supported employment services for the PASSE must pass a drug screen, a criminal background check, a child maltreatment registry check, and an adult maltreatment registry checks, and\n\n1. Have a high school diploma, GED or equivalent, and\n\n2. Have at least one year of experience working with persons with developmental disabilities of behavioral health support needs, or complete a session on incident reporting, abuse and neglect identification and reporting, overall training on IDD diagnosis, as well as client specific training on diagnosis and behavioral support needs\n\n3. Be certified to perform CPR and First Aid\n\nEntity responsible for verification: PASSE\n\nFrequency of verification: Annually, Proof of credentialing must be submitted to DMS.","url":"","verified":"","notes":"","row":4}]},{"code":"CA","name":"California","notes":[],"entries":[{"id":"ca-supported-employment-se-code","state":"CA","title":"Supported Employment (SE Code)","name":"Supported Employment","source":"SE Code","category":"employment","topic":"definition","text":"Supported Employment Program services consist of any combination of the allowable supports identified in the IPP and specified in the IHSP for a consumer as necessary to enable that consumer to perform integrated work for pay through a supported employment placement.\n\nAllowable supported employment services may include any of the following:\n-Job development, as indicated in the IPP and the IHSP, and authorized by the regional center;\n-Program staff time for conducting job analysis of supported employment opportunities for a specific consumer;\n-Program staff time for the direct supervision or training of a consumer or consumers while they engage in integrated work unless other arrangements for consumer supervision, including, but not limited to, employer supervision reimbursed by the supported employment program, are approved by the regional center;\n-Community-based training in adaptive functional and social skills necessary to ensure job adjustment and retention;\n-Counseling with a consumer and or his or her family member or authorized representative to ensure support of a consumer in job adjustment;\n-Advocacy or intervention on behalf of a consumer to resolve problems affecting the consumer's work adjustment or retention;\n-Ongoing support services needed to ensure the consumer's retention of the job.\n-Services and supports following a job loss;\n\nJob coach travel time for individual placement is billable as follows:\n-Job coach travel time from the vendor's headquarters to the first consumer's work site is billable to the first consumer.\n-The job coach travel time from the first consumer's worksite to the second consumer's worksite is billable to the second consumer.\n-Job coach travel time for all subsequent consumers is billed in the same fashion until the job coach arrives at the last consumer's worksite. Travel from last consumer's worksite back to the vendor's headquarters is not billable.","url":"","verified":"","notes":"","row":1},{"id":"ca-group-services-se-code","state":"CA","title":"Group Services - (SE Code)","name":"Group Services -","source":"SE Code","category":"employment","topic":"definition","text":"Group services shall be limited to:\n\n-Job coaching provided at the worksite;\n\n-Employment placements at a job coach-to-consumer ratio of not less than one-to-four nor more than one-to-eight except for those groups that may be authorized by the passage of the Trailer Bill to the Budget Act Fiscal Year 2004-05 to grand-father specific groups at a one-to-three consumer to job coach ratio:\nServices to a minimum of four consumers are funded by the regional center or the Department of Rehabilitation, and\nConsumers unable to participate due to illness or injury for a period not exceeding six (6) months are replaced by other consumers temporarily, for the purpose of maintaining the program's minimum coach-to-consumer ratio.\nA newly approved group begins with a minimum of three (3) consumers and increased to four (4) within ninety (90) days of starting.","url":"","verified":"","notes":"","row":2},{"id":"ca-individualized-services-se-code","state":"CA","title":"Individualized Services - (SE Code)","name":"Individualized Services -","source":"SE Code","category":"employment","topic":"definition","text":"May be provided on or off the jobsite\n\nShall consist of job coaching and other supported employment services for regional center-funded consumers in a supported employment placement at a job coach-to-consumer ratio of one-to-one;\n\nShall decrease over time until stabilization in the employment is achieved.","url":"","verified":"","notes":"","row":3},{"id":"ca-prevocational-services-waiver","state":"CA","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational services are services that are delivered for the purpose of furthering habilitation goals of learning and work experience through a habilitation service plan required by 17 CCR § 58812 to outline a specific path tocompetitive, integrated employment in the community. The service plan is to be reviewed not less than annually ormore frequently if requested by the individual.\n\nServices are intended to develop and teach general skills that lead to competitive and integrated employment including: ability to communicate effectively with supervisors, co-workers and customers; generally accepted community work place conduct and dress; ability to follow directions; ability to attend to asks; work place problem solving skills and strategies; general work place safety and mobility training. Additionally, both work adjustment and supportive habilitation services as defined in Title 17 CCR § 58820 (c)(2), should allow for the development of productive skills, physical and psychomotor skills, interpersonal and communicative skills, health and hygiene maintenance, personal safety practices, self-advocacy training, and other skills aimed at maintaining a job and as outlined in the individual’s person-centered services and supports plan. Individuals may be compensated based upon their performance and upon prevailing wage. However, compensation is not the sole purpose of participation in this service.\n\nPrevocational services are designed to prepare individuals in non-job-task-specific strengths and skills that contribute towards obtaining a competitive and integrated employment, as opposed to vocational services whose sole purpose is to provide employment without habilitation goals geared towards skill building.\n\nTransportation services are not included under Prevocational Services.\n\nThe reimbursement for Prevocational Services, (except for services provided to individuals working through an internship), includes incentive payments for measurable milestones identified below:\n\n1. A one-time payment made to a provider when an individual obtains competitive integrated employment and is still employed after 30 consecutive days.\n\n2. An additional one-time payment made to a provider when an individual obtains competitive integrated employment and is still employed after six consecutive months.\n\n3. An additional one-time payment made to a provider when an individual has been employed consecutively for one year.\n\n4. After a provider assists four individuals to achieve CIE placement, an additional payment is made to provider for each consumer thereafter who obtains competitive integrated employment and is still employed:\n\na. after 30 consecutive days\n\nb. after six consecutive months.\n\nOnly a single provider may receive an incentive payment for supporting an individual into a specific CIE placement.\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment; or payments that are passed through to users of supported employment services.\n\no The above-described services are not available under a program funded under section 110 of the Rehabilitation Act of 1973 (29 USC Section 730) or section 602(16) and (17) of the Individuals with Disabilities Education Act (20U.S.C. 1401 (16 and 17)).","url":"","verified":"","notes":"","row":4},{"id":"ca-prevoc-provider-specifications-supported-employment-programs","state":"CA","title":"Prevoc Provider Specifications – Supported Employment Programs (Waiver)","name":"Prevoc Provider Specifications – Supported Employment Programs","source":"Waiver","category":"prevoc","topic":"provider","text":"No state licensing category.\n\nFederal/State Tax Exempt Letter.\n\nAs appropriate, a business license as required by the local jurisdiction where the business is located.\n\nPrograms must initially meet the Department of Rehabilitation Program certification standards and be accredited by CARF within four years of providing services pursuant to Title 17 § 58810(f)(1)(2).\n\nRegional centers, through the vendorization process, verify providers meet requirements/qualifications outlined in Title 17, CCR, § 54310 including the following, as applicable: any license, credential, registration, certificate, permit, or academic degree required for the performance or operation of the service; the staff qualifications and duty statements; and service design.\n\nCommission on Accreditation of Rehabilitation Facilities (CARF). CARF communicates with DDS on all CARF accreditation renewals in process. The information is shared with regional centers as needed.\n\nVerified upon application for vendorization and biennially thereafter. Within four years at start-up; every one to three years thereafter.","url":"","verified":"","notes":"","row":5},{"id":"ca-prevoc-provider-specifications-work-activity-programs-waiver","state":"CA","title":"Prevoc Provider Specifications – Work Activity Programs (Waiver)","name":"Prevoc Provider Specifications – Work Activity Programs","source":"Waiver","category":"prevoc","topic":"provider","text":"Licensed facility by the Department of Social Services pursuant to the Health and Safety Code §§ 1500- 1567.87\n\nIf applicable Federal/State Tax Exempt Letter.\n\nAs appropriate, a business license as required by the local jurisdiction where the business is located\n\nPrograms must initially meet the Department of Rehabilitation Program certification standards and be accredited by CARF within four years of providing services per Welfare and Institutions Code § 4851\n\nRegional centers, through the vendorization process, verify providers meet requirements/qualifications outlined in Title 17, CCR, § 54310 including the following, as applicable: any license, credential, registration, certificate, permit, or academic degree required for the performance or operation of the service; the staff qualifications and duty statements; and service design.\n\nCommission on Accreditation of Rehabilitation Facilities (CARF). CARF communicates with DDS on all CARF accreditation renewals in process. The information is shared with regional centers as needed\n\nVerified upon application for vendorization and biennially thereafter.\n\nWithin four years at start-up; every one to three years thereafter.","url":"","verified":"","notes":"","row":6}]},{"code":"CO","name":"Colorado","notes":[],"entries":[{"id":"co-prevocational-services-waiver","state":"CO","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational Services prepare a participant for paid community employment. Services include teaching such concepts as following directions, attendance, task completion, problem solving, and safety that are associated with performing compensated work. Services are identified in the participant's Service Plan and are directed to be habilitative rather than explicitly for employment objectives. Services are provided in a variety of locations separate from the participant's private residence or other residential living arrangement. Participants are compensated in accordance with applicable federal laws and regulations. Prevocational services can be differentiated from\n\nSupported Employment services by using the following criteria:\n\n1) Compensation is paid at less than 50 percent of the minimum wage (agencies that pay less than minimum wage shall ensure compliance with department of labor section 14(c) regulations); and\n\n2) Goals for prevocational services are general in nature and are not primarily directed at teaching job specific skills.\n\nThe intended outcome of prevocational services is to obtain paid or unpaid community employment within five years. Prevocational services may continue longer than five years when documentation in the annual service plan demonstrates this need and the need is based on an annual assessment.\n\nParticipants who receive prevocational services may also receive Supported Employment and/or Day Habilitation Services. A participant's Service Plan may include two or more types of day services (i.e. Day Habilitation Services and Supports, Supported Employment or Prevocational Services), however different types of day services may not be billed during the same period of the day.\n\nDocumentation is maintained in the file of each participant receiving this service that the service is not available under a program funded under Section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C 1401 et seq.).]","url":"","verified":"","notes":"","row":1},{"id":"co-prevocational-services-duration-waiver","state":"CO","title":"Prevocational Services - Duration (Waiver)","name":"Prevocational Services - Duration","source":"Waiver","category":"prevoc","topic":"limits","text":"The number of units available for Day Habilitation Services in combination with Prevocational Services is 4800 units. When used in combination with Supported Employment Services, the total number of units available for Day Habilitation Services in combination with Prevocational Services will remain at 4800 units and the cumulative total, including Supported Employment Services, may not exceed 7112.\n\nIn the event the Day Habilitation Services and Supports (DHSS) and Prevocational Services limit of 4800 units per Service Plan year is insufficient to meet a participant's needs, the safety net of Residential Habilitation Services and Supports (RHSS) is available to participants 24-hours a day, seven days a week","url":"","verified":"","notes":"","row":2},{"id":"co-prevocational-services-community-centered-board-ccb-organize","state":"CO","title":"Prevocational Services - Community Centered Board (CCB)/Organized Health Care Delivery System (OHCDS (Waiver)","name":"Prevocational Services - Community Centered Board (CCB)/Organized Health Care Delivery System (OHCDS","source":"Waiver","category":"prevoc","topic":"activities","text":"Rules: 10 CCR 2505-10 § 8.500.5\n\nProgram Management: Baccalaureate or higher degree from an accredited college or university in the area of Vocational Rehabilitation, Education, Social Work, Psychology, or related field, and one year of successful experience in human services; or an Associates Degree from an accredited college and two years of successful experience in human services; or four years successful experience in human services.\n\nDirect Care Staff: Be at least 18 years of age, have the ability to communicate effectively, complete required forms and reports, and follow verbal and written instructions. Have the ability to provide services in accordance with a Service Plan. Have completed minimum training based on State training guidelines. Have necessary ability to perform the required job tasks and have the interpersonal skills needed to effectively interact with persons with developmental disabilities\n\nVerification of provider qualification is completed upon initial Medicaid enrollment and every five years through provider revalidation","url":"","verified":"","notes":"","row":3},{"id":"co-supported-employment-waiver","state":"CO","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment services consists of intensive, ongoing supports that enable participants, for whom competitive employment at or above the minimum wage is unlikely absent the provision of supports, and who, because of their disabilities, need supports, to perform in a regular work setting. Supported employment is conducted in a variety of settings in which participants interact with non-disabled individuals (other than those individuals who are providing services to the participant) to the same extent that individuals employed in comparable positions would interact. Participants must be involved in work outside of a base site. Included are participants who work in\n\ncommunity jobs, in enclaves, and on mobile crews. Group employment (e.g. mobile crews and enclaves) shall not exceed eight persons.\n\nJob Development services focus on assessment and identification of vocational interests and capabilities in preparation for job development as well as assisting the participant to locate a job or job development on behalf of the participant.\n\nJob Coaching services focus on activities needed to sustain paid work by participants, including supervision and training. When supported employment services are provided at a work site where persons without disabilities are employed, payment is made only for the adaptations, supervision and training required by participants receiving waiver services as a result of their disabilities. This does not include payment for the supervisory activities rendered as a normal part of the business setting.\n\nJob Placement services may be used to purchase items that a participant needs to obtain and/or sustain employment that are not otherwise the responsibility of the employer to provide under the Americans with Disabilities Act of 1990.\n\nParticipants are required to apply for services through the Division for Vocational Rehabilitation. Supported employment does not take the place of nor is it duplicative of services received through the Division for Vocational Rehabilitation. Documentation is maintained in the file of each participant receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.).\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as incentive payments made to an employer to encourage or subsidize the employer's participation in a supported employment program; payments that are passed through to users of supported employment programs; or payments for training that are not directly related to an individual's supported employment program\n\nThe number of units available for Supported Employment is 7,112 units. The unit limit for Day Habilitation Services and Supports and Prevocational Services is 4800. When these services are used in combination with Supported Employment, the cumulative total cannot exceed 7,112 units. This number of units is the equivalent of 1,778 hours of service per year or on average 7 hours a day for 254 service days.","url":"","verified":"","notes":"","row":4},{"id":"co-supported-employment-provider-specifications-community-cente","state":"CO","title":"Supported Employment Provider Specifications - Community Centered Board (CCB)/ Organized Health Care Delivery System (OHCDS) (Waiver)","name":"Supported Employment Provider Specifications - Community Centered Board (CCB)/ Organized Health Care Delivery System (OHCDS)","source":"Waiver","category":"employment","topic":"activities","text":"Rules: 10 CCR 2505-10 § 8.500.5\n\nSupported Employment Agency Program Management: Baccalaureate or higher degree from an accredited college or university in the area of Vocational Rehabilitation, Education, Social Work, Psychology or related field and one year of successful experience in employment counseling, job placement, job coaching, or vocational rehabilitation; or, an Associates Degree from an accredited college, and four years of successful experience in employment counseling, job placement, job coaching or vocational rehabilitation.\n\nIn addition to the requirements listed above, if an agency also provides Individual Job Development and/or Job Coaching, a nationally recognized certification, approved by the Department, must be maintained.\n\nGroup Job Developer/ Job Coach: Be at least 18 years of age, have the ability to communicate effectively, complete required forms and reports, and follow verbal and written instructions. Have the ability to provide services in accordance with a Service Plan. Have completed minimum training based on State training guidelines. Have necessary ability to perform the required job tasks and have the interpersonal skills needed to effectively interact with persons with developmental disabilities.\n\nIndividual Job Developer/Job Coach: In addition to the requirements listed above, a nationally recognized certification, approved by the Department, must be maintained.\n\nVerification of provider qualification is completed upon initial Medicaid enrollment and every five years through provider revalidation, as well as through the DPHE survey process initially and every three years","url":"","verified":"","notes":"","row":5},{"id":"co-supported-employment-provider-specifications-program-approve","state":"CO","title":"Supported Employment Provider Specifications - Program Approved Service Agency (Waiver)","name":"Supported Employment Provider Specifications - Program Approved Service Agency","source":"Waiver","category":"employment","topic":"provider","text":"Rules: 10 CCR 2505-10 § 8.500.5\n\nSupported Employment Agency Program Management: Baccalaureate or higher degree from an accredited college or university in the area of Vocational Rehabilitation, Education, Social Work, Psychology, or related field, and one year of successful experience in employment counseling, job placement, job coaching, or vocational rehabilitation; or, an Associates Degree from an accredited college, and four years of successful experience in employment counseling, job placement, job coaching, or vocational rehabilitation.\n\nIn addition to the requirements listed above, if an agency also provides Individual Job Development and/or Job Coaching, a nationally recognized certification, approved by the Department, must be maintained.\n\nGroup Job Developer/ Job Coach: Be at least 18 years of age, have the ability to communicate effectively, complete required forms and reports, and follow verbal and written instructions. Have the ability to provide services in accordance with a Service Plan. Have completed minimum training based on State training guidelines. Have necessary ability to perform the required job tasks and have the interpersonal skills needed to effectively interact with persons with developmental disabilities\n\nIndividual Job Developer/Job Coach: In addition to the requirements listed above, a nationally recognized certification, approved by the Department, must be maintained.\n\nVerification of provider qualification is completed upon initial Medicaid enrollment and every five years through provider revalidation, as well as through the DPHE survey process initially and every three years","url":"","verified":"","notes":"","row":6},{"id":"co-supported-employment-transportation-waiver","state":"CO","title":"Supported Employment - Transportation (Waiver)","name":"Supported Employment - Transportation","source":"Waiver","category":"employment","topic":"definition","text":"Service offered in order to enable waiver participants to gain access to Day Habilitation and Supported Employment services as specified by the Service Plan that are not related to medical interventions as covered in the State Plan.\n\nTransportation to and from work is a benefit in conjunction with Supported Employment service except when the Supported Employment service occurs at a frequency less than the number of days worked. In that case, transportation to and from the place of employment is a benefit when the participant does not have resources available, including personal funds, natural supports, and/or third party resources. This service is offered in addition to medical transportation required under 42 CFR §431.53 and transportation services under the State plan, defined at 42 CFR §440.170(a) (if applicable), and does not replace them. Transportation services under the waiver are offered in accordance with the participant's Service Plan. Whenever possible, family, neighbors, friends, or community agencies that can provide this service without charge are utilized.\n\nTransportation to and from day program shall be reimbursed based on the applicable transportation band. The number of units available for Transportation Services is 508 units per Service Plan year or approximately 42 trips per month. A unit is a per-trip charge for to and from Day Habilitation and Supported Employment programs.","url":"","verified":"","notes":"","row":7},{"id":"co-group-employment-settings-operational-memo","state":"CO","title":"Group Employment - Settings (Operational Memo)","name":"Group Employment - Settings","source":"Operational Memo","category":"employment","topic":"activities","text":"When evaluating the Supported Employment services a Member may need, the setting and conditions of the job should be considered. Job Coaching - Group is the most appropriate service if the employment setting meets the definition below.\n\nThe Department of Health Care Policy and Financing (HCPF) defines a group employment setting as a workplace where two or more Members are being supported in the same type of job, during the same timeframe, at the same site; additionally, if the structure of the employment arrangement meets any of the following characteristics:\n\nEmployer of Record - The provider agency, or one of its subsidiaries, that provides the Supported Employment services is also the Employer of Record.\n\nFor example, the provider agency also acts as the employer for the Member; and is responsible for managing the work schedule, issuing the paycheck, etc.\n\nSupervision Responsibilities – The provider agency employs the job supervisor who also provides the Supported Employment services.\n\nHiring process – The provider agency is the entity that controls the hiring and firing of the Member and provides the Supported Employment services.\n\nPurpose of the Business – A central purpose of the business’s creation was to offer jobs to multiple individuals with disabilities.\n\nPhysical Location—The location of the job is owned or controlled by the same provider agency that provides the Support Employment services.","url":"","verified":"","notes":"","row":8},{"id":"co-group-employment-supervision-operational-memo","state":"CO","title":"Group Employment - Supervision (Operational Memo)","name":"Group Employment - Supervision","source":"Operational Memo","category":"employment","topic":"definition","text":"In adherence to Colorado Revised Statute (CCR) 25.5-6-413, HCPF has developed and implemented Workplace Assistance, which provides work-related support for Members with elevated supervision needs who, because of a valid safety concern, may need assistance from a paid caregiver beyond what could be regularly supported by the workplace supervisor, co-workers, or a job coach. Historically, Job Coaching –Individual was allowed in group employment settings for Members needing elevated levels of support due to there not being an alternative service option. However, now that Workplace Assistance has been implemented, HCBS Supported Employment provider agencies will need to shift from this practice to utilizing Workplace Assistance to support members with elevated supervision needs, as defined in 10 CCR 2505-10 8.7555.\n\nJob Coaching - Individual is no longer the appropriate service in a group employment setting. If a Member is working in a group employment setting, and that Member has supervision needs that are beyond what can be addressed by group staffing arrangements, the Case Manager should consider whether the situation meets the criteria for Workplace Assistance. If the Member’s safety needs in that job meet the criteria, Workplace Assistance may be authorized for that Member rather than Job Coaching – Group.","url":"","verified":"","notes":"","row":9}]},{"code":"CT","name":"Connecticut","notes":[],"entries":[{"id":"ct-individual-supported-employment","state":"CT","title":"Individual Supported Employment","name":"Individual Supported Employment","source":"","category":"employment","topic":"definition","text":"What is it: A service to assist individuals to obtain, maintain and retain Competitive Integrated Employment (CIE)\n\nWhat is the goal & approach: Competitive Integrate Employment (CIE); Find an existing job for the individual\n\nWho should use it: Any DDS eligible individual interested in competitive integrated employment regardless of their current service type\n\nWhat is the funding source: Non-annualized through 1X incentives, Individual budget for long term support\n\nCertification needed: No\n\nWhat are the different components:\n1.Career Plan (up to 10hrs.) Explores an individual’s work preferences, develop interview skills, and learn about other employment opportunities while continuing their current program.\n2.Working Interview Funds to pay an individual while working in a position that has a strong likelihood of leading to a job offer. Staff hours are funded, too.\n3.Intensive Job Placement and Training Additional hours of job training and support to promote a successful transition to employment","url":"","verified":"","notes":"","row":1},{"id":"ct-employment-first-statement","state":"CT","title":"Employment First - Statement","name":"Employment First - Statement","source":"","category":"general","topic":"definition","text":"The Department of Developmental Services (DDS) is an Employment First agency with a goal of increasing opportunities for people with disabilities based on their skills and interests to find and retain employment in the general workforce that is equivalent to Competitive Integrated Employment (“CIE”). The general workforce includes typical jobs available to all job seekers:\n\n• In typical work settings including self-employment\n\n• Working side-by-side with people of all abilities\n\n• Earning industry-standard wages and benefits\n\n• Contributing to the labor force of society","url":"","verified":"","notes":"","row":1},{"id":"ct-customized-employment","state":"CT","title":"Customized Employment","name":"Customized Employment","source":"","category":"employment","topic":"definition","text":"What is is: An alternative method of finding CIE for individuals with most significant disabilities who have not been successful in obtaining CIE through traditional employment service models. Focuses on the strengths, skills and abilities of the individuals and the unmet needs of employers. Highly structured, person-centered process, carried out over time in 3 phase\n\nWhat is the goal & approach: Competitive Integrated Employment (CIE); Negotiate or carve out a customized job for the individual\n\nWho should use it: CE is a good strategy for those who need more creative support than typical individualized or group models and who may need more intensive discovery strategies for career/job direction. CE is effective for individuals with complexities that make it difficult to utilize traditional job search strategies.\n\nWhat is the funding source: Non annualized funds; individual budget for long term supports\n\nCertification needed: Yes, staff must have CE Certification\n\nWhat are the different components:\n1.Job Discovery (up to 40hrs.) - comprehensive Job seeker and CE Certified Staff work to gain a more in-depth understanding of the job seeker’s interests, likes, dislikes, strengths, skills, and abilities. Team approach includes family, friends, and significant individuals to job seeker. Average timeframe for Discovery is over 8 to 10 weeks.\n2. Job Development, Negotiation, and Placement CE staff identifies businesses that match the individual's vocational themes and negotiates customized job with employer. Team plans for potential support needs.\n3.Post-Employment Supports Training and stabilization on the job. Review and address ongoing support needs.","url":"","verified":"","notes":"","row":2},{"id":"ct-employment-first-purpose","state":"CT","title":"Employment First - Purpose","name":"Employment First - Purpose","source":"","category":"general","topic":"definition","text":"The purpose of this procedure is to provide information and guidance to DDS employees, Qualified Providers and employers to ensure that employment is part of conversations with individuals who have intellectual disability, where their goals and interests are taken into consideration and are receiving services or may receive services after transitioning from school through DDS. It also is intended to ensure that individuals are aware of the employment service options available and can make an informed choice regarding the opportunities that are best for them.","url":"","verified":"","notes":"","row":2},{"id":"ct-employment-first-implementation","state":"CT","title":"Employment First - Implementation","name":"Employment First - Implementation","source":"","category":"general","topic":"definition","text":"The DDS Employment and Day Services Unit will be responsible for determining the best practices for supporting individuals with intellectual disability in their search for employment including the transitioning to, retaining, and sustaining competitive integrated employment. The goal of the Employment and Day Services Unit is to:\n-Develop, implement, and integrate best practices into their recommendations for planning and supporting individuals with intellectual disability who wish to be employed;\n-Provide case managers with documentation that can be used during planning meetings or other meetings that would discuss employment and day services; and\n-Provide any additional support related to employment and day supports as requested.\n\nEmployment options shall be the primary focus when planning for day services unless contraindicated by the individual and their planning and support team or if the individual has expressed, they are not interested in employment options. The department is responsible for ensuring that all individuals are informed of their employment options. Such discussions may take place through individual planning meetings, planning and support team meetings, transition from school meetings, inquiries to the Employment and Day Services Unit, or discussions with regional staff\n\nEach individual receiving services from the Department shall have an annual review of their employment history and goals for employment by the individual, the individual’s PST, and other applicable DDS qualified provider staff. The annual review shall align with best practices and the preferences of the individual, which shall include informed choice of employment services options as well as meaningful day options. Such annual review may occur during the annual Individual Plan meeting. Any new goals or requests for employment shall be added into the individual’s Individual Plan.\n\nPrior to the annual employment review with the individual, the individual’s DDS case manager should determine appropriate employment services and programs available to the individual. The Employment & Day Services Unit shall provide a case manager with support and access to information and resources upon request.\n\nPrior to the annual meeting or other such meetings regarding employment and day services with the individual, the Employment and Day Services Unit may answer any of the case manager’s questions related to employment. If requested, Employment and Day staff may attend an individual’s annual employment review and provide education and support on employment services and programs.\n\nThe Case Manager will document the meeting and summarize the informed choice employment discussion in the individual’s case notes.","url":"","verified":"","notes":"","row":3},{"id":"ct-individual-supported-employment-2","state":"CT","title":"Individual Supported Employment","name":"Individual Supported Employment","source":"","category":"employment","topic":"definition","text":"What is it: A service to assist individuals to obtain, maintain and retain Competitive Integrated Employment (CIE)\n\nWhat is the goal & approach: Competitive Integrate Employment (CIE); Find an existing job for the individual\n\nWho should use it: Any DDS eligible individual interested in competitive integrated employment regardless of their current service type\n\nWhat is the funding source: Non-annualized through 1X incentives, Individual budget for long term support\n\nCertification needed: No\n\nWhat are the different components:\n\nCareer Plan (up to 10hrs.) Explores an individual’s work preferences, develop interview skills, and learn about other employment opportunities while continuing their current program.\n\nWorking Interview Funds to pay an individual while working in a position that has a strong likelihood of leading to a job offer. Staff hours are funded, too.\n\nIntensive Job Placement and Training Additional hours of job training and support to promote a successful transition to employment.","url":"","verified":"","notes":"","row":4},{"id":"ct-individual-supported-employment-waiver","state":"CT","title":"Individual Supported Employment (Waiver)","name":"Individual Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Individual supported employment consists of intensive, ongoing supports that enable participants, for whom competitive employment at or above the minimum wage is unlikely absent the provision of supports, and who because of their disabilities, need supports to perform in a regular work setting. Can include face-to-face interactions including Face Time or comparable technology(such as IPAD, IPHONE) in accordance with all HIPAA requirements that are designed to promote ongoing engagement of waiver participants towards the participant’s personal goals. Individual supported employment may include assisting the participant to locate a job or develop a customized job on behalf of the participant. Individual supported employment is conducted in a variety of community settings where persons without disabilities are employed. Individual supported employment includes activities needed to sustain paid work by participants, including supervision and training. When Individual supported employment services are provided at a work site where persons without disabilities are employed, payment is made only for adaptations, supervision and training required by participants receiving waiver services as a result of their disabilities but does not include payment for supervisory activities rendered as a normal part of the business setting. Individual supported employment does not include sheltered work or similar types of vocational services furnished in specialized facilities. Individual supported employment services may be furnished to participants who are paid at a rate more than minimum wage, provided that the participant requires Individual supported employment services in order to sustain employment. Individual supported employment services may be furnished by a co-worker or other job-site personnel provided that the services which are furnished are not part of the normal duties of the co-worker or other personnel and those individuals meet the pertinent qualifications for providers of the service. Individual supported employment may include services and supports that assist the participant in achieving self-employment through the operation of a business. However, Medicaid funds may not be used to defray the expenses associated with starting up or operating a business. FFP will not be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n1. Incentive payments made to an employer to encourage or subsidize the employer's participation in a Individual supported employment program;\n\n2. Payments that are passed through to users of Individual supported employment programs;\n\n3. Payments for vocational training that is not directly related to a participant's supported employment. Individual supported employment services furnished under the waiver are not available under a program funded by either program funded by either the Rehabilitation Act of 1973 or P.L. 94-142. Transportation to and from the participant's home is included in this service. The agency rate is adjusted for transportation costs based on mileage and type of vehicle required. May not be provided at the same time as Community Day Supports, Group Supported Employment, Individualized Day Supports, or Respite","url":"","verified":"","notes":"","row":5},{"id":"ct-individual-supported-employment-limits-waiver","state":"CT","title":"Individual Supported Employment - limits (Waiver)","name":"Individual Supported Employment - limits","source":"Waiver","category":"employment","topic":"limits","text":"Generally limited to 40 hours per week unless a prior approval has been issued and it is documented in the Individual Plan","url":"","verified":"","notes":"","row":6},{"id":"ct-individual-supported-employment-provider-agency-specificatio","state":"CT","title":"Individual Supported Employment - Provider Agency Specifications (Waiver)","name":"Individual Supported Employment - Provider Agency Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The agency meets the qualifications described in DDS Procedure PR.015 Qualifying Providers. In addition the agency ensures that employees meet the following qualifications: Prior to Employment\n\n·21 years of age\n\n·criminal background check\n\n·registry check\n\n·have ability to communicate effectively with the individual/family\n\n·have ability to complete record keeping as required by the employer Prior to being alone with the individual\n\n·demonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; human rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse.\n\n ·demonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific outcomes as described in the IP\n\n·ability to participate as a member of the circle if requested by the individual\n\n ·Medication Administration* * if required by the individual supported\n\nVerification initially and every 2 years thereafter by DDS or designee","url":"","verified":"","notes":"","row":7},{"id":"ct-individual-supported-employment-individuals-hired-by-partici","state":"CT","title":"Individual Supported Employment - Individuals Hired by Participants who Self Direct (Waiver)","name":"Individual Supported Employment - Individuals Hired by Participants who Self Direct","source":"Waiver","category":"employment","topic":"definition","text":"The Fiscal Intermediary ensures that employees meet the following qualifications: Prior to Employment:\n\n·21 years of age\n\n ·criminal background check\n\n ·registry check\n\n·have ability to communicate effectively with the individual/family\n\n·have ability to complete record keeping as required by the employer Prior to being alone with the individual:\n\n ·demonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; human rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse.\n\n·demonstrate competence/knowledge in topics required to safely support the individual as described in the Individual Plan\n\n·demonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific outcomes as described in the IP\n\n·ability to participate as a member of the circle if requested by the individual\n\n ·Medication Administration* * if required by the individual supported\n\nFI verification prior  to employment\n\nDDS Quality Management staff conduct an annual Quality Service Review on a sample of consumer directed persons. Review includes verification of training qualifications.","url":"","verified":"","notes":"","row":8},{"id":"ct-prevocational-services-waiver","state":"CT","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Services provide learning, work experiences, and training that develop and teach general skills to assist an individual in preparing for competitive and integrated employment. Service includes teaching such concepts as compliance, attendance, task completion, problem solving and safety that help develop general, non-job-task-specific strengths and skills that contribute to employability. The service also includes supporting general work activities, career assessment and career planning. Services are not job-task oriented, but instead, aimed at a generalized result. Services are reflected in the participants individual plan with outcomes and timelines towards integrated community employment. An annual community based assessment will be completed for each individual and reviewed by DDS Personnel. Documentation is maintained in the file of each individual receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).May not be provided at the same time as Adult Day Health, Group Supported employment, Blended Supports, Transitional Services, Group Day, Individualized Day Supports, Individual Supported Employment and Respite.","url":"","verified":"","notes":"","row":9},{"id":"ct-prevocational-services-limits-waiver","state":"CT","title":"Prevocational Services - Limits(Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"Outcomes and timelines for transition should be documented in the person's individual plan and reviewed at a minimum annually. Service cannot exceed three years and requires regional director review.","url":"","verified":"","notes":"","row":10},{"id":"ct-prevocational-services-agency-provider-specifications-waiver","state":"CT","title":"Prevocational Services - Agency Provider Specifications(Waiver)","name":"Prevocational Services - Agency Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"The agency will ensure that employees meet the following qualifications: Prior to Employment -18 yrs of age -criminal background check -registry check -have ability to communicate effectively with the individual/family -have ability to complete record keeping as required by the employer Prior to being alone with the Individual: -demonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; client rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse, knowledge of approved and prohibited physical management techniques -demonstrate competence/knowledge in topics required to safely support the individual as described in the Individual Plan -demonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific training outcomes as described in the Individual Plan -ability to participate as a member of the circle if requested by the individual -demonstrate understanding of Person Centered Planning -Medication Administration*\n\nVerification Initially and every two years thereafter by DDS","url":"","verified":"","notes":"","row":11},{"id":"ct-customized-employment-supports-waiver","state":"CT","title":"Customized Employment Supports (Waiver)","name":"Customized Employment Supports","source":"Waiver","category":"employment","topic":"definition","text":"Customized Employment Supports is a process through which the relationship between employer and employee is negotiated and personalized in a way that meets the needs of both parties in a typical workplace environment. Wages are at least minimum wage or higher and at a rate comparable to non-disabled workers performing the same tasks. Employees with disabilities must have the same benefits and opportunities as those without disabilities in the same position to interact with other employees, customers and vendors. Supports include: co-worker mentors who can help an employee learn a new job, develop social networks within the job, take advantage of training offered, job coaching, HR and more. Customized employment may also include modifications to an employee's work environment, changes to certain job functions that help an employee successfully perform them, and adjustments to employment policies or practices that support the employee. These supports fall into three main categories:\n\n1. Environmental supports such as: equipment, physical structures, surroundings, or objects present in the business that make the job site more accessible for current or future employees.\n\n2. Procedural supports that employers provide to assist potential or current employees with performing their jobs and job-related functions.\n\n 3. Natural informal supports typically available to any employee. These may include ride sharing to and from work with other employees, or a senior staff member helping a new co-worker get the job done when he/she needs extra assistance. It is anticipated that the employees with IDD will have access to the same supports that are available to all employees: HR, EAP, Supervisor, training, promotional opportunities etc.\n\nThis is a distinct and separate service that is different from other employment services. This service may not be provided at the same time as Individualized Day Supports, Individual or Group Supported Employment, Adult Day Health, Transitional Services, Prevocational or Respite.\n\nThe payment rates for Customized Employment are based on the combination of the Level of Need and the specific plan that is developed for the individual.","url":"","verified":"","notes":"","row":12},{"id":"ct-customized-employment-supports-individuals-hired-by-particip","state":"CT","title":"Customized Employment Supports - Individuals Hired by Participant (Waiver)","name":"Customized Employment Supports - Individuals Hired by Participant","source":"Waiver","category":"employment","topic":"definition","text":"The FI or DDS Designee will ensure that employees meet the following qualifications: Prior to Employment: 21 yrs of age criminal background check registry check, have ability to communicate effectively with the individual/family, have ability to complete record keeping as required by the employer\n\nPrior to being alone with the Individual:\n\n-demonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; client rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse, knowledge of approved and prohibited physical management techniques\n\n-demonstrate competence/knowledge in topics required to safely support the individual as described in the Individual Plan demonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific training outcomes as described in the Individual Plan ability to participate as a member of the team if requested by the individual demonstrate understanding of Person Centered Planning\n\n-demonstrate competence/knowledge in positive behavioral programming, working with individuals who experience moderate to severe psychological and psychiatric behavioral health needs and ability to properly implement behavioral support plans* Medication Administration*\n\n* if required by the individual supported\n\nCertification in\n\nDiscovery\n\nEvidence Based Job Development\n\nSystematic Instruction Skill Enhancement\n\nFI or DDS Designee verification prior to employment","url":"","verified":"","notes":"","row":13},{"id":"ct-customized-employment-supports-private-provider-waiver","state":"CT","title":"Customized Employment Supports - Private Provider (Waiver)","name":"Customized Employment Supports - Private Provider","source":"Waiver","category":"employment","topic":"provider","text":"The agency will ensure that employees meet the following qualifications: Prior to Employment 21 yrs of age, criminal background check, registry check, have ability to communicate effectively with the individual/family, have ability to complete record keeping as required by the employer\n\nPrior to being alone with the Individual:\n\n-demonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; client rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse, knowledge of approved and prohibited physical management techniques\n\n-demonstrate competence/knowledge in topics required to safely support the individual as described in the Individual Plan demonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific training outcomes as described in the Individual Plan ability to participate as a member of the team if requested by the individual demonstrate understanding of Person Centered Planning\n\n-demonstrate competence/knowledge in positive behavioral programming, working with individuals who experience moderate to severe psychological and psychiatric behavioral health needs and ability to properly implement behavioral support plans* Medication Administration*\n\n* if required by the individual supported\n\nTraining or Certification in:\n\n Discovery\n\nEvidence Based Job Development\n\n Systematic Instruction\n\nSkill Enhancement\n\nInitial verification by DDS or Designee","url":"","verified":"","notes":"","row":14},{"id":"ct-employment-transitional-services-waiver","state":"CT","title":"Employment Transitional Services (Waiver)","name":"Employment Transitional Services","source":"Waiver","category":"employment","topic":"definition","text":"Employment Transitional Services is a time limited, community-based, vocational service. It focuses on:\n\n• providing career discovery\n\n • career exploration\n\n• skill development\n\n • self-advocacy\n\nWith the goal of obtaining competitive employment for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities is considered to be the optimal outcome of services.\n\nThe service offers the following opportunities to develop the necessary skills for competitive employment:\n\n1. exploration of employment sites 2. Offers Adult Education opportunities and assistance with and Post-Secondary Schools 3. Assists with Apprenticeships/Internships 4. skills building classes leading to employment 5. financial management 6. participation in community activities to promote networking\n\nTime limited\n\nOne 6 month extension can be granted by Regional Director or Designee in the case of someone needing short time to successfully transition out of Transition Employment services into employment. After 3 year period individual will need to seek another Transition Employment Service provider if they are still in need of that service.\n\nThe payment rate for transitional employment is directly linked to the group supported employment payment rate.","url":"","verified":"","notes":"","row":15},{"id":"ct-employment-transitional-services-limits-waiver","state":"CT","title":"Employment Transitional Services - Limits(Waiver)","name":"Employment Transitional Services - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Time limit 3 years\n\nAn extension can be granted by Regional Director or Designee in the case of someone needing time to successfully transition out of Transition Employment services into employment. After 3 year period individual will need to seek another Transition Employment Service provider if they are still in need of that service.\n\nDocumentation is maintained in the file of each individual receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.)","url":"","verified":"","notes":"","row":16},{"id":"ct-employment-transitional-services-private-provider-standards-","state":"CT","title":"Employment Transitional Services - Private Provider Standards (Waiver)","name":"Employment Transitional Services - Private Provider Standards","source":"Waiver","category":"employment","topic":"provider","text":"The agency will ensure that employees meet the following qualifications: Prior to Employment\n\n18 yrs of age\n\ncriminal background check\n\nregistry check\n\nhave ability to communicate effectively with the individual/family\n\nhave ability to complete record keeping as required by the employer\n\nPrior to being alone with the Individual:\n\ndemonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; client rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse, knowledge of approved and prohibited physical management techniques\n\ndemonstrate competence/knowledge in topics required to safely support the individual as described in the Individual Plan\n\ndemonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific training outcomes as described in the Individual Plan ability to participate as a member of the circle if requested by the individual demonstrate understanding of Person Centered Planning Medication Administration*\n\nif required by the individual supported\n\nInitial verification by DDS or designee","url":"","verified":"","notes":"","row":17},{"id":"ct-group-supported-employment-waiver","state":"CT","title":"Group Supported Employment (Waiver)","name":"Group Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Group Supported Employment consists of ongoing supports that enable participants in a structured work environment focused towards work. Participants for whom competitive employment at or above the minimum wage is unlikely but are on the path to competitive employment with some ongoing supports and need supports to perform in a regular work setting. Group Supported employment may include assisting the participant with assessments, career planning, locate a job or develop a job on behalf of the participant. Group Supported employment is conducted in a variety of settings, particularly work sites where persons without disabilities are employed. Group Supported Employment includes activities needed to obtain and sustain paid work by participants, including career planning, assistive technology ,job development, supervision and training. When group supported employment services are provided at a work site where persons without disabilities are employed, payment is made only for adaptations, supervision and training required by participants receiving waiver services as a result of their disabilities but does not include payment for supervisory activities rendered as a normal part of the business setting. However, Medicaid funds may not be used to defray the expenses associated with starting up or operating a business. FFP will not be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n1. Incentive payments made to an employer to encourage or subsidize the employer's participation in a supported employment program;\n\n2. Payments that are passed through to users of supported employment programs;\n\n3. Payments for vocational training that is not directly related to a participant's supported employment. Group Supported employment services furnished under the waiver are not available under a program funded by either program funded by either the Rehabilitation Act of 1973 or P.L. 94-142. May not be provided at the same time as Adult Day Health, Group Day, Prevocational services, Individual Supported employment, Respite or Individualized Day Support","url":"","verified":"","notes":"","row":18},{"id":"ct-group-supported-employment-limits-waiver","state":"CT","title":"Group Supported Employment - Limits (Waiver)","name":"Group Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Group is defined as 8 or less. Generally limited to 40 hours per week unless a prior approval has been issued and it is documented in the Individual Plan","url":"","verified":"","notes":"","row":19},{"id":"ct-group-supported-employment-dds-qualified-provider-specificat","state":"CT","title":"Group Supported Employment - DDS Qualified Provider Specifications (Waiver)","name":"Group Supported Employment - DDS Qualified Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The agency will ensure that employees meet the following qualifications:\n\nPrior to Employment\n\n21 yrs of age\n\ncriminal background check\n\nregistry check\n\nhave ability to communicate effectively with the individual/family have ability to complete record keeping as required by the employer\n\nPrior to being alone with the Individual:\n\ndemonstrate competence in knowledge of DDS policies and procedures: abuse/neglect; incident reporting; client rights and confidentiality; handling fire and other emergencies, prevention of sexual abuse, knowledge of approved and prohibited physical management techniques\n\ndemonstrate competence/knowledge in topics required to safely support the individual as described in the Individual Plan\n\ndemonstrate competence, skills, abilities, education and/or experience necessary to achieve the specific training outcomes as described in the Individual Plan ability to participate as a member of the circle if requested by the individual demonstrate understanding of Person Centered Planning Medication Administration*\n\nInitial verification by DDS or designee","url":"","verified":"","notes":"","row":20}]},{"code":"DE","name":"Delaware","notes":[],"entries":[{"id":"de-supported-employment-individual-services-pathways-to-employm","state":"DE","title":"Supported Employment-Individual Services (Pathways to Employment)","name":"Supported Employment-Individual Services","source":"Pathways to Employment","category":"employment","topic":"definition","text":"Individual Supported Employment services are the ongoing supports provided, at a one to one participant to staff ratio, to participants who, because of their disabilities, need intensive ongoing support to obtain and maintain an individual job in competitive or customized employment, or self-employment, in an integrated work setting in the general workforce. Jobs in competitive and customized employment must provide compensation at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The outcome of this service is sustained paid employment at or above the minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals.\n\nIndividual Supported Employment may also include support to establish or maintain self-employment, including home based self-employment with business generated income for the individual. Supported employment services are individualized and may include any combination of the following services:\nvocational/job related discovery or assessment,  person centered employment planning, job placement, job development, negotiation with prospective employers, job analysis, job carving, training and systematic instruction, job coaching, benefits support, training and planning,  transportation,  asset development and career advancement services, and other workplace support services including services not specifically related to job skill training that enable the participant to be successful in integrating into the job setting.\n\nCompetitive and integrated employment, including self-employment, must be considered the first option when serving persons with disabilities who are of working age to obtain employment.\n\nServices must be delivered in a manner that supports the participant’s communication needs including, but not limited to, age appropriate communication, translation services for participants that are of limited-English proficiency, or who have other communication needs requiring translation.\n\nJob placement support provided as a component of this service is time-limited, requiring re-authorization every 90 days, up to 6 months in a benefit year months. At each 90-day interval, the service plan team will meet to clarify goals and expectations and review the job placement strategy.\nServices otherwise available under a program funded under Section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.) must be exhausted before Pathways can pay for a service.","url":"","verified":"","notes":"","row":1},{"id":"de-supported-employment-small-group-services-pathways-to-employ","state":"DE","title":"Supported Employment-Small Group Services (Pathways to Employment)","name":"Supported Employment-Small Group Services","source":"Pathways to Employment","category":"employment","topic":"definition","text":"Small Group Supported Employment are services and training activities provided in regular business, industry and community settings for groups of two (2) to no more than four (4) workers with disabilities. Examples include mobile crews and other business based workgroups employing small groups of workers with disabilities in employment in the community. Small Group Supported Employment must be provided in a manner that promotes integration into the workplace and interaction between participants and people without disabilities in those workplaces and be compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The outcome of this service is sustained paid employment and work experience leading to further career development and individual integrated community based employment for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Small Group Supported Employment does not include vocational services provided in facility based work settings, enclaves or other non-competitive or non-integrated job placements.\n\nSmall Group Supported Employment may include any combination of the following services: vocational/job related discovery or assessment, person centered employment planning, job placement, job development, negotiation with prospective employers, job analysis, training and systematic instruction, job coaching, benefits support, training, planning transportation and career advancement services. Other workplace support services may include services not specifically related to job skill training that enable the participant to be successful in integrating into the job setting.\n\nSmall Group Supported Employment emphasizes the importance of rapid job search for a competitive job and provide work experiences where the consumer can develop strengths and skills that contribute to employability in individualized paid employment in integrated community settings.\n\nServices must be delivered in a manner that supports the participant’s communication needs including, but not limited to, age appropriate communication, translation services for participants that are of limited English proficiency or who have other communication needs.\n\nContinuation of Small Group Supported Employment requires a review and reauthorization every 6 months in accordance with Department requirements, and shall not exceed 12 continuous months without exploration of alternative services. The review and reauthorization should verify that there have been appropriate attempts to prepare the consumer for a transition to Individualized Employment Support Services (IESS) and that the consumer continues to prefer Small Group Supported Employment, despite these attempts.\n\nJob placement support provided as a component of this service is time-limited, requiring re-authorization every 90 days, up to 6 months in a benefit year months. At each 90-day interval, the service plan team will meet to clarify goals and expectations and review the job placement strategy. Small Group Supported Employment does not include facility-based or other similar types of vocational services furnished in specialized facilities that are not a part of the general workplace. Services otherwise available under a program funded under Section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.) must be exhausted before Pathways can pay for a service.","url":"","verified":"","notes":"","row":2},{"id":"de-supported-employment-individual-and-small-group-services-pat","state":"DE","title":"Supported Employment–Individual and Small Group Services (Pathways to Employment)","name":"Supported Employment–Individual and Small Group Services","source":"Pathways to Employment","category":"employment","topic":"definition","text":"Providers of Supported Employment-Individual and Group Services must meet the following requirements: Must be certified by the Pathways Provider Certification Committee as meeting the standards for this service.\nDemonstrate the competencies and capacity to provide vocational services as described in Section 4.0 of this manual.\nMust be a contracted vendor for Job Development, Placement and Retention Services with the Delaware Division of Vocational Rehabilitation.\nComply with DHSS standards, including regulations, contract requirements, policies, and procedures relating to provider qualifications.\nMeet minimum standards as set forth by the Division of Vocational Rehabilitation or the Division for the Visually Impaired, as applicable, for comparable services.\nProviders must have a State Business License or 501(c)(3) status\n\nDirect care professionals must:\nHave criminal background investigations in accordance with state requirements.\nHave a screening against the child abuse and adult abuse registry checks and obtain service letters in accordance with 19 Del Code Section 708 and 11 Del Code Sections 8563 and 8564 and not have any adverse registry findings in the performance of the service.\nPossess certification through successful completion of training program as required by DHSS.\nA Job Coach/Employment Specialist must meet the following minimum standards:\nSuccessful completion of an Employment Specialist Curriculum as approved by the Department. Completion must occur within six months of date of hire; Persons who have not completed an approved Employment Specialist curriculum and who are currently providing services as of the effective date of this standard shall have six months to come into compliance;\nReceive mentoring during the first six months of employment. The mentor must have worked for a minimum of one year as an Employment Specialist and have completed an approved Employment Specialist Curriculum;\nGraduation from high school or acquired a GED; Persons without a high school diploma or a GED and currently providing the services as of the effective date of this rule shall have three years to obtain the minimum educational requirements.\nPossess a valid Driver’s License if transporting consumers","url":"","verified":"","notes":"","row":3},{"id":"de-career-exploration-and-assessment-services-pathways-to-emplo","state":"DE","title":"Career Exploration and Assessment Services (Pathways to Employment)","name":"Career Exploration and Assessment Services","source":"Pathways to Employment","category":"career","topic":"definition","text":"Providers of Career Exploration and Assessment Services must meet the following requirements:\nMust be certified by the Pathways Provider Certification Committee as meeting the standards for this service.\nComply with all DHSS standards, including regulations, contract requirements, policies, and procedures relating to provider qualifications.\nMeet minimum standards as set forth by the Division of Vocational Rehabilitation or the Division for the Visually Impaired as applicable for comparable services.\nEnsure employees complete DHSS required training, including training on the participant’s service plan and the participant’s unique and/or disability specific needs, which may include, but is not limited to, communication, mobility, and behavioral needs.\n\nDirect care professionals must:\nHave criminal background investigations in accordance with state requirements.\nHave a screening against the child abuse and adult abuse registry checks and obtain service letters in accordance with 19 Del Code Section 708 and 11 Del Code Sections 8563 and 8564 and not have any adverse registry findings in the performance of the service\nProviders must have a State Business License or 501(c)(3) status.","url":"","verified":"","notes":"","row":4}]},{"code":"DC","name":"District of Columbia","notes":[],"entries":[{"id":"dc-prevocational-services-employment-readiness-waiver","state":"DC","title":"Prevocational Services/Employment Readiness (Waiver)","name":"Prevocational Services/Employment Readiness","source":"Waiver","category":"prevoc","topic":"definition","text":"Employment Readiness Services provide learning and work experiences, including volunteer work, where the person can develop general, non-job- task-specific strengths and skills that contribute to employability in paid employment in integrated community settings. The activities shall support the acquisition of new employment-related skills, including soft skills such as self-determination, benefits counseling, the development of relationships, and employment exploration in the community. Services are expected to occur over a defined period of time and with specific outcomes to be achieved, as determined by the person and his/her service, and the supports planning team through an ongoing person-centered planning process. Employment Readiness Services should enable each person to attain the highest level of work in the most integrated setting and with the job matched to the person’s interests, strengths, priorities, abilities, and capabilities.\n\nEmployment Readiness Services may be furnished in a variety of locations in the community and are not limited to fixed-site facilities. No increase to the number of facility-based settings shall be authorized. Current providers will be prohibited from increasing the number of facility-based settings at which services are provided, and newly enrolling providers shall be prohibited from providing services at any facility-based settings.\n\nA person receiving Employment Readiness Services may pursue employment opportunities at any time to enter the general workforce. Employment Readiness Services are intended to assist individuals to enter the general workforce.\n\nPersonal care/assistance may be provided by the provider of employment readiness services as a component of this service, but may not comprise the entirety of the service.\n\nIndividuals receiving Employment Readiness Services must have employment-related goals in their person-centered services and supports plan and the general habilitation activities must be designed to support such employment goals. Competitive, integrated employment in the community for which a person is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by people without disabilities, is considered to be the optimal outcome of Employment Readiness Services.\n\nEmployment Readiness Services are intended to develop and teach general skills. Examples of Employment Readiness Services include, but are not limited to: ability to communicate effectively with supervisors, coworkers and customers; generally accepted community workplace conduct and dress; ability to follow directions; ability to attend to tasks; workplace problem-solving skills and strategies; and, general workplace safety and mobility training.\n\nIn the event that persons served through the waiver are compensated in employment-related training services, pay must be in accordance with the United States Fair Labor Standards Act of 1985. Persons served through the waiver who express interest in working in a competitive job setting are supported when transitioning to a more appropriate vocational opportunity by the Employment Readiness provider and Service Coordinator.\n\nEmployment Readiness Services provided via remote support:\n\nThis service may be rendered using remote support. The purpose of the remote support delivery option is to maintain\n\nor improve a participant’s functional abilities, enhance interactions, support meaningful relationships, and promote their ability to live independently, and meaningfully participate in their community. The participant’s services may not be delivered virtually one hundred (100) percent of the time. The participant must always have the option to utilize in-person services. A participant who requires in-person assistance during the provision of the service must receive services in person. The use of the remote delivery service option is not for the convenience of providers.\n\nRequirements and methodology regarding HIPAA have been approved by the DC HIPAA Compliance Officer. Participant privacy rights will be assured and monitored on an ongoing basis. Privacy obligations will be reviewed on an ongoing basis with providers and the person receiving services. Training will be provided for participants on how to identify or report issues if they believe their privacy has been violated. Providers will not use video or remote support devices in participant bedrooms or bathrooms. The use of the virtual support option must not block, prohibit or discourage the use of in-person services or access to the community. Community integration will be increased by having the option for remote service delivery. In instances where participants may not be inclined to attend or receive a service in-person, the remote service delivery option affords the opportunity for the participant to still participate in services, engage with their providers, community and friends, when they otherwise would not be able to do so due to illness, transportation issues, pandemics, or other personal reasons.\n\nParticipants will be provided initial and ongoing training, support, and assistance using the technology necessary for the remote delivery of this service. The participan
