 than 90 calendar days from the date of service initiation, unless extenuating circumstances warrant an extension. This service is expected, on average, to involve 50 hours of service.\n\nFor Discovery, the provider shall document each date of service, the activities performed that day, and the duration of each activity. The written Profile is due no later than 14 calendar days after the last date of service is concluded. Exploration & Discovery are paid on an outcome basis, after the written report is received and approved, and the provider submits documentation detailing each date of service, the activities performed that day, and the duration of each activity.\n\nThese services are designed to support the achievement of IIE and SE outcomes consistent with the individual’s personal and career goals, as determined through Exploration, Discovery and/or other similar career planning processes and which include an introduction to the variety of work incentives available to individuals receiving Supplemental Security Income (SSI) and/or Social Security Disability Insurance (SSDI), Medicaid and/or Medicare.\n\nAs part of the provision of this service, the provider shall be responsible for working with the person, the person’s ISC/Case Manager and Circle of Support (COS) to explore how Enabling Technology (ET) could be used to support the person’s achievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and COS in order to ensure an informed choice regarding the potential use of ET; and the implementation of ET supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nThe SE Ind-Discovery provider shall be responsible for any Personal Assistance (PA) needs during the time that SE Ind-Discovery services are rendered at any given time; however, PA may not comprise the entirety of the SE Ind-Discovery service(s) being provided.\n\nTransportation during the provision of SE Ind-Discovery is included in the rates paid for these services. Transportation of the person to and from SE Ind-Discovery is included in the rates paid for these services when such transportation is needed by the person.\n\nA person's PCSP may include more than one non-residential service (SE Ind services; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wraparound Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).","url":"","verified":"","notes":"","row":11},{"id":"tn-supported-employment-individual-discovery-limits-waiver","state":"TN","title":"Supported Employment Individual Discovery - Limits (waiver)","name":"Supported Employment Individual Discovery - Limits","source":"waiver","category":"career","topic":"limits","text":"After an individual has received the Discovery service for the first time, re-authorization may occur a maximum of once every three years (with a minimum of three 365-day intervals between services), and only if the person, at the time of reauthorization, is not already engaged in IIE or SE, or other services to obtain such employment, and the person has a goal to obtain IIE or SE within 12 months.\n\nThe Waiver will not cover SE-Ind Discovery services which are otherwise available to the individual under section 110 of the Rehabilitation Act of 1973, or the IDEA (20 U.S.C. 1401 et seq.). If one or more of these services are authorized, documentation is maintained that the service is not available to the individual under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).\n\nSE-Ind Discovery shall not be provided during the same time period that the person is receiving Personal Assistance, Respite, or services under a 504 Plan or Individual Education Program (IEP), is being homeschooled, or any combination thereof, or as a substitute for education services which are available pursuant to the Individual with Disabilities Education Act (IDEA), but which the person or his/her legal representative has elected to forego. Except for students who have graduated prior to May 2014, employment and day services for school aged persons (i.e., under the age of 22) are limited to regular school break periods.\n\nThese services are only for individuals seeking or engaged in IIE or SE.\n\nThese services do not include supporting paid employment or training in a sheltered workshop or similar facility-based setting. However, those individuals who are currently employed by a provider to fulfill a contract authorized pursuant to TCA 71-4-701 et seq. may continue to receive supported employment services for paid employment or training until the contract expires or the person loses the employment for any other reason. At that point, any supported employment services the person receives must fully align with best practices in competitive integrated employment and the State’s commitment to Employment First and will no longer be used to support employment or training in a business enterprise owned or operated by or affiliated with a provider of these services. In limited circumstances where the person is working in an integrated employment arrangement, but the provider agency is serving as the Employer of Record (EOR), providers will be permitted to bill for Employment Supports while EOR responsibilities are transitioned from the provider to the business/entity offering the integrated employment opportunity, in order to ensure that employment is not disrupted. These services do not include payment for supervisory activities rendered as a normal part of the business setting and supports otherwise available to employees without disabilities filling the same or similar positions in the business. Non-residential habilitation services (SE-Ind (except as noted below); Small Group ES; Community Participation Supports; IE&CI Wrap-Around Supports; FB Day Supports) and either the Residential SNA-Homebound (HB) or the Non-Residential HB Service, when combined, may involve no more than 5,832 quarter hour units/year and no more than 240 quarter hour units in a fourteen day billing period. The Residential SNA-HB and the Non-Residential HB Service are paid on a per diem basis and each day shall be considered as 24 quarter hour units for the purposes of including this service in the annual and billing period limits. Under SE-IES, authorizations of Benefits Counseling, Exploration, Discovery, and Job Development are not included in these limits.\n\nThese services will not duplicate other services provided through the Waiver or the Medicaid State Plan. Federal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n•Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment;\n\n•Payments that are passed through to users of supported employment services; or\n\n•Payments for training that is not directly related to an individual’s supported employment program\n\nA provider of SE-Ind Discovery services may also receive Social Security’s Ticket to Work Outcome and Milestone payments. These payments do not conflict with CMS regulatory requirements and do not constitute an overpayment of Federal dollars for services provided.","url":"","verified":"","notes":"","row":12},{"id":"tn-supported-employment-individual-exploration-waiver","state":"TN","title":"Supported Employment Individual Exploration (Waiver)","name":"Supported Employment Individual Exploration","source":"Waiver","category":"career","topic":"definition","text":"Supported Employment Individual-Exploration (SE Ind-Exploration) is a time-limited and targeted service designed to help a person make an informed choice about whether s/he wishes to pursue Individualized Integrated Employment (IIE) or Self_x0002_Employment (SE), as defined in TennCare Rule. Exploration is not appropriate for participants who already know they want to pursue IIE or SE.\n\nExploration includes career exploration activities to identify a person’s specific interests and aptitudes for paid work, including experience and skills transferable to IIE or SE. Exploration also includes exploration of IIE or SE opportunities in the local area that are specifically related to the person’s identified interests, experiences and/or skills through 4 to 5 uniquely arranged business tours, informational interviews and/or job shadows. Each person seeking IIE who is receiving this service should participate in business tours, informational interviews and/or job shadows uniquely selected based on his or her individual interests, aptitudes, experiences, and skills most transferable to employment. All persons should not participate in the same experiences. Each business tour, informational interview and/or job shadow shall include time for set-up, prepping the person for participation, and debriefing with the person after each opportunity.\n\nExploration also includes introductory education on work incentives for people receiving publicly funded benefits (e.g., SSI, SSDI, Medicaid, Medicare, etc.), and includes introductory education on how SE-IES work (including Vocational Rehabilitation (VR) services). Educational information is provided to the person and the legal guardian/conservator and/or most involved family member(s), if applicable, to ensure legal guardian/conservator and/or family support for the person’s choice to pursue IIE or SE. The educational aspects of this service shall include addressing any concerns, hesitations or objections of the person and the legal guardian/conservator and/or most involved family member(s), if applicable.\n\nSelf-Employment Exploration includes but is not limited to: Initial meeting with job coach or job developer to discuss SE goals, collecting information to assist the person in making an informed choice on the pursuit of SE, and feasibility study and consultation with local advisory agencies. This may consist of virtual or in-person meetings with job developer and advisory agencies with the goal of informing the person on SE. At the conclusion of SE Exploration, the individual will choose whether to continue pursuing SE. Additionally, the job developer will work to identify supports needed, discuss fading of paid job supports, and the expectations of job developer and job seeker. Completion and approval of the SE Exploration template is required for completion. Benefits counseling is mandatory during this phase through VR or the waiver.\n\nExploration shall be completed no more than sixty (60) calendar days from the date of service initiation, unless extenuating circumstances warrant an extension. Exploration service is expected to involve, on average, 40 hours of service. For Exploration & Discovery, the provider shall document each date of service, the activities performed that day, and the duration of each activity. Each service culminates in a written report summarizing the process and outcomes, using a standard template prescribed by DDA. The written report is due no later than 14 calendar days after the last date of service is concluded. Exploration & Discovery are paid on an outcome basis, after the written report is received and approved, and the provider submits documentation detailing each date of service, the activities performed that day, and the duration of each activity.\n\nAs part of the provision of this service, the provider shall be responsible for working with the person, the person’s ISC/Case Manager and Circle of Support (COS) to explore how Enabling Technology (ET) could be used to support the person’s achievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and COS in order to ensure an informed choice regarding the potential use of ET; and the implementation of ET supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nThe SE Ind-Exploration provider shall be responsible for any Personal Assistance (PA) needs during the time that SE Ind_x0002_Exploration services are rendered at any given time; however, PA may not comprise the entirety of the SE Ind-Exploration service(s) being provided.\n\nTransportation during the provision of SE Ind-Exploration is included in the rates paid for these services. Transportation of the person to and from SE Ind-Exploration is included in the rates paid for these services when such transportation is needed by the person.\n\nA person's PCSP may include more than one non-residential service (SE Ind services; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wrap_x0002_Around Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).","url":"","verified":"","notes":"","row":13},{"id":"tn-supported-employment-individual-exploration-limits-waiver","state":"TN","title":"Supported Employment Individual Exploration - Limits (Waiver)","name":"Supported Employment Individual Exploration - Limits","source":"Waiver","category":"career","topic":"limits","text":"After an individual has received the Exploration service for the first time, re-authorization may occur a maximum of once each per year for Exploration for IIE or Exploration for SE (with a minimum 365-day interval between services) and only if the person, at the time of re-authorization, is not already engaged in IIE or SE, or other services to obtain such employment. The Waiver will not cover SE-Ind Exploration services which are otherwise available to the individual under section 110 of the Rehabilitation Act of 1973, or the IDEA (20 U.S.C. 1401 et seq.). If one or more of these services are authorized, documentation is maintained that the service is not available to the individual under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.)\n\nSE-Ind Exploration shall not be provided during the same time period that the person is receiving Personal Assistance, Respite, or services under a 504 Plan or Individual Education Program (IEP), is being homeschooled, or any combination thereof, or as a substitute for education services which are available pursuant to the Individual with Disabilities Education Act (IDEA), but which the person or his/her legal representative has elected to forego. Except for students who have graduated prior to May 2014, employment and day services for school aged persons (i.e., under the age of 22) are limited to regular school break periods.\n\nThese services are only for individuals seeking or engaged in IIE or SE.\n\nThese services do not include supporting paid employment or training in a sheltered workshop or similar facility-based setting. However, those individuals who are currently employed by a provider to fulfill a contract authorized pursuant to TCA 71-4-701 et seq. may continue to receive supported employment services for paid employment or training until the contract expires or the person loses the employment for any other reason. At that point, any supported employment services the person receives must fully align with best practices in competitive integrated employment and the State’s commitment to Employment First and will no longer be used to support employment or training in a business enterprise owned or operated by or affiliated with a provider of these services. In limited circumstances where the person is working in an integrated employment arrangement, but the provider agency is serving as the Employer of Record (EOR), providers will be permitted to bill for Employment Supports while EOR responsibilities are transitioned from the provider to the business/entity offering the integrated employment opportunity, in order to ensure that employment is not disrupted.\n\nThese services do not include payment for supervisory activities rendered as a normal part of the business setting and supports otherwise available to employees without disabilities filling the same or similar positions in the business. Non-residential habilitation services (SE-Ind (except as noted below); Small Group ES; Community Participation Supports; IE&CI Wrap-Around Supports; FB Day Supports) and either the Residential SNA-Homebound (HB) or the Non-Residential HB Service, when combined, may involve no more than 5,832 quarter hour units/year and no more than 240 quarter hour units in a fourteen day billing period. The Residential SNA-HB and the Non-Residential HB Service are paid on a per diem basis and each day shall be considered as 24 quarter hour units for the purposes of including this service in the annual and billing period limits. Under SE-Ind, authorizations of Benefits Counseling, Exploration, Discovery, and Job Development are not included in these limits.\n\nThese services will not duplicate other services provided through the Waiver or the Medicaid State Plan. Federal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n•Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment;\n\n•Payments that are passed through to users of supported employment services; or\n\n•Payments for training that is not directly related to an individual’s supported employment program.\n\nA provider of SE-Ind Exploration services may also receive Social Security’s Ticket to Work Outcome and Milestone payments. These payments do not conflict with CMS regulatory requirements and do not constitute an overpayment of Federal dollars for services provided.","url":"","verified":"","notes":"","row":14},{"id":"tn-supported-employment-individual-exploration-legally-responsi","state":"TN","title":"Supported Employment Individual Exploration – Legally Responsible Provider Specifications","name":"Supported Employment Individual Exploration – Legally Responsible Provider Specifications","source":"","category":"career","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\n6. All providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements.\n\nAgency-employed staff delivering Supported Employment Individual-Exploration services shall also be required to meet the following qualifications:\n\nThe staff person shall have qualified as a Job Coach by either:\n\n(1) qualifying as a Job Developer as listed in TennCare protocol; or (2) successfully completing a competency-based training course covering best practices in job coaching and consultation, pre-approved by TennCare and covering, at minimum, specific content prescribed in TennCare protocol","url":"","verified":"","notes":"","row":15},{"id":"tn-supported-employment-individual-exploration-waiver-service-a","state":"TN","title":"Supported Employment Individual Exploration – Waiver Service Agency Provider Specifications (Waiver)","name":"Supported Employment Individual Exploration – Waiver Service Agency Provider Specifications","source":"Waiver","category":"career","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\n6. All providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements. Agency-employed staff delivering Supported Employment Individual-Exploration services shall also be required to meet the following qualifications:\n\nThe staff person shall have qualified as a Job Coach by either:\n\n(1) qualifying as a Job Developer as listed in TennCare protocol; or\n\n(2) successfully completing a competency-based training course covering best practices in job coaching and consultation, pre-approved by TennCare and covering, at minimum, specific content prescribed in TennCare protocol.\n\nVerification e Every 12-18 months","url":"","verified":"","notes":"","row":16},{"id":"tn-individual-job-coaching-waiver","state":"TN","title":"Individual Job Coaching (Waiver)","name":"Individual Job Coaching","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment Individual-Job Coaching (SE Ind-JC) consists of Job Coaching for Individualized Integrated Employment (IIE) and Job Coaching for Self-Employment (SE).\n\nJC for IIE includes identifying, through job analysis, and providing services and supports that assist the individual in maintaining IIE or SE as defined in TennCare Rule.\n\nJC for IIE includes supports provided to the individual and his/her supervisor and/or co-workers, either remotely (via\n\ntechnology) or face-to- face. Supports during each phase of employment must be guided by a JC Fading Plan which incorporates an appropriate mix of best practices for the individual to achieve fading goals as identified in the Plan (e.g.,systematic instruction utilizing task analysis to teach the individual to independently complete as much of his/her job duties as possible; high or low tech assistive technology; and effective engagement of natural supports including co-workers and supervisor(s) as needed). If progress on fading ceases at some point, adaptations to job duties, negotiated with the supervisor/employer, may be utilized to allow fading to continue if no reduction in hours or hourly pay results.\n\nJC for SE includes identification and provision of services and supports that assist the individual in maintaining SE. JC for SE includes supports provided to the individual, either remotely (via technology) or face-to-face. Supports must enable the individual to successfully operate the business (with assistance from other sources of professional services or suppliers of goods necessary for the type of business). JC supports should never supplant the individual's role or responsibility in all aspects of the business. Supports during each phase of SE must be guided by a JC Fading Plan which incorporates an appropriate mix of best practices for the individual to achieve fading goals as identified in the Plan (e.g., systematic instruction utilizing task analysis to teach the individual to independently complete as much of his/her roles and responsibilities as possible; high or low tech assistive technology; and effective engagement of any business partners and/or associates and/or suppliers of goods or services). If progress on fading ceases at some point, business plan adaptations may be utilized to allow fading to continue, if no reduction in paid hours or net hourly pay results.\n\nIf the individual’s support needs are 1 hour per week or less, JC through monthly Stabilization and Monitoring will be authorized as defined and stated above. This requires a minimum of 1 monthly face-to-face contact with the supported employee and ability of the provider to respond as needed to prevent loss of IIE/SE and where necessary, pursue a change in service authorization as needed to address longer term challenges to avoiding loss of IIE/SE.\n\nThe amount of time authorized for either type of SE Ind-JC is a percentage of the individual's hours engaged in IIE or SE, based on need.\n\nThese services are designed to support the achievement of IIE and SE outcomes consistent with the individual’s personal and career goals, as determined through Exploration, Discovery and/or other similar career planning processes and which\n\ninclude an introduction to the variety of work incentives available to individuals receiving Supplemental Security Income (SSI) and/or Social Security Disability Insurance (SSDI), Medicaid and/or Medicare.\n\nAs part of the provision of this service, the provider shall be responsible for working with the person, the person’s ISC/Case Manager and Circle of Support (COS) to explore how Enabling Technology (ET) could be used to support the person’s achievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and COS in order to ensure an informed choice regarding the potential use of ET; and the implementation of ET supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nThe SE Ind-JC provider shall be responsible for any Personal Assistance (PA) needs during the time that SE Ind-JC services are rendered at any given time; however, PA may not comprise the entirety of the SE Ind-JC service(s) being provided.\n\nTransportation during the provision of SE Ind-JC is included in the rates paid for these services. Transportation of the person to and from SE Ind-JC is included in the rates paid for these services when such transportation is needed by the person. Time spent transporting the person to/from the job site, when needed, in SE Ind-JC is considered authorized service time and it is expected that the Job Coach will use this time with the person, as needed, to engage in conversation to identify/address employment-related issues and questions, and to provide support, guidance and positive reinforcement that contributes to the person maintaining IIE or SE.\n\nA person's PCSP may include more than one non-residential service (SE Ind services; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wrap_x0002_Around Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).","url":"","verified":"","notes":"","row":17},{"id":"tn-individual-job-coaching-limits-waiver","state":"TN","title":"Individual Job Coaching - Limits (Waiver)","name":"Individual Job Coaching - Limits","source":"Waiver","category":"employment","topic":"limits","text":"JC services do not include supports for volunteering or any form of unpaid internship, work experience or employment. JC shall not be provided in excess of actual need and cannot be billed for more hours than the individual, engaged in employment or SE, has worked in a billing period\n\nThe Waiver will not cover SE Ind-JC services which are otherwise available to the individual under section 110 of the Rehabilitation Act of 1973, or the IDEA (20 U.S.C. 1401 et seq.). If one or more of these services are authorized, documentation is maintained that the service is not available to the individual under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.)\n\nSE Ind-JC shall not be provided during the same time period that the person is receiving Personal Assistance, Respite, or services under a 504 Plan or Individual Education Program (IEP), is being homeschooled, or any combination thereof, or as a substitute for education services which are available pursuant to the Individual with Disabilities Education Act (IDEA), but which the person or his/her legal representative has elected to forego. Except for students who have graduated prior to May 2014, employment and day services for school aged persons (i.e., under the age of 22) are limited to regular school break periods.\n\nThese services are only for individuals seeking or engaged in IIE or SE.\n\nThese services do not include supporting paid employment or training in a sheltered workshop or similar facility-based setting. However, those individuals who are currently employed by a provider to fulfill a contract authorized pursuant to TCA 71-4-701 et seq. may continue to receive supported employment services for paid employment or training until the contract expires or the person loses the employment for any other reason. At that point, any supported employment services the person receives must fully align with best practices in competitive integrated employment and the State’s commitment to Employment First and will no longer be used to support employment or training in a business enterprise owned or operated by or affiliated with a provider of these services. In limited circumstances where the person is working in an integrated employment arrangement, but the provider agency is serving as the Employer of Record (EOR), providers will be permitted to bill for Employment Supports while EOR responsibilities are transitioned from the provider to the business/entity offering the integrated employment opportunity, in order to ensure that employment is not disrupted.\n\nThese services do not include payment for supervisory activities rendered as a normal part of the business setting and supports otherwise available to employees without disabilities filling the same or similar positions in the business. Non-residential habilitation services (SE-Ind (except as noted below); Small Group ES; Community Participation Supports; IE&CI Wrap-Around Supports; FB Day Supports) and either the Residential SNA-Homebound (HB) or the Non-Residential HB Service, when combined, may involve no more than 5,832 quarter hour units/year and no more than 240 quarter hour units in a fourteen day billing period. The Residential SNA-HB and the Non-Residential HB Service are paid on a per diem basis and each day shall be considered as 24 quarter hour units for the purposes of including this service in the annual and billing period limits. Under SE-Ind, authorizations of Benefits Counseling, Exploration, Discovery and Job Development are not included in these limits.\n\nThese services will not duplicate other services provided through the Waiver or the Medicaid State Plan. Federal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n•Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment;\n\n•Payments that are passed through to users of supported employment services; or\n\n•Payments for training that is not directly related to an individual’s supported employment program\n\nA provider of SE-Ind JC services may also receive Social Security’s Ticket to Work Outcome and Milestone payments. These payments do not conflict with CMS regulatory requirements and do not constitute an overpayment of Federal dollars for services provided.","url":"","verified":"","notes":"","row":18},{"id":"tn-job-coaching-legally-responsible-person-provider-specificati","state":"TN","title":"Job Coaching - Legally Responsible Person Provider Specifications (Waiver)","name":"Job Coaching - Legally Responsible Person Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\nAll providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements. Agency-employed staff delivering Supported Employment Individual-Job Coaching services shall also be required to meet the following qualifications:\n\nThe staff person shall have qualified as a Job Coach by either:\n\n(1) qualifying as a Job Developer as listed in TennCare protocol; or\n\n(2) successfully completing a competency-based training course covering best practices in job coaching and consultation, pre-approved by TennCare and covering, at minimum, specific content prescribed in TennCare protocol.\n\nVerifications every 12-18 months","url":"","verified":"","notes":"","row":19},{"id":"tn-job-coaching-waiver-service-agency-provider-specifications-w","state":"TN","title":"Job Coaching - Waiver Service Agency Provider Specifications (Waiver)","name":"Job Coaching - Waiver Service Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\nStaff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\nAny waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\nStaff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\nStaff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\nWaiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\nAll providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements. Agency-employed staff delivering Supported Employment Individual-Job Coaching services shall also be required to meet the following qualifications:\n\nThe staff person shall have qualified as a Job Coach by either:\n\n(1) qualifying as a Job Developer as listed in TennCare protocol; or\n\n(2) successfully completing a competency-based training course covering best practices in job coaching and consultation,\n\npre-approved by TennCare and covering, at minimum, specific content prescribed in TennCare protocol.\n\nVerification every 12-18 months\n\nJob Development (Waiver)\n\nSupported Employment Individual-Job Development (SE-Ind JD) consists of JD Plan or Self-Employment (SE) Plan and JD Start-Up or SE Start-Up. JD Plan or SE Plan is a time-limited and targeted service designed to create a clear and detailed plan for JD or for the start-up phase of SE. This service is limited to thirty (30) calendar days from the date of service initiation for JD Plan and is limited to ninety (90) calendar days from the date of service initiation for SE Plan. This service includes a planning meeting involving the individual and other key people who will be instrumental in supporting the individual to become employed in individualized integrated employment (IIE) or SE as defined in TennCare Rule.\n\nFor SE Plan, the following additional items are required, and the service is expected to take around 50 hours to complete:\n\n• Attend one of the small business orientation classes if not completed during SE Exploration – options listed under SE Exploration.\n\n• Complete Feasibility Study with business mentor.\n\n• Completion of SE Plan Template and business plan. This should promote further questions for start-up consultant, person supported, etc\n\n• Contacting sources of start-up capital, beginning process of obtainment. (Plan to Achieve Self-Support (PASS), Vocational Rehabilitation (VR), Loans, Crowdsourcing).\n\n• Identifying licensure needed, inspections, liability insurance, etc. – and begin process of licensure. Reference the following site to determine if licensure is required: Registration and Licensing (tn.gov)\n\n• Identifying total cost and how to obtain all resources and licensure needed. Confirm funding\n\n• Final consultation with job developer and the advisor to review SE Plan and business plan and give further recommendations prior to start-up.\n\n• Benefits counseling consultation – if individual did not elect to pursue SE Exploration, ensure benefits counseling is received during this phase\n\n• A final template verifying not only SE Plan, but resources, funding, licensure needed, how it was obtained, and next steps. Submission and approval of the template is required and will need approval at the completion of this phase. The expected outcome of this phase is to obtain all needed goods, licensure, services, and assistive/enabling technology necessary for a person to start their business. A final meeting with person supported, job developer, and advisor is required before completion. The business plan and completed SE Plan Template need to be submitted to Employment Specialist in order to complete service.\n\nThis service culminates in a written plan, using a template prescribed by DDA that incorporates the results of Exploration and/or Discovery, if previously authorized. The written plan is due no later than thirty (30) calendar days after the service commences. For SE goals, this service results in the development of a SE business plan, including potential sources of business financing (such as VR, Small Business Administration loans, PASS plans), given that Medicaid funds may not be used to defray the capital expenses associated with starting a business. This service is paid on an outcome basis, after the\n\nwritten plan is received and approved, and the provider submits documentation detailing each date of service, the activities performed that day, and the duration of each activity.\n\nJD Start-Up or SE Start-up is a time-limited service designed to implement a JD or SE Plan as follows:\n\no JD Start-Up is support to obtain an individualized competitive or customized job in an integrated employment setting in the general workforce, for which an individual is compensated at or above the minimum wage, but ideally not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The JD strategy should reflect best practices and adjusted based on whether the individual is seeking competitive or customized employment.\n\no SE Start -Up is support in implementing a SE business plan.\n\nThe outcome of this service is expected to be the achievement of an IIE or SE outcome consistent with the individual’s personal and career goals, as determined through Exploration and/or Discovery if authorized, and as identified in the JD or SE Plan that guides the delivery of this service.\n\nThis service will be paid on an outcome basis once the person begun participation in IIE or SE. First payment for SE Startup will be following ten (10) business days “open.” SE business “open” means the first day of offering the sale of goods or\n\nservices. Proof of licensure is needed for SE outcome, indicating active SE. Outcome payment amounts for JD Start-Up are tiered based upon the assessed level of challenge anticipated to achieve the intended outcome of this service for the individual being served. The outcome payment amounts for SE Start-Up are not tiered. Outcome payments for both Start-Up services are also paid over three phases (two calendar weeks, six calendar weeks, and ten calendar weeks following the start of IIE or SE, so long as employment or SE is sustained) to incentivize retention of the job or SE situation.\n\nThese services are designed to support the achievement of IIE and SE outcomes consistent with the individual’s personal and career goals, as determined through Exploration, Discovery and/or other similar career planning processes and which include an introduction to the variety of work incentives available to individuals receiving Supplemental Security Income (SSI) and/or Social Security Disability Insurance (SSDI), Medicaid and/or Medicare.\n\nAs part of the provision of this service, the provider shall be responsible for working with the person, the person’s Case\n\nManager and Circle of Support (COS) to explore how Enabling Technology (ET) could be used to support the person’s\n\nachievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and COS in order to ensure an informed choice regarding the potential use of ET; and the implementation of ET supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nThe SE Ind-JD provider shall be responsible for any Personal Assistance (PA) needs during the time that SE Ind-JD services are rendered at any given time; however, PA may not comprise the entirety of the SE Ind-JD service(s) being provided.\n\nTransportation during the provision of SE Ind-JD is included in the rates paid for these services. Transportation of the person to and from SE Ind-JD is included in the rates paid for these services when such transportation is needed by the person.\n\nA person's PCSP may include more than one non-residential service (SE Ind services; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wraparound Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).","url":"","verified":"","notes":"","row":20},{"id":"tn-job-coaching-limits-waiver","state":"TN","title":"Job Coaching - Limits(Waiver)","name":"Job Coaching - Limits","source":"Waiver","category":"employment","topic":"limits","text":"o JD Plan or SE Plan: After an individual has received the service for the first time, re-authorization may occur a maximum of once every three years (with a minimum of three 365-day intervals between services), and only if the person, at the time of re-authorization, is not already engaged in IIE or SE, or other services to obtain such employment, and the person has a goal to obtain IIE or SE within 12 months.\n\no JD Start-Up or SE Start-up: After an individual has received the service for the first time, re-authorization may occur a maximum of once per year (with a minimum 365-day interval between services), and only if the person, at the time of reauthorization, is not already engaged in IIE or SE, or other services to obtain such employment, and the person has a goal to obtain IIE or SE within nine (9) months\n\nJob Development may not include placement services of an employment agency or business/financial services. The Waiver will not cover SE-Ind JD services which are otherwise available to the individual under section 110 of the Rehabilitation Act\n\nof 1973, or the IDEA (20 U.S.C. 1401 et seq.). If one or more of these services are authorized, documentation is maintained that the service is not available to the individual under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.)\n\nS E-Ind JD shall not be provided during the same time period that the person is receiving Personal Assistance, Respite, or services under a 504 Plan or Individual Education Program (IEP), is being homeschooled, or any combination thereof, or as  a substitute for education services which are available pursuant to the Individual with Disabilities Education Act (IDEA), but which the person or his/her legal representative has elected to forego. Except for students who have graduated prior to May 2014, employment and day services for school aged persons (i.e., under the age of 22) are limited to regular school break periods. These services are only for individuals seeking or engaged in IIE or SE.\n\nThese services do not include supporting paid employment or training in a sheltered workshop or similar facility-based setting. However, those individuals who are currently employed by a provider to fulfill a contract authorized pursuant to TCA 71-4-701 et seq. may continue to receive supported employment services for paid employment or training until the contract expires or the person loses the employment for any other reason. At that point, any supported employment services the person receives must fully align with best practices in competitive integrated employment and the State’s commitment to Employment First and will no longer be used to support employment or training in a business enterprise owned or operated by or affiliated with a provider of these services. In limited circumstances where the person is working in an integrated employment arrangement, but the provider agency is serving as the Employer of Record (EOR), providers will be permitted to bill for Employment Supports while EOR responsibilities are transitioned from the provider to the business/entity offering the integrated employment opportunity, in order to ensure that employment is not disrupted.\n\nThese services do not include payment for supervisory activities rendered as a normal part of the business setting and supports otherwise available to employees without disabilities filling the same or similar positions in the business. Non-residential habilitation services (SE-Ind (except as noted below); Small Group ES; Community Participation Supports; IE&CI Wrap-Around Supports; FB Day Supports) and either the Residential SNA-Homebound (HB) or the Non-Residential HB Service, when combined, may involve no more than 5,832 quarter hour units/year and no more than 240 quarter hour units in a fourteen day billing period. The Residential SNA-HB and the Non-Residential HB Service are paid on a per diem basis and each day shall be considered as 24 quarter hour units for the purposes of including this service in the annual and billing period limits. Under SE-IES, authorizations of Benefits Counseling, Exploration, Discovery, and Job Development are not included in these limits.\n\nThese services will not duplicate other services provided through the Waiver or the Medicaid State Plan.\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n•Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment;\n\n•Payments that are passed through to users of supported employment services; or\n\n•Payments for training that is not directly related to an individual’s supported employment program.\n\nA provider of SE-Ind JD services may also receive Social Security’s Ticket to Work Outcome and Milestone payment.","url":"","verified":"","notes":"","row":21},{"id":"tn-job-development-waiver-service-agency-provider-specification","state":"TN","title":"Job Development – Waiver Service Agency Provider Specifications (Waiver)","name":"Job Development – Waiver Service Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write,\n\nand communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\n6. All providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers,\n\nincluding quality monitoring requirements.\n\nAgency-employed staff delivering Supported Employment-Individual Job Development services shall also be required to\n\nmeet the following qualifications:\n\nThe staff person shall have successfully obtained training to qualify as a Job Developer as prescribed in TennCare protocol\n\nVerification every 12-18 months","url":"","verified":"","notes":"","row":22},{"id":"tn-job-development-legally-responsible-person-provider-specific","state":"TN","title":"Job Development – Legally Responsible Person Provider Specifications (Waiver)","name":"Job Development – Legally Responsible Person Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\n6. All providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements. Agency-employed staff delivering Supported Employment-Individual Job Development services shall also be required to meet the following qualifications:\n\nThe staff person shall have successfully obtained training to qualify as a Job Developer as prescribed in TennCare protocol\n\nVerification every 12-18 months","url":"","verified":"","notes":"","row":23}]},{"code":"TX","name":"Texas","notes":["No documents for the EF Program"],"entries":[{"id":"tx-employment-assistance-brochure","state":"TX","title":"Employment Assistance (Brochure)","name":"Employment Assistance","source":"Brochure","category":"employment","topic":"definition","text":"Employment assistance through an HCBS waiver program or MCO is provided by the service provider to help find competitive, integrated employment in one’s community. The service provider may:\nIdentify a person’s employment preferences, job skills, and requirements for a work setting\nConduct training on identified needs\nFind prospective employment matched with a person’s identified preferences, skills, and requirements\nContract prospective employers on the person’s behalf and negotiate their employment\nProvide transportation to help the preson locate paid employment in the community\nTake part in serivce planning team meetings","url":"","verified":"","notes":"","row":1},{"id":"tx-supported-employment-brochure","state":"TX","title":"Supported Employment (Brochure)","name":"Supported Employment","source":"Brochure","category":"employment","topic":"definition","text":"A person who already has a job may need ongoing support to keep their job. Supported employment helps a person be self-employed, work from home, or take part in a competitive integrated work setting while succesfully sustaining employment.\n\nThe service provider helps with:\nEmployment adaptions, supervision, and training related to a person’s disability\nTransportation to support the person’s efforts to be self-employed, work from home, or perform in a work setting\nService planning meetings and job coaching as needed","url":"","verified":"","notes":"","row":2}]},{"code":"UT","name":"Utah","notes":[],"entries":[{"id":"ut-individual-supported-employment-description","state":"UT","title":"Individual Supported Employment - Description","name":"Individual Supported Employment - Description","source":"","category":"employment","topic":"definition","text":"SEC services support Persons in their efforts to obtain, maintain, and advance in Competitive Integrated Employment. Supports are provided to the Person from a co-worker when the Person is at work. SEC is a pass through payment to the Person and their co-worker’s Employer.","url":"","verified":"","notes":"","row":1},{"id":"ut-individual-supported-employment-direct-service-requirements","state":"UT","title":"Individual Supported Employment - Direct Service Requirements","name":"Individual Supported Employment - Direct Service Requirements","source":"","category":"employment","topic":"provider","text":"The Contractor shall:\n(1)\tarrange with the employer of a private business for a Person employed in Competitive Integrated Employment to have a Person’s co-worker provide additional support when the Person is scheduled to work; and\n(2)\tprovide the Person’s employer and co-worker with training on the Person’s support needs. The training must be completed by the Person’s job coach who provides the Person with SEI services.","url":"","verified":"","notes":"","row":2},{"id":"ut-individual-supported-employment-direct-service-administrativ","state":"UT","title":"Individual Supported Employment - Direct Service Administrative Requirements","name":"Individual Supported Employment - Direct Service Administrative Requirements","source":"","category":"employment","topic":"provider","text":"The Contractor shall maintain documentation of the pass through funds and co-worker supports the Person received.","url":"","verified":"","notes":"","row":3},{"id":"ut-individual-supported-employment-specific-service-limitations","state":"UT","title":"Individual Supported Employment - Specific Service Limitations","name":"Individual Supported Employment - Specific Service Limitations","source":"","category":"employment","topic":"limits","text":"In addition to the General Limitations section of this contract, the Contractor shall NOT:\n\n(1)\tbill DSPD for supervisory activities that are provided as a normal part of the employment setting;\n(2)\tutilize SEC payments to fund incentive payments or unrelated vocational training expenses; and\n(3)\tbill DSPD for SEC for supporting the Person in a volunteer setting.","url":"","verified":"","notes":"","row":4},{"id":"ut-individual-supported-employment-contractor-qualifications","state":"UT","title":"Individual Supported Employment - Contractor Qualifications","name":"Individual Supported Employment - Contractor Qualifications","source":"","category":"employment","topic":"provider","text":"The Contractor shall provide the Person’s SEI services.","url":"","verified":"","notes":"","row":5},{"id":"ut-individual-supported-employment-outcomes","state":"UT","title":"Individual Supported Employment - Outcomes","name":"Individual Supported Employment - Outcomes","source":"","category":"employment","topic":"activities","text":"(a)\tThe intended outcome of this service is maintenance of Competitive Integrated Employment.\n(b)\tMeasures: The percentage of Persons who remained in Competitive Integrated Employment.\n(c)\tReporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via email to dspdcontracts@utah.gov by August 30th, 60 days after each fiscal year end. The fiscal year annual report must include the following:\n\n(1)\thow many Persons received SEC; and\n(2)\tdata reflecting the measure in (b) above.","url":"","verified":"","notes":"","row":6},{"id":"ut-individual-supported-employment-rate","state":"UT","title":"Individual Supported Employment - Rate","name":"Individual Supported Employment - Rate","source":"","category":"employment","topic":"billing","text":"SEC is a quarter hour rate paid to the Contractor to reimburse the Person’s employer for the co-worker support as a pass-through payment.","url":"","verified":"","notes":"","row":7},{"id":"ut-group-supported-employment-general-description","state":"UT","title":"Group Supported Employment - General Description","name":"Group Supported Employment - General Description","source":"","category":"employment","topic":"definition","text":"SED supports workgroups of Persons in their efforts to obtain, maintain, and advance in Competitive Integrated Employment.","url":"","verified":"","notes":"","row":8},{"id":"ut-group-supported-employment-direct-service-requirements","state":"UT","title":"Group Supported Employment - Direct Service Requirements","name":"Group Supported Employment - Direct Service Requirements","source":"","category":"employment","topic":"provider","text":"(1) provide Persons SED in workgroups including enclaves and mobile work crews. Workgroups can include between two and eight Persons;\n(2)\tprovide workgroup training, supervision and employment at a location not owned by the Contractor in a setting where the Person has opportunity to interact with other individuals who are not part of the SED group and the majority of whom are without disabilities;\n(3)\tassess the Person’s individual skills, interests, preferences, transferable skills, accommodations and potential workplace barriers to prepare them for individual Competitive Integrated Employment. Assessments must take place at an approved facility, employment site, or in the community;\n(4)\tsupport the Person with Informed Choice experiences, conversations and experiences connected to the Competitive Integrated Employment goal in the Person’s PCSP;\n(5)\tprovide the Person’s transportation during the SED program.  The Contractor may bill DSPD for MTP for the Contractor’s transportation of the Person to and from the Person’s home. The Contractor shall provide any necessary Staff during transportation, to ensure the Person’s health and safety; and\n(6) \tmaintain written plans, supports and strategies intended to increase on-the-job independence and fade paid employment services.","url":"","verified":"","notes":"","row":9},{"id":"ut-group-supported-employment-specific-service-limitations","state":"UT","title":"Group Supported Employment - Specific Service Limitations","name":"Group Supported Employment - Specific Service Limitations","source":"","category":"employment","topic":"limits","text":"In addition to the General Limitations section of this contract, the Contractor shall NOT:\n(1)\tutilize SED payments to fund incentive payments, subsidies, or unrelated vocational training expenses, including incentive payments made to an employer or beneficiaries to encourage or subsidize an employer participation in a supported employment program;\n(2)\tpay Persons less than what is paid to other employees without disabilities performing similar labor. If the Contractor pays a Person less than minimum wage, the DHHS service code EPR must be used; and\n(3)\tbill DSPD for SED for the Person’s support in a volunteer setting unless prior written approval was obtained from the DSPD Director or designee.","url":"","verified":"","notes":"","row":10},{"id":"ut-group-supported-employment-specific-service-contractor-quali","state":"UT","title":"Group Supported Employment - Specific Service Contractor Qualifications","name":"Group Supported Employment - Specific Service Contractor Qualifications","source":"","category":"employment","topic":"provider","text":"Prior to providing services, the Contractor shall ensure SED Staff have successfully completed:\n(1)\tACRE training through Utah State University or any accredited program available through the ACRE website; or\n(2)\tBasic Employment Specialist Training (no longer offered); or\n(3)\tbe signed up for and complete the next available Workplace Supports Training through Utah State University. If the SED Staff completes Workplace Supports Training, they may only do job coaching, and NOT job development, assessments, or customized employment. Workplace Supports Training is available here: https://ceiutah.com/workplace-supports-training/","url":"","verified":"","notes":"","row":11},{"id":"ut-group-supported-employment-outcomes","state":"UT","title":"Group Supported Employment - Outcomes","name":"Group Supported Employment - Outcomes","source":"","category":"employment","topic":"activities","text":"(a)\tThe intended outcome of this service is to receive skills building needed to succeed in individual Competitive Integrated Employment\n\n (b)\tMeasures:\n(1)\tthe percentage of Persons who developed skills to move into Competitive Integrated Employment; and\n(2)\tthe percentage of Persons who moved into Competitive Integrated Employment.\n\n (c)Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via email to dspdcontracts@utah.gov by August 30th, 60 days after each fiscal year end. The fiscal year annual report must include the following:\n(1)\thow many Persons received SED; and\n(2)\tdata reflecting the measure in (b) above.","url":"","verified":"","notes":"","row":12},{"id":"ut-group-supported-employment-rate","state":"UT","title":"Group Supported Employment - Rate","name":"Group Supported Employment - Rate","source":"","category":"employment","topic":"billing","text":"SED is a daily rate per Person.","url":"","verified":"","notes":"","row":13},{"id":"ut-supported-employment-enterprise-general-description","state":"UT","title":"Supported Employment Enterprise - General Description","name":"Supported Employment Enterprise - General Description","source":"","category":"employment","topic":"definition","text":"SEE services support Persons who are working competitively to establish, maintain, or advance their self-employment in a business enterprise of the Person’s creation.","url":"","verified":"","notes":"","row":14},{"id":"ut-supported-employment-enterprise-direct-service-requirements","state":"UT","title":"Supported Employment Enterprise - Direct Service Requirements","name":"Supported Employment Enterprise - Direct Service Requirements","source":"","category":"employment","topic":"provider","text":"(a)\tThe Contractor shall conduct assessments with the Person to determine interests, preferences, transferable skills, accommodations and potential workplace barriers of the Person before self-employment. The Contractor shall provide assessments at an approved facility or employment site.\n\n(b)\tThe Contractor shall assist the Person in conducting business enterprise development activities, including:\n(1)\tlocating potential customers in the community;\n(2)\tintroducing the Person to specific customers;\n(3)\tconducting business development and market analyses;\n(4)arranging for certification, licenses and other related activities that will enhance enterprise development and creation opportunities;\n(5)\tcreating a business plan;\n(6)\tobtaining business financing;\n(7)\testablishing and maintaining financial management and accounting systems; and\n(8)\timplementing the business.\n\n (c)\tThe Contractor shall support the person to grow and maintain self-employment business enterprise  including: job coaching, expanding business partners, networking, operations/budgeting tasks, and other duties as approved by DSPD.\n\n (d)\tThe Contractor shall transport the Person to and from the Person’s home and service related activities.\n\n (e) \tIf the Person has indicated a desire to explore other Competitive Integrated Employment, some SEE time may be used to support the Person with Informed Choice conversations and experiences connected to the Competitive Integrated Employment goals and interests.","url":"","verified":"","notes":"","row":15},{"id":"ut-supported-employment-enterprise-specific-service-limitations","state":"UT","title":"Supported Employment Enterprise - Specific Service Limitations","name":"Supported Employment Enterprise - Specific Service Limitations","source":"","category":"employment","topic":"limits","text":"In addition to the General Limitations section of this contract, the Contractor shall NOT:\n\n(1)\tbill DSPD for services that are not for adaptations, supervision, and training required by the Person as a result of the Person’s disability;\n\n(2)\tutilize SEE payments to fund incentive payments, subsidies, or unrelated vocational training expenses, including incentive payments made to an employer or beneficiaries to encourage or subsidize an employer’s participation in a supported employment program;\n\n(3)\tbill DSPD for SEE for supporting the Person in a volunteer setting unless prior written approval has been obtained from the DSPD Director or designee; and\n\n(4)\tbill DSPD for SEE on the same day as SEI.","url":"","verified":"","notes":"","row":16},{"id":"ut-supported-employment-enterprise-contractor-qualifications","state":"UT","title":"Supported Employment Enterprise - Contractor Qualifications","name":"Supported Employment Enterprise - Contractor Qualifications","source":"","category":"employment","topic":"provider","text":"The Contractor shall:\n\n(1) \tprior to providing services, ensure SEE Staff have successfully completed:\n(A)\tACRE training through Utah State University or any accredited program available through the ACRE website; or Basic Employment Specialist Training (no longer offered); and\n(B)\tCustomized Employment Training through Utah State University, available here: https://ceiutah.com/ce-training/.\n\n(2) \tbe signed up for and complete the first available Workplace Supports Training or Effective Job Coach Training through Utah State University. Workplace Supports and Effective Job Coaching Training can only be accessed as a minimum training requirement in SEE when Staff is supervised by another ACRE or Customized Employment trained Staff and the individual employment support only requires job coaching to maintain existing business tasks. Direct Service Requirements outlined in 28.2 to learn new tasks and develop and grow business shall be completed by ACRE or Customized Employment trained Staff.","url":"","verified":"","notes":"","row":17},{"id":"ut-supported-employment-enterprise-outcomes","state":"UT","title":"Supported Employment Enterprise - Outcomes","name":"Supported Employment Enterprise - Outcomes","source":"","category":"employment","topic":"activities","text":"The intended outcome of this service is to create or maintain competitive and integrated self employment with compensation equal to others without disabilities engaging in similar work.\n   (b)\tMeasures: The percentage of Persons who created or maintained self employment with compensation equal to or greater to others without disabilities engaging in similar work.\n   (c)\tReporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via email to dspdcontracts@utah.gov by August 30th, 60 days after each fiscal year end. The fiscal year annual report must include the following:\n(1)\thow many Persons received SEE; and\n\n(2)\tdata reflecting the measure in (b) above.","url":"","verified":"","notes":"","row":18}]},{"code":"VT","name":"Vermont","notes":[],"entries":[]},{"code":"VA","name":"Virginia","notes":[],"entries":[{"id":"va-se-service-description-administrative-code","state":"VA","title":"SE-Service Description (Administrative Code)","name":"SE-Service Description","source":"Administrative Code","category":"employment","topic":"definition","text":"Group and individual supported employment service may be performed for a single individual (as in individual supported employment (ISE)) or in small groups (as in group supported employment) of individuals (two to eight individuals). This service shall consist of ongoing supports provided by a job coach that enable individuals to be employed in an integrated work setting and may include assisting the individual, either as a sole individual or in small groups, to locate a job or develop a job on behalf of the individual, as well as activities needed by the individual to sustain paid work. Group and individual supported employment service shall be covered in the FIS, CL, and BI waivers.\n\n1. Group and individual supported employment service shall be provided in work settings where persons without disabilities are employed. Group and individual supported employment service shall be designed especially for individuals with developmental disabilities who face impediments to employment due to the nature and complexity of their disabilities, irrespective of age or vocational potential, that is, the individual's ability to perform work.\n\n2. Group and individual supported employment service shall be available to individuals for whom competitive integrated employment at or above the minimum wage is unlikely without ongoing supports and who because of their disabilities need ongoing support to perform in a work setting. The individual's assessment and ISP shall clearly reflect the individual's need for employment-related skill-building.\n\n3. Group and individual supported employment service shall be provided in one of two models: individual or group.","url":"","verified":"","notes":"","row":1},{"id":"va-se-group-employment-administrative-code","state":"VA","title":"SE-Group Employment (Administrative Code)","name":"SE-Group Employment","source":"Administrative Code","category":"employment","topic":"definition","text":"Group supported employment service shall be continuous support provided by staff in a naturally occurring place of employment to groups of two to eight individuals with disabilities and involves interactions with the public and coworkers who do not have disabilities. This service shall be provided in a community setting that promotes integration into the workplace and interaction in the workplace between participants and people without disabilities. Examples include mobile crews and other business-based workgroups employing small groups of workers with disabilities in the community. Group supported employment settings shall comply with the HCBS setting requirements per 42 CFR 441.301.","url":"","verified":"","notes":"","row":2},{"id":"va-se-individual-employment-administrative-code","state":"VA","title":"SE-Individual Employment (Administrative Code)","name":"SE-Individual Employment","source":"Administrative Code","category":"employment","topic":"definition","text":"Individual supported employment service shall be one-on-one ongoing support that enables individuals to work in an integrated setting. The outcome of this service shall be sustained paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals. For this service, reimbursement of supported employment shall be limited to actual documented interventions or collateral contacts by the provider as required by the individual receiving waiver services. Reimbursement shall not be provided for the supervisory activities rendered as a normal part of the regular business setting and not for the amount of time the individual enrolled in the waiver is in the supported employment situation.","url":"","verified":"","notes":"","row":3},{"id":"va-se-criteria-and-allowable-activities-administrative-code","state":"VA","title":"SE-Criteria and allowable activities (Administrative Code)","name":"SE-Criteria and allowable activities","source":"Administrative Code","category":"employment","topic":"activities","text":"1. Only activities that specifically pertain to the individual shall be allowable activities under the supported employment service, and DMAS shall cover this service only after determining that this service is not available from DARS or the local school system, for individuals younger than 22 years of age and eligible for school services under IDEA.\n2. To qualify for this service, the individual shall have demonstrated that competitive employment at or above the minimum wage is unlikely without ongoing supports and that because of the individual's disability, he needs ongoing support to perform in a work setting.\n3. The plan for supports shall document the amount of supported employment required by the individual.\n4. Allowable activities for both individual and group supported employment service include the following job development tasks, supports, and training. For DMAS reimbursement to occur, the individual shall be present, unless otherwise noted, when these activities occur:\na. Vocational or job-related discovery or assessment;\nb. Person-centered employment planning that results in employment related outcomes;\nc. Individualized job development, with or without the individual present, that produces an appropriate job match for the individual and the employer to include job analysis or determining job tasks, or both. This element shall be limited to individual supported employment service only and shall not be permitted for group supported employment service.\nd. Negotiation with prospective employers, with or without the individual present;\ne. On-the-job training in work skills required to perform the job;\nf. Ongoing evaluation, supervision, and monitoring of the individual's performance on the job, which does not include supervisory activities rendered as a normal part of the business setting;\ng. Ongoing support necessary to ensure job retention, with or without the individual present;\nh. Supports to ensure the individual's health and safety;\ni. Development of work-related skills essential to obtaining and retaining employment, such as the effective use of community resources, break or lunch areas, and transportation systems; and\nj. Staff provision of transportation between the individual's place of residence and the workplace when other forms of transportation are unavailable or inaccessible. The job coach shall be present with the individual during the provision of transportation.","url":"","verified":"","notes":"","row":4},{"id":"va-se-service-units-and-limits-administrative-code","state":"VA","title":"SE-Service units and Limits (Administrative Code)","name":"SE-Service units and Limits","source":"Administrative Code","category":"employment","topic":"limits","text":"1. Providers shall be reimbursed only for the amount and type of supported employment included in the individual's plan for supports. The unit of service for individual supported employment shall be one hour, and the service shall be limited to 40 hours per week per individual. The unit of service for group supported employment shall be one hour, and the service shall be limited to 40 hours per week per individual.\n2. Reimbursement for group supported employment service shall be based on the size of the group. Individual supported employment service shall be billed according to the DARS fee schedule.\n3. Group and individual supported employment service alone or in combination with the community engagement service, community coaching service, workplace assistance service, or group day service shall not exceed 66 hours per week. Group supported employment service shall take place in nonresidential settings separate from the individual's home.\n4. For time-limited and service authorized periods (not to exceed 24 hours) individual supported employment service may be provided in combination with day service or residential service for purposes of discovery under customized employment. Customized employment means a flexible process designed to personalize the employment relationship between a job candidate or employee and an employer in a way that meets the needs of both. It is based on identifying the strengths, conditions, and interests of a job candidate or employee through a process of discovery.\n5. Group and individual supported employment service shall include a skills development component along with the provision of supports, as needed.\n6. Individual supported employment service can be provided simultaneously with the workplace assistance service to ensure that the workplace assistant is trained and appropriately supervised about supporting an individual through the best practices of individual supported employment.\na. Individual supported employment may be provided with workplace assistance (WPA) when the individual is nearing stability in his job and the job coa
