ailable and funded under the Individuals with Disabilities Education Act (IDEA) (refer to CBSM - Guidance for emP-1.QY.ment services authorization).\n•Vocational services available and funded under Section 110 of the Rehabilitation Act of 1973 (refer to CBSM - Guidance for emP-1.QY.ment services authorization).\n•Vocational services in facility ­based or sheltered workshop settings.","url":"","verified":"","notes":"","row":5},{"id":"mn-employment-exploration-provider-standards-and-qualifications","state":"MN","title":"Employment Exploration -Provider Standards & Qualifications (Community-Based Services Manual)","name":"Employment Exploration -Provider Standards & Qualifications","source":"Community-Based Services Manual","category":"career","topic":"provider","text":"Employment exploration is a DHS enrollment-required service. Employment exploration service providers must:\n•Enroll with Minnesota Health Care Programs (MHCP).\n•Have a 245D license as an intensive support service provider.\n\nFor more information, refer to CBSM -Waiver/AC provider enrollment standards.\nAll providers of employment services must ensure staff competency. For more information, refer to DHS -Employment specialist competencies.\nTo provide employment exploration, providers must have a background study. For more information, refer to CBSM - Waiver/AC service provider overview - Required DHS background studies for direct-contact services.\nA provider licensed under 245D must report all uses of controlled procedures, emergency use of manual restraint and prohibited procedures according to Minn. Stat. §245D.06,. subd. 5 to DHS via the Behavioral Intervention Report Form, DHS-5148.","url":"","verified":"","notes":"","row":6},{"id":"mn-employment-exploration-service-authorization-rates-and-billi","state":"MN","title":"Employment Exploration -Service Authorization Rates & Billing (Community-Based Services Manual)","name":"Employment Exploration -Service Authorization Rates & Billing","source":"Community-Based Services Manual","category":"career","topic":"billing","text":"Employment exploration is a framework service. The lead agency uses the Rate Management System (RMS) to determine rates. For more information, refer to CBSM - RMS.\n\nEmployment services include in-service transportation. Transportation services occurring between the person's place of residence and the site of service are not covered as part of this service and should be billed as waiver transportation (refer to CBSM - TransP-ortation).\nEmployment exploration services should not be billed as DT&H day services, day support services, prevocational services, structured day services or adult day services.\nDT&H day services, day support services, prevocational services, structured day services, group employment support services and adult day services must be authorized and reimbursed on a 15-minute unit basis when provided during the same day as employment exploration services.","url":"","verified":"","notes":"","row":7},{"id":"mn-employment-development-definitions-community-based-services-","state":"MN","title":"Employment Development - Definitions(Community-Based Services Manual)","name":"Employment Development - Definitions","source":"Community-Based Services Manual","category":"employment","topic":"definition","text":"Employment development services: Individualized services designed to help a person achieve competitive, integrated employment, become self-employed or establish a microenterprise business in their community.\n\nMicroenterprise business: A commercial business with five or fewer employees, including the owner(s) of the business.\n\nCompetitive, integrated employment: Employment that pays a minimum wage or an industry standard, customary or prevailing wage with comparable benefits (e.g., health insurance, leave time).","url":"","verified":"","notes":"","row":8},{"id":"mn-employment-development-eligiblity-community-based-services-m","state":"MN","title":"Employment Development - Eligiblity (Community-Based Services Manual)","name":"Employment Development - Eligiblity","source":"Community-Based Services Manual","category":"employment","topic":"eligibility","text":"To receive employment development services, a person must:\n•Be eligible for Brain Injury (Bl), Community Access for Disability Inclusion (CADI), Community Alternative Care (CAC) or Developmental Disabilities (DD) waiver services\n•Have employment development services as an assessed need in their support plan\n•Not have access to the same services through Vocational Rehabilitation Services/State Services for the Blind (VRS/SSB) or Individuals with Disabilities Education Act (IDEA).","url":"","verified":"","notes":"","row":9},{"id":"mn-employment-development-covered-services-community-based-serv","state":"MN","title":"Employment Development - Covered Services (Community-Based Services Manual)","name":"Employment Development - Covered Services","source":"Community-Based Services Manual","category":"employment","topic":"activities","text":"Employment development services consist of both job development services and self­ employment/microenterprise development services. This section includes information about covered services.\nEmployment development services also include a plan phase and a find phase. Services must be authorized and provided under one of these phases. For information about each phase, including expected outcomes of the plan phase, see the service phases section.\n\nCovered job development services that require direct contact with the person include:\n•Individualized, strengths based assessments and employment opportunity discovery strategies\n(Note: This planning phase should not exceed 120 days of service delivery)\n•Support during new employee orientation for up to 30 days after a person starts a new job position\n•In-service transportation\n•Skills training to find and succeed in a job (e.g., interviewing, using community resources, resume writing)\n•Progress review and reporting meetings.\n\nCovered job development services that do not require direct contact with the person include:\n•Employment search assistance and support\n•Benefit(s) fact-gathering, review and analysis to determine how benefits will interact with employment\n•Help with negotiating and finalizing terms of employment\n•Development of job applications, resume and cover letters\n•Outreach with community businesses about available employment opportunities.\n\nCovered self-employment and microenterprise business development services that require direct contact with the person include:\n•Help with determining the type of business the person wants to establish\n•Consultation with the person about all business development activities and plans\n•Help with choosing and registering an available and marketable business name\n•In-service transportation\n•Progress review and reporting meetings.\n\nCovered self-employment and microenterprise business development services that do not require direct contact include collaborating with the person to:\n•Write a business plan\n•Find sources of start-up financing\n•Establish a legal structure for the business\n•Create a marketing and sales plan\n•Find a location and get the appropriate certifications, licenses, permits and variances\n•Purchase all necessary insurances\n•Develop business forms, records, bookkeeping and accounting systems\n•Perform benefit(s) fact gathering, review and analysis to determine how benefits will interact with self-employment.","url":"","verified":"","notes":"","row":10},{"id":"mn-employment-development-non-covered-services-community-based-","state":"MN","title":"Employment Development - Non Covered Services (Community-Based Services Manual)","name":"Employment Development - Non Covered Services","source":"Community-Based Services Manual","category":"employment","topic":"activities","text":"Employment development services do not cover:\n•Incentive payments (e.g., payments to an employer to encourage or subsidize the employer's participation in a development program)\n•Payments for vocational training that is not directly related to the person's development program\n•Direct compensation to supplement a person's wage\n•Special education services available and funded under IDEA or vocational services available and funded under Section 110 of the Rehabilitation Act of 1973\nVocational services in facility­based or sheltered workshop settings.","url":"","verified":"","notes":"","row":11},{"id":"mn-employment-development-service-phases-community-based-servic","state":"MN","title":"Employment Development - Service Phases (Community-Based Services Manual)","name":"Employment Development - Service Phases","source":"Community-Based Services Manual","category":"employment","topic":"activities","text":"Employment development services include a plan phase and a find phase. Services must be authorized and provided under one of these phases.\n\nThe plan phase (T2019 U1) helps the person plan their work goals and discover personal strengths, interests and conditions for employment. The plan phase includes the following excepted outcomes, as part of E1 MN agreements to support people as they transition between VRS/SSB and waiver programs.\n\nFor products associated with these excepted outcomes, helpful resources and information on plan phase activities, see DisabilitY. Hub MN - Work toolkit - Plan.\n\nThe expected outcomes from the plan phase are:\n1.Work goals: The person defines overall work goals that align with their strengths, interests, talents and conditions for success. The goals are informed by person-centered discovery and work­based learning experiences.\n2.Benefits plan: The person knows how work and benefits can go together to support their goals, as well as the tools and resources to help them manage their benefits while working.\n3.Job search launch: The person is set up for success in the find phase with resources and supports in place to help them reach their work goals. They have a positive summary and portfolio that informs their job search. If needed to prevent a gap in services, the person receives employment search assistance during VRS/SSB eligibility/priority of service determination (up to 60 days).\n\nThe find phase (T2019 U8) helps the person search for and obtain competitive, integrated employment or develop a microenterprise business when VRS/SSB is not available. For information and resources to help connect people with VRS/SSB, see DisabilitY. Hub MN - Work toolkit - Find.","url":"","verified":"","notes":"","row":12},{"id":"mn-employment-development-limitations-community-based-services-","state":"MN","title":"Employment Development - Limitations (Community-Based Services Manual)","name":"Employment Development - Limitations","source":"Community-Based Services Manual","category":"employment","topic":"limits","text":"Employment development services are time-limited and should end after a maximum of 12 months following the initial authorization of services. The plan phase should not exceed 120 days of this 12-month timeframe. In some circumstances, the person might need services to continue beyond these time limits. The lead agency can reauthorize employment development services when the person:\n•Has a verifiable change in employment (e.g., lost their employment, faces reduced hours or wants to seek other employment opportunities)\n•Experiences a debilitating health condition or life event that significantly interrupts service delivery\n•Changes service providers\n•Has submitted an application to VRS/SSB and is waiting on a determination of eligibility/priority for up to 60 days (only applies to the plan phase).\n\nWage and benefit compensation must comply with all applicable federal laws and regulations, as well as state statute and rules.\n\nMicroenterprise businesses are restricted to five or fewer people. Service providers cannot be owners, partners, shareholders, operators, employees, independent contractors, subcontractors or otherwise a financial beneficiary of the microenterprise businesses they assist, support and serve.","url":"","verified":"","notes":"","row":13},{"id":"mn-employment-development-secondary-information-community-based","state":"MN","title":"Employment Development - Secondary Information (Community-Based Services Manual)","name":"Employment Development - Secondary Information","source":"Community-Based Services Manual","category":"employment","topic":"definition","text":"A person can receive both employment development services and employment support services if they seek other competitive integrated employment opportunities while currently employed (see CBSM - Employment support services).","url":"","verified":"","notes":"","row":14},{"id":"mn-employment-development-provider-standards-and-qualifications","state":"MN","title":"Employment Development - Provider Standards & Qualifications (Community-Based Services Manual)","name":"Employment Development - Provider Standards & Qualifications","source":"Community-Based Services Manual","category":"employment","topic":"provider","text":"Employment development is a DHS enrollment-required service. Employment development service providers must both:\n•Enroll with Minnesota Health Care Programs (MHCP)\n•Have a 245D license as an intensive support service provider.\n\nAll providers of employment services must ensure staff competency. For more information, see DHS - Employment specialist competencies.\nTo provide employment development, providers must have a background study. For more information, see CBSM - Waiver/ AC service Provider overview - Required DHS background studies for direct-contact services.\nA provider licensed under 245D must report all uses of controlled procedures, emergency use of manual restraint and prohibited procedures according to Minn. Stat. §245D.06,. subd. 5 to DHS via the Behavioral Intervention Report Form, DHS-5148.","url":"","verified":"","notes":"","row":15},{"id":"mn-employment-support-services-definitions-community-based-serv","state":"MN","title":"Employment Support Services - Definitions (Community-Based Services Manual)","name":"Employment Support Services - Definitions","source":"Community-Based Services Manual","category":"employment","topic":"definition","text":"Employment support services: Individualized services and supports that help people maintain paid employment in community businesses/settings. Employment support services occur in integrated community settings.\n\nMicroenterprise business: A commercial business with five or fewer employees, including the owner(s) of the business.","url":"","verified":"","notes":"","row":16},{"id":"mn-employment-support-services-covered-services-community-based","state":"MN","title":"Employment Support Services - Covered services (Community-Based Services Manual)","name":"Employment Support Services - Covered services","source":"Community-Based Services Manual","category":"employment","topic":"activities","text":"Employment support services consist of both job support services and self-employment/microenterprise support services. Covered job support services that require direct contact with the person may include:\n•Job analysis.\n•Job re-design.\n•Coaching and supporting acceptable workplace self-care, proper dress, personal hygiene and grooming.\n•Job training and coaching to strengthen and maintain necessary work skills, behaviors and coworker relationships.\n•Job-related counseling and support, including help understanding earned wages and impact on benefits.\n•Training and coaching the person on job-related transportation.\n•Progress review and reporting meetings.\n•In-service transportation.\n\nCovered job support services that do not require direct contact with the person may include:\n•Arrangement for adaptive accommodations (e.g., modified work tasks or responsibilities, flexible schedules, telecommuting, etc.).\n•Arrangement for assistive technology (e.g., ergonomic workstations, magnifiers, speech­to-text or text-to-speech software, captioning, audio or visual cueing, etc.).\n•Advocacy, negotiation and liaison communication with the employer.\n•Development and strengthening natural work supports.\n•Research and coordination for job-related transportation.\n•Working with the employer to design and implement set schedules for ongoing follow-up support, job coach sharing, fading out and monitoring.\n•Formation of skilled, job specific, work crews and job enclaves for group employment support service arrangements.\n•Data collection, documentation and progress reports on a person's work performance.\n•Benefit(s) fact gathering, review and analysis to determine how a change in circumstances will affect benefits.\nCovered self-employment and microenterprise business support services that require direct contact with the person may include:\n\n•Training, coaching and support services for helping with effective day-to-day operations of all aspects of the business (i.e., marketing, sales, production, order fulfillment, customer service, business technology, bookkeeping, file record maintenance, purchasing, inventory control, financial management, accounting, timely tax reporting and legal compliance).\n•Help with identifying other needed external business resources and services to assist with the continued development and support of the business enterprise.\n•Ongoing analysis and consultation to identify needed supports.\n•Design and implementation of set schedules for ongoing, follow up support.\n•Business-related counseling and support, including help understanding earned wages and impact on benefits.\nCovered self-employment and microenterprise business support services that do not require direct contact with the person may include benefit(s) fact gathering, review and analysis to determine how a change in a person's circumstances will affect benefits.","url":"","verified":"","notes":"","row":17},{"id":"mn-employment-support-services-limitations-community-based-serv","state":"MN","title":"Employment Support Services - Limitations (Community-Based Services Manual)","name":"Employment Support Services - Limitations","source":"Community-Based Services Manual","category":"employment","topic":"limits","text":"A person cannot receive employment support services in groups of more than six people.\n\nA person cannot receive employment support services in a facility-based setting. Employment support services should involve opportunities and experiences for the people receiving the services to interact meaningfully with both coworkers and people in the community without disabilities.\n\nWage and benefit compensation must be compliant with all applicable federal laws and regulations, as well as state statute and rules.\n\nMicroenterprise businesses are restricted to five or fewer people. Service providers cannot be owners, partners, shareholders, operators, employees, independent contractors, subcontractors or otherwise a financial beneficiary of the microenterprise businesses they assist, support and serve.\n\nEmployment support services cannot be provided in businesses that are owned or operated by the same organization that is providing the person's day and employment services.","url":"","verified":"","notes":"","row":18},{"id":"mn-employment-support-services-non-covered-servies-community-ba","state":"MN","title":"Employment Support Services - Non Covered Servies (Community-Based Services Manual)","name":"Employment Support Services - Non Covered Servies","source":"Community-Based Services Manual","category":"employment","topic":"definition","text":"Employment support services do not cover:\n•Incentive payments (e.g., payments to an employer to encourage or subsidize the employer's participation in a support program).\n•Payments for vocational training that is not directly related to the person's support program.\n•Direct compensation to supplement a person's wage.\n•Special education services available and funded under the Individuals with Disabilities Education Act (IDEA)\n•Vocational services available and funded under Section 11 O of the Rehabilitation Act of 1973(refer to CBSM - VRS, IDEA and HCBS employment services - Interim guidance).\n•Vocational services in facility based or sheltered workshop settings.","url":"","verified":"","notes":"","row":19},{"id":"mn-employment-support-services-individual-community-based-servi","state":"MN","title":"Employment Support Services - Individual (Community-Based Services Manual)","name":"Employment Support Services - Individual","source":"Community-Based Services Manual","category":"employment","topic":"definition","text":"Individual employment support services provide services to one person at a time who works at a full-time or part-time, paid job position in a community business (including self-employment).","url":"","verified":"","notes":"","row":20},{"id":"mn-employment-support-services-group-community-based-services-m","state":"MN","title":"Employment Support Services - Group (Community-Based Services Manual)","name":"Employment Support Services - Group","source":"Community-Based Services Manual","category":"employment","topic":"definition","text":"Group employment support services provide support to 2-6 people in a group who work together and share the tasks, duties and responsibilities of a job position in a community business. The group receives support while they:\n•Perform and share the work tasks, duties and responsibilities of a full-time or part-time job position.\n•Divide work tasks, duties and responsibilities of the job position across group members.\n\nA service is not group support if a provider delivers job-coaching support to multiple people who work at their own distinct job positions at different or dispersed locations in a community business. In this situation, the service would be an individual support service with a shared, job-coaching arrangement.","url":"","verified":"","notes":"","row":21},{"id":"mn-employment-support-services-provider-standards-and-qualifica","state":"MN","title":"Employment Support Services - Provider standards and qualifications (Community-Based Services Manual)","name":"Employment Support Services - Provider standards and qualifications","source":"Community-Based Services Manual","category":"employment","topic":"provider","text":"Employment support is a DHS enrollment-required service. Employment support service providers must:\n•Enroll with Minnesota Health Care Programs (MHCP).\n•Have a 245D license as an intensive support service provider.\n\nFor more information, refer to CBSM -Waiver/AC Provider enrollment standards.\n\nAll providers of employment services must ensure staff competency. For more information, refer to DHS -Employment Specialist competencies.\nTo provide employment exploration, providers must have a background study. For more information, refer to CBSM - Waiver/AC service provider overview - Required OHS background studies for direct-contact services.\nA provider licensed under 2450 must report all uses of controlled procedures, emergency use of manual restraint and prohibited procedures according to Minn. Stat. §2450.06,. subd. 5 to OHS via the Behavioral Intervention Report Form, OHS-5148.","url":"","verified":"","notes":"","row":22},{"id":"mn-employment-support-services-service-authorization-rates-and-","state":"MN","title":"Employment Support Services - Service authorization, rates and billing (Community-Based Services Manual)","name":"Employment Support Services - Service authorization, rates and billing","source":"Community-Based Services Manual","category":"employment","topic":"billing","text":"Employment support is a framework service. The lead agency uses the Rate Management System (RMS) to determine rates. For more information, refer to CBSM - RMS.\n\nEmployment services include in-service transportation. Transportation services occurring between the person's place of residence and the site of service are not covered as part of this service and should be billed as waiver transportation (refer to CBSM - Transportation).\n\nIndividual and group employment support should not be billed as DT&H day services, day support services, prevocational services, structured day services or adult day services.\n\nDT&H day services, day support services, prevocational services, structured day services and adult day services must be authorized and reimbursed on a 15-minute unit basis when employment support services are provided during the same day as these services.","url":"","verified":"","notes":"","row":23}]},{"code":"MS","name":"Mississippi","notes":[],"entries":[{"id":"ms-prevocational-services-waiver","state":"MS","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational Services provide meaningful activities of learning and work experiences, including volunteer work, where the person can develop general, non-job task specific strengths and skills that contribute to paid employment in integrated community settings. Prevocational Services are expected to be provided over a defined period of time with specific outcomes to be achieved as determined by the person and his/her team. There must be a written plan to include job exploration, work assessment, and work training. The plan must also include a statement of needed services and the duration of work activities.\n\nPeople receiving Prevocational Services must have employment related outcomes in their Plan of Services and Supports; the general habilitation activities must be individualized and designed to support such employment outcomes. Prevocational Services must enable each person to attain the highest level of work in an integrated setting with the job matched to the person’s interests, strengths, priorities, abilities and capabilities, while following applicable federal wage guidelines. Services are intended to develop and teach general skills associated with building skills necessary to perform work in a competitive, integrated employment.\n\nParticipation in Prevocational Services is not a prerequisite for Supported Employment. A person receiving Prevocational Services may pursue employment opportunities at any time to enter the general work force. At least annually, providers will conduct an orientation informing people receiving services about Supported Employment and other competitive employment opportunities in the community. This documentation must be maintained on site. Representative(s) from the Mississippi Department of Rehabilitation Services must be invited to participate in the orientation.\n\nSettings where Prevocational Services are provided must meet all federal standards for HCBS settings. The setting must be physically accessible to persons. Prevocational Services may be furnished in a variety of locations in the community and are not limited to fixed program locations. Community job exploration activities must be offered to each person based on choices/requests of the persons and be provided individually or in small groups. Documentation of the choices offered, and the chosen activities must be documented in each person’s record. People who have a high level of support need must be included in community job exploration activities. Transportation must be provided to and from the program and for community integration/job exploration.\n\nMobile crews and entrepreneurial models that do not meet the definition of Supported Employment and that are provided in groups of up to three (3) people can be included in Prevocational Services away from the program site and be documented as part of the Plan of Services and Supports.\n\nPeople must be at least 18 years of age. Anyone under the age of 22 must have documentation in their Plan of Services and Supports to indicate he/she has completed their education and/or is no longer attending school","url":"","verified":"","notes":"","row":1},{"id":"ms-prevocational-services-limits-waiver","state":"MS","title":"Prevocational Services – Limits (Waiver)","name":"Prevocational Services – Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"People receiving Prevocational Services may also receive Day Services-Adult but not at the same time of day. Maximum hours for one or combination of the two services cannot exceed 138 hours per month.","url":"","verified":"","notes":"","row":2},{"id":"ms-prevocational-services-service-provider-agency-specification","state":"MS","title":"Prevocational Services – Service Provider Agency Specifications","name":"Prevocational Services – Service Provider Agency Specifications","source":"","category":"prevoc","topic":"provider","text":"People receiving Prevocational Services may also receive Day Services-Adult but not at the same time of day. Maximum hours for one or combination of the two services cannot exceed 138 hours per month.\n\nStudents aging out of school services must be referred to the Mississippi Department of Rehabilitation Services and exhaust those Supported Employment benefits before being able to enroll in Prevocational Services.\n\nProviders must comply with Title 23 of the Mississippi Administrative Code. Waiver specific provider enrollment and compliance requirements for these providers can be found in Rule 5.5 (page 91-118) of Part 208 of the Administrative Code available at https://medicaid.ms.gov/wp content/uploads/2014/01/Admin-Code-Part-208.pdf. Providers must also comply with MDMH Operational Standards (pages 13 - 22) available at https://www.dmh.ms.gov/wp content/uploads/2022/05/Revised-DMH-2020-Operational-Standards-5-19-22-1.pdf.\n\nMississippi Division of Medicaid is responsible for the credentialing of all providers. MDMH is responsible for certification of all providers. The provider agency verifies the qualifications are met for all Prevocational service workers.\n\nQualifications are verified upon enrollment/hire and thereafter as needed.","url":"","verified":"","notes":"","row":3},{"id":"ms-supported-employment-waiver","state":"MS","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Before a person can receive Supported Employment services, he/she must be referred by his/her Support Coordinator to the MS Department of Rehabilitation Services to determine his/her eligibility for services from that agency. Documentation must be maintained in the person’s record that verifies the service is not available under an agency provider funded under Section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et. Seq.). People must be at least 18 years of age. Anyone under the age of 22 must have documentation in their Plan of Services and Supports to indicate he/she has completed their education and are no longer attending school.\n\nSupported Employment is ongoing support for people who, because of their support needs, will need intensive, ongoing services to obtain or maintain a job in competitive, integrated employment or self-employment. Employment must be in an integrated work setting in the general workforce where an individual is compensated at or above the minimum wage but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Supported Employment does not include volunteer work or unpaid internships.\n\nProviders must work to reduce the number of hours of staff involvement as the employee becomes more productive and less dependent on paid supports. This is decided on an individualized basis based on the job. The amount of support is decided with the person and all staff involved as well as the employer, the Department of Rehabilitation Services and the person’s team.\n\nSupported Employment Services are provided in a work location where individuals without disabilities are employed; therefore, payment is made only for adaptations, supervision, and training required by individuals receiving waiver services as a result of their disabilities but does not include payment for the supervisory activities rendered as a normal part of the business setting. Other workplace supports may include services not specifically related to job skills training that enable the individual to be successful in integrating into the job setting (i.e., appropriate attire, social skills, etc.).\n\nProviders must be able to provide all activities that constitute Supported Employment as outlined in MDMH Operational Standards. Job Development activities assist an individual in determining the best type of job for him/her and then locating a job in the community that meets those stated desires. Job Maintenance activities assist an individual to learn and maintain a job in the community. Supported Employment may also include services and supports that assist the individual in achieving self-employment through the operation of a business, either home based or community-based.\n\nTransportation will be provided between the individual's place of residence for job seeking and job coaching as well as between the site of the individual’s job or between day program sites as a component part of Supported Employment. Transportation cannot comprise the entirety of the service. If local or other transportation is available, the individual may choose to use it but the provider is ultimately responsible for ensuring the availability of transportation.","url":"","verified":"","notes":"","row":4},{"id":"ms-supported-employment-limits-waiver","state":"MS","title":"Supported Employment – Limits (Waiver)","name":"Supported Employment – Limits","source":"Waiver","category":"employment","topic":"limits","text":"Individuals cannot receive Supported Employment during the Job Discovery process.\n\nJob Development is limited to ninety (90) hours per certification year. Additional hours may be approved by MDMH on an individual basis with appropriate documentation. The amount of Job Maintenance a person receives is dependent upon individual need, team recommendations, and employer evaluation and as justified in the Plan of Services and Support.\n\nSelf-employment is limited to max of fifty-two (52) hours per month of at home assistance by a job coach, including business plan development and assistance with tasks related to producing the product and max of thirty-five (35) hours per month for assistance in the community by a job coach. Payment is not made for any expenses associated with starting up or operating a business. Referrals for assistance in obtaining supplies and equipment for someone desiring to achieve self-employment should be made to the Mississippi Department of Rehabilitation Services. There must be documentation of the referral in the person’s record.","url":"","verified":"","notes":"","row":5},{"id":"ms-supported-employment-agency-provider-specifications","state":"MS","title":"Supported Employment – Agency Provider Specifications","name":"Supported Employment – Agency Provider Specifications","source":"","category":"employment","topic":"provider","text":"Providers must comply with Title 23 of the Mississippi Administrative Code. Waiver specific provider enrollment and compliance requirements are detailed in Part 208 of the code. Providers must also comply with MDMH Operational Standards.\n\nMississippi Division of Medicaid is responsible for the credentialing of all providers. MDMH is responsible for certification of all providers. The provider agency verifies the qualifications are met for all supported employment staff.\n\nQualifications are verified upon enrollment/hire and thereafter as needed.","url":"","verified":"","notes":"","row":6},{"id":"ms-job-discovery-waiver","state":"MS","title":"Job Discovery (Waiver)","name":"Job Discovery","source":"Waiver","category":"career","topic":"definition","text":"Job Discovery is the person-centered process to assist a person in determining the type of job best fits the person’s unique interests and his/her abilities, skills, and support needs. Job Discovery staff must receive or participate in Customized Employment training as specified by MDMH and use those skills to develop a Job Discovery Profile for the person. Job Discovery includes, but is not limited to, face-to-face interviews with the person and people who know the person well; review of current and previous supports and services; observation of the neighborhood and local community to determine nearby employment, services, transportation, and safety concerns; observation of and participation with the person in typical life activities outside of his/her home; and participation in a familiar activity in which person is at his/her best and most competent. Job Discovery assists the person discover opportunities in job exploration, job shadowing, and internships. Job Discovery also includes other person-centered services such as, but not limited to interviewing skills, job and task analysis activities, environmental and work culture assessments and resume development. Job Discovery may include business plan development for self-employment and development of an employment/career plan.\n\nJob Discovery staff must refer the person to the MS Department of Rehabilitation Services to begin the eligibility process for Supported Employment. The person must also be referred to Community Work Incentives Coordinator at the MS Department of Rehabilitation Services to determine the impact of income on benefits.\n\nPersons eligible for Job Discovery include a person who is an adult (age eighteen or older) and has never worked; a person who has previously had two (2) or more unsuccessful (e.g., were fired for behaviors, inability to perform, etc.) employment placements; a person with multiple disabilities who cannot represent him/herself and has previously or never been successful in obtaining community employment; or a person who has had a significant change in life situation/support needs that directly affects his/her ability to find and maintain a job.","url":"","verified":"","notes":"","row":7},{"id":"ms-job-discovery-limits-waiver","state":"MS","title":"Job Discovery – Limits (Waiver)","name":"Job Discovery – Limits","source":"Waiver","category":"career","topic":"limits","text":"Job Discovery cannot exceed thirty (30) hours of service over a three (3) month period. Additional monthly increments/hours must be justified and prior authorized by the MDMH.\n\nIndividuals who are currently employed or who are receiving Supported Employment Services cannot receive Job Discovery services. A person cannot receive Pre-Vocational Services and/or Day Services-Adult at the same time of day as Job Discovery.","url":"","verified":"","notes":"","row":8},{"id":"ms-job-discovery-agency-provider-specifications-waiver","state":"MS","title":"Job Discovery – Agency Provider Specifications (Waiver)","name":"Job Discovery – Agency Provider Specifications","source":"Waiver","category":"career","topic":"provider","text":"Mississippi Division of Medicaid is responsible for the credentialing of all providers. MDMH is responsible for certification of all providers. The provider agency verifies the qualifications are met for all Job Discovery staff.\n\nWaiver specific provider enrollment and compliance requirements for these providers can be found in Rule 5.5 (page 91-118) of Part 208 of the Administrative Code available at https://medicaid.ms.gov/wp content/uploads/2014/01/Admin-Code-Part-208.pdf. Providers must also comply with MDMH Operational Standards (pages 13 - 22) available at https://www.dmh.ms.gov/wp content/uploads/2022/05/Revised-DMH-2020-Operational-Standards-5-19-22-1.pdf.\n\nQualifications are verified upon enrollment/hire and thereafter as needed","url":"","verified":"","notes":"","row":9}]},{"code":"MO","name":"Missouri","notes":[],"entries":[{"id":"mo-career-planning-provider-manual","state":"MO","title":"Career Planning (Provider Manual)","name":"Career Planning","source":"Provider Manual","category":"career","topic":"definition","text":"Career planning is a comprehensive individualized service which supports a participant with vocational discovery, identification of career themes (pathways), and development of a plan to achieve competitive integrated or self-employment goals. The outcome of this service is documentation of the participant's stated career objective, and a completed career plan/discovery profile used to guide ongoing individual employment support needs.\n\nCareer planning activities may include but are not limited to the coordination and delivery of:\n1.Home and neighborhood observations\n2.Job exploration\n3.Job shadowing\n4.Informational interviewing\n5.Work specific review of assistive technology\n6.Assessment interests and skills\n7.Labor market research\n8.Vocational and job-related discovery on asset development\n\nProviders of this service may coordinate, evaluate, and communicate not only with the individual, but also with their caregivers, support team, employers, teachers, and others who can assist with discovering an individual's skills, abilities, interests, preferences, conditions, and needs. This support and evaluation should be provided to the maximum extent possible in the presence of the individual. It should also be conducted in the community; however, completion of activities in the home or without the presence of the individual is not precluded.\n\nIf an individual is employed, career planning may be used to explore other ongoing competitive employment career objectives which are consistent with the individual's skills and interests or explore advancement opportunities in their chosen career.\n\nCareer planning should be reviewed and considered as a component of an individual's PCSP, no less than annually, more frequently as necessary, or as requested by the individual. These services should be designed to support successful employment outcomes consistent with the individual's goals.\nTransportation costs for the implementation of Career Planning services are included in the service rate.\nPersonal Care Assistance (PCA) may be provided to support an individual while receiving this service but may not comprise the entirety of the service.\n\nOutcomes expected for the career planning service are as follows:\n1.An identified career path and the supports needed for pursuing that career path in ways that can be identified and measured\n2.A career plan which specifies the individual's needs, interests, strengths, natural supports, and characteristics of potential work environments. The plan must also specify training or skills development necessary to achieve the individual's career goals.\n\nCareer planning furnished under the waiver may not include services available under a program funded under Section 110 of the Rehabilitation Act of 1973 and its amendments or section 602(16) and (17) of the Individuals with Disabilities Education Act (20 U.S.C. 1401(16 and 17)). Therefore, the case record for any individual receiving this service must document the individual is not eligible for, unable to access, exhausted services, or is otherwise inapplicable for the aforementioned programs as outlined in an interagency memorandum of understanding between Vocational Rehabilitation (VR) and the Division of DD. Career planning can be authorized, without a referral to VR, in those instances when:\n1.It is currently unknown if an individual is able to prepare, secure, retain, or regain competitive employment and the individual is still exploring if competitive integrated employment is aligned with their abilities and capabilities\n2.An individual has previously been determined ineligible for VR services or closed unsuccessfully from VR as 'disability too severe'\n3.An individual has previously accessed VR and their services were discontinued as VR established thresholds of support and/or outcomes were accomplished","url":"","verified":"","notes":"","row":1},{"id":"mo-job-development-provider-manual","state":"MO","title":"Job Development (Provider Manual)","name":"Job Development","source":"Provider Manual","category":"employment","topic":"definition","text":"Job Development is a support service that facilitates competitive work in an individual integrated work setting. The service must be identified in the PCSP based upon an individualized assessed need that promotes the greatest degree of integration, independence and autonomy.\n\nJob Development services are the supports to individuals who, because of their disabilities, need assistance in obtaining individual competitive or customized employment in an integrated work setting in the general workforce at or above the state's minimum wage, at or above the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nJob Development services may include:\n1.Application completion assistance with the individual\n2.Job interviewing activities with the individual\n3.Completion of job analysis and/or task analysis with or without the presence of the individual based upon individualized need\n4.Negotiation with prospective employers and education of prospective employers of their role in promoting full inclusion with or without the presence of the individual based upon individualized need\n5.Consultation with the prospective employer on the use of assistive technology to promote greater autonomy and independence in the potential workplace\n\nConsultation and negotiation of work hours, wages and earnings\n\nAdditional Information for Job Development services:\n1.Job Development services must be provided in a manner that promotes integration into the workplace and interaction between individuals and people without disabilities in those workplaces while maintaining the individual's rights of dignity, privacy and respect\n2.This service and support should be designed to support a successful employment outcome consistent with the individual's assessed goals, needs, interests and preferences. An individual's autonomy and independence to perform employment with the least amount of restrictions must be supported through the person-centered planning process\n3.Job Development should be reviewed and considered as a component of an individual's person-centered services and supports plan no less than annually, more frequently as necessary or as requested by the individual\n4.Transportation costs are included in the implementation of Job Development service. Job Development furnished under the waiver may not include services available under a program funded under section 110 of the Rehabilitation Act of 1973 and its amendments or section 602(16) and (17) of the Individuals with Disabilities Education Act (20 U.S.C. 1401(16 and 17)). Therefore, the case record for any individual receiving this service must document the individual is not eligible for, unable to access, exhausted services or otherwise inapplicable for the aforementioned programs as outlined in an interagency memorandum of understanding between Vocational Rehabilitation (VR) and the Division of DD. Job Development can be authorized, without a referral to VR, in instances when:\na.An individual has previously been determined ineligible for VR services or closed unsuccessfully from VR as \"disability too severe\"\nb.An individual has previously accessed VR and their services were discontinued as VR established thresholds of support and/or outcomes were accomplished\n\nPCA may be provided to support an individual while receiving Job Development services, but may not comprise the entirety of the service.\n\nFederal Financial Participation (FFP) is not claimed for incentive payments, subsidies or unrelated vocational training expenses such as the following:\n1.Incentive payments made to an employer to encourage or subsidize the employer's participation in a supported employment program\n2.Payments that are passed through to users of community employment programs","url":"","verified":"","notes":"","row":2},{"id":"mo-prevocatial-services-provider-manual","state":"MO","title":"Prevocatial Services(Provider Manual)","name":"Prevocatial Services","source":"Provider Manual","category":"prevoc","topic":"definition","text":"Prevocational services provide one-to-one learning and group experiences to further develop an individual's general, non-job task specific skills needed to succeed in competitive, integrated employment (work settings where compensation is at or above minimum wage). Services are expected to occur over a defined period of time with specific and measurable outcomes to be achieved.\n\nPrevocational services prepare the individual to attain the highest level of independence and autonomy in the most integrated employment setting aligned with the individual's interests, abilities and capabilities.\n\nPrevocational services include activities that are primarily directed at assisting an individual with developing non-job task specific skills that are associated with performing competitive work in community integrated employment. Providers of this service may coordinate, evaluate and communicate not only with the individual but, also with community businesses to develop unpaid work experiences. This service should be provided in the presence of the individual to the maximum extent possible and should be conducted in the community to the maximum extent possible but completion of activities without the presence of the individual should not be precluded.\n\nPrevocational services may include volunteering, uncompensated work experience and compensated work experience settings to support the development of expanded habilitation skills. Any limitations on location or duration of these experiences are established and governed through the US DOL Fair Labor Standards Act and Wage and Hour Laws. It is the service provider's responsibility to understand these industry specific term and act in accordance to DOL regulations.\n\nPrevocational services may be provided in a community setting or at a certified or accredited facility of a qualified employment service provider. The setting for the delivery of services must be aligned with the individualized assessed need and that which is most conducive in developing the specific and measurable outcomes contained within the PCSP. Services cannot be provided within an individual's residence.\n\nPrevocational services are intended to develop and teach expanded habilitative skills that lead to competitive and integrated employment including, but not limited to:\n1.Communication with supervisors, co-workers and customers\n2.Workplace appropriate conduct, hygiene and dress\n3.Workplace problem solving skills\n4.Use of strategies, to include assistive technology, for task attendance and completion\n5.Workplace safety skill\n6.Mobility and motor skills training\n7.Asset development and financial literacy\n\nPrevocational services, which are not covered through HCB waivers, are job task specific skills training required by a participant for the primary purpose of completing those tasks for a specific facility-based job or those delivered in a segregated setting. The distinction between vocational and pre-vocational services is that prevocational services are delivered for the purpose of furthering habilitation goals that will lead to greater opportunities for competitive integrated employment or further career advancement.\n\nParticipation in prevocational services is not a prerequisite for supported employment services. Prevocational services should only be authorized when an individual is otherwise unable to directly enter the general workforce as a result of an underdeveloped or undeveloped general, non-job­task- specific skill(s).\n\nPrevocational services can be provided in small groups not exceeding four ( 4) individuals at a time. The decision to provide services in a group setting must be based on individualized assessed need and be supported in the PCSP as being the most autonomous setting which facilitates the highest levels of individual learning.\n\nThe provision of prevocational services is always delivered with the intention of developing skills which will lead to competitive integrated employment. Volunteering for personal reasons not related to future employment would not be Prevocational services.\n1.All prevocational service options should be reviewed and considered as a component of an individual's person-centered services and supports plan no less than annually, more frequently as necessary or as requested by the individual.\n2.These services and supports should be designed to support successful employment outcomes consistent with the individual's goals.\n3.PA services may be a component of prevocational service as necessary for the individual to participate in the service but may not comprise the entirety of the service\n4.Transportation costs for implementation of prevocational services are included in the service rate.\n5.Individuals who receive prevocational services may also receive supported employment and/or DH services. A participant's PCSP may include two (2) or more types of non­residential habilitation services. However, different types of non-residential habilitation services may not be billed during the same period of the day, unless specifically permitted under the service definition.\n6.Prevocational services furnished under the waiver may not include services available under a program funded under section 110 of the Rehabilitation Act of 1973 and its amendments or section 602(16) and (17) of the Individuals with Disabilities Education Act (20 U.S.C. 1401(16 and 17)). Therefore, the case record for any individual receiving this service must document the individual is not eligible for, unable to access, exhausted services or otherwise inapplicable for the aforementioned programs as outlined in an interagency MOU between VR and the Division of DD.\n\nPrevocational services must comply with 42 CFR 440.1801(2){i)\n\nOutcomes expected for this service are as follows:\n1.Identification of the skills being developed\n2.Actions steps and planning to include a timeline and steps necessary to achieve the outcome by unit of service\n3.Progress measures on the skills being developed for the outcome(s) identified\n4.Providers of prevocational services must maintain an individualized plan and detailed record of activities by unit of service.","url":"","verified":"","notes":"","row":3},{"id":"mo-supported-employment-provider-manual","state":"MO","title":"Supported Employment (Provider Manual)","name":"Supported Employment","source":"Provider Manual","category":"employment","topic":"definition","text":"Supported Employment is a support service to facilitate competitive work in ain integrated work setting. The service must be identified in the PCSP based upon an individualized assessed need which promotes the greatest degree of integration, independence and autonomy. Models of supported employment may include individual support or group support such as community business-based work groups and or mobile crews. Individual and group services are defined separately below.\n\nFor those individuals whose individualized assessed need supports self-employment, Supported Employment Individual employment supports may include services and supports that assist the individual in achieving self-employment through the operation of a business; however, MHD funds may not be used to defray the expenses associated with starting up or operating a business.\n\nAssistance for self-employment may include:\n1.Aide to the individual in identifying potential business opportunities\n2.Assistance in the development of a business plan, including potential sources of business financing and other assistance in developing and launching a business\n3.Identification of the supports that are necessary for the individual to operate the business\n4.Ongoing assistance, counseling and guidance once the business has been launched","url":"","verified":"","notes":"","row":4},{"id":"mo-supported-employment-individual-support-provider-manual","state":"MO","title":"Supported Employment - Individual Support (Provider Manual)","name":"Supported Employment - Individual Support","source":"Provider Manual","category":"employment","topic":"definition","text":"Individual Supported Employment services are the ongoing supports provided to individuals and their employers who, because of their disabilities, need intensive on-going support to maintain a job in competitive or customized employment, or self-employment, in an integrated work setting in the general workforce at or above the state's minimum wage, at or above the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The outcome of this service is sustained paid employment at or above the minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals.\n\nSupported Employment - Individual Supported Employment services may include:\n1.On-the-job training in work and work-related skills; i.e. job coaching to facilitate the acquisition, and ongoing performance, of the essential functions of the job and the facilitation of natural supports (i.e. fading)\n2.Ongoing retention, supervision and monitoring of the individual's performance; i.e. evaluating self-maintenance strategies, work production and the effectiveness of natural supports (i.e. fading) which promote the greatest degree of inclusion, integration and autonomy\n3.Training in related skills needed to retain employment; i.e. supporting and facilitating strategies which promote attendance and social inclusion in the workplace based upon individualized assessed need such as using community resources and public transportation\n\nSupported Employment - Individual can be authorized, without a referral to VR, in those instances when:\n1.Individuals who in the delivery of waiver funded preparatory, planning and habilitative employment services (i.e. Career Planning or Prevocational Services) become employed\n2.An individual has previously been determined ineligible for VR services or closed unsuccessfully from VR as \"disability too severe\"\n3.An individual has previously accessed VR and their services were discontinued as VR established thresholds of support and/or outcomes were accomplished","url":"","verified":"","notes":"","row":5},{"id":"mo-supported-employment-small-group-support-provider-manual","state":"MO","title":"Supported Employment - Small Group Support (Provider Manual)","name":"Supported Employment - Small Group Support","source":"Provider Manual","category":"employment","topic":"definition","text":"Group Supported Employment are services and training activities provided in regular community business and industry settings for groups of two (2) to four ( 4) workers with disabilities. Small group employment support does not include services provided in facility based work settings or non- integrated work settings (i.e. settings which physically and socially isolate individuals from other employees).\n\nExamples include mobile crews and other community business-based workgroups employing small groups of workers with disabilities in integrated competitive employment in the community.\n\nThe outcome of this service is sustained paid employment, work experience leading to further career development and individual integrated community-based employment for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. An annual review must occur to determine if the employment setting optimizes, but does not regiment, individual initiative, autonomy and independence in making employment choices.\n\nSupported Employment- Small Group Employment Supports may include:\n1.On-the-job training in work and work-related skills; i.e. job coaching to facilitate the acquisition, and ongoing performance, of the essential functions of the job and the facilitation of natural supports (i.e. fading)\n2.Ongoing supervision and monitoring of the individual's performance on the job; i.e. evaluating self-maintenance production and the effectiveness of natural supports (i.e. fading) which promote the greatest degree of inclusion, integration and autonomy\n3.Training in related skills needed to retain individual integrated community-based employment; i.e. supporting and facilitating strategies which promote attendance and social inclusion in the workplace based upon individualized assessed need such as using community resources and public transportation Additional Information about Supported Employment services:\n\n1.Supported employment services must be provided in a manner that promotes integration into the workplace and interaction between individuals and people without disabilities in those workplaces while maintaining the individual's rights of dignity, privacy and respect\n2.All supported employment service options should be reviewed and considered as a component of an individual's person-centered services and supports plan no less than annually, more frequently as necessary or as requested by the individual\n3.These services and supports should be designed to support successful employment outcomes consistent with the individual's assessed goals, needs, interests and preferences\n4.Supported Employment Group is not appropriate for individuals who demonstrate the capacity, ability and interest to work independently\n5.An individual's autonomy and independence to perform employment with the least amount of restrictions must be supported through the person-centered planning process\n\nSupported Employment - Group can be authorized without a referral to VR as VR does not provide this service.","url":"","verified":"","notes":"","row":6}]},{"code":"MT","name":"Montana","notes":[],"entries":[{"id":"mt-supported-employment-individual-employment-support-dd-provid","state":"MT","title":"Supported Employment - Individual Employment Support (DD Provider Manual)","name":"Supported Employment - Individual Employment Support","source":"DD Provider Manual","category":"employment","topic":"definition","text":"Services and supports needed by a person to acquire or advance in a job or career in a competitive, customized, or self-employment setting.","url":"","verified":"","notes":"","row":1},{"id":"mt-supported-employment-group-employment-support-dd-provider-ma","state":"MT","title":"Supported Employment - Group Employment Support (DD Provider Manual)","name":"Supported Employment - Group Employment Support","source":"DD Provider Manual","category":"employment","topic":"definition","text":"Teaching and supports for groups of two to eight people with developmental disabilities working together in the general workforce.","url":"","verified":"","notes":"","row":2},{"id":"mt-prevocational-services-waiver","state":"MT","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational Training services are habilitative activities that foster employability for a member.\n\nMust not be provided if they are available under a program funded under Section 110 of the Rehabilitation Act of 1973 or Section 602(16) and (17) of the Education of the Handicapped Act. The Case Management Team must document in the file of each individual receiving this service that the service is not otherwise available under a program funded under the Rehabilitation Act of 1973 or P.L. 94-142. This documentation may be obtained by working with the Department of Public Health and Human Services Vocational Rehabilitation programs; Are aimed at preparing an individual for paid or unpaid employment and includes teaching such concepts as compliance, attendance, task completion, problem solving, endurance, work speed, work accuracy, attention span, motor skills and safety.\n\nA person receiving pre-vocational services may pursue employment opportunities at any time to enter the general work force. Pre-vocational services are intended to assist individuals to enter the general workforce. This service must provide opportunity and support members to obtain and maintain community employment in the most integrated settings. This service must not be delivered in facility based or sheltered work settings where individuals are supervised for the primary purpose of producing goods or performing services. This service must be delivered\n\nfor the purpose of furthering habilitation goals such as attendance, task completion, problem solving, interpersonal relations and safety as outlined in the person’s service.\n\nTransportation between the participant’s place of residence and the prevocation site/s is not provided as a component of this service.\n\nActivities included in this service are generally not directed at teaching specific job skills, but underlying habilitative goals, such as attention span and motor skills. All prevocational services will be reflected in the member's service plan.\n\nIndividuals participating in prevocational services may be compensated in accordance with applicable federal laws and regulations and the provision of prevocational services is always delivered with the intention of leading to permanent integrated employment at or above the minimum wage in the community.\"\n\nAll prevocational and supported employment service options should be reviewed and considered as a component of an individual’s person-centered services and supports plan no less than annually, more frequently as necessary or as requested by the individual. These services and supports should be designed to support successful employment outcomes consistent with the individual’s goals.\n\nPersonal care/assistance may be a component of prevocational services but may not comprise the entirety of the service.\n\nIndividuals who receive prevocational services may also receive educational, supported employment and/or day habilitation services. A participant’s person-centered service plan may include two or more types of non-residential habilitation services. However, different types of non-residential habilitation services may not be billed during the same period of the day.\n\nPrevocational services may include volunteer work, such as volunteer learning and training activities that prepare a person for entry into the paid workforce\n\nPrevocational Training services shall be authorized and delivered using person-centered practices","url":"","verified":"","notes":"","row":3},{"id":"mt-prevocational-services-limits-waiver","state":"MT","title":"Prevocational Services - Limits (Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"Any activities provided under this service must be tied to goals and objectives in the individualized service plan and necessary to avoid institutionalization.\n\nPre-vocational services do not include services that are available under the Rehabilitation Act (or, in the case of youth, under the provisions of the IDEA).\n\nPrevocational services are intended to be time limited allowing people to develop needed skills and then move on to paid employment","url":"","verified":"","notes":"","row":4},{"id":"mt-prevocational-services-provider-specifications-waiver","state":"MT","title":"Prevocational Services - Provider Specifications (Waiver)","name":"Prevocational Services - Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"An entity providing prevocational services must have two years' experience in providing services to persons with physical disabilities and be an enrolled BSW Supported Living provider.\n\nThe entity, inclusive of its staff, providing habilitation services, must be qualified generally to provide the services and specifically to meet each consumer's defined habilitation needs.\n\nPrior to hire:\n\na. Be at least 17 years of age.\nb. Within 30 days of hire receive training in:\n\nAbuse reporting,\n\nIncident reporting,\n\nClient confidentiality, and\n\nAny specialty training relating to the needs of the member served, as outlined in the plan of care.","url":"","verified":"","notes":"","row":5},{"id":"mt-individual-supported-employment-waiver","state":"MT","title":"Individual Supported Employment (Waiver)","name":"Individual Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment-Individual Employment Support services are the ongoing supports to participants who, because of their disabilities, need intensive on-going support to obtain and maintain an individual job in competitive or customized employment, or self-employment in an integrated work setting in the general workforce at or above the state's minimum wage, at or above the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The outcome of this service is sustained paid employment at or above the minimum wage in an integrated setting in the general workforce, in a job that meets the personal and career goals of the member. This service is required to be provided on a one-to-one basis.\n\na. Supported Employment is not intended for people working in mobile work crews of small groups of people with disabilities in the community.\n\nb. Supported Employment does not include facility-based, or other similar types of vocational services furnished in specialized facilities that are not a part of the general workplace.\n\nc. All prevocational and supported employment service options should be reviewed and considered as a component of an individual’s person-centered services and supports plan no less than annually, more frequently as necessary or as requested by the individual. These services and supports should be designed to support successful employment outcomes consistent with the individual’s goals.\n\ne. Supported Employment does not include volunteer work. Such volunteer learning and training activities that prepare a person for entry into the paid workforce are addressed through pre-vocational services.\n\nf. Supported Employment does not include payment for supervision, training, support and adaptations typically available to other workers without disabilities filling similar positions in the business.\n\ng. Personal care/assistance may be a component part of supported employment individual employment supports but may not comprise the entirety of the service.","url":"","verified":"","notes":"","row":6},{"id":"mt-individual-supported-employment-waiver-payment","state":"MT","title":"Individual Supported Employment (Waiver) - Payment","name":"Individual Supported Employment (Waiver) - Payment","source":"","category":"employment","topic":"definition","text":"When supported employment services are provided at a work site in which persons without disabilities are employed, payment will be made only for the adaptations, supervision and training required by BSW members as a result of their disabilities, and will not include payment for the supervisory activities rendered as a normal part of the business setting by the employer or for items the employer is required to provide under the Americans with Disabilities Act.","url":"","verified":"","notes":"","row":7},{"id":"mt-individual-supported-employment-exlcusion-and-documentation-","state":"MT","title":"Individual Supported Employment - Exlcusion & Documentation (Waiver)","name":"Individual Supported Employment - Exlcusion & Documentation","source":"Waiver","category":"employment","topic":"documentation","text":"Supported Employment services rendered under BSW are not available under a program funded by either the Rehabilitation Act of 1973, or P.L. 94-142. Documentation will be maintained in the file of each individual receiving this service that the service is not otherwise available under a program funded under the Rehabilitation Act of 1973 or P.L. 94-142. This documentation may be obtained by working with the DPHHS Vocational Rehabilitation program.","url":"","verified":"","notes":"","row":8},{"id":"mt-individual-supported-employment-transportation-waiver","state":"MT","title":"Individual Supported Employment - Transportation (Waiver)","name":"Individual Supported Employment - Transportation","source":"Waiver","category":"employment","topic":"definition","text":"Transportation may be provided between the member's place of residence and the job site, or between job sites (in cases where the member is working in more than one place) as a component part of supported employment services","url":"","verified":"","notes":"","row":9},{"id":"mt-supported-employment-provider-specifications","state":"MT","title":"Supported Employment - Provider Specifications","name":"Supported Employment - Provider Specifications","source":"","category":"employment","topic":"provider","text":"An entity inclusive of its staff, providing habilitation services must be qualified generally to provide the services and specifically to meet each consumer's defined habilitation needs.\n\nPrior to hire:\n\n*Be at least 17 years of age.\n\nWithin 30 days of hire receive training in:\n\n*Abuse reporting,\n\n*Incident reporting,\n\n*Client confidentiality, and\n\n*Any specialty training relating to the needs of the member served, as outlined in the plan of car","url":"","verified":"","notes":"","row":10}]},{"code":"NE","name":"Nebraska","notes":[],"entries":[{"id":"ne-supported-employment-individual-service-defintion","state":"NE","title":"Supported Employment - Individual - Service Defintion","name":"Supported Employment - Individual - Service Defintion","source":"","category":"employment","topic":"definition","text":"Supported Employment- Individual is a habilitative service to provide a job coach for one-on-one teaching to help a participant maintain competitive integrated employment. Supported Employment - Individual must be provided in an integrated community employment setting.","url":"","verified":"","notes":"","row":1},{"id":"ne-supported-employment-individual-conditions-of-provisions","state":"NE","title":"Supported Employment - Individual - Conditions of Provisions","name":"Supported Employment - Individual - Conditions of Provisions","source":"","category":"employment","topic":"definition","text":"1.A participant chooses each service based on their needs.\n1a.Services should increase independence and community integration; and\n1b.The chosen waiver services and who provides them are documented in the participant's Person-Centered Plan (PCP).\n\n2.Supported Employment - Individual includes:\n2a.Habilitation programs to maintain and increase employment-related skills;\n2b.Connecting participants with coworkers at the work site and advocating for the participant;\n2c.Developing a plan to decrease the need for a job coach; and\n2d.Referring the participant to gain access to an employment network, Ticket to Work services, Work Incentive Planning and Assistance (WIPA) services, or other qualified employment service programs, which provide benefits planning.\n\n3.Supported Employment - Individual is a habilitative service and must include habilitation programs. Individual habilitation programs must be conducted, and data recorded each time the service is provided.\n\n4.Supported Employment - Individual may include self-employment businesses. Being self ­employed means:\n4a.Running a profitable operation and generating cash flow by providing specific goods, products or billable services;\n4b.Earning income directly from one's own trade or profession, operated directly by the participant; and\n4c.Maintaining at least 51 % ownership of the business.\n\n5.A portion of this service can be delivered virtually, which includes but is not limited to:\n5a.The participant's needs must be able to be met with verbal cueing and other support that can be provided virtually;\n5b.Available to participants in the basic and intermediate funding tier;\n5c.The majority of Supported Employment - Individual provided each week must be provided in-person;\n5d.The total combined hours for virtual supports may not exceed a weekly amount of 10 hours; and\n5e.These 10 hours are included in the 35 hours per week cap of day services.\n\n6.Examples of Supported Employment- Individual may include but are not limited to:\n6a.Learning a work schedule;\n6b.Working alongside with coworkers;\n6c.Talking with the boss about work needs; or\n6d.Learning job expectations.\n\n7.Supported Employment - Individual has the following limitations:\n7a.Supported Employment - Individual can only be authorized when a participant has completed VR milestones.\n7a.a It cannot be authorized for someone who found a job on their own; or\n7a.b For situations where a provider informally supported the participant outside of the Vocational Rehabilitation process.\n7b.Supported Employment - Individual cannot take place in a setting owned or operated by a DD provider.\n7c.A participant may receive Supported Employment - Individual in combination with other day services, but the total combined hours cannot exceed 1820 hours per year. requirements.\n\n8.Supported Employment - Individual shall exclude any services available through public education programs funded under the Individuals with Disabilities Education Act (IDEA).\n8a.This includes services not otherwise available through public education programs in the participant's local school district, including after-school supervision and daytime services when school is not in session (such as summer breaks and/or scheduled school holidays, in-service days).\n8b.Services cannot be provided during the school hours set by the local school district.\n8c.Regular school hours and days apply for a child who receives home schooling.\n\n9.Supported Employment - Individual cannot overlap with, replace, or duplicate other similar services provided through Medicaid or Vocational Rehabilitation.","url":"","verified":"","notes":"","row":2},{"id":"ne-supported-employment-individual-provider-requirements","state":"NE","title":"Supported Employment - Individual - Provider Requirements","name":"Supported Employment - Individual - Provider Requirements","source":"","category":"employment","topic":"provider","text":"1.All providers of waiver services must:\n1a.Be a Medicaid provider;\n1b.Comply with all applicable Titles of the Nebraska Administrative Code and Nebraska State Statutes;\n1c.Adhere to standards as described in the Division of Medicaid and Long-Term Care Service Provider Agreement;\n1d.Complete DHHS trainings upon request; and\n1e.Use universal precautions.\n\n2.Supported Employment- Individual can be offered by a DD agency provider or independent provider.","url":"","verified":"","notes":"","row":3}]},{"code":"NV","name":"Nevada","notes":[],"entries":[{"id":"nv-prevocational-services-waiver","state":"NV","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational Services are intended to provide recipients with opportunities to develop basic work skills, such as following directions, working independently, and problem-solving, as well as to learn about different types of jobs and careers in the most integrated setting with the ultimate goal of community employment. Prevocational services may include:\n\n• Prevocational Services Assessment: To determine whether a recipient continues to need the allowable prevocational services and job readiness preparation.\n\n• Work Readiness training: This includes activities to help recip
