t will have full control of virtual support devices and have the ability to turn on and off the device and end services any time they wish. In order to ensure the health and safety of the participant, the plan of care team must assess and monitor the appropriateness and effectiveness of virtual support with the participant. The Individual Service Plan (ISP) must include a justification statement explaining how remote support assures health and safety If it is determined that in-person assistance is required, virtual support may not be provided.\n\nEmployment Readiness remote support services provide learning and work experiences, including volunteer work, and support persons on their pathway to competitive, integrated employment and consist of the following:\n\n(a)Providing opportunities for persons enrolled in the Waiver to develop general, non-job, task-specific strengths and skills that contribute to employability and are consistent with the person’s goals;\n\n(b)Assessment activities that occur annually or more frequently based upon the needs of the person, which require, at a minimum, a Positive Personal Profile and Job Search and Community Participation Plan, and may also include a customized employment assessment, and/or conducting a person-centered vocational and situational assessment and employment readiness assessments provided at community businesses and other community settings;\n\n(c)Social and soft skills training, including, but not limited to, the following:\n\n(1)Following and interpreting instructions;\n(2)Interpersonal skills, including building and maintaining relationships;\n(3)Communication skills for communicating with supervisors, co-workers, and customers;\n(4)Travel skills;\n(5)Respecting the rights of others and understanding personal rights and responsibilities;\n(6)Decision-making skills and strategies;\n\n(7)Support for self-determination and self-advocacy; and\n\n(8)Budgeting and money management;\n\n(d)Developing work skills which shall include, at a minimum, teaching the person the following:\n\n(1)Appropriate workplace attire, attitude, and conduct;\n(2)Work ethics;\n(3)Attendance and punctuality;\n(4)Task completion;\n(5)Job safety;\n(6)Attending to personal needs, such as personal hygiene or medication management; and\n(7)Interviewing skills;\n\n(e)Coordinating transportation to community activities utilizing the Medicaid Non-Emergency Transportation Broker;\n\n(f)Employment exploration and/ or employment preparation in the community; and\n\n(g)Coordinating community-based, integrated, volunteer experiences.\n\nEmployment Readiness remote support service staffing ratio is 1:6 and must have active, continuous engagement and contact with the remote support platform. Staff should be available during the service hours and document that they are continuously engaged with the person and/or the remote supports responder platform to bill for hourly services rendered","url":"","verified":"","notes":"","row":1},{"id":"dc-prevocational-services-employment-readiness-limit-waiver","state":"DC","title":"Prevocational Services/Employment Readiness - Limit (Waiver)","name":"Prevocational Services/Employment Readiness - Limit","source":"Waiver","category":"prevoc","topic":"limits","text":"Services are not available to people who can be fully supported individuals in programs funded under Section 110 of the Rehabilitation Act of 1973 or Section 602(16) and (17) of the Individuals with Disabilities Education Act, 20 U.S.C. 1401 (16) and (71), but may be used to wrap around those programs.\n\nAny new Employment Readiness setting must be fully compliant with the requirements of the HCBS Settings Rule.\n\nCurrent Employment Readiness settings that have a daily census under fifty people in the setting for more than 20% of the day, may only receive authorizations for services for new participants up to a daily census of fifty people in the setting. The daily census is inclusive of people who receive support through the IDD HCBS Waiver and people who receive ICF/IDD supports and are engaged in active treatment at the setting. There are no current Employment Readiness settings with a daily census of more than 50 people in the setting.\n\nTime limitations on use of Employment Readiness services:\n\nFor people who are not currently enrolled in Employment Readiness services, the service may only be authorized for up to one year, except that DDS may approve up to a one year extension if there is documentation that the person is\n\nmaking progress towards competitive integrated employment and would benefit from extended services.\n\nIf a person has exhausted Employment Readiness services and: (1) has had at least one year since the end of that service; (2) expresses an interest in employment; and (3) the support team has identified specific goals around building employment skills that are reflected in the ISP, then DDS may authorize Employment Readiness services one time, for up to one year. (Total of up to three years of Employment Readiness services.)\n\nException: At any time that a person loses his or her job, or is employed and is seeking to learn new job skills, DDS may authorize Employment Readiness services for up to one year.\n\nMedicaid reimbursement employment readiness services shall not be provided, or billed at the same time as the following services: day habilitation, supported employment, in-home supports, companion, personal care services, and individualized day supports.\n\nThe employment readiness service includes transportation furnished by the provider during the course of the service.\n\nWhile the State Plan includes a transportation benefit, and providers under that benefit are capable of transporting IDD Waiver individuals, this benefit is only used by IDD waiver beneficiaries to reach the employment readiness site. This is because the State Plan transportation benefit cannot provide real-time services dedicated to a particular provider’s needs. State Plan transportation services are coordinated by a non-emergency medical transportation broker. The service must be reserved in advance, and trips often include other non-IDD waiver beneficiaries on their way to a variety of destinations. As a result, it is not practical for a beneficiary to rely on transportation arranged by the broker during an episode of an employment readiness service. The employment readiness service covers such transportation, and it is separate and distinct from the State Plan transportation service generally.\n\nThere shall be no increase to the number of facility-based settings shall be authorized. Current providers will be prohibited from increasing the number of facility-based settings at which services are provided, and newly enrolling providers shall be prohibited from providing services at any facility-based settings.\n\nThis service can be provided using remote support no more than four (4) hours per day. The IDT will need to assess the person’s ability to benefit from remote services engagement to determine how many hours the person can engage in remote support for employment readiness. Employment readiness services can be implemented partially in-person and partially remote supports.\n\nServices cannot be delivered remotely one hundred (100) percent of the time.","url":"","verified":"","notes":"","row":2},{"id":"dc-prevocational-services-employment-readiness-provider-specifi","state":"DC","title":"Prevocational Services/Employment Readiness - Provider Specifications (Waiver)","name":"Prevocational Services/Employment Readiness - Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"DDS Provider Certification Review per DDS Policy Certified Enabling Technology Integration Specialist (ETIS) employed by a Shift Accredited DDS Service Provider or Enabling Technology Credential (ETC) Shift is the developmental and disability services industry’s first online learning curriculum and community that standardizes best practices in Technology First programming. The program is accredited by the National Association of Direct Support Professionals. Currently, it includes three (3) programs:\n\n1. Enabling Technology Credential for professionals who want to learn more about how to use enabling technology as a natural support for people with Intellectual and Developmental Disabilities;\n\n2. Enabling Technology Integration Specialist Certification that provides specialized training in person-centered technology assessment and implementation; and\n\n3. Technology First Accreditation for organizations demonstrating sustainable and standardized best practices in enabling technology integration.\n\nEach Employment Readiness services provider shall:\n\nBe a home health agency, social service agency, or other business entity;\n\nHave a current District of Columbia Medicaid Provider Agreement that authorizes the provider to bill for prevocational services under the Waiver;\n\nOwner-operators shall complete training in Person-Centered Thinking, Supported Decision-making, Supporting Community Integration, and any other topics determined by DDS, and in accordance with DDS published guidance within one year from the date the waiver application becomes effective for current providers and prior to any new waiver provider becoming approved to initiate services.\n\n\"Provider must be enrolled as a provider for Rehabilitation Services Administration (RSA) within one year of becoming an Employment Readiness provider for new providers. For individual employees, the following requirements apply:\n\nDocumentation that each employee is eighteen (18) years of age or older;\n\nDocumentation from a physician or other official stating that the employee is free from  communicable disease as confirmed by a purified protein derivative of tuberculin (PPD) Skin Test in accordance with current Centers for Disease Control (CDC) guidelines;\n\nRecord of completion of competency-based training in communication with people with intellectual disabilities;\n\nRecord of completion of competency-based training in infection control procedures consistent with the requirements of the Occupational Safety and Health Administration, U.S. Department of Labor regulations at 29 CFR 1910. 1030;\n\nA high school diploma or general equivalency development;\n\n(GED) certificate from English speaking program or ESL certificate;\n\n Record of completion of competency-based training in emergency procedures;\n\nCertification (active) in cardiopulmonary resuscitation (CPR) and First Aid;\n\nCOVID vaccination in accordance with DC Health Rules 22 DCMR B230.2. With the addition of the COVID vaccination requirement, the District assures that an adequate provider pool will be maintained;\n\nRecord of completion of DDS-approved pre-service and in-service training in DDS policies and procedures;\n\nTraining needed to address the unique support needs of the individual as detailed in their ISP.\n\nFor direct support professionals providing 1:1 employment readiness services, the following requirements apply:\n\nBe trained in physical management techniques, positive behavioral support practices, and other training required to implement the person’s health care management plan and behavioral support plan (BSP), in accordance with DDS’s Training policy and procedure; Accurately complete the behavioral data sheets when required by a person's BSP.\n\nWithin one year of becoming an employment readiness provider:\n\nThe provider shall maintain evidence of completion of a professional development course that will satisfy a Basic Employment Certificate or comparable as required by the Association of Community Rehabilitation Educators (ACRE). In addition to the requirements stated above, for all staff working directly with persons with disabilities, particularly in job development and placement, the following topic areas should be covered by the course or training and obtained within a year:\n\nApplication of Core Values and Principles to Practice or Federal Policy and Historical Perspective required four (4) hours\n\nIndividualized Assessment and Employment/ Career Planning or Customer Profile and Employment Selection required six (6) hours\n\nCommunity Research and Job Development or Organizational Marketing and Job Development required five (5) hours\n\nWorkplace and Related Supports or Job-Site Training required ten (10) hours\n\nOthers (Specific Disabilities, Long Term Support, Funding, Benefits Counseling, etc.) required ten (10) hours\n\nThe total hours of these services are forty (40) hours.\n\nThis training requirement may be waived if the staff possesses a National Certificate in Employment Services or is a Certified Employment Support Professional.\n\nInitial verification and annually thereafter","url":"","verified":"","notes":"","row":3},{"id":"dc-supported-employment-waiver","state":"DC","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Individual Services are designed to provide opportunities for people with disabilities to obtain competitive work in an integrated work setting, or employment in an integrated work setting in which individuals are working toward competitive work, consistent with strengths, resources, priorities, concerns, abilities, capabilities, interests and informed choice. The level of employment participation may be full-time or part-time. These services and supports should be designed to support successful employment outcomes consistent with the individual’s goals. Supported Employment services are also provided to people with ongoing support needs for whom competitive employment has not traditionally occurred. In addition to the need for an appropriate job match that meets the individual’s skills and interests, individuals with the most significant disabilities may also need long term employment support to successfully maintain a job due to the ongoing nature of the individual’s support needs, changes in life situations, or evolving and changing job responsibilities. Stabilization services are a component of Supported Employment Services and are ongoing services needed to support and maintain an individual in an integrated competitive employment site or customized home-based employment.\n\nSupported Employment Individual Services is not intended for people working in mobile work crews of small groups of people with disabilities in the community, but may be appropriate for small group supported employment to the extent that the setting complies with the HCBS settings rule.\n\nSupported Employment may include:\nVocational assessments: All vocational assessments, regardless of the individual’s vocational placement, are conducted by supported employment providers;\nBenefits counseling: Analysis and advice to help the person understand the potential impact of employment on his or her public benefits, including, but not limited to Supplemental Security Income, Medicaid, Social Security Disability Insurance, Medicare, and Food Stamps.\"\nIndividual placement: A supported employment placement strategy in which an employment specialist (job coach) places a individual into competitive employment through a job discovery process, provides training and support, and then gradually reduces time and assistance at the worksite;\n\nDevelopment and on-going support for micro-enterprises owned and operated by the individual. This assistance consists of:\nAssisting the individual to identify potential business opportunities;\nAssisting the individual in the development of a business plan, including potential sources of business financing\nand other assistance in developing and launching a business;\nIdentification of the supports that are necessary in order for the individual to operate the business; and,\nOngoing assistance, counseling and guidance once the business has been launched.\nOn-the-job coaching Supported Employment services may be provided in person, or through phone or other technological means (e.g., Skype, Facetime), where approved by the person and his or her support team and documented in the ISP\n\nFFP will not be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\nIncentive payments made to an employer to encourage or subsidize the employer's participation in a supported employment program;\nPayments that are passed through to users of supported employment programs; or\nPayments for vocational training that is not directly related to an individual's supported employment program.\n\nAs part of the person-centered planning process, the support team must discuss and create an individualized plan in the event that technology failures occur.\nSupported Employment Services provided via remote support:\n-This service may be rendered using remote support. The purpose of the remote support delivery option is to maintain or improve a participant’s functional abilities, enhance interactions, support meaningful relationships, and promote their ability to live independently, and meaningfully participate in their community. The participant’s services may not be delivered virtually one hundred (100) percent of the time. The participant must always have the option to utilize in-person services. A participant who requires in-person assistance during the provision of the service must receive services in person. The use of the remote delivery service option is not for the convenience of providers\n-Requirements and methodology regarding HIPAA have been approved by the DC HIPAA Compliance Officer. Participant privacy rights will be assured and monitored on an ongoing basis. Privacy obligations will be reviewed on an ongoing basis with providers and the person receiving services. Training will be provided for participants on how to identify or report issues if they believe their privacy has been violated. Providers will not use video or remote support devices in participant bedrooms or bathrooms. The use of the virtual support option must not block, prohibit or discourage the use of in-person services or access to the community. Community integration will be increased by having the option for remote service delivery. In instances where participants may not be inclined to attend or receive a service in-person, the remote service delivery option affords the opportunity for the participant to still participate in services, engage with their providers, community and friends, when they otherwise would not be able to do so due to illness, transportation issues, pandemics, or other personal reasons.\n-Participants will be provided initial and ongoing training, support, and assistance using the technology necessary for the remote delivery of this service. The participant will have full control of virtual support devices and have the ability to turn on and off the device and end services any time they wish. In order to ensure the health and safety of the participant, the plan of care team must assess and monitor the appropriateness and effectiveness of virtual support with the participant. The Individual Service Plan (ISP) must include a justification statement explaining how remote support assures health and safety If it is determined that in-person assistance is required, virtual support may not be provided.","url":"","verified":"","notes":"","row":4},{"id":"dc-supported-employment-limits-waiver","state":"DC","title":"Supported Employment - Limits (Waiver)","name":"Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Supported employment individual services:\n\nAre not provided in specialized facilities that are not a part of the general workplace;\n\n1. DO NOT include volunteer work; (volunteer learning and training activities that prepare a person for entry into the paid workforce are addressed through Employment Readiness services); and\n2. DO NOT include payment for supervision; training; or support and adaptations typically available to other workers without disabilities filling similar positions in the business. Day Habilitation, Employment Readiness, In-Home Supports, and Individualized Day Supports shall not be used at the same time as this service.\n\nWhen Supported Employment services are provided at a work site in which persons without disabilities are employees, payment will be made only for the adaptations, supervision and training required by individuals receiving waiver services as a result of their disabilities, and will not include payment for the supervisory activities rendered as a normal part of the business setting.\n\nServices are not available to people who can be fully supported individuals who are eligible to participate in programs funded under Section 110 of the Rehabilitation Act of 1973 or Section 602(16) and (17) of the Individuals with Disabilities Education Act, 20 U.S.C. 1401 (16) and (71), but may be used to wrap around those programs.\n\nService Limits\n\n1. Intake and Assessment activities shall not exceed 80 hours per calendar year.\n2. Job Preparation, Development and Placement activities shall not exceed 240 hours per job placement per calendar year. Additional hours may be provided as prior authorized by DDS.\n3. On the Job training shall not exceed more than 360 hours per placement per year. Additional hours may be provided as prior authorized by DDS.\n4. This service is delivered no more than 40 hours per week, in combination with any other waiver day or vocational support services. This includes Day Habilitation, Small Group Supported Employment, Employment Readiness, or Individualized Day Supports.\n\nSupported employment services is delivered no more than forty (40) hours per week in combination with any other\n\nWaiver day or vocational support services. This includes Day Habilitation, Employment Readiness, and Individualized Day Supports.\n\nThe supported employment service includes transportation furnished by the provider during the course of the service. Time spent in transportation to and from the program shall not be included in the total amount of services provided per day.\n\nWhile the State Plan includes a transportation benefit, and providers under that benefit are capable of transporting IDD Waiver persons, this benefit is only used by IDD waiver persons to reach the supported employment site. This is because the State Plan transportation benefit cannot provide real-time services dedicated to a particular provider’s\n\nneeds. State Plan transportation services are coordinated by a non-emergency medical transportation broker. The service must be reserved in advance, and trips often include other non-IDD waiver persons on their way to a variety of destinations. As a result, it is not practical for a person to rely on transportation arranged by the broker during an episode of a supported employment service. The supported employment service covers such transportation, and it is separate and distinct from the State Plan transportation service generally.\n\nThe IDT will need to assess the person’s ability to benefit from remote services engagement to determine how many hours the person can engage in remote supports for supported employment. Supported Employment services can be implemented partially in-person and partially remote supports.\n\nServices cannot be delivered remotely one hundred (100) percent of the time.","url":"","verified":"","notes":"","row":5},{"id":"dc-supported-employment-provider-specifications-waiver","state":"DC","title":"Supported Employment – Provider Specifications (Waiver)","name":"Supported Employment – Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"DDS Provider Certification Review per DDS Policy.\n\nCertified Enabling Technology Integration Specialist (ETIS) employed by a Shift Accredited DDS Service Provider or Enabling Technology Credential (ETC).\n\nShift is the developmental and disability services industry’s first online learning curriculum and community that standardizes best practices in Technology First programming. The program is accredited by the National Association of Direct Support Professionals. Currently, it includes three (3) programs:\n\n1. Enabling Technology Credential for professionals who want to learn more about how to use enabling technology as a natural support for people with Intellectual and Developmental Disabilities;\n\n2. Enabling Technology Integration Specialist Certification that provides specialized training in person_x0002_centered technology assessment and implementation; and\n\n3. Technology First Accreditation for organizations demonstrating sustainable and standardized best practices in enabling technology integration.\n\nProvider enrolled to provide services through DDS/DHCF and has a current Medicaid agreement. The provider must be enrolled as a provider for Rehabilitation Services Administration (RSA) within one year of becoming a supported employment provider. Owner-operators shall complete training in Person-Centered Thinking, Supported Decision-Making, Supporting Community Integration, and any other topics determined by DDS, and in accordance with DDS published guidance within one year from the date the waiver application becomes effective for current providers and prior to any new waiver provider becoming approved to initiate services.\n\nDocumentation that each employee is eighteen (18) years of age or older;\n\n- Documentation that each employee was found acceptable by the individual\n\n- Annual documentation from a physician or other official that the employees are free from communicable diseases as confirmed by an annual purified protein as confirmed by an annual purified protein derivative of tuberculin (PPD) Skin Test;\n\n- Record of completion of competency-based training in communication with people with intellectual disabilities\n\n- Record of completion of competency-based training in infection control procedures consistent with the requirements of the Occupational Safety and Health Administration, U.S. Department of Labor regulations at 29 CFR 1910. 1030;\n\n- A high school diploma or general equivalency development;\n\n- Certification in cardiopulmonary resuscitation (CPR) and First Aid;\n\n- COVID vaccination in accordance with DC Health Rules 22 DCMR B230.2. With the addition of the COVID vaccination requirement, the District assures that an adequate provider pool will be maintained;\n\n- Record of completion of DDC0approved pre-services and in-service training in DDS policies and procedures;\n\n- Training is needed to address the unique support needs of the individual as detailed in their Plan of Care; and Verification of Provider Qualifications.\n\nWithin one year of becoming a supported employment provider:\n\nThe provider shall maintain evidence of completion of a professional development course that will satisfy a Basic Employment Certificate or comparable as required by the Association of Community Rehabilitation Educators (ACRE).\n\nIn addition to the requirements stated above, all staff working directly with persons with disabilities particularly in job development and placement , the following topic areas should be covered by the course or training and obtained within a year:\n\nO Application of Core Values and Principles to Practice or Federal Policy and Historical Perspective required four (4) hours\n\nO Individualized Assessment and Employment/ Career Planning or Customer Profile and Employment Selection required six (6) hours\n\no Community Research and Job Development or Organizational Marketing and Job Development required five (5) hours\n\nO Workplace and Related Supports or Job-Site Training required ten (10) hours\n\nO Others (Specific Disabilities, Long Term Support, Funding, Benefits Counseling etc.) required ten (10) hours\n\nO The total hours of these services are forty (40) hours.\n\nThis training requirement may be waived if staff possesses a National Certificate in Employment Services or is a Certified Employment Support Professional”","url":"","verified":"","notes":"","row":6},{"id":"dc-small-group-supported-employment-waiver","state":"DC","title":"Small Group Supported Employment (Waiver)","name":"Small Group Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Note to CMS: We recognize that this is a statutory service; however, this web portal will not allow us to have two statutory services called \"Supported Employment\". Because of this, we have listed this as an \"Other Service\" Small Group are services and training activities provided in regular business, industry and community settings for groups of two (2) to four (4) workers with disabilities. Examples include mobile crews and other business-based workgroups employing small groups of workers with disabilities in the community. Small Group Supported Employment must be provided in a manner that promotes integration into the workplace and interaction between the workers with disabilities and those without disabilities in those workplaces.\n\nPersonal care/assistance may be a component part of supported employment, small group employment support services, but may not comprise the entirety of the service. Small Group Supported Employment includes benefits counseling, defined as analysis and advice to help the person understand the potential impact of employment on his or her public benefits, including, but not limited to: Supplemental Security Income, Medicaid, Social Security Disability Insurance, Medicare, and Food Stamps. People should be provided information to make an informed decision in choosing between supported employment, small group employment supports and supported employment individual employment support services.\n\nSmall Group Supported Employment Services provided via remote support:\n\nThis service may be rendered using remote support. The purpose of the remote support delivery option is to maintain or improve a participant’s functional abilities, enhance interactions, support meaningful relationships, and promote their ability to live independently, and meaningfully participate in their community. The participant’s services may not be delivered virtually one hundred (100) percent of the time. The participant must always have the option to utilize in-person services. A participant who requires in-person assistance during the provision of the service must receive services in person. The use of the remote delivery service option is not for the convenience of providers.\n\nRequirements and methodology regarding HIPAA have been approved by the DC HIPAA Compliance Officer.\n\nParticipant privacy rights will be assured and monitored on an ongoing basis. Privacy obligations will be reviewed on an ongoing basis with providers and the person receiving services. Training will be provided for participants on how to identify or report issues if they believe their privacy has been violated. Providers will not use video or remote support devices in participant bedrooms or bathrooms. The use of the virtual support option must not block, prohibit or discourage the use of in-person services or access to the community. Community integration will be increased by having the option for remote service delivery. In instances where participants may not be inclined to attend or receive a service in-person, the remote service delivery option affords the opportunity for the participant to still participate in services, engage with their providers, community and friends, when they otherwise would not be able to do so due to illness, transportation issues, pandemics, or other personal reasons.\n\nParticipants will be provided initial and ongoing training, support, and assistance using the technology necessary for the remote delivery of this service. The participant will have full control of virtual support devices and have the ability to turn on and off the device and end services any time they wish. In order to ensure the health and safety of the participant, the plan of care team must assess and monitor the appropriateness and effectiveness of virtual support with the participant. The Individual Service Plan (ISP) must include a justification statement explaining how remote support assures health and safety If it is determined that in-person assistance is required, virtual support may not be provided.","url":"","verified":"","notes":"","row":7},{"id":"dc-small-group-supported-employment-limits-waiver","state":"DC","title":"Small Group Supported Employment - Limits (Waiver)","name":"Small Group Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Supported employment group services:\n\n1. ARE NOT provided in specialized facilities that are not a part of the general workplace;\n\n2. DOES NOT INCLUDE volunteer work; (volunteer learning and training activities that prepare a person for entry into the paid workforce are addressed through employment readiness services); and\n\n3. DOES NOT include payment for supervision, training, or support and adaptations typically available to other workers without disabilities filling similar positions in the business.\n\nTime spent in transportation to and from the program shall not be included in the total amount of services provided per day. However, time spent in public transportation to and from the program for the purpose of training the person on the use of transportation services may be included in the number of hours of services provided per day for a period of time specified in the person’s ISP/Plan of Care.\n\nDay Habilitation, Employment Readiness; In-Home Supports and Individualized Day Supports shall not be used at the same time as this service.\n\nWhen Supported Employment services are provided at a work site in which persons without disabilities are employees, payment will be made only for the adaptations, supervision and training required persons receiving waiver services as a result of their disabilities, and will not include payment for the supervisory activities rendered as a normal part of the business setting.\n\nServices are not available to persons who are eligible to participate in programs funded under Section 110 of the Rehabilitation Act of 1973 or Section 602(16) and (17) of the Individuals with Disabilities Education Act, 20 U.S.C. 1401 (16) and (71).\n\nService Limits\n\n1. Intake and Assessment activities shall not exceed 80 hours per calendar year.\n\n2. Job Preparation, Development and Placement activities shall not exceed 240 hours per job placement per calendar year.\n\n3. On the Job training shall not exceed more than 360 hours per placement per year. Additional hours may be provided as prior authorized by DDS.\n\nTime spent in transportation to and from the service shall not be included in the total amount of services provided per day. Time spent in transportation during activities is reimbursed under Small Group Supported Employment.\n\nThe IDT will need to assess the person’s ability to benefit from remote services engagement to determine how many hours the person can engage in remote supports for supported employment. Supported Employment services can be implemented partially in-person and partially remote supports.\n\nServices cannot be delivered remotely one hundred (100) percent of the time.","url":"","verified":"","notes":"","row":8},{"id":"dc-small-group-supported-employment-provider-specifications-wai","state":"DC","title":"Small Group Supported Employment - Provider Specifications (Waiver)","name":"Small Group Supported Employment - Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"DDS Provider Certification Review per DDS Policy Certified Enabling Technology Integration Specialist (ETIS) employed by a Shift Accredited DDS Service Provider or Enabling Technology Credential (ETC).\n\nShift is the developmental and disability services industry’s first online learning curriculum and community that standardizes best practices in Technology First programming. The program is accredited by the National Association of Direct Support Professionals. Currently, it includes three (3) programs:\n\n1. Enabling Technology Credential for professionals who want to learn more about how to use enabling technology as a natural support for people with Intellectual and Developmental Disabilities;\n\n2. Enabling Technology Integration Specialist Certification that provides specialized training in person-centered technology assessment and implementation; and\n\n3. Technology First Accreditation for organizations demonstrating sustainable and standardized best practices in enabling technology integration\n\nProvider enrolled to provide services through DDS/DHCF and has a current Medicaid agreement. A provider must become an RSA Supported Employment provider within one year of the approval date of the waiver amendments. Owner-operators shall complete training in Person-Centered Thinking, Supported Decision-Making, Supporting Community Integration, and any other topics determined by DDS, and in accordance with DDS published guidance within one year from the date, the waiver application becomes effective for current providers and prior to any new waiver provider becoming approved to initiate services.\n\nFor individual employees, the following requirements apply:\n\n- Documentation that each employee is eighteen (18) years of age or older;\n\n- Documentation that each employee was found acceptable by the individual\n\n- Annual documentation from a physician or other official that the employees are free from\n\ncommunicable diseases as confirmed by an annual purified protein as confirmed by an annual purified protein derivative of tuberculin (PPD) Skin Test;\n\n- Record of completion of competency-based training in communication with people with intellectual disabilities\n\n- Record of completion of competency-based training in infection control procedures consistent with the requirements of the Occupational Safety and Health Administration, U.S. Department of Labor regulations at 29 CFR 1910. 1030;\n\n- A high school diploma or general equivalency development;\n\n- Certification (annual) in cardiopulmonary resuscitation (CPR) and First Aid;\n\n- COVID vaccination in accordance with DC Health Rules 22 DCMR B230.2. With the addition of the\n\nCOVID vaccination requirement, the District assures that an adequate provider pool will be maintained;\n\n- Record of completion of DDC-approved pre-services and in-service training in DDS policies and procedures;\n\n- Training is needed to address the unique support needs of the individual as detailed in their Plan of Care; and Verification of Provider Qualifications.\n\nWithin one year of becoming a small group supported employment provider:\n\n- The provider shall maintain evidence of completion of a professional development course that will satisfy a Basic Employment Certificate or comparable as required by the Association of Community Rehabilitation Educators (ACRE).\n\n- In addition to the requirements stated above, for all staff working directly with persons with disabilities, particularly in job development and placement, the following topic areas should be covered by the course or training and obtained within a year:\n\nO Application of Core Values and Principles to Practice or Federal Policy and Historical Perspective required four (4) hours\n\nO Individualized Assessment and Employment/ Career Planning or Customer Profile and Employment Selection required six (6) hours\n\nO Community Research and Job Development or Organizational Marketing and Job Development required five (5) hours\n\nO Workplace and Related Supports or Job-Site Training required ten (10) hours\n\nO  Others (Specific Disabilities, Long Term Support, Funding, Benefits Counseling, etc.) required ten (10) hours\n\nO The total hours of these services are forty (40) hours.\n\n- This training requirement may be waived if the staff possesses a National Certificate in Employment Services or is a Certified Employment Support Professional.\n\nInitial verification and annually thereafter","url":"","verified":"","notes":"","row":9}]},{"code":"FL","name":"Florida","notes":[],"entries":[{"id":"fl-prevocational-services-waiver","state":"FL","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational services are services that provide learning and work experiences, including volunteer work, where the individual can develop general, non-job-task-specific strengths and skills that contribute to employability in paid employment in integrated community settings. Services are time-limited and with specific outcomes to be achieved, as determined by the individual and his/her service and supports planning team through an ongoing person-centered planning process, to be reviewed not less than annually or more frequently as requested by the individual. Individuals receiving prevocational services must have employment-related goals in their person-centered service plan; the general habilitation activities must be designed to support such employment goals. The successful outcome of prevocational services is competitive, integrated employment in the community for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Prevocational services should enable everyone to attain the highest level of work in the most integrated setting and with the job matched to the individual’s interests, strengths, priorities, abilities, and capabilities, while following applicable federal wage guidelines. Services are intended to develop and teach general skills that lead to competitive and integrated employment including: the ability to communicate effectively with supervisors, co-workers and customers; adhere to generally accepted community workplace conduct and dress; follow directions; attend to tasks; employ workplace problem solving skills and strategies; adhere to general workplace safety and mobility training. Documentation is maintained in the file of everyone receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).\n\nNon-emergency transportation is a covered waiver service offered in order to enable enrollees to gain access to waiver services specified by the plan of care. This service is offered in addition to medical transportation required under 42 CFR 431.53 and transportation services under the State Plan, defined at 42 CFR 440.170(a) (if applicable), and shall not replace them. Transportation services under the waiver shall be offered in accordance with the enrollee's plan of care. Whenever possible, family, neighbors, friends, or community agencies, which can provide this service without charge, will be utilized. All services must be authorized in the enrollee’s person-centered support plan. Additionally, prevocational providers are paid separately for transportation services only when the service is authorized in the cost plan, the provider is enrolled as a transportation provider, and transportation is provided between a recipient’s place of residence and the training site. Transportation between prevocational sites, if the activities provided are a part of the respective services, will be included as a component and in the rate paid to the provider of prevocational services.","url":"","verified":"","notes":"","row":1},{"id":"fl-prevocational-services-limit-waiver","state":"FL","title":"Prevocational Services - Limit (Waiver)","name":"Prevocational Services - Limit","source":"Waiver","category":"prevoc","topic":"limits","text":"Life Skills Development Level 4 – Prevocational services are limited to the amount, duration, and scope of the service described on the recipient's support plan and current approved cost plan to foster health, safety, and welfare of the recipient.","url":"","verified":"","notes":"","row":2},{"id":"fl-prevocational-services-provider-specifications-life-skills-d","state":"FL","title":"Prevocational Services Provider Specifications - Life Skills Development Level 4 (Waiver)","name":"Prevocational Services Provider Specifications - Life Skills Development Level 4","source":"Waiver","category":"prevoc","topic":"provider","text":"The agency manager or director will not have full-time responsibility for providing direct services and will not be included in determining the staffing ratios. • The program director must possess at a minimum an associate’s degree from an accredited college or university and two years, hands-on, related experience. • Supervisors of direct care staff will have a high school diploma or GED and one year of direct, care-related experience. • Related experience will substitute on a year-for-year basis for the required college education. • Direct service staff will work under appropriate supervision. • The staffing ratio will not exceed 10 recipients per direct service staff (supervisory and other management staff can be included in determining the direct care staff ratio. Administrative staff and those not providing direct service to the recipient are not considered direct service staff). • Direct service staff must be age 18 years or older at the time they are hired. Providers of Prevocational services must be designated by the APD regional office as Life Skills Development 4 providers.\n\nInitial verification and upon reenrollment requested of the Medicaid Agency.\n\nThe agency manager or director will not have full-time responsibility for providing direct services and will not be included in determining the staffing ratios. The program director must possess at a minimum an associate's degree from an accredited college or university and two years, hands-on, related experience. Supervisors of direct care staff will have a high school diploma or GED and one year of direct, care-related experience. Related experience will substitute on a year-for-year basis for the required college education. Direct service staff will work under appropriate supervision. The staffing ratio will not exceed 10 recipients per direct service staff (supervisory and other management staff can be included in determining the direct care staff ratio. Administrative staff and those not providing direct service to the recipient are not considered direct service staff). Direct service staff must be age 18 years or older at the time they are hired. Providers of Prevocational services must be designated by the APD regional office as Life Skills Development Level 4 providers.","url":"","verified":"","notes":"","row":3},{"id":"fl-supported-employment-waiver","state":"FL","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported employment services provide training and assistance to help support recipients in job development and sustaining paid employment at or above minimum wage unless the recipient is operating a small business. This service can be performed on a full or part-time basis and at a level of benefits paid by the employer for the same or similar work performed by trained non-disabled recipients. The provider assists with the acquisition, retention, or improvement of skills related to accessing and maintaining such employment, or developing and operating a small business. With the assistance of the provider, the recipient receives help in securing employment according to the recipient’s knowledge, skills, abilities, supports needed, desired goals, and planned outcomes. This service is conducted in a variety of settings, including work sites in which individuals without disabilities are employed. This service should include assisting a recipient to learn job tasks needed to be employed, and the recipient should be included in all aspects of job development, interviewing, and job seeking activities.\n\nSupported employment services include three models: Individual, Group, and Supported Self-Employment.\n\nSupported Employment is provided to support, obtain and maintain competitive or customized employment in an integrated work setting in the general workforce at or above the state’s minimum wage, at or above the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The enrollee’s person-centered support plan and authorization records must include documentation related to Supported Employment and document if the service is not available through a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.)\n\nFederal financial participation may not be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n1. Incentive payments made to an employer to encourage or subsidize the employer’s participation in supported employment; or\n\n2. Payments that are passed through to users of supported employment services. Transportation is not a component of this service. Non-emergency transportation is a covered waiver service offered in order to enable enrollees to gain access to waiver services specified by the plan of care. This service is offered in addition to medical transportation required under 42 CFR 431.53 and transportation services under the State Plan, defined at 42 CFR 440.170(a) (if applicable), and shall not replace them. Transportation services under the waiver shall be offered in accordance with the enrollee's plan of care. Whenever possible, family, neighbors, friends, or community agencies, which can provide this service without charge, will be utilized. All services must be authorized in the enrollee’s person-centered support plan.","url":"","verified":"","notes":"","row":4},{"id":"fl-supported-employment-limits-waiver","state":"FL","title":"Supported Employment - Limits (Waiver)","name":"Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Life Skills Development Level 2 - Supported Employment services are limited to the amount, duration, and scope of the service described on the recipient's support plan and current approved cost plan to foster health, safety, and welfare of the recipient.","url":"","verified":"","notes":"","row":5},{"id":"fl-supported-employment-agency-provider-specifications-waiver","state":"FL","title":"Supported Employment – Agency Provider Specifications (Waiver)","name":"Supported Employment – Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Providers of supported employment services must meet one or more of the following requirements:\n\n* Have a bachelor's degree from an accredited college or university with a major in education, rehabilitative science, business or a related degree.\n\n* Have an associate's degree or two years of college from an accredited college or university and have two years of documented direct experience with recipients with developmental disabilities.\n\n* Have one year of college from an accredited college or university and three years of documented direct experience in working with recipients with developmental disabilities.\n\n* Four years of direct professional experience in working with recipients with developmental disabilities may substitute for college on a year for year basis.\n\nThe provider must hold a valid high school diploma or GED diploma.\n\nInitial verification upon reenrollment requirements of the Medicaid Agency.","url":"","verified":"","notes":"","row":6},{"id":"fl-supported-employment-individual-provider-specifications-waiv","state":"FL","title":"Supported Employment – Individual Provider Specifications (Waiver)","name":"Supported Employment – Individual Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Providers of supported employment services must meet one or more of the following requirements:\n\n* Have a bachelor's degree from an accredited college or university with a major in education, rehabilitative science, business or a related degree.\n\n* Have an associate's degree or two years of college from an accredited college or university and have two years of documented direct experience with recipients with developmental disabilities.\n\n* Have one year of college from an accredited college or university and three years of documented direct experience in working with recipients with developmental disabilities.\n\n* Four years of direct professional experience in working with recipients with developmental disabilities may substitute for college on a year for year basis.\n\nThe provider must hold a valid high school diploma or GED diploma.","url":"","verified":"","notes":"","row":7}]},{"code":"GA","name":"Georgia","notes":[],"entries":[{"id":"ga-supported-employment-general-scope-of-services","state":"GA","title":"Supported Employment - General (Scope of Services)","name":"Supported Employment - General","source":"Scope of Services","category":"employment","topic":"definition","text":"Supported Employment services are ongoing supports that enables individuals, for whom competitive employment as or above the minimum wage is unlikely absent the provision of supports, and who, because of their disabilities, need supports, to perform in a regular work setting. Supported Employment services are conducted in a variety of settings, particularly work sites where persons without disabilities are employed. Individuals who receive Supported Employment services must require long-term, direct or indirect job-related support in job supervision, adapting equipment, adapting behaviors, transportation assistance, peer support, and/or personal care assistance during the workday. Supported Employment has four distinct categories: Job Maintenance, Individual Job Coaching, Individual Job Development, and Group.Supported Employment Job Maintenance services consist of activities needed to sustain paid work by individuals, including supervision, training, and services and supports that assist individuals in achieving self-employment through the operation of a business, including helping the individual identifying the supports that are necessary for the individual to operate a business, and providing ongoing assistance, counseling and guidance once the business has been launched. Services must be delivered on a one-to-one basis. These services do not include the supervisory activities rendered as a normal part of the business setting. Individuals authorized for Job Maintenance activities typically require occasional support and generally do not need support for every hour they work. To be authorized for Job Maintenance, an individual must work at least 60 hours per month.Supported Employment Individual Job Coaching services consist of activities needed to sustain paid work by individuals, including supervision, training, and services and supports that assist individuals to advance in their careers or achieve self-employment through the operation of a business. This service is distinguished from Job Maintenance in that individuals authorized for Job Coaching  typically require more direct, face-to-face support on an ongoing basis.\n\nThe planned outcomes of these services are to increase the hours worked by each individual toward the goal of forty hours per week and to increase the wages of each individual toward the goal of increased financial independence. Supported Employment services are based on the individual’s needs, preferences, and informed choice. These services allow for flexibility in the amount of support an individual receives over time and as needed in various work sites.\n\nSupported Employment Services Providers offer (or arrange when needed) any of the standard services listed in section 3305 – Covered Services that are needed by the individuals served and specified in the individuals’ Individual Service Plans.","url":"","verified":"","notes":"","row":1},{"id":"ga-supported-employment-individual-scope-of-services","state":"GA","title":"Supported Employment - Individual (Scope of Services)","name":"Supported Employment - Individual","source":"Scope of Services","category":"employment","topic":"definition","text":"Supported Employment Individual Job Development services consist of activities needed to obtain paid work by individuals, including job location, prospective employer outreach, assistance with resume development, and job interview preparation, as well as services and supports that assist individuals in achieving self-employment through the establishment of a business. Job Development services can only be authorized when not available through the Georgia Vocational Rehabilitation Agency (GVRA).","url":"","verified":"","notes":"","row":2},{"id":"ga-supported-employment-group-scope-of-services","state":"GA","title":"Supported Employment - Group (Scope of Services)","name":"Supported Employment - Group","source":"Scope of Services","category":"employment","topic":"definition","text":"Supported Employment Group services are provided to groups of individuals, with a staff to individual ratio of one to two or more. The staff to individual ratio for Supported Employment Group services cannot exceed one (1) to ten (10).","url":"","verified":"","notes":"","row":3}]},{"code":"HI","name":"Hawaii","notes":[],"entries":[{"id":"hi-discovery-and-career-planning-manual","state":"HI","title":"DISCOVERY & CAREER PLANNING (Manual)","name":"DISCOVERY & CAREER PLANNING","source":"Manual","category":"career","topic":"definition","text":"Discovery & Career Planning (DCP) combines elements of traditional prevocational services with career planning in order to provide supports that the participant may use to develop skills and interests toward becoming employed for the first time or at different stages of the participant’s work career to develop skills and interests for advancement or a change in the participant’s career plan.\n\nDCP is based on the belief that all individuals with intellectual and developmental disabilities can work when given the opportunity, training, and supports that build on an individual's strengths, abilities and interests.\n\nThis service is designed to assist participants to:\nacquire skills to achieve underlying habilitative goals that are associated with building skills necessary to perform work in integrated community employment;\nexplore possibilities/impact of work; and\ndevelop career goals through career exploration and learning about personal interests, skills and abilities.\nThe outcome of DCP services is to complete or revise a career plan and develop the knowledge and skills needed to get a job in a competitive, integrated employment or be self-employed.\nThe provision of DCP is always delivered with the intention of leading to permanent integrated employment at or above the minimum wage in the community.\n\nDCP includes Benefits Counseling. Benefits planning/counseling services are an important part of career decision making for participants who receive Supplemental Security Income (SSI) and/or Social Security Disability Insurance (SSDI), and other entitlements. Benefits counselors are skilled in helping participants determine the impact of earning income on their benefits and are knowledgeable about many work incentives that may be available. Providers must:\nsupply the participant with a list of certified benefits counselors and assist them with scheduling a Benefits Counseling session with the provider of their choice; and\nprovide instructions on how to obtain a Benefits Planning Query (BPQY) from Social Security prior to the scheduled Benefits Counseling appointment.","url":"","verified":"","notes":"","row":1},{"id":"hi-dcp-reimburseable-activities-manual","state":"HI","title":"DCP Reimburseable Activities (Manual)","name":"DCP Reimburseable Activities","source":"Manual","category":"career","topic":"billing","text":"All DCP activities billed are for face-to-face contact between the participant and provider.\n\nDCP services are time-limited activities that include the following:\n\n1.exploring employment goals and interest to identify a career direction;\n2.community-based formal or informal situational assessments;\n3.task analysis activities;\n4.mobility training to be able to use fixed routes and/or paratransit public transportation as independently as possible;\n5.skills training/mentoring, work trials, apprenticeships, internships, and volunteer experiences;\n6.training in communication with supervisors, co-workers and customers; generally accepted workplace conduct and attire; ability to follow directions; ability to attend to tasks; workplace problem-solving skills and strategies; general workplace safety and other skills as identified through the person-centered planning process;\n7.broad career exploration and self-discovery resulting in targeted employment opportunities including activities such as job shadowing, information interviews and other integrated worksite based opportunities;\n8.interviewing, video resumes and other job-seeking activities;\n9.transitioning the participant into employment supports for individualized competitive integrated employment or self-employment from:\na.volunteer work, apprenticeships, internships or work trials;\nb.a job that pays less than minimum wage; and\nc.a more segregated setting or group employment situation;\n10.financial literacy (including benefits counseling and planning), budgeting, credit, debt, savings, donating and investing; and\n11.when assisting a participant who is already employed, activities to support the participant in exploring other careers or opportunities; and\n12.transporting the participant to and from DCP experiences is billable under DCP.","url":"","verified":"","notes":"","row":2},{"id":"hi-individual-employment-supports-manual","state":"HI","title":"INDIVIDUAL EMPLOYMENT SUPPORTS (Manual)","name":"INDIVIDUAL EMPLOYMENT SUPPORTS","source":"Manual","category":"employment","topic":"definition","text":"Individual Employment Supports (IES) are based on the belief that all individuals with intellectual and developmental disabilities can work and that individuals of working age should be provided the supports necessary not only to gain access to and maintain employment in the community, but to advance in their chosen fields and explore new employment options as their skills, interests, and needs change. IES are designed to maximize the participant’s skills, talents, abilities and interests. The goal of IES is employment in a competitive integrated work setting. This is defined as a work place in the community or self-employment, where the participant receives at least minimum wage or the prevailing rate for that work, where the majority of individuals do not have disabilities, and which provides opportunities to interact with non-disabled individuals to the same extent that individuals employed in comparable positions would interact. Services may be ongoing based on the support needs of the participant and must increase individual independence and reduce level of service need.IES consists of Job Development and Job Coaching.","url":"","verified":"","notes":"","row":3},{"id":"hi-ies-reimburseable-activities-manual","state":"HI","title":"IES Reimburseable Activities (Manual)","name":"IES Reimburseable Activities","source":"Manual","category":"employment","topic":"billing","text":"IES activities includes:\n1. ongoing job coaching services to include on-the-job work skills training and systematic instruction required to perform the job with fading of supports as the participant becomes more confident and competent in the job to the extent possible;\n2. person-centered employment planning;\n3. job development, carving, or customization;\n4. negotiations with prospective employers;\n5. assistance for self-employment, including:\na)identifying potential business opportunities that align with the participant’s marketable skills, personal attributes, preferred tasks and ideal workplace conditions;\nb)identifying natural supports needed in order for the participant to operate the business;\nc)identifying and connecting the participant to community resources and services for long term support with business planning, feasibility assessments, marketing, accounting, etc.; and\nd)applying systematic instruction and job coaching that will fade over time for the participant to be independent in completing the job tasks of his/her business.\n6. worksite visits as needed by the individual or employer to assess for new needs and to proactively support the participant to address issues that arise (typically at the worksite unless the individual requests visits outside the worksite or worksite visits are deemed too disruptive by the employer);\n7. ongoing evaluation of the individual’s job performance except for supervisory activities rendered as a normal part of the business setting; training related to acclimating to or acceptance in the workplace environment, such as effective communication with co-workers and supervisors and when and where to take breaks and lunch;\n8.individualized problem-solving/advising with the participant about issues that could affect maintaining employment;\n9.training in skills to communicate disability-related work support and accommodation needs;\n10.assessing the need for basic job aids, facilitating referral through the participant’s CM for assistive technology assessment and acquisition of assistive technology from the Division of Vocational Rehabilitation;\n11.facilitating referral through the CM to a Discovery & Career Planning provider for financial literacy, money management and budgeting;\n12.providing information and training, as appropriate, for employers related to disability awareness, use of tax credits and other incentives, individual disability-specific training, and use of basic job aids and accommodations (may or may not be delivered with the participant present);\n13.training in arranging and using transportation, such as fixed route public transportation or paratransit services to get to and from the participant’s place of employment; and\n14.career advancement services. Services are typically delivered face-to-face with the participant. Exceptions where the participant may or may not be present include:\n15.job development, carving, or customization;\n16.negotiations with prospective employers including meetings and phone calls; and\n17.discussions with the participant’s supervisor or family","url":"","verified":"","notes":"","row":4}]},{"code":"ID","name":"Idaho","notes":[],"entries":[{"id":"id-supported-employment-provider-qualifications","state":"ID","title":"Supported Employment – Provider Qualifications","name":"Supported Employment – Provider Qualifications","source":"","category":"employment","topic":"provider","text":"Supported employment must be provided by an agency that supervises the direct service and is accredited by the Commission on Accreditation of Rehabilitation Facilities (CARF) or other comparable standards or meets State requirements to be a State-approved provider. Providers who provide direct care and services must satisfactorily complete an Idaho Department of Health and Welfare background check. The provider must be enrolled with Idaho Medicaid prior to submitting claims for services.\n\nProviders must follow the provider handbook and all applicable state, and federal and regulations. See General Information and Requirements for Providers, Idaho Medicaid Provider Handbook for more information on enrolling as an Idaho Medicaid provider.","url":"","verified":"","notes":"","row":1},{"id":"id-supported-employment-participant-eligibility","state":"ID","title":"Supported Employment – Participant Eligibility","name":"Supported Employment – Participant Eligibility","source":"","category":"employment","topic":"eligibility","text":"Participants are eligible to receive supported employment when they meet A&D Waiver Eligibility or DD Waiver Eligibility requirements.","url":"","verified":"","notes":"","row":2},{"id":"id-supported-employment-covered-services-and-limitations","state":"ID","title":"Supported Employment – Covered Services and Limitations","name":"Supported Employment – Covered Services and Limitations","source":"","category":"employment","topic":"limits","text":"Supported employment consists of competitive work in integrated work settings for individuals with the most severe disabilities for whom competitive employment has not traditionally occurred, or for whom competitive employment has been interrupted or intermittent because of a severe disability. Because of the nature and severity of their disability, these individuals need intensive supported employment services or extended services to perform such work. Supported employment is limited to 40 hours per week. For DD waiver participants, the combination of supported employment, adult day health, and developmental therapy cannot exceed 40 hours per week.\n\nSupported employment services are not available when funded under another program such as the Rehabilitation Act of 1973, as amended, or the Individuals with Disabilities Education Act (IDEA). Additionally, supported employment is not reimbursable for incentive payments, subsidies, or unrelated vocational training expenses. Non-reimbursable expenses include incentive payments made to an employer of waiver participants to encourage or subsidize the employers' participation in a supported employment program, payments passed through to beneficiaries of supported employment programs, or payments for vocational training that are not directly related to a waiver participant's supported employment program.\n\nSupported employment services may receive an exception for plans or addenda requesting services that exceed the participant’s authorized budget. Exceptions are considered when the service is needed to obtain or maintain employment. The request must be submitted on the approved form with the following:\n•A recommendation addressing amount of service, level of support needed, employment goals and a transition plan. When a participant is transitioned from the Idaho Division of Vocational Rehabilitation (IDVR), the recommendation must be completed by IDVR. When the participant is in an established job, it is completed by the supported employment agency.\n•A plan of service developed by the participant and their person-centered planning team with a goal for supported employment services. A comprehensive review of all services on the plan is required before submission of the exception request. The combination of services must support an addition or increase of supported employment.\n•An acknowledgement signed by the participant and their legal guardian, if applicable, that additional budget dollars approved must not be reallocated to purchase any other Medicaid service.\n\nSupported employment must meet federal HCBS requirements as outlined in the Home and Community Based Services (HCBS) section of this handbook.","url":"","verified":"","notes":"","row":3},{"id":"id-supported-employment-documentation","state":"ID","title":"Supported Employment – Documentation","name":"Supported Employment – Documentation","source":"","category":"employment","topic":"documentation","text":"Documentation must be maintained verifying the service is not available or funded under the Rehabilitations Act of 1973 or the Individuals with Disabilities Education Act (IDEA). Providers must meet all documentation requirements listed in the Adult DD Services section of this handbook, or the A&D Waiver Services section of this handbook, based on which waiver the participant is receiving services from. All documentation must follow standard retention requirements including, but not limited to, those listed in the General Information and Requirements for Providers, Idaho Medicaid Provider Handbook.\n\nDocumentation must be made available to Department personnel acting in their official capacity immediately upon request. Services without documentation are not eligible for reimbursement. Providers should only submit records requested by the Department. Documentation sent unsolicited, or not for a service requiring prior authorization, will not be reviewed by the Department. Unreviewed documentation does not constitute approval or authorization of a service.","url":"","verified":"","notes":"","row":4},{"id":"id-supported-employment-reimbursement","state":"ID","title":"Supported Employment – Reimbursement","name":"Supported Employment – Reimbursement","source":"","category":"employment","topic":"billing","text":"Providers must be enrolled to receive reimbursement from Idaho Medicaid. Supported employment is reimbursed on a fee for service basis and must be prior authorized. The Adult DD Services Reimbursement section of this handbook and the A&D Waiver Services Reimbursement section of this handbook detail the reimbursement requirements for supported employment.\n\nFor participants receiving hourly support, the combination of hourly supported living, developmental therapy, supported employment, and adult day health cannot exceed the maximum set daily rate for H2022 – Daily Supported Living Services – High Support, except when all of the following are present:\n\nA participant is eligible for high support.\nSupported employment is in the service plan causing the daily limit to be exceeded\nDocumentation that the Person-Centered Planning team explored other lower-cost options and supports.\nA participant’s health and safety needs can be met using hourly services.\n\nSupported employment services provided to DD waiver participants are prior authorized by the Bureau of Developmental Disabilities (BDDS). Supported employment services provided to A&D waiver participants are prior authorized by the Bureau of Long Term Care (BLTC).\n\nEnter the appropriate ICD-10-CM: Z74.2 – Need for assistance at home and no other household member able to render care code for the primary diagnosis in field 21 on the CMS-1500 claim form or in the appropriate field of the electronic claim form.\n\nSupported employment can only be provided in the following POS: 99 Other (Community)\n\nEnter this information in field 24B on the CMS-1500 claim form or in the appropriate field of the electronic claim form.","url":"","verified":"","notes":"","row":5},{"id":"id-supported-employment-waiver","state":"ID","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment consists of competitive work in integrated work settings for individuals with the most severe disabilities for whom competitive employment has not traditionally occurred; or for whom competitive employment has been interrupted or intermittent as a result of a severe disability. Due to the nature and severity of their disability, these individuals need intensive supported employment services or extended services in order to perform their work.\n\na.Supported Employment services rendered under this waiver are not available under a program funded by either the Rehabilitation Act of 1973, as amended, or the Individuals with Disabilities Education Act (IDEA). Documentation must be maintained in the file of each individual receiving this service verifying that the service is not otherwise available or funded under the Rehabilitation Act of 1973 as amended, or the IDEA.\n\nb.Federal Financial Participation (FFP) cannot be claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following: incentive payments made to an employer of waiver participants to encourage or subsidize the employers’ participation in a Supported Employment program; payments that are passed through to beneficiaries of Supported Employment programs; or payments for vocational training that are not directly related to a participant's Supported Employment program.\n\nSupported Employment includes activities needed to sustain paid work at or above the minimum wage by participants, including oversight and training. Service payment is made only for the adaptations, oversight, and training required by participants receiving waiver services as a result of their disabilities but does not include payment for the supervisory activities rendered as a normal part of the business setting.\n\nc.Supported Employment services do not include employment services offered under other waiver services or State programs. Idaho’s Division of Vocational Rehabilitation may assist participants with locating a job or developing a job on behalf of the participant.\n\nd.Transportation of the participant to and from the job site is not covered under this Supported Employment service but may be provided as Non-Medical Transportation (a separate billable service).","url":"","verified":"","notes":"","row":6},{"id":"id-supported-employment-limits-waiver","state":"ID","title":"Supported Employment – Limits (Waiver)","name":"Supported Employment – Limits","source":"Waiver","category":"employment","topic":"limits","text":"The combination of Developmental Therapy, Adult Day Health, and Supported Employment must not exceed forty (40) hours per week.","url":"","verified":"","notes":"","row":7},{"id":"id-supported-employment-agency-provider-specifications","state":"ID","title":"Supported Employment – Agency Provider Specifications","name":"Supported Employment – Agency Provider Specifications","source":"","category":"employment","topic":"provider","text":"Supported Employment services must be provided by an agency capable of supervising the direct service and be accredited by the Commission on Accreditation of Rehabilitation Facilities (CARF); or other comparable standards; or meet State requirements to be a State approved provider. Supported Employment service providers of direct care or services must satisfactorily complete a criminal history and background check in accordance with IDAPA 16.05.06, “Criminal History and Background Checks.”\n\nVerification occurs every 2 years by the Department of Health and Welfare","url":"","verified":"","notes":"","row":8}]},{"code":"IL","name":"Illinois","notes":[],"entries":[{"id":"il-individual-employment-support-waiver","state":"IL","title":"Individual Employment Support (Waiver)","name":"Individual Employment Support","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment – Individual Employment Support (SEI) services consist of ongoing supports that enable customers, for whom sustained competitive integrated employment is unlikely due to the nature of the customer’s disabilities and absent the provision of supports, to maintain competitive employment in an integrated setting and at an employer identified by the customer through informed choice.\n\nSEI services facilitate the maintenance and enhancement of employment, which is aligned with a customer’s interests, skills, desires and conditions of employment. It may also include self-employment.\n\nSEI services do not include supporting paid employment or a facility-based setting.\n\nThe expected outcome of SEI is sustained competitive integrated employment that is well-matched to the customer’s interests, strengths, priorities, and abilities, and that meets the customer’s personal and career goals.","url":"","verified":"","notes":"","row":1},{"id":"il-individual-employment-support-eligibility-and-authorization-","state":"IL","title":"Individual Employment Support - Eligibility & Authoriz
