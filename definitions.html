ients develop basic work sills, such as punctuality, following directions, and working independently.\n\n• Volunteer work: This includes opportunities to participate in community service activities to gain work experience and develop social skills.\n\n• Training in social skills: This includes activities to help recipients develop communication, problem-solving, and conflict resolution skills necessary in the workplace.\n\nServices are expected to occur over a defined period to time and with specific outcomes to be achieved, as identified in the recipient’s PCP. Pre-vocational services can prepare the recipient for other programs such as supported employment and/or career planning. The ultimate goal of pre-vocational services is to help individuals with disabilities gain the skills and confidence they need to successfully transition to competitive integrated employment for which a recipient is compensated at or above minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nRecipients receiving prevocational services must have employment-related goals in their PCP; the general habilitative activities must be designed to support such employment goals.\n\nPrevocational Services are subcontracted under the service provision of Jobs and Day Training (JDT) Services Authorizations.\n\nInformation is maintained in the file of each recipient receiving this service.\n\nThis service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).","url":"","verified":"","notes":"","row":1},{"id":"nv-prevocational-services-limits-waiver","state":"NV","title":"Prevocational Services - Limits (Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"Recipients who receive prevocational services may receive two (2) or more types of non-residential support services;\n\nhowever, different types of non-residential support services may not be billed during the same period of the day","url":"","verified":"","notes":"","row":2},{"id":"nv-prevocational-services-provider-managed-specifications-waive","state":"NV","title":"Prevocational Services - Provider Managed Specifications (Waiver)","name":"Prevocational Services - Provider Managed Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"Must be certified by Nevada Developmental Services, pursuant to NRS 435 and Developmental Services Policies and Procedures.\n\nMeet all requirements to enroll and maintain status as an approved Medicaid provider, pursuant to the DHCFP Medicaid Services Manual, Chapters 100 and 2100, as applicable.\n\nMeet all Conditions of Participation in Medicaid Services Manual 102.1.\n\nComply with all Developmental Services Standards of Service Provision for Jobs and Day Training Providers.\n\nInitial application for provider enrollment for provisional certification, and then up to every three (3) years thereafter, as part of the recertification review process","url":"","verified":"","notes":"","row":3},{"id":"nv-prevocational-services-individual-provider-specifications-wa","state":"NV","title":"Prevocational Services -Individual Provider Specifications (Waiver)","name":"Prevocational Services -Individual Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"Must be certified by Nevada Developmental Services, pursuant to NRS 435 and Developmental Services Policies and Procedures.\n\nMeet all requirements to enroll and maintain status as an approved Medicaid provider, pursuant to the DHCFP Medicaid Services Manual, Chapters 100 and 2100, as applicable.\n\nMeet all Conditions of Participation in Medicaid Services Manual 102.2.\n\nComply with Developmental Services Standards of Service Provision for all Jobs and Day Training Providers\n\nInitial application for provider enrollment for provisional certification, and then up to every three (3) years thereafter, as part of the recertification review process.","url":"","verified":"","notes":"","row":4},{"id":"nv-supported-employment-waiver","state":"NV","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment services are designed to help recipients find, secure, and maintain employment in a competitive job setting alongside members of the community-including those without ID/DD. Supported employment services can be an effective way to help recipients achieve greater independence and financial self-sufficiency. By providing the necessary supports and accommodations, recipients can contribute to their communities and lead more fulfilling lives. The specific supported employment services can vary and depend on the individual's needs and goals. Supported Employment is often provided alongside Career Planning.\n\nOnce a recipient has obtained a job, ongoing support may be provided to help them maintain their employment. This may include assisting individuals with job placement and provide ongoing support to ensure successful in their new position, including providing resources and support to help individuals access training and educational opportunities.\n\nPersonal care/assistance may be a component part of the supported employment services but may not comprise the entirety of the service.\n\nIndividual Supported Employment is for recipients who need ongoing supports in order to obtain and maintain a job that meets personal and career goals in competitive, customized employment, or self-employment, in an integrated work setting within the general workforce for which the individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. Individual supported employment services do not include vocational services provided in facility-based work settings or other similar types of vocational services furnished in specialized facilities that are not a part of integrated community workplaces. Supported employment support does not include volunteering. Such volunteer learning and un-paid training activities that prepare a person for entry into the paid workforce are addressed through pre-vocational services. Supported employment supports do not include payment for supervision, training, support, and adaptations typically available to other workers without disabilities filling similar positions in the business.\n\nOne approach to individual supported employment is customized employment. Customized employment is an approach that involves tailoring the job to the strengths, interests, and abilities of the individual with a disability, while meeting the needs of the employer. Customized employment assumes the provision of reasonable accommodations and support necessary to perform the functions of a job that is individually negotiated and developed.\n\nSupported Employment Services are authorized under the service provision of Jobs and Day Training (JDT) Service Authorizations. Co-workers who meet provider standards may provide individual supported employment if the furnished services are not a part of the co-worker’s normal duties.\n\nInformation is maintained in the file of each recipient receiving this service; documenting that the service is not available in a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.). Federal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses.\n\nSmall Group\n\nSmall Group Employment Supports are services and training activities provided in regular business, industry and community settings for groups of two (2) to eight (8) workers with   which employ small groups of recipients in integrated employment in the community with the goals of sustained paid employment and work experience leading to further career development and individual integrated community based employment for which the recipient is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by recipients without disabilities. Small group supported employment services does not include payment for supervision, training, support or adaptations typically available to other workers without disabilities in similar positions in the business. Small group employment services also does not include supports needed for unpaid, volunteer opportunities. Supported Employment Services are authorized under the service provision of Jobs and Day Training (JDT) Service Authorizations. Co-workers who meet provider standards may provide small group supported employment services if the furnished services are not a part of the co-worker’s normal duties. Information is maintained in the file of each recipient receiving this service; documenting that the service is not available in a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.). Federal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses.\n\nRecipients receiving supported employment services may also receive prevocational, career planning, and any nonresidential habilitation services. However, different types of non-residential habilitation are not billed during the same period of time.\n\nMedicaid funds cannot be used to assist in the costs of starting or operating a business.","url":"","verified":"","notes":"","row":5},{"id":"nv-supported-employment-provider-managed-specifications","state":"NV","title":"Supported Employment – Provider Managed Specifications","name":"Supported Employment – Provider Managed Specifications","source":"","category":"employment","topic":"provider","text":"Must be certified by Nevada Developmental Services, pursuant to NRS 435 and Developmental Services Policies and Procedures.\n\nMeet all requirements to enroll and maintain status as an approved Medicaid provider, pursuant to the DHCFP Medicaid Services Manual, Chapter 100 and 2100, as applicable.\n\nMeet all Conditions of Participation in Medicaid Services Manual 102.2. Comply with all Developmental Services Standards of Service Provision for Jobs and Day Training Providers.\n\nInitial application for provider enrollment for provisional certification, and then up to every three (3) years thereafter, as part of the recertification review process.\n\nSupported Employment – Individual Provider Managed Specifications\n\nMust be certified by Nevada Developmental Services, pursuant to NRS 435 and Developmental Services Policies and Procedures.\n\nMeet all requirements to enroll and maintain status as an approved Medicaid provider, pursuant to the DHCFP Medicaid Services Manual, Chapter 100 and 2100, as applicable.\n\nMeet all Conditions of Participation in Medicaid Services Manual 102.2.\n\nComply with all Developmental Services Standards of Service Provision for Jobs and Day Training Providers.\n\nInitial application for provider enrollment for provisional certification, and then up to every three (3) years thereafter, as part of the recertification review process","url":"","verified":"","notes":"","row":6}]},{"code":"NH","name":"New Hampshire","notes":[],"entries":[{"id":"nh-employment-services-defintions-es-code","state":"NH","title":"Employment Services - Defintions (ES Code)","name":"Employment Services - Defintions","source":"ES Code","category":"employment","topic":"definition","text":"“Career exploration” means as part of the career planning process, selection by an individual of a job, training, or educational path that fits their interests, skills, and abilities.\n\n“Career planning” means a time-limited, person-centered, comprehensive, employment planning process that assists an individual to identify a career direction and results in a plan for achieving employment at or above minimum wage.\n\n“Customized employment” means the individualizing of the employment relationship between employees and employers in ways that meet the needs of both. It is based on an individualized determination of the strengths, needs, and interests of the individual, and is also designed to meet the specific needs of the employer.\n\n“Job development” means contacting and connecting with employers to identify, develop, or customize jobs suited to individuals’ skills and interests.","url":"","verified":"","notes":"","row":1},{"id":"nh-employment-services-service-principles-es-code","state":"NH","title":"Employment Services - Service Principles (ES Code)","name":"Employment Services - Service Principles","source":"ES Code","category":"employment","topic":"definition","text":"All employment services shall be designed to:\n\nAssist the individual to obtain employment or self-employment that is based on the individual’s employment profile and goals as outlined in the service agreement;\n\nProvide the individual with opportunities to participate in a comprehensive career development process that helps to identify, in a timely manner, the individual’s employment profile;\n\nSupport the individual to develop appropriate skills for job searching, including:\n-Creating a resume and employment portfolio;\n-Practicing job interviews; and\n-Learning soft skills that are essential for succeeding in the workplace;\n\nAssist the individual to become as independent as possible in their employment, internships, and education and training opportunities by:\n-Developing accommodations;\n-Utilizing assistive technology; and\n-Creating and implementing a fading plan;\n\nHelp the individual to:\n-Meet their goal for the desired number of hours of work as outlined  in the service agreement; and\n-Earn wages of at least minimum wage or prevailing wage, unless the individual is pursuing income based on self-employment;\n\nAssess, cultivate, and utilize natural supports within the workplace to assist the individual to achieve independence to the greatest extent possible;\n\nHelp the individual to learn about, and develop appropriate social skills to actively participate in, the culture of their workplace;\n\nUnderstand, respect, and address the business needs of the individual’s employer, in order to support the individual to meet appropriate workplace standards and goals;\n\nMaintain communication with, and provide consultations to, the employer to:\n-Address employer specific questions or concerns to enable the individual to perform and retain their job; and\n-Explore opportunities for further skill development and advancement for the individual;\n\nHelp the individual to learn, improve, and maintain a variety of life skills related to employment, such as:\n-Traveling safely in the community;\n-Managing personal funds;\n-Utilizing public transportation; and\n-Other life skills identified in the service agreement related to employment;\n\nPromote the individual’s health and safety;\n\nProtect the individual’s right to freedom from abuse, neglect, and exploitation;\n\nProtect the individual’s rights in accordance with He-M 310; and\n\nProvide opportunities for the individual to exercise personal choice and independence within the bounds of reasonable risks.\n\nAn individual, guardian, or representative may select any available provider that is qualified pursuant to He-M 504.03, He-M 504.04, and He-M 504.11, to deliver the employment services identified in the individual’s service agreement in accordance with He-M 518.05 and He-M 518.10.\n\nAll provider agencies and providers of employment services shall:\n-Comply with applicable rules, the 1915(c) home and community-based waiver service authority and any other federal laws, rules, and regulations, when applicable;\n-Meet the provisions specified within the individual’s service agreement; and\n-Meet the needs of the individual while taking into account the interests and obligations of the employer.","url":"","verified":"","notes":"","row":2},{"id":"nh-employment-services-elibility-es-code","state":"NH","title":"Employment Services - Elibility (ES Code)","name":"Employment Services - Elibility","source":"ES Code","category":"employment","topic":"definition","text":"Employment services shall be available to any individual who:\n-Has been referred to the bureau of vocational rehabilitation at the start of the employment planning process to first assess if the service the individual needs is provided and available by vocational rehabilitation, and it has been determined that the individual requires employment supports in excess of the vocational rehabilitation services available to the individual;\n-Is found to be eligible for Home and Community Based waiver services (HCBS services) in accordance with He-M 503.05 or He-M 522.05;\n-Has a service agreement that includes the goals and desired outcomes that will be addressed through the provision of employment services; and\n-Has a prior authorization requested by the agency intending to provide employment services through the Medicaid program using the procedure outlined in He-M 517.11.\n\nThe determination or confirmation that the individual has an employment goal and desires shall occur at or by:\n-The preliminary recommendations for services process under He-M 503.05 or He-M 522.05;\n-The service planning required by He-M 503.09 or He-M 522.10;\n-The transition process described in Ed 1109.01 (a)(10) for individuals beginning at age 14 or younger, as applicable who are in school; or\n-Any other informal or formal means by which the individual expresses a desire to work.","url":"","verified":"","notes":"","row":3},{"id":"nh-the-individual-employment-planning-process-es-code","state":"NH","title":"The Individual Employment Planning Process (ES Code)","name":"The Individual Employment Planning Process","source":"ES Code","category":"employment","topic":"definition","text":"As part of the person-centered service planning process, the individual’s service coordinator shall include employment planning for each individual seeking or receiving employment services.\n\nThe employment planning process shall:\n-Be led by an employment professional qualified pursuant to He-M 518.10(e); and\n\nInclude:\n-A vocational evaluation or an assessment of employment interests and capacities;\n-Development of an employment profile to include:\n-Learning style;\n-Environmental needs;\n-Medical needs;\n-Physical needs; and\n-Safety needs;\n-Career exploration;\n-Goal setting;\n-Development of soft skills;\n=Development of hard skills through:\n-Internships;\n-Sector-based training;\n-Continuing education;\n-On-the-job training; and\n-Unpaid work experiences;\n-Development of strategies for achieving employment;\n-Transportation planning and training to independently use transportation options;\n-Community safety skills training; and\n-Work incentives planning.\n\nThe service agreement for each individual who receives employment services shall include:\n-An employment profile of the individual;\n-A resume and employment portfolio;\n-Employment goal(s) and strategies with specific timeframes for achieving the goal(s) that include:\n-Skills training;\n-Increased responsibilities;\n-Career advancement;\n-Increased wages;\n-Increased hours worked;\n-Change in employment; and\n-Any other identified goals;\n\nReferral to the bureau of vocational rehabilitation;\n\nIdentification of the roles and responsibilities of team members in implementing the goal(s) and service(s); and\n\nIdentification of any of the services listed in He-M 518.07 to achieve the goal(s).","url":"","verified":"","notes":"","row":4}]},{"code":"NJ","name":"New Jersey","notes":[],"entries":[{"id":"nj-supported-employment-individual-employment-support-provider-","state":"NJ","title":"Supported Employment – Individual Employment Support (Provider Manual)","name":"Supported Employment – Individual Employment Support","source":"Provider Manual","category":"employment","topic":"definition","text":"Activities needed to help a participant obtain and maintain an individual job in competitive or customized employment, or self-employment, in an integrated work setting in the general workforce for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities. The service may be delivered for an intensive period upon the participant’s initial employment to support the participant who, because of their disability, would not be able to sustain employment without supports. Supports in the intensive period are delivered in a face-to-face setting, one-on-one. The service may also be delivered to a participant on a less intensive, ongoing basis (“follow along”) where supports are delivered either face-to-face or by phone with the participant and/or their employer. Services are individualized and may include: training and systematic instruction, job coaching, benefit support, travel training, and other workplace support services including services not specifically related to job-skill training that enable the participant to be successful in integrating into the job setting.Training and systematic instruction\n\n Job coaching\n\nBenefit support/planning\n\nJob development\n\nTravel training\n\nTraining that will enable an individual to be successful in integrating on a job setting (even where not specifically related to job skills)\n\nJob site analysis","url":"","verified":"","notes":"","row":1},{"id":"nj-supported-employment-small-group-employment-support-provider","state":"NJ","title":"Supported Employment – Small Group Employment Support (Provider Manual)","name":"Supported Employment – Small Group Employment Support","source":"Provider Manual","category":"employment","topic":"definition","text":"Services and training activities provided to participants in regular business, industry and community settings for groups of two to eight workers with disabilities. Services may include mobile crews and other business-based workgroups employing small groups of workers with disabilities in employment in the community. Services must be provided in a manner that promotes integration into the workplace and interaction between participants and people without disabilities. Services may include: job placement, job development, negotiation with prospective employers, job analysis, training and systematic instruction, job coaching, benefit support, travel training and planning. Mobile crews / crew labor\n\nGroup placement (enclaves)\n\nSocial enterprises in which employees are making at least minimum wage\n\nOn-site job training\n\nJob development\n\nJob site analysis","url":"","verified":"","notes":"","row":2},{"id":"nj-service-limitations-supported-employment-individual-employme","state":"NJ","title":"Service Limitations - Supported Employment – Individual Employment Support (Provider Manual)","name":"Service Limitations - Supported Employment – Individual Employment Support","source":"Provider Manual","category":"employment","topic":"limits","text":"This service is available to participants in accordance with the DDD Supports Program Policies & Procedures Manual and as authorized in their Service Plan. Documentation is maintained in the file of each individual receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973, the IDEA (20 U.S.C. 1401) or P.L. 94-142. Supported Employment – Individual Employment Support is limited to 30 hours per week. Transportation to or from a Supported Employment site is not included in the service. When Supported Employment is provided at a work site in which people without disabilities are employed, payment will be made only for the adaptations, supervision and training required for participants as a result of their disabilities and will not include payment for the supervisory activities rendered as a normal part of the business setting or for incentive payments, subsidies or unrelated training expenses. Training and systematic instruction\n\n Job coaching\n\nBenefit support/planning\n\nJob development\n\nTravel training\n\nTraining that will enable an individual to be successful in integrating on a job setting (even where not specifically related to job skills)\n\nJob site analysis","url":"","verified":"","notes":"","row":3},{"id":"nj-service-limitations-supported-employment-group-employment-su","state":"NJ","title":"Service Limitations - Supported Employment – Group Employment Support (Provider Manual)","name":"Service Limitations - Supported Employment – Group Employment Support","source":"Provider Manual","category":"employment","topic":"limits","text":"This service is available to participants in accordance with the DDD Supports Program Policies & Procedures Manual and as authorized in their Service Plan. Documentation is maintained in the file of each individual receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973, the IDEA (20 U.S.C. 1401) or P.L. 94-142. Supported Employment – Small Group Employment Support is limited to 30 hours per week. Transportation to or from a Supported Employment site is not included in the service. When Supported Employment is provided at a work site in which people without disabilities are employed, payment will be made only for the adaptations, supervision and training required for participants as a result of their disabilities and will not include payment for the supervisory activities rendered as a normal part of the business setting or for incentive payments, subsidies or unrelated training expenses.","url":"","verified":"","notes":"","row":4},{"id":"nj-provider-qualifications-provider-manual","state":"NJ","title":"Provider Qualifications (Provider Manual)","name":"Provider Qualifications","source":"Provider Manual","category":"employment","topic":"provider","text":"All providers of Supported Employment services (Individual or Small Group Employment Support) must comply with the standards set forth in this manual. In addition, Supported Employment providers shall complete State/Federal Criminal Background checks and Central Registry checks for all staff, drug tests as applicable under Stephen Komninos’ Law, and ensure staff successfully completes the Division mandated training, are a minimum of 20 years of age, and possess a valid driver’s license and abstract (not to exceed 5 points) if driving is required.","url":"","verified":"","notes":"","row":5},{"id":"nj-pre-placement-phase-provider-manual","state":"NJ","title":"Pre-Placement Phase (Provider Manual)","name":"Pre-Placement Phase","source":"Provider Manual","category":"employment","topic":"activities","text":"Services utilized to assist the job seeker in identifying a career path and potential job matches and finding competitive employment in the general workforce. Activities conducted in this phase of Supported Employment include but are not limited to the following:\n\nAssessments – particularly situational assessments (also known as trial work experience, community-based vocational assessment, job sampling) to identify the individual’s strengths, skills, preferences, support needs, etc.;\n\nVocational profile development – details areas of career interest; identifies strengths, skills, preferences, support needs; and provides a plan for finding employment;\n\nJob development – utilizing assessment information to target jobs available in the local labor market and link the job seeker with job opportunities consistent with their interests, abilities, and identified work goal. Some activities may include meeting with employers, proposing a potential employee to the employer, etc.;\n\nDevelopment/improvement of job seeking skills – assistance with resume development, building interview skills, assisting with networking, completing applications, etc.;\n\nAddressing concerns/barriers – assisting the job seeker in understanding how to maintain benefits while working, explaining work incentives available through the Social Security Administration, explaining WorkAbility – NJ’s Medicaid Buy-In Program, linking the individual to transportation options, etc.;\n\nJob site analysis – the systematic study of a specific job that is conducted by observing a worker performing their job and making note of the tasks and duties performed by the worker as well as determining the skill, educational, and experience requirements necessary for the job and the safety and work culture of the environment in which this job is performed;\n\nOutreach to businesses – setting up interviews (and/or trial work periods for individuals with limited interview skills), explaining the benefits of hiring the job seeker, arranging customized employment opportunities, identifying and proposing support needs as applicable, job carving, job restructuring, etc.","url":"","verified":"","notes":"","row":6},{"id":"nj-intensive-job-coaching-phase-provider-manual","state":"NJ","title":"Intensive Job Coaching Phase (Provider Manual)","name":"Intensive Job Coaching Phase","source":"Provider Manual","category":"employment","topic":"activities","text":"Services utilized once the job seeker has become employed to assist the employer in teaching the job, communicating standards, and supporting the employee as well as assist the newly hired employee in learning the job, understanding how to perform their work tasks to the standard of the employer, and integrating into the work site. Activities conducted in this phase of Supported Employment include but are not limited to the following:\n\nAssistance with orientation and new hire activities;\n\nOn-site job coaching;\n\nDirect training on job duties/tasks;\n\nDeveloping strategies, interventions, jigs, accommodations, and natural supports\n\nTravel training;\n\nSupporting the employee in communicating with the employer;\n\nFading from the job site as the employer becomes more skilled at their job and independent","url":"","verified":"","notes":"","row":7},{"id":"nj-long-term-follow-along-phase-provider-manual","state":"NJ","title":"Long-Term Follow-Along Phase (Provider Manual)","name":"Long-Term Follow-Along Phase","source":"Provider Manual","category":"employment","topic":"activities","text":"Services utilized once the employee is stabilized on the job and can perform their job independently with the strategies, interventions, jigs, accommodations, and natural supports that have been established. Activities conducted in this phase of Supported Employment include but are not limited to the following:\n\nOngoing and regular on- or off-site support to ensure job stabilization continues;\n\nAddress changes to job duties/tasks\n\nMeet standards of a new supervisor;\n\nAddress issues/concerns that come up;\n\nAssist in career planning (promotions, salary increases, new tasks/jobs, other job opportunities, etc.)","url":"","verified":"","notes":"","row":8}]},{"code":"NM","name":"New Mexico","notes":[],"entries":[{"id":"nm-person-centered-assessments-pca-and-career-development-plans","state":"NM","title":"Person Centered Assessments (PCA) and Career Development Plans (DD Waiver Service Standards)","name":"Person Centered Assessments (PCA) and Career Development Plans","source":"DD Waiver Service Standards","category":"career","topic":"definition","text":"Agencies who provide CCS and/or CIE are required to complete a person-centered assessment (PCA). A PCA is a person-centered planning tool that is intended to be used for the service agency to get to know the person whom they are supporting and to help identify the individual needs and strengths to be addressed in the ISP. The PCA should provide the reader with a good sense of who the person is and is a means of sharing what makes an individual unique. The information gathered in a PCA should be used to guide community inclusion services for the individual. Recommended methods for gathering information include paper reviews, interviews with the individual, guardian or anyone who knows the individual well including staff, family members, friends, BSC therapist, school personnel, employers, and providers. Observations in the community, home visits, neighborhood/environmental observations research on community resources, and team input are also reliable means of gathering valuable information. A Career Development Plan (CDP), developed by the CIE Provider Agency with input from the CCS Provider, must be in place for job seekers or those already working to outline the tasks needed to obtain, maintain, or seek advanced opportunities in employment. For those who are employed, the career development plan addresses topics such as a plan to fade paid support from the worksite or strategies to improve opportunities for career advancement. CCS and CIE Provider Agencies must adhere to the following requirements related to a PCA and Career Development Plan:\n\n1.A PCA should contain, the following major topics, at a minimum:\na.information about the person’s background and current status;\nb.the person’s strengths and interests and how they are known;\nc.conditions for success to integrate into the community, including conditions for job success (for those who are working or wish to work); and\nd.support needs for the individual.\n2.The agency must involve the individual and describe how they were involved in the development of the PCA. A guardian and those who know the person best must also be included in the development of the PCA, as applicable.\n3.Timelines for completion: A new or updated PCA is required for all individuals receiving CCS and/or CIE services. When an individual is new to an agency or services, the new agency is required to complete a new PCA within 90 days from the start of CCS/CIE services. If an individual has been receiving CCS/CIE services for over 90 days from a CCS or CIE agency, an annual PCA is required. The Provider Agency must ensure that the PCA is reviewed and updated with the most current information, annually. A more extensive update of the PCA must be completed every five years. PCAs completed at the 5-year mark should include a narrative summary of progress toward outcomes from initial development, changes in support needs, major life changes, etc. If there is a significant change in a person’s circumstance, a new PCA should be considered because the information in the PCA may no longer be relevant. A significant change may include but is not limited to losing a job, changing residence or provider, and/or moving to a new region of the state. (See Chapter 6.3 Role of Assessments for more information on submission deadlines.)\n4.If a person is receiving more than one type of service from the same provider, one PCA with information about each service is acceptable.\n5.PCA’s should be signed and dated to demonstrate that the assessment was reviewed and updated with the most current information, at least annually.\n6.A career development plan is developed by the CIE provider with input from the CCS provider, as appropriate, and can be a separate document or be added as an addendum to a PCA. The career development plan should have specific action steps that identify who does what and by when.","url":"","verified":"","notes":"","row":1},{"id":"nm-employment-first-steps-dd-waiver-service-standards","state":"NM","title":"Employment First - Steps (DD Waiver Service Standards)","name":"Employment First - Steps","source":"DD Waiver Service Standards","category":"general","topic":"activities","text":"1.Assessment: The first step in making an informed choice about employment starts with the assessment process. The Person-Centered Assessment (PCA) and minimum requirements are referenced in Chapter 11.4: Person Centered Assessments (PCA) and Career Development Plans below.\n2.Experience: The second step in making an informed choice includes offering opportunities to explore new experiences in the community to determine interests, abilities, and assess skills for individuals that have no volunteer or work history. It is the responsibility of the provider to offer and document the outcome of these experiences. The outcome of these experiences must be documented by the CM in the ISP Work, Education and/or Volunteer History section. If new experiences will not be explored, those reasons should be documented in the ISP, as well.\n3.Opportunity for Trial Work or Volunteering: The third step in making an informed choice includes offering/providing the person job exploration activities including volunteer options and/or trial work opportunities if the person and guardian are interested. Provider Agencies should assist in accessing these opportunities. These opportunities must be documented by the CM in the ISP in the Work, Education and/or Volunteer History section.\n\nOnce the first three steps have been fulfilled, then the individual, in conjunction with a legal guardian, if appropriate, can determine whether employment shall be pursued.\n\nIf employment is the preferred option, then the IDT shall have a discussion of potential impact on the person’s benefits and services. This process may require accessing community resources to determine the potential impact. Provider Agencies can assist in providing this information, and the details of the discussion must be documented by the CM in the Work, Education and/or Volunteer History section of the ISP as described in Chapter 6.6.3.4: Documenting Employment First in the ISP.\n\nIf a person is retired, then this information must be clearly documented in the ISP in the Work, Education and/or Volunteer History section. The reasons for the choice to retire, the retirement date, and other pertinent information should be included in the ISP as described in Chapter 6.6.3.4: Documenting Employment First in the ISP.","url":"","verified":"","notes":"","row":2},{"id":"nm-community-integrated-employment-dd-waiver-service-standards","state":"NM","title":"Community Integrated Employment (DD Waiver Service Standards)","name":"Community Integrated Employment","source":"DD Waiver Service Standards","category":"employment","topic":"definition","text":"Community Integrated Employment (CIE) activities support individuals to obtain and maintain employment in the community. Services are individualized to meet the needs, interests and skills of the person that is being supported. Employment services support people in jobs that are in integrated businesses, industries, or government environments.\nCIE is intended to provide support that result in jobs in the community which increase economic independence, self-reliance, social connections, and the ability to grow within a career.\n\nCIE services are geared to place people with disabilities in employment settings with non- disabled co-workers within the general workforce or assist the person in business ownership. This service may include small group employment. People are supported to explore and seek opportunities for career advancement through growth in wages, hours, experience, promotions and/or movement from group to individual employment. People are provided with the opportunity to participate in negotiating their work schedule, break/lunch times, leave and medical benefits with their employer. These activities are to be reflected in individual career development plans.\n\nCIE includes Job Development, Short-term Job Coaching, Job Maintenance, Self-Employment, Intensive Community Integrated Employment (ICIE), and CIE- Group models. All the models may incorporate elements of customized employment, which includes job carving, job restructuring, and negotiated responsibilities. Reasonable accommodation is essential to employment, when needed. A Community Inclusion Aide may be provided to assist individuals with personal care needs related to ADLs in individual community employment settings when natural support is not available. Services must be provided in a way that does not embarrass, disrespect, or restrict a person from making friendships and co-worker relationships. Natural/peer support should be explored and encouraged to potentially fade the paid supports. Fading paid support is most successful when natural/peer supports are in place and stable.\n\nIn a group employment setting, the provider determines the job site and is responsible for the day-to-day supervision of the individuals and for follow-up services. For individual placements, the employer is responsible for the provision of general supervision consistent with his or her role as employer.\n\n11.7.2.1 General CIE Requirements\n\nCIE services shall be provided based on the interests of the person and Desired Outcomes listed in the ISP. Employment services are to be available 365 days a year, 24 hours a day. Services are driven by the person’s Desired Outcome and the job. Services may include remote based support if they are appropriate, and person centered. CIE services are not intended to be portrayed as a 2 for 1 employment situation. Individuals should be supported to be as independent as possible, on the job. CIE Staff are expected to support, teach/train and promote independence and are not allowed to complete the job for the individual.\n\nRequirements include:\n1.Arranging for, providing, or training on transportation supports during CIE including the use of public transportation (i.e., bus, train, ride share, etc.) options;\n2.Accessing services and supports through agencies such as the Division of Vocational Rehabilitation (DVR) and Department of Workforce Solutions (DWS), including attendance at appointments. Individuals who have a change in employment such as, loss of a job, wants a second job, wants to advance and/or transition to other types of employment are required to utilize funding for services available through vocational rehabilitation and special education as mandated in federal regulation;\n3.Providing basic assistance needed for personal care and ADL (such as eating, toileting and personal hygiene);\n4.For persons with health care needs:\na.receiving training and oversight through ANS to implement HCPs and implementation of practitioner’s orders occurring during CCS;\nb.aiding and support with medication delivery in compliance with the DDSD AWMD training; and\nc.collaborating and communicating with ANS Provider Agencies to immediately communicate any health issues or concerns.\n5.Implementing a Communication Dictionary, AT, AAC, or RPST and communicating any needs or concerns to the appropriate therapist in a timely manner, including battery replacement and use of recharging devices as needed to assure function;\n6.Implementing, tracking progress and documenting outcomes of healthcare orders, therapy plans, WDSIs, TSS, HCPs, PBSPs, BCIPs, PPMPs, RMPs, and CARMPs, as applicable to the person in service;\n7.Communicating any concerns to the relevant authors of plans;\n8.Promoting and encouraging a safe environment free of abuse, neglect, or exploitation\n9.Ensuring and implementing a system to communicate and minimize any disruption to a person’s employment when an individual suffers a “life change” (e.g., hospitalization, health status change, relocation to another city, loss of employment);\n10.Attending IDT meetings within ten calendar days of a person’s life change to take appropriate actions to minimize a disruption in the person’s employment. (See Chapter 6.5.2: ISP Revisions for more information.); and\n11.Remote based supports may be implemented to assist the individual in employment. Remote based supports must comply with the CIE Scope of work. In addition:\na.Staff must be trained to support individuals using remote-based supports.\nb.Remote based supports may only be billed from the start time of the remote based class/session to the end time of the remote based class/session. Agencies may only bill for one location at a time, either remote or in person, not both.\nc.Agencies may not bill for time used to develop remote based supports or supplies associated with sessions.\nd.If technical issues occur (i.e., internet outage, power, or connectivity issues) only the hours that the service was provided can be billed.\ne.Remote based supports must meet accessibility requirements related to both the ADA and the individual’s technology availability.\nf.Providers are responsible for providing remote services on a platform that all individuals can access. An inability for an individual to access remote services is the same as choosing to not provide the service.\ng.Remote based supports must be person centered and presented in the ISP Action Plan and Outcomes.\nh.Remote based supports are intended to supplement not supplant necessary employment supports and must not lead to social isolation. Individuals are encouraged to participate in community integrated employment to the fullest extent possible in conjunction with the use of remote based supports.\ni.DTs are encouraged to explore AT and RPST to support independence in employment, to the fullest extent possible.","url":"","verified":"","notes":"","row":3},{"id":"nm-community-integrated-employment-group-dd-waiver-service-stan","state":"NM","title":"Community Integrated Employment-Group (DD Waiver Service Standards)","name":"Community Integrated Employment-Group","source":"DD Waiver Service Standards","category":"employment","topic":"definition","text":"In CIE- Group as many as six individuals work in an integrated setting with staff support on site. Regular and daily contact with non-disabled coworkers and/or the public must occur. Within the CIE Group model, there are two categories of service: CIE Group Category 1 and CIE- Group Category 2 Extensive Support. The two categories are based on the intensity and nature of individual support needs. The scope of work for CIE- Group may include, but is not limited to, the following:\n1.Staff ratios at a non-residential facility or in the community are dependent upon the person’s approved category of service:\na.CIE Group Category 1 are not to exceed one-to-six (1:6).\nb.CIE – Group Category 2 – Extensive Support are not to exceed one-to-four (1:4).\n2.Participating in the IDT to develop a plan to assist a person who desires to move from group employment to individual employment, including accessing services and supports through agencies such as the Division of Vocational Rehabilitation (DVR) and Department of Workforce Solutions (DWS), including attendance at appointments.\n3.Assisting the person to gain and/or increase job skills, which include, but are not limited to additional training, fading of support, and opportunities for career advancement to individual employment.\n4.Exploring, facilitating, developing, requesting, and implementing job accommodations and the use of assistive technology to help an individual be successful in employment.\n5.Providing effective job support and on-the-job training as needed to assist the person in maintaining the job placement and enhancing skill development.\n6.Advocating for the person to be integrated into the work culture, including attending job–related social functions and interacting with non-disabled co-workers during lunch or break times, as well as fully accessing employer designated dining or break areas.","url":"","verified":"","notes":"","row":4}]},{"code":"NY","name":"New York","notes":[],"entries":[{"id":"ny-pathway-to-employment-overview-memo","state":"NY","title":"Pathway to Employment Overview (Memo)","name":"Pathway to Employment Overview","source":"Memo","category":"prevoc","topic":"definition","text":"Pathway to Employment is a time-limited, person-centered, comprehensive, career and vocational planning and support service. The goal of this service is to help people develop a vocational plan with an identified career path to obtain competitive integrated employment in the future. This habilitative service uses an individualized career and vocational planning process to identify the person’s vocational strengths and interests. This service includes community vocational experiences and support services.\n\nThe outcome of Pathway to Employment is a career, vocational and transition plan document which includes the next steps for achieving self-employment or competitive, integrated employment at or above the applicable state or federal minimum wage.","url":"","verified":"","notes":"","row":1},{"id":"ny-limits-memo","state":"NY","title":"Limits (Memo)","name":"Limits","source":"Memo","category":"prevoc","topic":"limits","text":"Pathway to Employment is time limited. Eligible individuals may be approved for Pathway to Employment for up to 12 months or 425 hours, whichever occurs first. In extenuating circumstances, the Pathway to Employment provider may request OPWDD approval for additional hours and/or days of this service. Attachment # 2, Request to Bill Additional Pathway to Employment Services, see (b) in this section.\n\nA. Managing Pathway to Employment as a Time-Limited Service\nService providers must effectively plan and manage the delivery of Pathway to Employment services to ensure that the person is provided with a comprehensive Career, Vocational and Transition plan within the timeframe for completion (i.e., 12 months or 425 hours whichever is sooner). Service providers should discuss disenrollment from Pathway to Employment services if the individual is inactive, has a significant change in status which impacts their ability to engage in the service, or the agency lacks the resources necessary to deliver services within the established timeframes. Doing so will preserve the person’s lifetime allowance of Pathway to Employment hours and/or days for future use.\n\nB. Requesting Additional Hours and/or Days for Pathway to Employment\nIf a service provider in coordination with the person and support team determines that the person needs more than 12 months or 425 hours, then they must submit a Request to Bill Additional Pathway to Employment \tServices form (see Attachment #2) to the OPWDD Central Office Employment and Meaningful Community Activities Unit. When reviewing these requests, OPWDD considers:\n1.The services delivered;\n2.The person’s requests, interests and needs;\n3.Whether the service provider has provided a reasonable number of hours in community-based vocational experiences;\n4.New strategies and resources to complete the Career, Vocational and Transition Plan;\n5.Whether authorization of additional hours and/or days is in the best interest of the individual; and\n6.Any other relevant criteria as determined by the OPWDD Central Office Employment Unit.\nIf the request for additional hours or days is authorized by OPWDD, it must not exceed 24 months or 556 lifetime hours whichever occurs first. The service provider must maintain documentation of OPWDD’s authorization of additional hours and/or time.\n\nC. Disenrollment from Pathway to Employment\nPeople will be automatically disenrolled from Pathway to Employment 24 months from enrollment. This includes non-contiguous periods of service when a person may have enrolled in the service multiple times. Providers are responsible for checking with the person and their Care Manager to determine if the individual previously received Pathway to Employment services with another provider.","url":"","verified":"","notes":"","row":2},{"id":"ny-community-based-settings-memo","state":"NY","title":"Community-Based Settings (Memo)","name":"Community-Based Settings","source":"Memo","category":"prevoc","topic":"activities","text":"Pathway to Employment services must be delivered primarily in community-based settings. Community-based settings are locations that are used by the general public, where people with disabilities have opportunities to interact with other people who do not have disabilities, do not receive Medicaid HCBS, and are not paid to provide services to people with disabilities.","url":"","verified":"","notes":"","row":3},{"id":"ny-community-based-vocational-experiences-memo","state":"NY","title":"Community-Based Vocational Experiences(Memo)","name":"Community-Based Vocational Experiences","source":"Memo","category":"employment","topic":"definition","text":"Community-based vocational experiences and career exploration activities are fundamental elements of Pathway to Employment services. Service providers are expected to develop community-based vocational experiences following initial planning and meetings with the person. Community-based vocational experiences and career exploration activities must be delivered in integrated settings alongside members of the broader community (e.g., local, community-based businesses and organizations). The purpose of community-based vocational experiences is to identify the person’s demonstrated skills, interests, strengths, and support needs in a variety of vocational areas.","url":"","verified":"","notes":"","row":4}]},{"code":"NC","name":"North Carolina","notes":[],"entries":[{"id":"nc-supported-employment-scope-se-policy","state":"NC","title":"Supported Employment Scope (SE Policy)","name":"Supported Employment Scope","source":"SE Policy","category":"employment","topic":"activities","text":"A supported employment program is a service that provides periodic support services for individuals 16 years of age or older with developmental disability, mental illness or substance abuse disorders to prepare the individual to work as independently as possible. The service is typically planned and implemented in cooperation with the Division of Vocational Rehabilitation Services.\n\nSupported employment encompasses a variety of services, which are implemented according to the employment needs of the individual as identified in the individual's service plan. These include vocational evaluation, job development, intensive training, job placement, and long-term support. Support services to clients' families and consultation with the clients' employers and other involved agencies may also be provided.\n\nThe Rules contained in this Section are applicable to two specific models of supported employment services:\n1.Supported Employment. All of the training activities in this model occur in a separate location in the community, not in a specialized facility maintained by the operator.\n2.Supported Employment - Long-Term Support. Clients served in this model have successfully completed the intensive initial training phase of supported employment sponsored by the Division for Vocational Rehabilitation Services, and now are receiving those long-term support services targeted towards maintenance in the job, which are the responsibility ofDMH/DD/SAS:\na.At a minimum these services provide monthly monitoring at the work site of each individual in supported employment in order to assess employment stability, unless the individualized written rehabilitation plan specifies a different monitoring schedule or off­site monitoring, which is based on client request.\nb.Examples of such long-term support services include \"refresher\" vocational training to ensure that existing job skills are not lost, training in new job performance expectations, and consultation to other employees, employers, and families, and residential program staff.","url":"","verified":"","notes":"","row":1},{"id":"nc-phase-1-pre-employment-phase-se-policy","state":"NC","title":"Phase 1: Pre-employment Phase (SE Policy)","name":"Phase 1: Pre-employment Phase","source":"SE Policy","category":"employment","topic":"activities","text":"Activities completed before an individual starts work:\n1.Trying out jobs and activities\n2.Learning new skills\n3.Learning how a new job might change other benefits they receive\n4.Searching and applying for jobs\nImportant note: This phase is often completed in DVR. If an individual is starting this process for the first time, DVR will support the Pre-Employment activities","url":"","verified":"","notes":"","row":2},{"id":"nc-phase-2-employment-stabilization-se-policy","state":"NC","title":"Phase 2: Employment Stabilization (SE Policy)","name":"Phase 2: Employment Stabilization","source":"SE Policy","category":"employment","topic":"activities","text":"Activities to help with learning and keeping a job:\n1.Hands-on Job Coaching\n2.Demonstrating work tasks\n3.Helping set up work\n4.Building relationships\n5.Build a plan to do the job without staff on site","url":"","verified":"","notes":"","row":3},{"id":"nc-phase-3-long-term-supported-employment-se-policy","state":"NC","title":"Phase 3: Long-Term Supported Employment (SE Policy)","name":"Phase 3: Long-Term Supported Employment","source":"SE Policy","category":"employment","topic":"activities","text":"Have a plan with the individuals career goals and the supports they need to achieve those goals and keep their job","url":"","verified":"","notes":"","row":4},{"id":"nc-eligibility-state-funded-employment-se-policy","state":"NC","title":"Eligibility – State Funded Employment (SE Policy)","name":"Eligibility – State Funded Employment","source":"SE Policy","category":"employment","topic":"eligibility","text":"To be eligible for State Funded Supported Employment, all of the following criteria must be met\n1.At least 16 years old\n2.IDD or TBI Diagnosis\n3.SNAP/SIS/TBI/VR Assessment\n4.At least 1 functional impairment","url":"","verified":"","notes":"","row":5}]},{"code":"ND","name":"North Dakota","notes":[],"entries":[{"id":"nd-prevocational-services-waiver","state":"ND","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Prevocational Services are formalized training, experiences, and staff supports designed to prepare participants for paid employment in integrated community settings. Services are structured to develop general abilities and skills that support employability in a work setting. Services may include training in effective communication within a work setting, workplace conduct and attire, following directions, attending to tasks, problem solving, and workplace safety. Services are not directed at teaching job-specific skills, but at specific habilitative goals outlined in the participant’s person-centered service plan.\n\nRates for Prevocational Services may include transportation costs to access program related activities in the community. Transportation does not include travel between the participant's home and the Prevocational Services program site. Any transportation provided to a participant as a part of the rate is not billable as a discrete service andcannot duplicate transportation provided under any other service in this waiver or Medicaid State Plan.\n\nThis service is to provide support for conditions specifically related to IID/DD.\n\nA participant’s need and desire for continued Prevocational Services shall be evaluated every twelve (12) months, or more frequently if requested by the participant and/or legal decision maker.\n\nProviders must, in consultation with each participant, develop employment goals/outcomes in their person-centered service plan that outlines a pathway for transitioning to integrated, employment. The person-centered service plans must be updated annually and document each participant’s progress toward completion of prevocational training.\n\nThe Department will review annually the active progress made during the prior year on increasing general work skills, time on tasks, or other job preparedness objectives. The Developmental Disabilities Program Administrator\n\n(DDPA) may approve an additional 12 months, twice (for a total of 24 months), of prevocational training with submission of employment outcomes that are consistent with the participant’s goals/outcomes in their person-centered service plan. A participant who requests to remain in the service beyond the two additional approvals from the DDPA (36 months) must receive approval from the DD Section.\n\nIndividuals participating in this service may be compensated in accordance with applicable federal laws and regulations.\n\nParticipation in this service is not a required prerequisite for Individual Employment or Small Group Employment Support services furnished under this waiver.\n\nParticipants who require ongoing nursing support may be eligible for a higher medical acuity level. There are 3 additional medical acuity tiers for the Prevocational Services rate. These tiers are based on the participant’s assessed medical needs.\n\nStaff who provide services in the medical acuity tiers are required to have a current Certified Nursing Assistant (CNA) certification or equivalent or higher.\n\nA nurse assessment and care plan are required for the medical acuity tiers. The participant’s person-centered service plan must address medical needs. Nursing services must be within the scope of the State’s Nurse Practice Act and are provided by a registered professional nurse (RN), or licensed practical nurse (LPN) under the supervision of a RN licensed to practice in the state North Dakota","url":"","verified":"","notes":"","row":1},{"id":"nd-prevocational-services-limits-waiver","state":"ND","title":"Prevocational Services - Limits (Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"This service does not include training and services available to a participant through the Rehabilitation Act of 1973 or Individuals with Disabilities Education Act (IDEA).\n\nThis service cannot duplicate any other service in this waiver.\n\nThis service shall not be furnished or billed at the same time of day as other services that provide direct care to the participant. These services include Medicaid State Plan Services, In-Home Supports, Residential Habilitation, Independent Habilitation, Extended Home Health Care, Parenting Support, Adult Foster Care, Behavioral Consultation, Respite, or Homemaker services. This service shall be available to those receiving Day Habilitation, Individual Employment Support and Small Group Employment Support and subject to limitations stipulated in DD Section policy. Billing for such services may not be duplicated in a time period. Hours authorized in Day Habilitation, Individual Employment Support, Small Group Employment and Prevocational Services may not exceed 40 cumulative hours per week per participant.\n\nPrevocational Services cannot be authorized on the individual service plan with Family Care Option.\n\nThe service is limited to additional services not otherwise covered under the state plan, including EPSDT, but consistent with waiver objectives of avoiding institutionalization.","url":"","verified":"","notes":"","row":2},{"id":"nd-prevocational-services-provider-specifications-waiver","state":"ND","title":"Prevocational Services – Provider Specifications (Waiver)","name":"Prevocational Services – Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"For Medical Acuity Tiers, staff are required to have a current Certified Nursing Assistant (CNA) certification or equivalent or higher.\n\nAnnual verification","url":"","verified":"","notes":"","row":3},{"id":"nd-supported-employment-waiver","state":"ND","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Individual Employment Support services are long-term ongoing supports to assist participants in maintaining paid employment in an integrated setting or self-employment. This service is designed for participants who need intensive ongoing support to perform in a work setting. Service includes on- or off-the-job employment-related support for participants needing intervention to assist them in obtaining or maintaining employment, in accordance with their person-centered service plan. Supports are provided on an individual basis. Participants are paid by the employer at or above minimum wage.\n\nTransportation from a participant’s residence to their workplace may be included in authorized services hours when a participant needs it as a support intervention for the participant to maintain employment. It is not allowed as a substitute for personal, public, or generic transportation, is not billable as a discrete service, and cannot duplicate any transportation under any other service in this waiver or Medicaid State Plan.\n\nThis service is to provide support for conditions specifically related to IID/DD.\n\nThis service may be provided remotely through virtual supports as determined necessary to ensure services are delivered while considering participant choice, compliance with CMS requirements and identified in the participant's person-centered plan. If the participant requires hands on assistance for a specific task, then virtual supports service delivery cannot be an option for that task but may be utilized for other tasks that do not need hands on support.\n\nA Virtual Support Checklist will be required to be completed by the DD Program Manager and the team during the person-centered planning process. This checklist will act as a safeguard to ensure virtual supports can help meet the needs of the participant in a way that protects the right to privacy, dignity, respect, and freedom from coercion. Any issues will be addressed prior to the implementation of remote supports. The checklist will ensure that the planning process has considered service needs and if these needs can be met by using a virtual supports method of service delivery. The Virtual Support Checklist will include consideration of the estimated hours/visits that virtual supports delivery will be utilized. The risk assessment and service plan require the team to develop a plan to address health, safety and behavioral needs while remote supports are utilized so appropriate assistance can be provided. In virtual supports, the use of cameras in bathrooms or bedrooms is not permitted. Virtual supports reinforce community integration by encouraging the participant to engage in community life as independently as possible and to be able to safely engage in activities in his or her home or in the community without relying on the physical presence of staff to accomplish those activities.\n\nThe participant’s services may not be delivered via virtual support 100% of the time. The participant must always have the option to request in-person services. The amount of time chosen shall be determined during the person-centered planning process and outlined in the Individual Service Plan. Provider must use a HIPAA compliant service delivery method (e.g. Microsoft Teams, Zoom for Healthcare). HIPAA rules apply to all covered entities regarding HIPAA Privacy and Security. Participant will be given education and support on the use of virtual supports by their chosen provider. Virtual supports are not a system to provide surveillance or for staff convenience.","url":"","verified":"","notes":"","row":4},{"id":"nd-supported-employment-limits-waiver","state":"ND","title":"Supported Employment - Limits (Waiver)","name":"Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Direct intervention time for this service shall only be provided to one participant at a time. This service cannot duplicate any other service in this waiver.\n\nThis service shall not be furnished or billed at the same time of day as other services that provide direct care to the participant. These services include Medicaid State Plan Services, In-Home Supports, Residential Habilitation,\n\nIndependent Habilitation, Extended Home Health Care, Parenting Support, Adult Foster Care, Behavioral Consultation, Respite, or Homemaker services.\n\nThis service shall be available to those receiving Day Habilitation, Prevocational Services, and Small Group Employment Support services are subject to limitations stipulated in DD Section policy. Billing for such services may not be duplicated in a time period (e.g., billed for more than one service for 1:00 to 5:00 p.m. on April 1). Hours authorized in Day Habilitation, Individual Employment Support, Prevocational Services, and Small Group Employment Support services may not exceed 40 cumulative hours per week per participant.\n\nThis service does not include facility-based, or other similar types of vocational services furnished in specialized facilities that are not a part of the general workplace.\n\nThis service does not include payment for supervision, training, support and adaptations typically available to other workers without disabilities filling similar positions in the business.\n\nThis service does not include training and services available to a participant through the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (IDEA).\n\nIndividual Employment cannot be authorized on the individual service plan with Family Care Option.\n\nThis service is limited to additional services not otherwise covered under the state plan, including EPSDT, but consistent with waiver objectives of avoiding institutionalization.\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n1. Incentive payments made to an employer to encourage or subsidize the employer's participation in supported\n\nemployment; or\n\n2. Payments that are passed through to users of supported employment services.","url":"","verified":"","notes":"","row":5}]},{"code":"OH","name":"Ohio","notes":[],"entries":[{"id":"oh-supported-employment-defintions-se-code","state":"OH","title":"Supported Employment Defintions (SE Code)","name":"Supported Employment Defintions","source":"SE Code","category":"employment","topic":"definition","text":"Supported employment\" means competitive integrated employment, including customized employment, or employment in an integrated work setting in which an individual with a most significant disability, including a youth with a most significant disability, is working on a short-term basis toward competitive integrated employment that is individualized, customized, and consistent with the unique strengths, abilities, interests, and informed choice of the individual, including ongoing support services for individuals with the most significant disabilities for whom:\n1.Competitive integrated employment has not historically occurred or competitive integrated employment has been interrupted or intermittent as a result of a significant disability;\n2.Due to the nature and severity of their disabilities, the individual needs intensive supported employment services and extended services after the transition from support provided by the designated state unit, in order to perform this work.\n\n\"Supported employment services\" are ongoing support services that are organized and made available, singly or in combination, in such a way to assist an eligible individual with a disability to achieve competitive integrated employment based on a determination of the needs of an eligible individual, as specified in the individualized plan for employment (IPE).","url":"","verified":"","notes":"","row":1},{"id":"oh-ongoing-supports-definitions-se-code","state":"OH","title":"Ongoing Supports Definitions (SE Code)","name":"Ongoing Supports Definitions","source":"SE Code","category":"employment","topic":"definition","text":"\"Ongoing support services\" means services that:\n1.Are needed to support and maintain an individual with a most significant disability, including a youth with a most significant disability, in supported employment; and\n2.Are identified based on a determination by OOD of the individual's need as specified in an IPE.\n\n\"Extended services\" mean ongoing support services and other appropriate services that are: needed to support and maintain an individual in supported employment; based on the needs of an individual, as specified in an IPE; and provided by a state agency, a private nonprofit organization, employer, or any other appropriate resource, after an individual has made a transition from support from OOD.","url":"","verified":"","notes":"","row":2},{"id":"oh-ongoing-supported-services-se-code","state":"OH","title":"Ongoing Supported Services (SE Code)","name":"Ongoing Supported Services","source":"SE Code","category":"employment","topic":"definition","text":"Ongoing support services are furnished by OOD from the time of job placement until transition to extended services, unless post-employment services are provided following transition, and thereafter by one or more extended service providers throughout the individual's term of employment in a particular job placement.\n\nOngoing support services include an assessment of employment stability and provision of specific services or the coordination of services at or away from the worksite that are needed to maintain stability based on:\n1.At a minimum, twice-monthly monitoring at the worksite of each individual in supported employment; or\n2.If under specific circumstances the IPE provides for off-site monitoring, twice monthly meetings with the individual.\n\nOngoing support services may consist of:\n1.Any particularized assessment supplementary to the comprehensive assessment of rehabilitation needs;\n2.The provision of skilled job trainers who accompany the individual for intensive job skill training at the work site;\n3.Job development and training;\n4.Social skills training;\n5.Regular observation or supervision of the individual;\n6.Follow-up services including regular contact with the employers, the individuals, parents, family members, guardians, advocates or authorized representatives of the individuals, and other suitable professional and informed advisors, in order to reinforce and stabilize the job placement;\n\nFacilitation of natural supports at the worksite;\n\nAny other service identified in the scope of vocational rehabilitation services for individuals; or\n\nAny service similar to the foregoing services.","url":"","verified":"","notes":"","row":3}]},{"code":"OK","name":"Oklahoma","notes":[],"entries":[{"id":"ok-waiver-employment-services-ohca-policies-and-rules","state":"OK","title":"Waiver Employment Services (OHCA Policies & Rules)","name":"Waiver Employment Services","source":"OHCA Policies & Rules","category":"employment","topic":"definition","text":"Waiver Employment Services are offered under the Home and Community-Based Waiver for persons with intellectual disabilities at rates prescribed by the Oklahoma Health Care Authority.\n\nWaiver Employment Services include:\n1.Vocational Habilitation Training Specialist, Supplemental Support;\n2.Employment Training Specialist;\n3.Center-Based Services;\n4.Community-Based Services;\n5.Enhanced Community-Based Services;\n6.Job Coaching;\n7.Enhanced Job Coaching; and\n8.Stabilization Services.\n\nState-funded employment services are available to members of the Homeward Bound class who are not eligible for Developmental Disabilities Services Waiver services.","url":"","verified":"","notes":"","row":1},{"id":"ok-eligibility-ohca-policies-and-rules","state":"OK","title":"Eligibility (OHCA Policies & Rules)","name":"Eligibility","source":"OHCA Policies & Rules","category":"employment","topic":"eligibility","text":"Individuals served through Waiver Employment Services must be:\n1.16 years of age and older for persons receiving services through the Community Waiver, In Home Supports Waiver, or the Homeward Bound Waiver; and\n2.approved for waiver services, per Oklahoma Administrative Code (OAC) 317:40-1-1.\n\nServices available to the member through the Oklahoma Department of Rehabilitation Services (DRS) or through the state or local education agency are not funded under Waiver Employment Services.\n1.Members may utilize waiver employment services during times when school is not in session, and/or the member is not participating in an Individual Education Program that includes extended school year services through the school system\n2.All members seeking competitive, integrated employment make application to DRS. Prior to the authorization of Waiver Employment Services, the case manager documents the application for DRS services. The documentation is permanently maintained in the Client Contact Manager record.\n3.Since services provided by DRS are time-limited by federal law, Developmental Disabilities Services provides long-term, on-going supports for individuals who need long-term supports, per OAC 317:40-7-11.","url":"","verified":"","notes":"","row":2},{"id":"ok-community-based-services-ohca-policies-and-rules","state":"OK","title":"Community-Based Services (OHCA Policies & Rules)","name":"Community-Based Services","source":"OHCA Policies & Rules","category":"employment","topic":"definition","text":"Community-based services are provided in sites and at times typically used by others in the community and promote independence, community inclusion, and the creation of natural supports. Community-based services must reflect the member's choice and values in typical age and cultural situations.\n\nApproved community-based services are individualized work-related supports targeting inclusion into integrated experiences and are pre-planned, documented activities supported by a schedule relating to the member's identified employment outcomes. Approved community-based services activities include:\n1.active participation in formalized volunteer activities;\n2.active participation in paid or unpaid work experience sites in community settings;\n3.training through generic entities such as trade schools, technolog 􀀁 centers, community colleges, or other community groups. The provider i ] paid for the time when direct supports are necessary and provided;\n4.stamina-enhancing programs in integrated settings;\n5.transportation to and from employment or community-based activities;\n6.meals and breaks during the member's employment activities that occur in the community at a location used for the same purpose, with others without disabilities;\n7.job tours or job shadowing scheduled with and provided by a community­business entity;\n8.using Workforce OK services; and\n9.attending job fairs.\n\nAny other work-related, community-based activities must be approved through the exception process, per Oklahoma Administrative Code (OAC) 317:40-7-21.\n\nCommunity-based services continue when the member goes to a center-based facility for support, such as repositioning or personal care, as long as the member returns immediately to a planned community-based activity. The amount of time for the repositioning and personal care are based upon a Team-approved health care positioning plan.\n\nCommunity-based services are available for individual and group placements.\n1.Individual placement means the member is provided supports that enable him or her to participate in individual community-based activities described in this Section and not as part of a group placement.\n2.Group placement means two-to-five members are provided supports that enable participation in the approved community-based activities described in this section","url":"","verified":"","notes":"","row":3},{"id":"ok-definitions-ohca-policies-and-rules","state":"OK","title":"Definitions (OHCA Policies & Rules)","name":"Definitions","source":"OHCA Policies & Rules","category":"employment","topic":"definition","text":"\"Commensurate wage\" means wages paid to a worker with a disability based on the worker's productivity in proportion to the wages and productivity of workers without a disability performing essentially the same work in the same geographic area
