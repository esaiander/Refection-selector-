ation (Waiver)","name":"Individual Employment Support - Eligibility & Authorization","source":"Waiver","category":"employment","topic":"eligibility","text":"Eligibility and Authorization: SEI services are available only to customers who are engaged in competitive integrated employment and who have been successfully closed and transitioning from supports provided by the Illinois Department of Human Services, Division of Rehabilitation Services, Vocational Rehabilitation program.\n\nSEI services are authorized only for employment opportunities for which customers are compensated at or above (the higher of) local, state, or federal minimum wage and to the same degree as the customary wage and benefit levels of employees performing the same work who do not have disabilities.\n\nSEI services may not supplant services typically available from the Division of Rehabilitation Services’ Vocational Rehabilitation or are otherwise available under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act. Documentation must be maintained by the provider that the non-waiver employment services noted above (under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act) have been successfully exhausted.\n\nSEI services must be reviewed no less than annually, coinciding with the development or revision of the PCP.","url":"","verified":"","notes":"","row":2},{"id":"il-individual-employment-support-settings-and-service-array-wai","state":"IL","title":"Individual Employment Support - Settings & Service Array(Waiver)","name":"Individual Employment Support - Settings & Service Array","source":"Waiver","category":"employment","topic":"activities","text":"Employment Settings: SEI services may only be conducted within (or associated to) integrated settings in which persons without disabilities are employed and where customers have contact with co-workers, consumers, supervisors and others without disabilities who are not paid supports.\n\nService Array: SEI services provide intermittent or periodic job coaching, systematic instruction, job analysis, assistance with obtaining accommodations, benefits counselling or financial analysis, assistance with training or retraining, support in improving productivity, assistance with scheduling, support with efforts to obtain benefits, mobility training, assistance in fostering advancement opportunities, facilitation of communication between the customer and business co-workers, supervisors or consumers and other workplace assistance services which enable the customer to sustain competitive integrated employment or self-employment.\n\nSEI service providers are responsible for the delivery of all personal assistance needs required by the customer during the time that SEI services are provided. Personal assistance needs should be intermittent, and while a component of SEI, shall not comprise the entirety of the services being provided and providers of SEI services must ensure that the on-going personal assistance needs, which extend beyond natural supports, can be met when the provider is not present.\n\nSEI services are individualized and provided at a ratio of 1:1, staff member to customer.","url":"","verified":"","notes":"","row":3},{"id":"il-individual-employment-support-support-changes-waiver","state":"IL","title":"Individual Employment Support - Support Changes (Waiver)","name":"Individual Employment Support - Support Changes","source":"Waiver","category":"employment","topic":"definition","text":"Support Changes: The option to change the amount of supports provided is based on a change in needs and/or on an assessment of needs for the customer. Should the customer and staff recognize a need for a change in supports, the change should be developed as part of the customer’s person-centered plan and implementation strategy. Support changes that have been identified and are included in the implementation strategy must be reviewed regularly, but at least annually, by the Independent Service Coordination Agency to determine if the customer and staff continue to believe the existing supports are appropriate, if the supports are effective, and if further changes in supports should occur. It is expected that, due to the nature of supports and services provided, customers will develop skills and natural supports (non-paid support relationships) which allow for greater independence.","url":"","verified":"","notes":"","row":4},{"id":"il-individual-employment-support-self-employment-waiver","state":"IL","title":"Individual Employment Support - Self-Employment (Waiver)","name":"Individual Employment Support - Self-Employment","source":"Waiver","category":"employment","topic":"definition","text":"Self-Employment: SEI services may support the maintenance of Individual Self-Employment that is either based from a customer’s residence or located within an integrated setting. Self-Employment must result in earned wages that, after deduction of business expenses and after a start-up period of no more than 1 year, are equal to or greater than (the higher of) local, state, or federal minimum wage. Self-Employment services provide identification of business opportunities, support to explore and identify sources of financing opportunities and limited on-going ancillary assistance. Waiver funds offered through SEI may not be used to defray the expense of starting up or operating Self-Employment.","url":"","verified":"","notes":"","row":5},{"id":"il-individual-employment-support-self-employment-waiver-2","state":"IL","title":"Individual Employment Support - Self-Employment (Waiver)","name":"Individual Employment Support - Self-Employment","source":"Waiver","category":"employment","topic":"definition","text":"Payments: SEI service payments are only made for individual employment which meets competitive and integrated criteria. SEI service payments are not authorized for supervisory, training, support and adaptation activities typically offered by the employer to workers in similar positions or for group employment, non-paid prevocational activities (such as volunteering or internships paid below minimum wage) or time during which provider staff are not actively engaged in support. SEI services include a rate component for transportation for the staff member to travel to the employment site but customer facing time spent transporting the customer to and from a worksite is not considered billable time. Billable time related to transportation training shall be authorized only if the customer’s PCP indicates a specific need for transportation training and the transportation training is being provided. Transportation training must result in the eventual reduction of direct support related to travel.\n\nAdaptations, supervision and training under SEI, provided to the customer or to supervisors or coworkers on behalf of the customer, may include non-customer facing portions of time which support continued successful employment. However, a direct service benefiting the customer’s sustained employment outcome must be provided in order to bill for the time.","url":"","verified":"","notes":"","row":6},{"id":"il-individual-employment-support-duplication-of-services-waiver","state":"IL","title":"Individual Employment Support - Duplication of Services (Waiver)","name":"Individual Employment Support - Duplication of Services","source":"Waiver","category":"employment","topic":"definition","text":"Duplication of Services: SEI services may be combined with other services so long as the combined services are not duplicative, including the prohibition of:\n\n-billing other non-residential waiver services at the same time as SEI.\n\n-billing SEI services which are redundant or overlapped with Division of Rehabilitation Services’ Vocational Rehabilitation program payments or services\n\nA customer’s PCP may include more than one non-residential habilitation service (Supported Employment – Group Employment Services, Community Day Services, VDS); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expensessuch as the following:\n\n-Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment;\n\nOr\n\n-Payments that are passed through to users of supported employment services; or\n\n -Payments for training that is not directly related to a customer’s supported employment program.","url":"","verified":"","notes":"","row":7},{"id":"il-individual-employment-support-billing-waiver","state":"IL","title":"Individual Employment Support - Billing (Waiver)","name":"Individual Employment Support - Billing","source":"Waiver","category":"employment","topic":"billing","text":"SEI services shall be billed in 15-minute increments\n\nSEI services must be:\n\n-included in the Career and Income portion of the individual’s PCP.\n\n-approved by the ISC agency representative.\n\n-validated by the Division of Developmental Disabilities based on criteria including:\n\no setting\n\no hourly wage or salary\n\no number of work hours per week\n\no benefits\n\no location\n\no duration of employment\n\no job title\n\no employer\n\nNew SEI service requests post 1/1/21 require successful closure from the Division of Rehabilitation Services’ Vocational Rehabilitation program.\n\nSEI service providers must:\n\n• Comply with all Illinois Department of Human Services (IDHS), Division of Developmental Disabilities (DDD) requests\n\nfor information on case notes, billing records, employment records, including pay details, and other items as requested, including progress towards employment and career goals.\n\n• Allow DDD, Bureau of Quality Management to review the customer’s file as part of their survey process.\n\n• Recognize, and document in the customer’s record, changes in health behavior, work productivity or overall condition.\n\n• Report identified safety and sanitation hazards that occur at the worksite to employers having the responsibility to remedy the condition.\n\nIn circumstances where the provider of Supported Employment – Individual Employment Support wishes to hire the customer, in order to preserve the Medicaid free choice of provider requirement, the provider must ensure a policy exists related to the hiring and supervision of the customer which explicitly informs the customer of the option to identity and utilize services and supports from another provider and that the policy has been shared with the customer. In this circumstance, the provider must also ensure that the role(s) which have been identified meet(s) the threshold of competitive integrated employment.","url":"","verified":"","notes":"","row":8},{"id":"il-individual-employment-support-limits-waiver","state":"IL","title":"Individual Employment Support - Limits (Waiver)","name":"Individual Employment Support - Limits","source":"Waiver","category":"employment","topic":"limits","text":"The annual rate is spread over a State fiscal year maximum of 1,200 hours for any combination of day programs (listed above). Monthly payment is limited to a maximum of 115 hours for any combination of day programs. SEI is limited to 5 hours per day","url":"","verified":"","notes":"","row":9},{"id":"il-individual-supported-employment-community-based-provider-spe","state":"IL","title":"Individual Supported Employment – Community-Based Provider Specifications (Waiver)","name":"Individual Supported Employment – Community-Based Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Job Coach Requirements:\n\nThe Agency must be under contract with the OA. Per these contracts, employees must complete OA-approved direct support personnel training and pass competency-based training assessments and be certified as Direct Support Personnel.\n\nAll employees must have had criminal background and Health Care Worker Registry checks completed prior to employment.\n\nJob Coaches must possess valid High School Diploma or GED.\n\nIf in the performance of duties employees are required to utilize either agency or personal vehicles, a valid driver’s license and automobile liability insurance is required.\n\nEmployees providing Supported Employment Individual and Supported Employment Group supports and services receive training in the tenets and application of Competitive Integrated Employment activities as determined by the employing Agency.\n\nThe OA verifies upon enrollment and conducts an annual review of contract continuation.","url":"","verified":"","notes":"","row":10},{"id":"il-small-group-employment-waiver","state":"IL","title":"Small Group Employment (Waiver)","name":"Small Group Employment","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment – Small Group Support (SEG) services consist of ongoing supports that enable customers to engage in provider facilitated integrated group employment which supports the acquisition of skills and knowledge which lead to a successful transition into individualized competitive integrated employment or self-employment. SEG may supplement individualized competitive integrated employment or self-employment when it is only part-time but should not be utilized as a final destination with services into perpetuity. SEG services facilitate the enhancement of employment skills aligned with each customer’s interests, skills, desires and conditions of employment.\n\nEligibility and Authorization: The provision of SEG services presumes all customers are capable of working in individualized competitive integrated employment and/or self-employment. SEG services do not require successful closure and transition from supports provided by the Illinois Department of Human Services, Division of Rehabilitation Services, Vocational Rehabilitation program.\n\nSEG services authorization and re-authorization require the PCP to include, in the career and income section, opportunities are being provided to the customer through this service on an on-going basis, which support the customer’s achievement of independence and transition to competitive integrated employment. The PCP shall also document and address any barriers to the above.\n\nSEG services are authorized only for employment opportunities, in integrated settings, for which customers are compensated at or above (the higher of) local, state or federal minimum wage and to the same degree as the customary wage and benefit levels of customers performing the same work who do not have disabilities.\n\nSEG services must occur at an employer identified by the customer through informed choice.\n\nThe SEG service provider is responsible for training, supervision and support of customers in experiences which allow opportunities for routine interactions with others without disabilities in the setting and involvement from supervisors and coworkers' without disabilities (not paid to deliver this service) in supervision and support.\n\nCustomers receiving SEG services, who are not yet working in individualized competitive integrated employment or self-employment, shall be encouraged, on an ongoing basis, to explore and develop their interests, strengths, and abilities relating to individualized competitive integrated employment and/or self-employment. Customers utilizing SEG services to supplement individualized competitive integrated employment or self- employment that is only part time, shall be offered assistance and be supported to utilize all available services and supports, including increasing hours in individualized competitive integrated employment, to transition fully to individualized competitive integrated employment as an alternative to continuing this service","url":"","verified":"","notes":"","row":11},{"id":"il-small-group-employment-settings-waiver","state":"IL","title":"Small Group Employment - Settings (Waiver)","name":"Small Group Employment - Settings","source":"Waiver","category":"employment","topic":"activities","text":"Employment Settings: SEG services may only be conducted within (or associated to) integrated settings in which persons without disabilities are employed and where customers have contact with co-workers, consumers, supervisors and others without disabilities who are not paid supports. The setting must meet all HCBS setting standards and not isolate customers from others in the setting who do not have disabilities.\n\nSEG service settings cannot be provider-owned, leased or operated settings. The settings must be integrated in and support full access of customers to the greater community, including opportunities to learn about and seek individualized integrated employment or self-employment, engage in community life, and control their earned income.","url":"","verified":"","notes":"","row":12},{"id":"il-small-group-employment-service-array-waiver","state":"IL","title":"Small Group Employment - Service Array (Waiver)","name":"Small Group Employment - Service Array","source":"Waiver","category":"employment","topic":"activities","text":"SEG service providers are responsible for the delivery of all personal assistance needs required by the customer during the time that SEG services are provided. Personal assistance needs, while a component of SEG, shall not comprise the entirety of the services being provided and providers of SEG services must ensure that the on-going personal assistance needs, which extend beyond natural supports, are considered in transition to individualized competitive integrated employment. SEG services must be necessary and appropriate to meet the employment goal(s), as defined in the PCP, and provides job coaching, job analysis, training and systematic instruction, transportation training, development of natural supports assistance with communication with employer or potential employer, and facilitation of employment related meetings involving the employer (performance evaluations, compliance training, department meetings)\n\nSEG services are provided at a ratio of 1:3 or 1:6, staff member to customer.","url":"","verified":"","notes":"","row":13},{"id":"il-small-group-employment-supports-changes-waiver","state":"IL","title":"Small Group Employment - Supports Changes (Waiver)","name":"Small Group Employment - Supports Changes","source":"Waiver","category":"employment","topic":"definition","text":"Support Changes: The option to change the amount of supports provided is based on a change in needs and/or on an assessment of needs for the customer. Should the customer and staff recognize a need for a change in supports, the change should be developed as part of the customer’s person-centered plan and implementation strategy. Support changes that have been identified and are included in the implementation strategy must be reviewed regularly, but at least annually, by the Independent Service Coordination Agency to determine if the customer and staff continue to believe the existing supports are appropriate, if the supports are effective, and if further changes in supports should occur. It is expected that, due to the nature of supports and services provided, customers will develop skills and natural supports (non-paid support relationships) which allow for greater independence.","url":"","verified":"","notes":"","row":14},{"id":"il-small-group-employment-payments-waiver","state":"IL","title":"Small Group Employment - Payments(Waiver)","name":"Small Group Employment - Payments","source":"Waiver","category":"employment","topic":"definition","text":"Payments: SEG service payments are only made for group employment which meets integrated criteria. No payments will be authorized for non-paid prevocational activities (such as volunteering), employment training provided in non-integrated, facility based settings, time during which provider staff are not actively engaged in support or for supervisory, training, support and adaptation activities typically offered by the employer to workers in similar positions. SEG services includes 13.5 program related transportation miles per day, per customer, for supporting groups to transport customers to the work location.\n\nSEG1: Small Group Level 1 (1:3 staff to customer ratio)\n\nSEG2: Large Group Level 2 (1:6 staff to customer ratio)","url":"","verified":"","notes":"","row":15},{"id":"il-small-group-employment-duplication-of-services-waiver","state":"IL","title":"Small Group Employment - Duplication of Services(Waiver)","name":"Small Group Employment - Duplication of Services","source":"Waiver","category":"employment","topic":"definition","text":"Duplication of Services: SEG services may be combined with other services so long as the combined services are not duplicative, including the prohibition of:\n\n- billing other non-residential waiver services at the same time as SEG.\n\n-billing SEG services which are redundant or overlapped with Division of Rehabilitation Services Vocational Rehabilitation program payments or services\n\nA customer’s PCP may include more than one non-residential habilitation service (Supported Employment – Individual Employment Services, Community Day Services); however, they may not be billed for during the same period of time (the same 15 minute or hour unit of time)\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n-Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment; or\n\n-Payments that are passed through to users of supported employment services; or\n\n-Payments for training that is not directly related to a customer’s supported employment program","url":"","verified":"","notes":"","row":16},{"id":"il-small-group-employment-billing-waiver","state":"IL","title":"Small Group Employment - Billing (Waiver)","name":"Small Group Employment - Billing","source":"Waiver","category":"employment","topic":"billing","text":"SEG services shall be billed in 15-minute increments.\n\nSEG1: Small Group Level 1 (1:3 staff to customer ratio)\n\nSEG2: Large Group Level 2 (1:6 staff to customer ratio)\n\nRequirements:\n\nSEG services must be\n\n-included in the Career and Income portion of the customer’s PCP.\n\n-approved by the ISC agency representative.","url":"","verified":"","notes":"","row":17},{"id":"il-small-group-employment-requirements-waiver","state":"IL","title":"Small Group Employment - Requirements (Waiver)","name":"Small Group Employment - Requirements","source":"Waiver","category":"employment","topic":"provider","text":"-Comply with all Illinois Department of Human Services (IDHS), Division of Developmental Disabilities (DDD) requests for information on case notes, billing records, employment records, including pay details, and other items as requested, including progress towards employment and career goals.\n\n-Allow DDD Bureau of Quality Management to review the customer’s file as part of their survey process.\n\n-Remain in compliance with federal and state Departments of Labor (DOL).\n\n-Recognize, and document in the customer’s record, changes in health behavior, work productivity or overall condition.\n\n-Report identified safety and sanitation hazards that occur at the worksite to employers having the responsibility to remedy the condition","url":"","verified":"","notes":"","row":18},{"id":"il-small-group-employment-limits-waiver","state":"IL","title":"Small Group Employment - Limits (Waiver)","name":"Small Group Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"The annual rate is spread over a State fiscal year maximum of 1,200 hours for any combination of day programs. Monthly payment is limited to a maximum of 115 hours for any combination of day programs. SEG is limited to 5 hours per day.","url":"","verified":"","notes":"","row":19},{"id":"il-small-group-employment-community-based-agency-provider-speci","state":"IL","title":"Small Group Employment - Community-based Agency Provider Specifications (Waiver)","name":"Small Group Employment - Community-based Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The Agency must be under contract with the OA. Per these contracts, employees must complete OA-approved direct support personnel training and pass competency-based training assessments and be certified as Direct Support Personnel.\n\nAll employees must have had criminal background and Health Care Worker Registry checks completed prior to employment.\n\nJob Coaches must possess valid High School Diploma or GED.\n\nIf in the performance of duties employees are required to utilize either agency or personal vehicles, a valid driver’s license and automobile liability insurance is required.\n\nEmployees providing Supported Employment Individual and Supported Employment Group supports and services receive training in the tenets and application of Competitive Integrated Employment activities as determined by the employing Agency.\n\nThe Operating Agency verifies upon enrollment and conducts an annual review of contract continuation.","url":"","verified":"","notes":"","row":20}]},{"code":"IN","name":"Indiana","notes":[],"entries":[{"id":"in-career-exploration-and-planning-ddrs-hcbs-waivers","state":"IN","title":"Career Exploration & Planning (DDRS HCBS Waivers)","name":"Career Exploration & Planning","source":"DDRS HCBS Waivers","category":"career","topic":"definition","text":"The following subsections provide information and requirements for Career Exploration and Planning services for the FSW and CIH Waiver.\n\nService Definition\nCareer Exploration and Planning is a targeted service designed to help an individual make an informed choice about whether they wish to:\n\n• Pursue competitive integrated employment (CIE) including self-employment.\n\n• Obtain information to dissuade myths around or hesitation about CIE.\n\n• Identify the career path they would like to pursue either independently or with available supports.\nThis service is ideal for individuals newly transitioning from school-based services who are unsure as to their path toward CIE and may be used to gather information in preparation for a referral to Indiana Vocational Rehabilitation (VR), American Jobs Center or other employment supports. This service may be used for individuals who are employed to explore advancement opportunities in their chosen career or to explore other CIE career objectives which are more consistent with their skills and interests.","url":"","verified":"","notes":"","row":1},{"id":"in-career-exploration-and-planning-reimburseable-activities-ddr","state":"IN","title":"Career Exploration & Planning - Reimburseable Activities (DDRS HCBS Waivers)","name":"Career Exploration & Planning - Reimburseable Activities","source":"DDRS HCBS Waivers","category":"career","topic":"billing","text":"Activities to identify an individual’s specific interests and aptitudes for CIE, including experience and skills transferable to CIE.\nExploration of CIE opportunities in the local area that are specifically related to the individual’s identified interests, experiences and/or skills. This can include:\nBusiness tours\nInformational interviews\nJob shadows\nWork experiences\nSetup, preparation and debriefing for each exploration opportunity\nIntroductory education on available employment supports, work incentives, Supported Employment services, and benefits of working in competitive integrated employment settings","url":"","verified":"","notes":"","row":2},{"id":"in-career-exploration-and-planning-service-standards-ddrs-hcbs-","state":"IN","title":"Career Exploration & Planning - Service Standards(DDRS HCBS Waivers)","name":"Career Exploration & Planning - Service Standards","source":"DDRS HCBS Waivers","category":"career","topic":"provider","text":"Service may be provided on an individual basis or in groups dependent on participant choice. When group services are offered, the group shall not exceed four persons and must be based on shared CIE interests of the group members. Services must be provided in community settings.","url":"","verified":"","notes":"","row":3},{"id":"in-career-exploration-and-planning-documentation-standards-ddrs","state":"IN","title":"Career Exploration & Planning - Documentation Standards (DDRS HCBS Waivers)","name":"Career Exploration & Planning - Documentation Standards","source":"DDRS HCBS Waivers","category":"career","topic":"documentation","text":"Development of documentation around individual’s interests and aptitudes, stated career objectives, and development of a strengths-based career profile for use and guidance when seeking individual employment support. This profile must include the individual’s determined career path and outcome documented in the PCISP. Career profiles may also be used to develop an individual’s resume and inform outreach to local employers. When applicable, career profiles should include:\nDreams, goals and interests\nTalents, skills and knowledge\nLearning styles\nPositive personality traits and values\nWorkplace and environmental preferences\nDislikes and situations/careers to avoid\nPrevious work experiences\nSupport system and community resources\nSpecific challenges and possible solutions (including benefits considerations and accommodation needs)\nCareer opportunities (including preferred career paths and potential contributions to community employers)","url":"","verified":"","notes":"","row":4},{"id":"in-career-exploration-and-planning-limitations-ddrs-hcbs-waiver","state":"IN","title":"Career Exploration & Planning - Limitations (DDRS HCBS Waivers)","name":"Career Exploration & Planning - Limitations","source":"DDRS HCBS Waivers","category":"career","topic":"limits","text":"Career Exploration and Planning is intended to be a time-limited service along the continuum of employment supports. Career Exploration and Planning shall not exceed 20 hours a month for six months in any 12-month period.","url":"","verified":"","notes":"","row":5},{"id":"in-career-exploration-and-planning-activities-not-allowed-ddrs-","state":"IN","title":"Career Exploration & Planning - Activities not allowed (DDRS HCBS Waivers)","name":"Career Exploration & Planning - Activities not allowed","source":"DDRS HCBS Waivers","category":"career","topic":"limits","text":"Services that are available under Section 110 of the Rehabilitation Act of 1973 or Section 602(16) and (17) of Individual with Disabilities Education Act (IDEA). Documentation must be maintained verifying that the service is not otherwise available or funded under the Rehabilitation Act of 1973, as amended, or the IDEA.","url":"","verified":"","notes":"","row":6},{"id":"in-career-exploration-and-planning-provider-qualifications-ddrs","state":"IN","title":"Career Exploration & Planning - Provider Qualifications (DDRS HCBS Waivers)","name":"Career Exploration & Planning - Provider Qualifications","source":"DDRS HCBS Waivers","category":"career","topic":"provider","text":"Providers of Career Exploration and Planning must meet the following criteria:\nEnrolled as an active Medicaid provider\nMust be FSSA/DDRS-approved\nMust comply with Indiana Administrative Code 460 IAC 6, including but not limited to:\n460 IAC 6-10-5 Documentation of Criminal Histories\n460 IAC 6-12-1 and 460 IAC 6-12-2 Insurance\n460 IAC 6-11-1 to 460 IAC 6-11-3 Financial Status of Providers\n460 IAC 6-5-27 Specialized Medical Equipment and Supplies Supports Provider Qualifications\nMust comply with any applicable FSSA/BDS service standards, guidelines, policies and/or manuals, including FSSA/BDS policies and this module, which is accessible from the IHCP Provider Reference Modules page at in.gov/medicaid/providers\nMust obtain/maintain accreditation (specific to Indiana programs) by at least one of the following organizations:\nThe Commission on Accreditation of Rehabilitation Facilities (CARF), or its successor\nThe Council on Quality and Leadership In Supports for People with Disabilities, or its successor\nThe Joint Commission on Accreditation of Healthcare Organizations (JCAHO), or its successor\nThe National Committee for Quality Assurance, or its successor\nThe ISO-9001 human services quality assurance (QA) system\nAn independent national accreditation organization approved by the FSSA Secretary","url":"","verified":"","notes":"","row":7},{"id":"in-extended-services","state":"IN","title":"Extended Services","name":"Extended Services","source":"","category":"employment","topic":"definition","text":"Extended Services are ongoing employment support services that enable an individual to maintain integrated competitive employment in a community setting. Individuals must be employed in a community-based, competitive job that pays at or above minimum wage to access this service. The initial job placement, training and stabilization may be provided through Indiana Vocational Rehabilitation (VR). Extended Services provide the additional work-related supports needed by the individual to continue to be as independent as possible in community employment. If an employed individual has obtained community-based competitive employment and stabilization without VR services, the individual is still eligible to receive Extended Services, as long as the individual meets the qualifications (see the Provider Qualifications section). Ongoing employment support services are identified in the individuals’ PCISP and must be related to the individuals’ limitations in functional areas (for example, self-care, understanding and use of language, learning, mobility, self-direction, capacity for independent living, economic self-sufficiency), as necessary to maintain employment.\n\nDocumentation is maintained in the file of each individual receiving this service that the service is not available under a program funded under Section 110 of the Rehabilitation Act of 1973 or the IDEA (20 USC 1401 et seq.). Federal financial participation is not claimed for incentive payments, subsidies or unrelated vocational training expenses such as the following:\nIncentive payments made to an employer to encourage or subsidize the employer's participation in Supported Employment; or\nPayments that are passed through to users of Supported Employment services.","url":"","verified":"","notes":"","row":8},{"id":"in-extended-services-additional-information","state":"IN","title":"Extended Services - Additional Information","name":"Extended Services - Additional Information","source":"","category":"employment","topic":"definition","text":"ndividuals may also use workplace assistance during any hours of competitive integrated employment in conjunction with their use of Extended Services. Extended Services are not time-limited.\n\nCommunity settings are defined as nonresidential, integrated settings that are in the community. Services may not be rendered within the same buildings alongside other nonintegrated individuals.\n\nCompetitive integrated employment is defined as full or part-time work at minimum wage or higher, with wages and benefits similar to those without disabilities performing the same work, and fully integrated with coworkers without disabilities.\n\nIndividuals may be self-employed, working from their own homes, and still receive Extended Services when the work is competitive and could also be performed in an integrated environment by and among persons without intellectual/developmental disabilities.","url":"","verified":"","notes":"","row":9},{"id":"in-extended-services-reimburseable-activities","state":"IN","title":"Extended Services - Reimburseable Activities","name":"Extended Services - Reimburseable Activities","source":"","category":"employment","topic":"billing","text":"Reimbursable activities include the following:\nEnsuring that natural supports at the worksite are secured through interaction with supervisors and staff (A tangible outcome of this activity would be a decrease in the number of hours of Extended Services an individual accessed over time.)\nTraining for the individual and/or the individual’s employer, supervisor or coworkers, to increase the individual’s inclusion at the worksite\nRegular observation or support of the individual to reinforce and stabilize the job placement\nJob-specific or job-related safety training\nJob-specific or job-related self-advocacy skills training\nReinforcement of work-related personal care and social skills\nTraining on use of public transportation and/or acquisition of appropriate transportation\nFacilitating, but not funding, driver’s education training\nCoaching and training on job-related tasks, such as computer skills or other job-specific tasks\nTravel by the provider to the worksite as part of the delivery of this service\n\nIndividual (one-on-one) services can be billed in 15-minute increments.\nFor Extended Services provided in a group setting, reimbursement equals the unit rate divided by the number of individuals served.\nWith the exception of 1:1 on-the-job coaching, support and observation, the potential exists for all components of the Extended Services service definition to be applicable to either a waiver individual or to a group of individuals. However, specific examples of activities that might be rendered in a group setting would include instructing a group of individuals on professional appearance requirements for various types of employment, reinforcement of work-related personal care or social skills, knowing how to get up in time to get ready for and commute to work. Groups could receive job-specific or job-related safety training, self-advocacy training, or training on the use of public transportation. A group could receive training on computer skills or other job-specific tasks when group individuals have similar training needs.","url":"","verified":"","notes":"","row":10},{"id":"in-extended-services-service-standards","state":"IN","title":"Extended Services - Service Standards","name":"Extended Services - Service Standards","source":"","category":"employment","topic":"provider","text":"Extended services are provided in integrated community settings where persons without disabilities are also employed. Reimbursement will only be made for the employment support services required by the individual receiving services as a result of their disability.\n\nExtended services do not include sheltered work or other similar types of vocational services furnished in specialized facilities or volunteer endeavors.\n\nAn individual’s PCISP should be constructed in a manner that reflects individual informed choice and goals relating to employment and ensures provision of services in the most integrated setting possible. The extended services supports should be designed to support employment outcomes that lead to further independence and are consistent with the individual’s goals.","url":"","verified":"","notes":"","row":11},{"id":"in-extended-services-documentation-standards","state":"IN","title":"Extended Services - Documentation Standards","name":"Extended Services - Documentation Standards","source":"","category":"employment","topic":"documentation","text":"Individual informed choices and goals related to employment and the justification/need for extended services must be outlined in the PCISP.\n\nIn addition to compliance with documentation requirements outlined in 460 IAC 6, the following data elements are required for each service rendered:\nName of individual served\nIHCP Member ID of the individual\nName of provider\nIdentified employment need\nService rendered\nExpected outcome\nDate of service including the year\nTime frame of service (include a.m. or p.m.)\nNotation of the primary location of service delivery\nA summary of services rendered to include the specific reimbursable activities that were performed and the outcomes realized from those activities\nA description of any issue or circumstance concerning the individual including, but not limited to, significant medical or behavioral incidents or any other situation that may be uncommon for the individual\nSignature that includes at least the last name and first initial of the staff person making the entry (Electronic signatures are permissible when in compliance with the Uniform Electronic Transactions Act [IC 26-2-8])\n\nUpon request, all data elements must be made available to auditors, quality monitors, case managers and any other government entity. The documentation may reside in multiple locations but must be clearly and easily linked to the individual or the standard will not be met. As applicable, monthly/quarterly reports must be uploaded to the document library of the state’s case management system by the chosen service provider on or before the 15th day of the following month.","url":"","verified":"","notes":"","row":12},{"id":"in-extended-services-limitations","state":"IN","title":"Extended Services - Limitations","name":"Extended Services - Limitations","source":"","category":"employment","topic":"limits","text":"Group services may only be rendered at the discretion of the IST and in group sizes no greater than four individuals to one staff. In addition, the provider must be able to provide appropriate documentation, as outlined under Documentation Standards for Extended Services, demonstrating that the ratio for each claimed time frame of services did not exceed the maximum allowable ratio determined by the IST for each group individual, and provide documentation identifying other group individuals, by using the individuals’ Health Insurance Portability and Accountability Act (HIPAA) naming convention.","url":"","verified":"","notes":"","row":13},{"id":"in-extended-services-activities-not-allowed","state":"IN","title":"Extended Services - Activities Not Allowed","name":"Extended Services - Activities Not Allowed","source":"","category":"employment","topic":"limits","text":"Reimbursement is not available under Extended Services for the following activities:\nAny non-community-based setting where the majority (51% or more) of the individuals have an intellectual or developmental disability\nSheltered work observation or participation\nVolunteer endeavors\nAny service that is otherwise available under the Rehabilitation Act of 1973 or Public Law 94-142\nPublic relations\nIncentive payments made to an employer to subsidize the employer’s participation in Extended Services\nPayment for vocational training that is not directly related to the individual’s Extended Service needs outlined in the PCISP\nExtended Services do not include payment for supervisory activities rendered as a normal part of the business setting.\nExtended Services provided to a minor by a parents, step-parents, legal guardian or spouse\nThe provision of transportation to an individual is not a reimbursable activity within Extended Services.\nWaiver funding for the provision of vocational services delivered in facility-based or sheltered work settings, where individuals are supervised for the primary purpose of producing goods or performing services\nGroup supports delivered to individuals who are using different support options (For example, one individual in the group is using Extended Services and another individual in the same group setting is using Day Habilitation.)\n\nNote: Supported Employment services continue to be available under the Rehabilitation Act of 1973 through the Vocational Rehabilitation (VR) program within the DDRS Bureau of Rehabilitation Services (BRS).","url":"","verified":"","notes":"","row":14},{"id":"in-extended-services-provider-qualifications","state":"IN","title":"Extended Services - Provider Qualifications","name":"Extended Services - Provider Qualifications","source":"","category":"employment","topic":"provider","text":"Providers must meet the following criteria:\nEnrolled as an active Medicaid provider\nBe FSSA DDRS-approved\nComply with Indiana Administrative Code 460 IAC 6, including but not limited to:\n460 IAC 6-12-1 and 460 IAC 6-12-2 Insurance\n460 IAC 6-10-5 Documentation of Criminal Histories\n460 IAC 6-11-1 to 460 IAC 6-11-3 Financial Status of Providers\n460 IAC 6-14-5 Requirements for Direct Care Staff\n460 IAC 6-14-4 Staff Training and 460 IAC 6-14-4 Training\nComply with any applicable BDS service standards, guidelines, policies and/or manuals, including FSSA DDRS policies and this module, accessible from the IHCP Provider Reference Modules page at in.gov/medicaid/providers\nMust obtain/maintain Indiana accreditation by at least one of the following organizations:\nThe Commission on Accreditation of Rehabilitation Facilities (CARF), or its successor\nThe Council on Quality and Leadership in Supports for People with Disabilities, or its successor\nThe Joint Commission on Accreditation of Healthcare Organizations (JCAHO), or its successor\nThe National Commission on Quality Assurance, or its successor\nAn independent national accreditation organization approved by the secretary","url":"","verified":"","notes":"","row":15},{"id":"in-workplace-assistance","state":"IN","title":"Workplace Assistance","name":"Workplace Assistance","source":"","category":"employment","topic":"definition","text":"Service Definition\nWorkplace Assistance services provide a range of personal care services and/or supports during paid competitive community employment hours and in a competitive community employment setting to enable waiver individuals to accomplish tasks that they would normally do for themselves if they did not have a disability. Assistance may take the form of hands-on assistance (actually performing a personal care task for the individual) or prompting the individual to perform a personal care task. Workplace Assistance services may be provided on an episodic or on a continuous basis.\nWorkplace Assistance services are designed to ensure the health, safety and welfare of the individual, thereby assisting in the retention of paid employment for the individual who is paid at or above the federal minimum wage.\n\nAdditional information\nWorkplace Assistance services are available under the FSW and CIH Waiver.\nWorkplace Assistance may be used in conjunction with Extended Services.\nWorkplace Assistance may be used with each hour the individual is engaged in paid competitive community employment, including employment hours overlapping with Extended Services.","url":"","verified":"","notes":"","row":16},{"id":"in-workplace-assistance-reimurseable-activities","state":"IN","title":"Workplace Assistance - Reimurseable Activities","name":"Workplace Assistance - Reimurseable Activities","source":"","category":"employment","topic":"activities","text":"Reimbursable activities under Workplace Assistance include the following:\nDirect support, monitoring, training, education, demonstration or support to assist with personal care while on the job or at the job site (may include assistance with meals, hygiene, toileting, transferring, maintaining continence, administration of medication and so forth)\nMay have been used in conjunction with Extended Services\nMay be used with each hour the individual is engaged in paid competitive community employment","url":"","verified":"","notes":"","row":17},{"id":"in-workplace-assistance-service-standards","state":"IN","title":"Workplace Assistance - Service Standards","name":"Workplace Assistance - Service Standards","source":"","category":"employment","topic":"provider","text":"The following service standards apply to Workplace Assistance:\nWorkplace Assistance services must be reflected in the PCISP.\nWorkplace Assistance services should complement but not duplicate Day Habilitation services being provided in other settings.\nWorkplace Assistance services may only be delivered in the employment setting.\nThere is no requirement for a physician’s prescription or authorization. The need for Workplace Assistance services is determined entirely by the IST.","url":"","verified":"","notes":"","row":18},{"id":"in-workplace-assistance-documentation-standards","state":"IN","title":"Workplace Assistance -Documentation Standards","name":"Workplace Assistance -Documentation Standards","source":"","category":"employment","topic":"documentation","text":"Workplace Assistance services documentation must include the following:\nServices must be outlined in the PCISP.\nIn addition to compliance with documentation requirements outlined in 460 IAC 6, the following data elements are required for each service rendered:\nName of individual served\nIHCP Member ID of the individual\nName of provider\nService rendered\nTime frame of service (include a.m. or p.m.)\nDate of service including the year\nNotation of the primary location of service delivery\nA brief activity summary of service rendered\nIn addition to the brief activity summary of service rendered, a description by direct care staff of any issue or circumstance concerning the individual including, but not limited to, significant medical or behavioral incidents or any other situation that may be uncommon for the individual\nSignature that includes at least the last name and first initial of the direct care staff person making the entry (Electronic signatures are permissible when in compliance with the Uniform Electronic Transactions Act [IC 26-2-8].)\nUpon request, all data elements must be made available to auditors, quality monitors, case managers and any other government entity. The documentation may reside in multiple locations but must be clearly and easily linked to the individual or the standard will not be met.\nAs applicable, monthly/quarterly reports must be uploaded to the document library of the state’s case management system by the chosen service provider on or before the 15th day of the following month.","url":"","verified":"","notes":"","row":19},{"id":"in-workplace-assistance-limitations","state":"IN","title":"Workplace Assistance -Limitations","name":"Workplace Assistance -Limitations","source":"","category":"employment","topic":"limits","text":"The following are limitations on Workplace Assistance services:\nAllowed Ratio – Individual, one client to one staff.\nReimbursement for Workplace Assistance services is available only during the individual’s hours of paid, competitive community employment.","url":"","verified":"","notes":"","row":20},{"id":"in-workplace-assistance-activities-not-allowed","state":"IN","title":"Workplace Assistance -Activities Not Allowed","name":"Workplace Assistance -Activities Not Allowed","source":"","category":"employment","topic":"limits","text":"When services are furnished to a minor child by the parents, stepparents or legal guardian\nWhen services are furnished to an individual by that individual’s spouse\nAny service that is otherwise available under the Rehabilitation Act of 1973 or Public Law 94-142\nDuring volunteer activities\nIn a facility setting\nIn conjunction with sheltered employment\nDuring activities other than paid competitive community employment\nWorkplace Assistance should complement but not duplicate services being provided under Extended Services.\nWorkplace Assistance is not to be used for observation or supervision of the individual for the purpose of teaching job tasks or to ascertain the success of the job placement.\nWorkplace Assistance is not to be used for offsite monitoring when the monitoring directly relates to maintaining a job.\nWorkplace Assistance is not to be used for the provision of skilled job trainers who accompany the individual for short-term job skill training at the work site to help maintain employment.\nWorkplace Assistance is not to be used for regular contact and/or follow-up with the employers, individuals, parents, family members, guardians, advocates or authorized representatives of the individuals, or other appropriate professional or informed advisors, to reinforce and stabilize the job placement.\nWorkplace Assistance is not to be used for the facilitation of natural supports at the work site.\nWorkplace Assistance is not to be used for individual program development, writing tasks analyses, monthly reviews, termination reviews or behavioral intervention programs.\nWorkplace Assistance is not to be used for advocating for the individual.\nWorkplace Assistance is not to be used for staff time in traveling to and from a work site.\nThis service will not be reimbursed when provided by the parent of a minor child participant or the spouse of a participant (also known as LRIs).","url":"","verified":"","notes":"","row":21},{"id":"in-workplace-assistance-provider-qualifications","state":"IN","title":"Workplace Assistance -Provider Qualifications","name":"Workplace Assistance -Provider Qualifications","source":"","category":"employment","topic":"provider","text":"Enrolled as an active Medicaid provider\nBe FSSA DDRS-approved\n\nComply with Indiana Administrative Code, 460 IAC 6, including but not limited to:\n460 IAC 6-10-5 Documentation of Criminal Histories\n460 IAC 6-12-1 and 460 IAC 6-12-2 Insurance\n460 IAC 6-11-1 to 460 IAC 6-11-3 Financial Status of Providers\n460 IAC 6-14-5 Requirements for Direct Care Staff\n460 IAC 6-14-4 Staff Training and 460 IAC 6-14-4 Training\n460 IAC 6-5-30 Transportation Services Provider Qualifications\n460 IAC 6-5-31 Transportation Supports Provider Qualifications\n\nComply with any applicable BDS service standards, guidelines, policies and/or manuals, including FSSA DDRS policies and this module, accessible from the IHCP Provider Reference Modules page at in.gov/medicaid/providers","url":"","verified":"","notes":"","row":22}]},{"code":"IA","name":"Iowa","notes":[],"entries":[{"id":"ia-prevocational-services","state":"IA","title":"Prevocational Services","name":"Prevocational Services","source":"","category":"prevoc","topic":"definition","text":"“Prevocational services” means services that provide career exploration, learning and work experiences, including volunteer opportunities, where the member can develop non-job-task-specific strengths and skills that lead to paid employment in individual community settings.\n\nPrevocational services are provided to members who are expected to be able to join the general workforce with the assistance of supported employment. Prevocational services are intended to develop and teach general employability skills relevant to successful participation in individual employment. These skills include, but are not limited to:\n-The ability to communicate effectively with supervisors, coworkers, and customers,\n-An understanding of generally accepted community workplace conduct and dress,\n-The ability to follow directions,\n-The ability to attend to tasks,\n-Workplace problem-solving skills and strategies,\n-General workplace safety and mobility training,\n-The ability to navigate local transportation options,\n-Financial literacy skills, and\n-Skills related to obtaining employment.\n\nPrevocational services include career exploration activities to facilitate successful transition to individual employment in the community. Participation in prevocational services is not a prerequisite for individual or small-group supported employment services.","url":"","verified":"","notes":"","row":1},{"id":"ia-prevocational-services-ctnd","state":"IA","title":"Prevocational Services - CTND","name":"Prevocational Services - CTND","source":"","category":"prevoc","topic":"limits","text":"Participation in prevocational services is not a required prerequisite for individual or small-group supported employment services provided under the waiver. Many members, particularly those transitioning from school to adult activities, are likely to choose to go directly into supported employment. Similarly, the evidence-based Individual Placement and Support (IPS) model of supported employment for members with behavioral health conditions emphasizes rapid job placement in lieu of prevocational services.\n\nThe distinction between vocational and prevocational services is that prevocational services, regardless of setting, are delivered for the purpose of furthering habilitation goals that will lead to greater opportunities for competitive and integrated employment and career advancement at or above minimum wage. These goals are described in the member’s person-centered services and supports plan and are designed to teach skills that will lead to integrated competitive employment.\n\nA member receiving prevocational services may pursue employment opportunities at any time to enter the general work force. Prevocational services are intended to assist members to enter the general workforce.\n\nMembers participating in prevocational services may be compensated for work performed in accordance with applicable federal laws and regulations. If a provider chooses to compensate a member for such work, the provider must use non-Medicaid funding such as revenues from a third-party contract to pay the member. The provider of prevocational services must be able to document the funding source of the member’s wages from work performed. The optimal outcome of the provision of prevocational services is permanent integrated employment at or above the minimum wage in the community.\n\nAll prevocational and supported employment service options should be reviewed and considered as a component of a member’s person-centered services and supports plan no less than annually, more frequently as necessary or as requested by the member. These services and supports should be designed to support successful employment outcomes consistent with the member’s goals.\n\nPersonal care and assistance may be a component of prevocational services but may not comprise the entirety of the service.\n\nMembers who receive prevocational services may also receive educational, supported employment, and day habilitation services. A member’s person-centered services and supports plan may include two or more types of non-residential habilitation services. However, different types of non-residential habilitation services may not be billed during the same period of the day.\n\nPrevocational services may include volunteer work, such as learning and training activities that prepare a member for entry into the paid workforce.\n\nPrevocational services may be furnished to any member who requires and chooses them through a person-centered planning process.","url":"","verified":"","notes":"","row":2},{"id":"ia-prevocational-services-career-exploration","state":"IA","title":"Prevocational Services - Career Exploration","name":"Prevocational Services - Career Exploration","source":"","category":"prevoc","topic":"definition","text":"Career exploration activities are designed to develop an individual career plan and facilitate the member’s experientially-based informed choice regarding the goal of individual employment.\n\nCareer exploration may be provided in small groups of no more than four members to participate in career exploration activities that include:\n-Business tours\n-Attending industry education events\n-Benefit information\n-Financial literacy classes\n-Attending career fairs\n\nCareer exploration may be authorized for up to 34 hours, to be completed over 90 days in the member’s local community or nearby communities and may include, but is not limited to, the following activities:\n-Meeting with the member and the member’s family, guardian or legal representative to introduce them to supported employment and explore the member’s employment goals and experiences,\n-Business tours,\n-Informational interviews,\n-Job shadows,\n-Benefits education and financial literacy,\n-Assistive technology assessment, and\n-Job exploration events.","url":"","verified":"","notes":"","row":3},{"id":"ia-prevocational-services-expected-outcomes-of-service","state":"IA","title":"Prevocational Services – Expected Outcomes of Service","name":"Prevocational Services – Expected Outcomes of Service","source":"","category":"prevoc","topic":"activities","text":"The expected outcome of prevocational services is individual employment in the general workforce, or self-employment, in a setting typically found in the community, where the member interacts with individuals without disabilities, other than those providing services to the member or other individuals with disabilities, to the same extent that individuals without disabilities in comparable positions interact with other persons; and for which the member is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nThe expected outcome of the career exploration activity is a written career plan that will guide employment services which lead to community employment or self-employment for the member.","url":"","verified":"","notes":"","row":4},{"id":"ia-prevocational-services-setting","state":"IA","title":"Prevocational Services – Setting","name":"Prevocational Services – Setting","source":"","category":"prevoc","topic":"activities","text":"Prevocational services shall take place in community-based nonresidential settings.","url":"","verified":"","notes":"","row":5},{"id":"ia-prevocational-services-concurrent-services","state":"IA","title":"Prevocational Services – Concurrent Services","name":"Prevocational Services – Concurrent Services","source":"","category":"prevoc","topic":"definition","text":"A member’s individual service plan may include two or more types of nonresidential habilitation services (e.g., individual supported employment, long-term job coaching, small-group supported employment, prevocational services, and day habilitation); however, more than one service may not be billed during the same period of time (e.g., the same hour).","url":"","verified":"","notes":"","row":6},{"id":"ia-prevocational-services-exclusions","state":"IA","title":"Prevocational Services – Exclusions","name":"Prevocational Services – Exclusions","source":"","category":"prevoc","topic":"limits","text":"Prevocational services payment shall not be made for the following:\n-Services that are available to the member under a program funded under Section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.).\n-Documentation that funding is not available to the member for the service under these programs shall be maintained in the service plan of each member receiving prevocational services.\n-Services available to the member that duplicate or replace education or related services defined in the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.).\n-Compensation to members for participating in prevocational services.\n-Support for members volunteering in for-profit organizations and businesses other than for-profit organizations, or businesses that have formal volunteer programs in place (e.g., hospitals, nursing homes), and support for members volunteering to benefit the service provider.\n-The provision of vocational services delivered in facility-based settings where members are supervised for the primary purpose of producing goods or performing services or where services are aimed at teaching skills for specific types of jobs rather than general skills.\n-A prevocational service plan with the goal or purpose of the service documented as maintaining or supporting the member in continuing prevocational services or any employment situation similar to sheltered employment.","url":"","verified":"","notes":"","row":7},{"id":"ia-prevocational-services-limitations","state":"IA","title":"Prevocational Services –Limitations","name":"Prevocational Services –Limitations","source":"","category":"prevoc","topic":"limits","text":"There is a time limitation for members starting prevocational services. For members starting prevocational services after May 4, 2016, participation in these services is limited to 24 calendar months. This time limit can be extended to continue beyond 24 months if one or more of the following conditions apply:\n-The member who is in prevocational services is also working in either individual or small-group community employment for at least the number of hours per week desired by the member, as identified in the member’s current service plan; or\n-The member who is in prevocational services is also working in either individual or small-group community employment for less than the number of hours per week the member desires, as identified in the member’s current service plan, but the member has services documented in the member’s current service plan, or through another identifiable funding source (e.g., Iowa Vocational Rehabilitation Services (IVRS)), to increase the number of hours the member is working in either individual or small-group community employment; or\n-The member is actively engaged in seeking individual or small-group community employment or individual self-employment, and services for this are included in the member’s current service plan or services funded through another identifiable funding source (e.g., IVRS) are documented in the member’s service plan; or\n-The member has requested supported employment services from Medicaid and IVRS in the past 24 months, and the member’s request has been denied or the member has been placed on a waiting list by both Medicaid and IVRS; or\n-The member has been receiving individual supported employment services (or comparable services available through IVRS) for at least 18 months without obtaining individual or small-group community employment or individual self-employment; or\n-The member is participating in career exploration activities.\n\nFor members enrolled in prevocational services on or before May 4, 2016, participation in these services is limited to 90 business days beyond the completion of the career exploration activity including the development of the career plan. This time limit may be extended if one of the six listed criteria applies. If the criteria do not apply, the member will not be authorized to continue in prevocational services.","url":"","verified":"","notes":"","row":8},{"id":"ia-prevocational-services-units-of-service","state":"IA","title":"Prevocational Services –Units of Service","name":"Prevocational Services –Units of Service","source":"","category":"prevoc","topic":"billing","text":"Prevocational services are an hourly unit of service. Career exploration is an hourly unit of service\n\nPrevocational Services: T2015: Hourly unit of service\n\nCareer Exploration: T2015 U3: Hourly unit of service\n\nThe current HCBS Prevocational and Supported Employment fee schedule may be located at: http://dhs.iowa.gov/ime/providers/csrp/fee-schedule","url":"","verified":"","notes":"","row":9},{"id":"ia-individual-supported-employment","state":"IA","title":"Individual Supported Employment","name":"Individual Supported Employment","source":"","category":"employment","topic":"definition","text":"Individual supported employment involves supports provided to, or on behalf of, the member that enable the member to obtain and maintain individual employment. Services are provided to members who need support because of their disabilities.\n\nIndividual supported employment services are services provided to, or on behalf of, the member that enable the member to obtain and maintain an individual job in competitive employment, customized employment or self-employment in an integrated work setting in the general workforce.","url":"","verified":"","notes":"","row":10},{"id":"ia-individual-supported-employment-expected-outcomes-of-service","state":"IA","title":"Individual Supported Employment - Expected Outcomes of Service","name":"Individual Supported Employment - Expected Outcomes of Service","source":"","category":"employment","topic":"activities","text":"The expected outcome of this service is sustained employment, or self-employment, paid at or above the minimum wage or the customary wage and level of benefits paid by an employer, in an integrated setting in the general workforce, in a job that meets personal and career goals. Successful transition to long-term job coaching, if needed, is also an expected outcome of this service. An expected outcome of supported self-employment is that the member earns income that is equal to or exceeds the average income for the chosen business within a reasonable period of time.","url":"","verified":"","notes":"","row":11},{"id":"ia-individual-supported-employment-setting","state":"IA","title":"Individual Supported Employment - Setting","name":"Individual Supported Employment - Setting","source":"","category":"employment","topic":"activities","text":"Individual supported employment services shall take place in integrated work settings.\n\nFor self-employment, the member’s home can be considered an integrated work setting. Employment in the service provider’s organization (not including a sheltered workshop or similar type of work setting where members are paid for the production of goods or services) can be considered employment in an integrated work setting in the general workforce if the employment occurs in a work setting where interactions are predominantly with coworkers or business associates who do not have disabilities or with the general public.\n\nIndividual employment strategies include, but are not limited to:\n-Customized employment,\n-Individual placement and support, and\n-Supported self-employment.\n\nService activities are individualized and may include any combination of the following:\n-Benefits education\n-Career exploration (e.g., tours, informational interviews, job shadows)\n-Employment assessment\n-Assistive technology assessment\n-Trial work experience\n-Person-centered employment planning\n-Development of visual or traditional résumés\n-Job-seeking skills training and support\n-Outreach to prospective employers on behalf of the member (e.g., job development; negotiation with prospective employers to customize, create or carve out a position for the member; employer needs analysis)\n-Job analysis (e.g., work site assessment or job accommodations evaluation)\n-Identifying and arranging transportation\n-Career advancement services (e.g., assisting a member in making an upward career move or seeking promotion from an existing employer)\n-Reemployment services (if necessary due to job loss)\n-Financial literacy and asset development\n-Other employment support services deemed necessary to enable the member to obtain employment\n-Systematic instruction and support during initial on-the-job training including initial on-the-job training to stabilization\n-Engagement of natural supports during initial period of employment\n-Implementation of assistive technology solutions during initial period of employment\n-Transportation of the member during service hours\n-Initial on-the-job training to stabilization activity","url":"","verified":"","notes":"","row":12},{"id":"ia-supported-self-employment","state":"IA","title":"Supported Self Employment","name":"Supported Self Employment","source":"","category":"employment","topic":"definition","text":"Individual employment may also include support to establish a viable self-employment opportunity, including home-based self-employment.\n\nAn expected outcome of supported self-employment is that the member earns income that is equal to or exceeds the average income for the chosen business within a reasonable period of time. In addition to the activities listed under Individual Supported Employment, assistance to establish self-employment may include:\n-Aid to the member in identifying potential business opportunities.\n-Assistance in the development of a business plan, including identifying potential sources of business financing and other assistance in developing and launching a business.\n-Identification of the long-term supports necessary for the individual to operate the business.","url":"","verified":"","notes":"","row":13},{"id":"ia-long-term-coaching","state":"IA","title":"Long Term Coaching","name":"Long Term Coaching","source":"","category":"employment","topic":"definition","text":"Long-term job coaching is support provided to, or on behalf of, the member that enables the member to maintain an individual job in competitive employment, customized employment or self-employment in an integrated work setting in the general workforce.\n\nLong-term job coaching services are provided to or on behalf of members who need support because of their disabilities and who are unlikely to maintain and advance in individual employment absent the provision of supports. Long-term job coaching services shall provide individualized and ongoing support contacts at intervals necessary to promote successful job retention and advancement.","url":"","verified":"","notes":"","row":14},{"id":"ia-long-term-coaching-expected-outcome-of-service","state":"IA","title":"Long Term Coaching - Expected Outcome of Service","name":"Long Term Coaching - Expected Outcome of Service","source":"","category":"employment","topic":"activities","text":"The expected outcome of this service is sustained employment paid at or above the minimum wage in an integrated setting in the general workforce, in a job that meets the member’s personal and career goals.\n\nAn expected outcome of supported self-employment is that the member earns income that is equal to or exceeds the average income for the chosen business within a reasonable period of time.","url":"","verified":"","notes":"","row":15},{"id":"ia-long-term-coaching-setting","state":"IA","title":"Long Term Coaching - Setting","name":"Long Term Coaching - Setting","source":"","category":"employment","topic":"activities","text":"Long-term job coaching services shall take place in integrated work settings.\n\nFor self-employment, the member’s home can be considered an integrated work setting.\n\nEmployment in the service provider’s organization (not including a sheltered workshop or similar type of work setting) can be considered employment in an integrated work setting in the general workforce if the employment occurs in a work setting where interactions are predominantly with coworkers or business associates who do not have disabilities, or with the general public, and if the position would exist within the provider’s organization were the provider not being paid to provide the job coaching to the member.","url":"","verified":"","notes":"","row":16},{"id":"ia-long-term-coaching-service-activities","state":"IA","title":"Long Term Coaching - Service Activities","name":"Long Term Coaching - Service Activities","source":"","category":"employment","topic":"activities","text":"Long-term job coaching services are designed to assist the member with learning and retaining individual employment, resulting in workplace integration, and which allows for the reduction of long-term job coaching over time. Services are individualized, and service plans are adjusted as support needs change and may include any combination of the following activities with or on behalf of the member:\n-Job analysis\n-Job training and systematic instruction\n-Training and support for use of assistive technology and adaptive aids\n-Engagement of natural supports\n-Transportation coordination\n-Job retention training and support\n-Benefits education and ongoing support\n-Supports for career advancement\n-Financial literacy and asset development\n-Employer consultation and support\n-Negotiation with employer on behalf of the member (e.g., accommodations, employment conditions, access to natural supports, and wage and benefits)\n-Other workplace support services may include services not specifically related to job skill training that enable the waiver member to be successful in integrating into the job setting\n-Transportation of the member during service hours\n-Career exploration services leading to increased hours or career advancement","url":"","verified":"","notes":"","row":17},{"id":"ia-long-term-coaching-self-employment","state":"IA","title":"Long Term Coaching - Self Employment","name":"Long Term Coaching - Self Employment","source":"","category":"employment","topic":"definition","text":"Self-employment long-term job coaching may include support to maintain a self-employment opportunity, including home-based self-employment.\n\nIn addition to the activities listed under 441 IAC 78.27(10) “b” (4), assistance to maintain self-employment may include:\n-Ongoing identification of the supports necessary for the individual to operate the business.\n-Ongoing assistance, counseling and guidance to maintain and grow the business; and\n-Ongoing benefits education and support.","url":"","verified":"","notes":"","row":18},{"id":"ia-long-term-coaching-units-of-service","state":"IA","title":"Long Term Coaching - Units of Service","name":"Long Term Coaching - Units of Service","source":"","category":"employment","topic":"billing","text":"Long-term job coaching services are based on the identified needs of the member as documented in the member’s comprehensive service plan. The member is authorized for a monthly tier of service based on the number of hours of direct support and activities on behalf of the member that the member requires each month to maintain their employment.\n\nLong Term Job Coaching Tiers\n\nTier 1 - 1 contact/month, monthly unit of service - H2025 U4\nTier 2 - 2-8 hours/month, monthly unit of service - H2025 U3\nTier 3 - 9-16 hours/month, monthly unit of service - H2025 U5\nTier 4 - 17-25 hours/month, monthly unit of service - H2025 U7\nTier 5 - 26 or more hours/month, hourly unit of service - H2025 UC\n\nEach long-term job coaching tier is billed as one monthly unit of service with the exception of Tier 5. When a member requires 26 or more hours of long-term job coaching during the month, the units of service entered into the service plan are the total number of hours of support required for the month.\n\nThe current HCBS Prevocational and Supported Employment fee schedule may be located at: http://dhs.iowa.gov/ime/providers/csrp/fee-schedule","url":"","verified":"","notes":"","row":19},{"id":"ia-small-group-employment","state":"IA","title":"Small Group Employment","name":"Small Group Employment","source":"","category":"employment","topic":"definition","text":"2 – 8  individuals\n\nSmall-group supported employment services are training and support activities provided in regular business or industry settings for groups of two to eight workers with disabilities. The outcome of this service is sustained paid employment experience, skill development, career exploration and planning leading to referral for services to obtain individual integrated employment or self-employment for which an individual is compensated at or above the minimum wage, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities.\n\nSmall-group supported employment services must be provided in a manner that promotes integration into the workplace and interaction between members and people without disabilities (e.g., customers, coworkers, natural supports) in those workplaces. Examples include, but are not limited to:\n-Mobile crews and other business-based workgroups employing small groups of workers with disabilities in employment in integrated business settings.\n-Small-group activities focused on career exploration and development of strengths and skills that contribute to successful participation in individual community employment.","url":"","verified":"","notes":"","row":20},{"id":"ia-small-group-employment-expected-outcome-of-service","state":"IA","title":"Small Group Employment - Expected Outcome of Service","name":"Small Group Employment - Expected Out
