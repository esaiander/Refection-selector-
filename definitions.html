up are provided in group settings, such as mobile work crews or enclaves and employees may be paid directly by the employer/business or by the Employment Services – Group provider.\n\nEmployment Services – Group is not a prerequisite for Employment Services – Individual.\n\nFor Employment Group--Transportation will be provided from the individual’s residence to the habilitation site when the service start time is before 12:00 Noon. Transportation will be available from the individual’s habilitation site to their residence when the service start time is after 12:00 Noon.\n\nProviders are permitted to employ enabling technologies to assist with optimizing independence and autonomy, while maintaining health and safety. Use of these technologies is aimed at reducing reliance on paid or natural supports in employment settings. These technologies (e.g., smartphone/tablet applications, wearable smart devices, communication systems) are not disability specific, but rather are technologies leveraged by people with and without disabilities. Training on their use enables waiver participants to work as independently as possible.","url":"","verified":"","notes":"","row":3},{"id":"sc-supported-employment-employment-services-provider-specificat","state":"SC","title":"Supported Employment – Employment Services Provider Specifications (Waiver)","name":"Supported Employment – Employment Services Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"Employment Services will be provided by staff who:\n• Are at least 18 years of age.\n\n• Have a valid high school diploma or its certified equivalent.\n\n• Have references from past employment if the person has a 5 year work history.\n\n• Are capable of aiding in the activities of daily living and implementing the Employment Services Plan of each person for whom they are responsible.\n\n• Have a valid driver’s license if duties require transportation of individuals.\n\n• Have a background check\n\n• Pass an initial physical exam prior to working in the program.\n\n• Pass initial tuberculosis screening prior to working in the program and annually thereafter.\n\n • Must be trained and be deemed competent in accordance with OIDD Directives.\n\n• Participate in the staff development/in-service education program operating in their provider agency which requires all staff to complete in-service education programs and staff development opportunities in accordance with OIDD directives.\n\nVerification happens initially and annually. OIDD QIO Reviews are conducted on a 24 month cycle depending on past performance of the provider organization.","url":"","verified":"","notes":"","row":4}]},{"code":"SD","name":"South Dakota","notes":[],"entries":[{"id":"sd-career-exploration-definition-choices-manual","state":"SD","title":"Career Exploration - Definition (CHOICES Manual)","name":"Career Exploration - Definition","source":"CHOICES Manual","category":"career","topic":"definition","text":"Career Exploration services are based on the belief that all individuals with developmental disabilities can work in integrated, competitive employment and that individuals of working age should be provided the supports necessary not only to gain and maintain employment but to advance in their chosen fields and explore new employment options as their skills, interests, and needs change. The outcome of the service is to obtain paid employment at or above minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals.","url":"","verified":"","notes":"","row":1},{"id":"sd-career-exploration-outlines-choices-manual","state":"SD","title":"Career Exploration - Outlines (CHOICES Manual)","name":"Career Exploration - Outlines","source":"CHOICES Manual","category":"career","topic":"definition","text":"Participants receiving career exploration services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome.\n\nCareer Exploration services are designed to assist participants in identifying and developing skills to prepare them for integrated competitive jobs and compensation at or above minimum wage, but not less than customary wage and level of benefits paid by the employer for similar work performed by employees without disabilities. This includes\n-Developing general work-related skills that are not job-specific\n-Following multiple step directions and instructions\n-Staying on task for extended periods of time\n-General health maintenance, including performing activities of daily living as it relates to maintaining employment\n\nCareer Exploration includes occupational training to teach participants skills for the competitive labor market, and personal training designed to develop appropriate worker traits. Occupational training through this service will include teaching concepts such as following directions, attendance, task completion, problem solving, and workplace safety.\n\nPrimarily focusing on the development of competitive worker traits through a trial-work training model, Career Exploration services can be furnished in a variety of community settings and is not limited to fixed-site facilities\n\nParticipant training will include learning the expectations of a competitive work environment, problem solving skills and strategies, and general workplace safety and mobility training.\n\nFurther Career Exploration components will include training participants on benefits management, the financial information needed by participants when they enter employment in the general workforce, and the use of work-related evaluations which involve the use of planned activities, systematic observation, job shadowing, internships, and work trials to accomplish a formal assessment of the participant skills and interests, including identification of service needs and identification of employment objectives.\n\nCareer Exploration services are limited to an 18-month delivery window, with a maximum of two three-month extensions. Upon culmination of Career Exploration, a participant has identified and is prepared to pursue additional career goals through other Employment-related Services.\n\nThe DHS/DDD will preauthorize participant access to Career Exploration as well as requests for extension. Access and requests for extension must include ISP team determination of the person's interest in employment, existing work readiness skills and the length of time likely needed to transition successfully to competitive, integrated employment.","url":"","verified":"","notes":"","row":2},{"id":"sd-career-exploration-billing-parameters-choices-manual","state":"SD","title":"Career Exploration - Billing Parameters (CHOICES Manual)","name":"Career Exploration - Billing Parameters","source":"CHOICES Manual","category":"career","topic":"billing","text":"Career Exploration services are reimbursed at an hourly unit rate. A billable unit consists of a minimum of 31 minutes. Please refer to the CHOICES Fee Schedule for detailed rates.\n\nA participant may receive Career Exploration in combination with other non-residential services, but the total combined hours cannot exceed 35 hours per week. Examples of other non-residential services include:\n-Day services\n-Small Group Vocational Support\n-Group supported employment\n-Individual Supported employment\n\nTransportation between the participant's place of residence and the Day Services site is provided as a component of Day Services and the cost of this transportation is included in this rate.\n-Participants may choose not to use the transportation provided by the day services provider. In that event, however, the participant’s choice to use public transportation must be documented in the participant’s care plan. Charges associated with the alternative transportation method are the responsibility of the participant.\n-If there is a situation where a provider is unable to provide transportation to a participant, alternative transportation should be arranged at the expense of the provider, as those costs are considered in the rate.\n-Providers should not bill for the minutes spent transporting participants, as those costs are factored into the rate.\n\nWaiver funds cannot be used to pay or add to a participant’s wages.\n\nIf the participant receives a wage less than the minimum wage, the Community Support Provider must have a Certificate pursuant to Section 14 (C) of the Fair Labor Standards Act from the Federal Department of Labor permitting payment of a sub-minimum wage.\n\nServices must not duplicate services provided by the Division of Vocational Rehabilitation.","url":"","verified":"","notes":"","row":3},{"id":"sd-individual-employment-choices-manual","state":"SD","title":"Individual Employment(CHOICES Manual)","name":"Individual Employment","source":"CHOICES Manual","category":"employment","topic":"definition","text":"Individual Supported Employment services are supports to a participant to obtain and maintain a job in integrated competitive employment, customized employment, or self-employment. Services include job coaching, job support, retention, and follow along. Participants may access Supported Employment regardless of whether Pre-Employment services have been previously accessed. Participants receiving Individual Supported Employment services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome. The service definition and limits outlined below do not include all details and requirements. For the service standards, limitations, provider types and qualifications, and reimbursement information, refer to the CHOICES Waiver","url":"","verified":"","notes":"","row":4},{"id":"sd-individual-employment-definitions-choices-manual","state":"SD","title":"Individual Employment - Definitions (CHOICES Manual)","name":"Individual Employment - Definitions","source":"CHOICES Manual","category":"employment","topic":"definition","text":"Individual Supported Employment services are integrated work setting in the general workforce.\n\nParticipants receiving group supported employment services receive compensation at or above the minimum wage.\n\nIndividual Supported Employment services must be provided in a manner that promotes integration into the workplace and interaction between participants and people without disabilities in those workplaces.\n\nIndividual Supported Employment services may include service and supports that assist the participant in achieving self-employment through the operation of a business. However, waiver funds may not be used to defray the expenses associated with starting up or operating a business. Assistance for self-employment may include:\n-aiding the participant to identify potential business opportunities\n-assistance in the development of a business plan, including potential sources of business financing and other assistance in developing and launching a business\n-identification of the supports that are necessary in order for the participant to operate the business\n-ongoing assistance, counseling and guidance once the business has been launched\n\nIndividual Supported Employment services are provided on a 1:1 ratio and the individual in on the payroll of the community business.\n\nExamples of Individual Supported Employment include\n-Learning a work schedule\n-Working alongside coworkers\n-Talking with the boss about work needs\n-Learning work expectations","url":"","verified":"","notes":"","row":5},{"id":"sd-individual-employment-phases-choices-manual","state":"SD","title":"Individual Employment - Phases (CHOICES Manual)","name":"Individual Employment - Phases","source":"CHOICES Manual","category":"employment","topic":"activities","text":"Discovery: Development of an employment profile as the desired outcome.\n\nJob Development: Coordination between the job seeker and employer to identify and negotiate job responsibilities.\n\nStabilization: Provision of necessary supports that result in the person learning job responsibilities, building relationships with supervisor(s) and coworkers, and achieving professional growth as identified by the person.\n\nLong-Term Support: Provision of on-going supports as identified by the team or person to sustain long-term employment, which may include re-engagement of additional supports if needed. The delivery of Supported Employment services may include personal care type services as long as those supports do not encompass the entirety of the service (more than 20%).","url":"","verified":"","notes":"","row":6},{"id":"sd-individual-employment-billing-choices-manual","state":"SD","title":"Individual Employment - Billing (CHOICES Manual)","name":"Individual Employment - Billing","source":"CHOICES Manual","category":"employment","topic":"billing","text":"Individual Supported Employment are reimbursed at a 15-minute unit rate. A billable unit consists of a minimum of 8 minutes. Please refer to the CHOICES Fee Schedule for detailed rates\n\nA participant may receive Individual Supported Employment in combination with other non-residential services, but the total combined hours cannot exceed 35 hours per week. Examples of other non-residential services include:\n-Day services\n-Career Exploration\n-Small Group Vocational Support\n-Group Supported employment\n\nIndividual Supported Employment services cannot be billed unless the staff providing the service meet the training requirements outlined by DDD\n\nTransportation between the participant's place of residence and the Individual Supported Employment services site is provided as a component of Supported Employment services and the cost of this transportation is included in this rate\n-Participants may choose not to use the transportation provided by the day services provider. In that event, however, the participant’s choice to use public transportation must be documented in the participant’s care plan. Charges associated with the alternative transportation method are the responsibility of the participant\n-If there is a situation where a provider is unable to provide transportation to a participant, alternative transportation should be arranged at the expense of the provider, as those costs are considered in the rate\n-Providers should not bill for the minutes spent transporting participants, as those costs are factored into the rate\n\nIndividual Supported Employment should not be billed for transportation purposes only, including for pick up and/or drop off assistance when a participant cannot secure transportation to an employment or service site. Transportation between the participant’s place of residence and the employment or service site is allowable only when the provider remains onsite to provide Supported Employment services\n\nIndividual Supported Employment services cannot be provided in a provider owned or controlled setting unless the participant is competitively employed by the community support provider. All the following criteria must be met for the team to determine the participant qualifies for Individual Supported Employment while working for the community support provider\n-the person is working in an integrated environment\n-the person is earning at least minimum wage\n-the person is supervised as others in the same area\n-the person’s supervisor cannot deliver a waiver service – can’t be paid to be a supervisor AND a job coach\n-if the person requires supports on the job, a designated job coach or employment staff is available\n\nIndividual Supported Employment hours may only be billed for the time that the job coach is providing support.\n\nWaiver funds cannot be used to pay or add to a participant’s wages or to purchase supplies for a participant’s self-employment related activities.\n\nIncome from a customized home business does not have to meet the minimum wage requirement.\n\nIndividual Supported Employment services cannot be provided at the same time a participant is receiving day services.\n\nSelf-employment supports does not include\n-paying expenses with starting up or operating a business\n-supporting the participant to engage in self-employment that is not likely to result in earning at least minimum wage for hours worked within the first year of creating the business;\n-supporting an activity if the activity is a hobby and not a business; and\n-providing supervision, bookkeeping or related administrative duties required to operate the participant’s business;\n\nServices must not duplicate services provided by the Division of Vocational Rehabilitation","url":"","verified":"","notes":"","row":7},{"id":"sd-group-supported-employment-choices-manual","state":"SD","title":"Group Supported Employment (CHOICES Manual)","name":"Group Supported Employment","source":"CHOICES Manual","category":"employment","topic":"definition","text":"The outcome of Group Supported Employment is sustained paid employment at or above minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals. Participants receiving group supported employment services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome. Group Supported Employment services are supports to a group of participants to obtain and maintain a job in integrated competitive employment, customized employment, or self-employment. Services include job coaching, job support, retention, and follow along. Participants may access Supported Employment regardless of whether Pre-Employment services have been previously accessed. The service definition and limits outlined below do not include all details and requirements. For the service standards, limitations, provider types and qualifications, and reimbursement information, refer to the CHOICES Waiver","url":"","verified":"","notes":"","row":8},{"id":"sd-group-supported-employment-outlines-choices-manual","state":"SD","title":"Group Supported Employment - Outlines (CHOICES Manual)","name":"Group Supported Employment - Outlines","source":"CHOICES Manual","category":"employment","topic":"definition","text":"Group supported employment services are integrated work setting in the general workforce.\n\nParticipants receiving group supported employment services receive compensation at or above the minimum wage.\n\nGroup Supported Employment can be provided to a group of (2) to (4) individuals.\n\nGroup supported employment services must be provided in a manner that promotes integration into the workplace and interaction between participants and people without disabilities in those workplaces\n\nGoals and/or supports related to employment are outlined within the person-centered ISP.\n\nGroup supported employment services are provided to participants that are employed by the community business and are on their payroll.\n\nGroup supported employment services aim to connect participants with coworkers at the work site and include a plan to decrease the need for a job coach through the development of job-related skills.\n\nExamples of group supported employment include:\n-Learning a work schedule\n-Working alongside coworkers\n-Talking with the boss about work needs  -Learning work expectations","url":"","verified":"","notes":"","row":9},{"id":"sd-group-supported-employment-billing-parameters","state":"SD","title":"Group Supported Employment - Billing Parameters","name":"Group Supported Employment - Billing Parameters","source":"","category":"employment","topic":"billing","text":"Group Supported Employment services are reimbursed at an hourly unit rate. A billable unit consists of a minimum of 31 minutes. Please refer to the CHOICES Fee Schedule for detailed rates.\n\nA participant may receive Group Supported Employment in combination with other non-residential services, but the total combined hours cannot exceed 35 hours per week. Examples of other non-residential services include:\n-Day services\n-Career Exploration\n-Small Group Vocational Support\n-Individual Supported employment\n\nTransportation between the participant's place of residence and the Group Supported Employment services site is provided as a component of Group Supported Employment services and the cost of this transportation is included in this rate.\n-Participants may choose not to use the transportation provided by the day services provider. In that event, however, the participant’s choice to use public transportation must be documented in the participant’s care plan. Charges associated with the alternative transportation method are the responsibility of the participant.\n-If there is a situation where a provider is unable to provide transportation to a participant, alternative transportation should be arranged at the expense of the provider, as those costs are considered in the rate.\n-Providers should not bill for the minutes spent transporting participants, as those costs are factored into the rate.\n\nGroup Supported Employment services cannot be provided in a provider owned or controlled setting.\n\nWaiver funds cannot be used to pay or add to a participant’s wages.\n\nProviders will bill the same rate for each participant in the group based on the number of hours of support provided.\n\nServices must not duplicate services provided by the Division of Vocational Rehabilitation.","url":"","verified":"","notes":"","row":10},{"id":"sd-prevocational-services-waiver","state":"SD","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Services are based on the belief that all individuals with developmental disabilities can work in integrated, competitive employment and that individuals of working age should be provided the supports necessary not only to gain and maintain employment but to advance in their chosen fields and explore new employment options as their skills, interests, and needs change. The outcome of the service is sustained paid employment at or above minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals.\n\nCareer Exploration services are designed to assist participants in identifying and developing skills to prepare them for integrated competitive jobs and compensation at or above minimum wage, but not less than customary wage and level of benefits paid by the employer for similar work performed by employees without disabilities.\n\nPrimarily focusing on the development of competitive worker traits through a trial-work training model, Career Exploration services can be furnished in a variety of community settings and is not limited to fixed-site facilities. Participant training will include learning the expectations of a competitive work environment, problem solving skills and strategies, and general workplace safety and mobility training.\n\nCareer Exploration includes occupational training to teach participants skills for the competitive labor market, and personal training designed to develop appropriate worker traits. Occupational training through this service will include teaching concepts such as following directions, attendance, task completion, problem solving, and workplace safety.\n\nFurther Career Exploration components will include training participants on benefits management, the financial information needed by participants when they enter employment in the general workforce, and the use of work-related evaluations which involve the use of planned activities, systematic observation, job shadowing, internships, and work trials to accomplish a formal assessment of the participant skills and interests, including identification of service needs and identification of employment objectives.\n\nCareer Exploration services are limited to an 18-month delivery window, with a maximum of two three-month extensions available with DHS approval. Upon culmination of Career Exploration, a participant has identified and is prepared to pursue additional career goals through other Employment-related Services. The DHS/DDD will preauthorize participant access to Career Exploration as well as requests for extension. Access and requests for extension must include ISP team determination of the person's interest in employment, existing work readiness skills and the length of time likely needed to transition successfully to competitive, integrated employment. The DHS/DDD will determine through the preauthorization process if the supports identified by the ISP team are prevocational rather than vocational in nature.\n\nParticipants receiving career exploration services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome.\n\nTransportation between the participant's place of residence and the Career Exploration site is provided as a component of Career Exploration and the cost of this transportation is included in this rate. Participants may choose not to use the transportation provided by the Career Exploration location. In that event, however, the participant’s choice to use public transportation must be documented in the participant’s care plan. Charges associated with the alternative transportation method are the responsibility of the participant.\n\nProviders of Career Exploration will maintain thorough and timely documentation of services demonstrating full compliance with all programmatic and contractual requirements, the Administrative Rules of South Dakota, and all Department of Human Services and Department of Social Services policies.\n\nDocumentation is maintained in the file of each participant receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.)","url":"","verified":"","notes":"","row":11},{"id":"sd-prevocational-services-limits-waiver","state":"SD","title":"Prevocational Services - Limits (Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"Career exploration services are limited to 18 months, with a maximum of two three-month extensions with approval by DHS/DDD. Career exploration services cannot occur in a residential setting.","url":"","verified":"","notes":"","row":12},{"id":"sd-prevocational-services-community-support-provider-specificat","state":"SD","title":"Prevocational Services – Community Support Provider Specifications (Waiver)","name":"Prevocational Services – Community Support Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"A CSP/OHCDS must be certified by the DHS/DDD pursuant to Administrative Rules of South Dakota (ARSD) 46:11:02. The CSP/OHCDS must be an enrolled Medicaid provider and have a provider agreement with DHS/DDD.\n\nThe provider shall ensure that all employees responsible for providing supports and services to individuals are trained on the minimum requirements necessary to address the individual's needs. The training and documentation requirements as described in 46:11:04:15.01.\n\nBiennial verification.","url":"","verified":"","notes":"","row":13},{"id":"sd-supported-employment-waiver","state":"SD","title":"Supported Employment (Waiver)","name":"Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Services are based on the belief that all individuals with developmental disabilities can work in integrated, competitive employment and that individuals of working age should be provided the supports necessary not only to gain and maintain employment but to advance in their chosen fields and explore new employment options as their skills, interests, and needs change.\n\nSupported Employment services are supports to a participant to obtain and maintain a job in integrated competitive employment, customized employment, or self-employment. Services include job coaching, job support, retention, and follow along. Participants may access Supported Employment regardless of whether Pre-Employment services have been previously accessed. Supported Employment is defined as:\n\n• Integrated work setting in the general workforce.\n\n• Compensation at or above the minimum wage for individual supported employment.\n\n• Must be provided in a manner that promotes integration into the workplace and interaction between participants and people without disabilities in those workplaces.\n\n• Goals and/or supports related to employment are outlined within the person-centered ISP.\n\nParticipants receiving Supported Employment services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome.\n\nDiscovery: Development of an employment profile as the desired outcome\n\nJob Development: Coordination between the job seeker and employer to identify and negotiate job responsibilities\n\nStabilization: Provision of necessary supports that result in the person learning job responsibilities, building relationships with supervisor(s) and coworkers, and achieving professional growth as identified by the person\n\nLong-Term Support: Provision of on-going supports as identified by the team or person to sustain long-term employment, which may include re-engagement of additional supports if needed. The delivery of Supported Employment services may include personal care type services as long as those supports do not encompass the entirety of the service.\n\nSupported Employment should not be billed for transportation purposes only, including for pick up and/or drop off assistance when a participant cannot secure transportation to an employment or service site. Transportation between the participant’s place of residence and the employment or service site is allowable only when the provider remains onsite to provide Supported Employment services.\n\nDocumentation is maintained in the file of each participant receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.).","url":"","verified":"","notes":"","row":14},{"id":"sd-supported-employment-community-support-provider-specificatio","state":"SD","title":"Supported Employment – Community Support Provider Specifications (Waiver)","name":"Supported Employment – Community Support Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"A CSP/OHCDS must be certified by the DHS/DDD pursuant to Administrative Rules of South Dakota (ARSD) 46:11:02. The CSP/OHCDS must be an enrolled Medicaid provider and have a provider agreement with DHS/DDD.\n\nThe provider shall ensure that all employees responsible for providing supports and services to individuals are trained on the minimum requirements necessary to address the individual's needs. The training and documentation requirements as described in 46:11:04:15.01.\n\nSupported Employment services must be provided by a direct service worker with a certificate or training related to providing employment supports for individuals with intellectual/developmental disabilities as approved by DHS/DDD.\n\nDHS/DDD is responsible to assure each CSP/OHCDS meets certification requirements pursuant to ARSD 46:11:02 and 46:11:04:15.01.\n\nBiennial verification","url":"","verified":"","notes":"","row":15},{"id":"sd-group-supported-employment-waiver","state":"SD","title":"Group Supported Employment (Waiver)","name":"Group Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"Services are based on the belief that all individuals with developmental disabilities can work in integrated, competitive employment and that individuals of working age should be provided the supports necessary not only to gain and maintain employment but to advance in their chosen fields and explore new employment options as their skills, interests, and needs change.\n\nSimilar to Individual Supported Employment, the outcome of Group Supported Employment is sustained paid employment at or above minimum wage in an integrated setting in the general workforce, in a job that meets personal and career goals. Participants receiving group supported employment services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome.\n\nGroup Supported Employment services are supports to a group of participants to obtain and maintain a job in integrated competitive employment, customized employment, or self-employment. Services include job coaching, job support, retention, and follow along. Participants may access Supported Employment regardless of whether Pre-Employment services have been previously accessed. Group Supported Employment is defined as:\n\n• Integrated work setting in the general workforce.\n\n• Compensation at or above the minimum wage for individual supported employment.\n\n• Group Supported Employment can be provided to a group of (2) to (4) individuals.\n\n• Must be provided in a manner that promotes integration into the workplace and interaction between participants and\n\npeople without disabilities in those workplaces.\n\n• Goals and/or supports related to employment are outlined within the person-centered ISP.\n\nParticipants receiving Supported Employment services must have an outcome for competitive, integrated employment included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome.\n\nTransportation between the participant's place of residence and the employment site is allowable and the cost of this transportation is included in the rate paid to providers of supported employment services. Participants may choose not to use the transportation provided as part of this service. In that event, however, the participant’s choice to use public transportation must be documented in the participant’s care plan. Charges associated with the alternative transportation method are the responsibility of the participant.","url":"","verified":"","notes":"","row":16},{"id":"sd-group-supported-employment-limits-waiver","state":"SD","title":"Group Supported Employment - Limits (Waiver)","name":"Group Supported Employment - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Between 2-4 participants supported in a group at a time.","url":"","verified":"","notes":"","row":17},{"id":"sd-group-supported-employment-community-support-provider-specif","state":"SD","title":"Group Supported Employment - Community Support Provider Specifications (Waiver)","name":"Group Supported Employment - Community Support Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"A CSP/OHCDS must be certified by the DHS/DDD pursuant to Administrative Rules of South Dakota (ARSD) 46:11:02. The CSP/OHCDS must be an enrolled Medicaid provider and have a provider agreement with DHS/DDD.\n\nThe provider shall ensure that all employees responsible for providing supports and services to individuals are trained on the minimum requirements necessary to address the individual's needs. The training and documentation requirements as described in 46:11:04:15.01.\n\nDHS/DDD is responsible to assure each CSP/OHCDS meets certification requirements pursuant to ARSD 46:11:02 and 46:11:04:15.01.\n\nBiennial verification.","url":"","verified":"","notes":"","row":18},{"id":"sd-small-group-vocational-support-waiver","state":"SD","title":"Small Group Vocational Support (Waiver)","name":"Small Group Vocational Support","source":"Waiver","category":"employment","topic":"definition","text":"Services are based on the belief that all individuals with developmental disabilities can work in integrated, competitive employment and that individuals of working age should be provided the supports necessary not only to gain and maintain employment but to advance in their chosen fields and explore new employment options as their skills, interests, and needs change.\n\nUnlike Individual and Group Supported Employment, which seeks to provide participants with the supports and training necessary to maintain a job in an integrated competitive employment environment, Small Group Vocational Support services are designed to create a pathway towards integrated community-based employment for those who are not yet ready to receive Group or Individual Supported Employment services. Participants receiving these services must have an outcome to sustain competitive, integrated, paid employment at or above minimum wage in an integrated setting in the general workforce in a job that meets personal and career goals included in their person-centered ISP. The service must be reviewed at least annually or more frequently as needed to assess the need for the service and progress on the employment outcome.\n\nSmall Group Vocational Support services are expected to specifically involve strategies that enhance a participant's employability in integrated, community settings, in a separate and distinct area of the business, while affording participants the opportunity for interaction between non-disabled peers or customers. Specifically, these provide structured environments in which individuals can work in the community to develop appropriate work skills and habits that include initiating interaction with coworkers, taking direction from supervisors, making transportation arrangements, and managing time and money. Small Group Vocational Support services include work experience where the provider holds a contract with the business and the agency provider pays the participant or group of participants who complete the job. Enclave services can be provided in groups of 2-8 participants.\n\nSuccessful outcomes for participants include demonstrated improvement of work skills and employment habits, and/or a Provider recommendation that the Participant advance to Group Supported or another higher tier of Career and Employment services.\n\nTransportation between the participant's place of residence and the employment site is allowable and the cost of this transportation is included in the rate paid to providers of supported employment services. Participants may choose not to use the transportation provided as part of this service. In that event, however, the participant’s choice to use public transportation must be documented in the participant’s care plan. Charges associated with the alternative transportation method are the responsibility of the participant.\n\nDocumentation is maintained in the file of each participant receiving this service that the service is not available under a program funded under section 110 of the Rehabilitation Act of 1973 or the Individuals with Disabilities Education Act (20 U.S.C. 1401 et seq.)","url":"","verified":"","notes":"","row":19},{"id":"sd-small-group-vocational-support-limits-waiver","state":"SD","title":"Small Group Vocational Support - Limits (Waiver)","name":"Small Group Vocational Support - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Between 2-8 individuals supported at a time. Crew work is not limited or excluded from this service.","url":"","verified":"","notes":"","row":20},{"id":"sd-small-group-vocational-support-community-support-provider-sp","state":"SD","title":"Small Group Vocational Support – Community Support Provider Specifications (Waiver)","name":"Small Group Vocational Support – Community Support Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"A CSP/OHCDS must be certified by the DHS/DDD pursuant to Administrative Rules of South Dakota (ARSD) 46:11:02. The CSP/OHCDS must be an enrolled Medicaid provider and have a provider agreement with DHS/DDD.\n\nThe provider shall ensure that all employees responsible for providing supports and services to individuals are trained on the minimum requirements necessary to address the individual's needs. The training and documentation requirements as described in 46:11:04:15.01.\n\nDHS/DDD is responsible to assure each CSP/OHCDS meets certification requirements pursuant to ARSD 46:11:02 and 46:11:04:15.01.\n\nBiennial verification","url":"","verified":"","notes":"","row":21}]},{"code":"TN","name":"Tennessee","notes":[],"entries":[{"id":"tn-prevocational-services-waiver","state":"TN","title":"Prevocational Services (Waiver)","name":"Prevocational Services","source":"Waiver","category":"prevoc","topic":"definition","text":"Services and supports that occur in a facility-based setting and which help a person to acquire, retain and improve skills in the area of self-care, sensory/motor development, socialization, daily living skills, and communication, in order to pursue and achieve his or her personal community employment and/or community participation goals. Facility-Based Day Supports are expected to provide a springboard for participants to access the local community, and to discover and pursue their interests and goals related to community employment, community participation/involvement an-d building/maintaining relationships with members of the wider community who do not have disabilities and/or do not receive Medicaid HCBS. All participants in Facility-Based Day Supports must be encouraged and supported to explore and pursue possibilities for integrated community employment and opportunities to engage in community life and develop/maintain relationships with others in their communities who do not have disabilities or receive Medicaid HCBS, based on their individualized preferences and needs, and as reflected in the PCSP.\n\nFacility-Based Day Supports may be provided only when selected by a person supported who needs time-limited prevocational training, when such training is not available on the job site, and to persons who, through their person- centered planning process choose to participate in a facility based program in order to focus on the development of individualized and specific skills that will support them in pursuing and achieving employment and/or community living goals. Facility-Based Day Supports must allow for opportunities for all persons supported to be engaged in the broader community when appropriate and be specified in the PCSP. Opportunities to transition into more integrated settings, including competitive integrated employment, will be evaluated on at least a semi- annual basis. As part of the provision of this service, the provider shall be responsible for working with the person, the person’s Case Manager and Circle of Support to explore how Enabling Technology could be used to support the person’s achievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and Circle of Support in order to ensure an informed choice regarding the potential use of Enabling Technology; and the implementation of Enabling Technology supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nAll day services shall occur in the most integrated setting where an individual’s needs can be effectively met. The most integrated setting is the setting that enables an individual to interact with persons without disabilities (not including paid staff) to the greatest extent possible. Facility-Based Day Supports must allow for, and actively facilitate whenever possible, opportunities for all persons supported to transition into more integrated employment and/or day service model, including Supported Employment and Community Participation Supports. To ensure this is occurring, continued need for Facility Based Day Supports will be evaluated on at least a semi-annual basis. Further, before authorization Facility-Based Day Supports for the purposes of time-limited pre-vocational training, consideration should be given as to whether such training could occur in an integrated, community-based setting(s) where learning is likely to be more directly transferable to, and applicable for, participation in competitive integrated employment.\n\nAuthorization of these services shall include an employment informed choice process to support the person in making an informed choice about work and other integrated service options.\n\nAn individual’s PCSP may include more than one non-residential habilitation service (Supported Employment-Individual Employment Supports; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wrap-Around Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).\n\nTransportation during the provision of these services is included in the rates paid for these services. Transportation of a participant to and from these services is included in the rates paid for these services when such transportation is needed by a participant.","url":"","verified":"","notes":"","row":1},{"id":"tn-prevocational-services-limits-waiver","state":"TN","title":"Prevocational Services - Limits (Waiver)","name":"Prevocational Services - Limits","source":"Waiver","category":"prevoc","topic":"limits","text":"Non-residential habilitation services (Supported Employment-Individual Employment Supports (except as noted below); Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wrap-Around Supports; Facility-Based Day Supports) and either the Residential Special Needs Adjustment-Homebound or the Non-Residential Homebound Support Service, when combined, may involve no more than 5,832 quarter hour units/year and no more than 240 quarter hour units in a fourteen day billing period. The Residential Special Needs Adjustment-Homebound and the Non-Residential Homebound Support Service are paid on a per diem basis and each day shall be considered as 24 quarter hour units for the purposes of including this service in the annual and billing period limits. Under Supported Employment-Individual Employment Supports, authorizations of Benefits Counseling, Exploration, Discovery and Job Development are not included in these limits.\n\nFacility-Based Day Supports may only be authorized for up to six (6) months at one time. Before any and every reauthorization, a review must occur to determine whether the facility remains the most integrated setting where the person’s goals and needs can be effectively met, whether there are opportunities for the person to transition into more integrated settings and services, including supported employment and community participation, and whether – if time-limited prevocational services are being provided – there are opportunities to provide these services in an integrated, community_x0002_based setting(s) where learning is likely to be more directly transferable to, and applicable for, participation in competitive integrated employment, including supported employment.\n\nFacility-Based Day Services shall not be provided during the same time period that the person is receiving Personal Assistance Services, Respite Services, or services under a 504 Plan or Individual Education Program (IEP), is being homeschooled, or any combination thereof, or as a substitute for education services which are available pursuant to the Individual with Disabilities Education Act (IDEA), but which the person or his/her legal representative has elected to forego. Except for students who have graduated prior to May of 2014, Day Services for school aged persons (i.e., under the age of 22) are limited to regular school break periods.\n\nFacility-Based Day Supports may not be provided on the same date as the Intermittent Employment and Community Integration Wrap-Around Support service\n\nFacility-Based Day Supports shall not be provided in inpatient hospitals, nursing facilities, and Intermediate Care Facilities for Individuals with Intellectual Disabilities (ICFs/IID).\n\nFacility-Based Day Supports exclude services available to an individual under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.)\n\nPaid work done as part of Facility-Based Day Supports must be compensated consistent with applicable state and federal labor laws and must provide the opportunity for participants to earn wage increases over time.\n\nFacility-Based Day Supports does not include vocational services or the provision of employment opportunities solely intended to provide long-term employment and earned income to participants.","url":"","verified":"","notes":"","row":2},{"id":"tn-prevocational-services-waiver-service-agency-provider-specif","state":"TN","title":"Prevocational Services – Waiver Service Agency Provider Specifications (Waiver)","name":"Prevocational Services – Waiver Service Agency Provider Specifications","source":"Waiver","category":"prevoc","topic":"provider","text":"Must hold an Intellectual Disability Facility-Based Adult Habilitation Day license from DDA.\n\nThe provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver's license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by DDA.\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\nAll providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements.\n\nVerification every 12-18 months.","url":"","verified":"","notes":"","row":3},{"id":"tn-small-group-supported-employment-waiver","state":"TN","title":"Small Group Supported Employment (Waiver)","name":"Small Group Supported Employment","source":"Waiver","category":"employment","topic":"definition","text":"This service provides employment services and training activities to support successful transition to Individualized Integrated Employment (IIE) or Self-Employment (SE) as defined in TennCare Rule, or to supplement such IIE and/or SE when it is only part-time. Service may involve small group career planning and exploration, small group Discovery classes/activities, other educational opportunities related to successful job acquisition and working successfully in IIE. Service may also include employment in integrated business, industry, and community settings. Examples include mobile crews, small enclaves and other small groups participating in integrated employment that is specifically related to the identified interests, experiences and/or skills of each of the persons in the small group and that results in acquisition of knowledge, skills, and experiences that facilitate transition to IIE or SE, or that supplement such IIE or SE when it is only part-time. Maximum group size is three waiver participants.\n\nAs part of the provision of this service, the provider shall be responsible for working with the person, the person’s ISC/Case Manager and Circle of Support (COS) to explore how Enabling Technology (ET) could be used to support the person’s achievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and COS in order to ensure an informed choice regarding the potential use of ET; and the implementation of ET supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nCareer planning and exploration activities, Discovery classes/activities, other educational opportunities related to successful job acquisition and working successfully in IIE or SE must be conducted in appropriate non-disability-specific settings (e.g. Job Centers, businesses, post-secondary education campuses, libraries, etc.) All settings must meet all HCBS setting standards and must not isolate participants from others who do not have disabilities\n\nIn the enclave model, a small group of people with disabilities (no more than three people) is trained and supervised to work among employees who are not disabled at the host company's work site. Persons in the enclave may work as a team at a single work area or may work in multiple areas throughout the company. The Supported Employment—Small Group provider is responsible for training, supervision, and support of participants. The provider is expected to conduct this service in integrated business, industry or community settings that meet all HCBS setting standards and do not isolate participants from others in the setting who do not have disabilities. The experience should allow opportunities for routine interactions with others without disabilities in the setting and involvement from supervisors and co-workers without disabilities (not paid to deliver this service) in the supervision and support of individuals receiving this service\n\nIn the mobile work crew model, a small crew of workers (including no more than three persons with disabilities and ideally including workers without disabilities who are not paid support staff) work as a distinct unit and operate as a self_x0002_contained business that generates employment for their crew members by selling a service. The crew typically works at several locations within the community. The Supported Employment—Small Group provider is responsible for training, supervision, and support of participants. The provider is expected to conduct this service in integrated business, industry or community settings that meet all HCBS setting standards and do not isolate participants from others who do not have disabilities. The experience should allow opportunities for routine interactions with people without disabilities (including fellow crew members, customers, etc.) in the course of performing services\n\nPaid work under Supported Employment—Small Group must be paid in accordance with all applicable federal and state labor laws, with the optimal expectation being wages that are at or above the state minimum wage. Further, the employment must provide an opportunity for participants, whether paid based on productivity or not, to earn an increased hourly wage over time as would be typical for other members of the general workforce. Supported Employment—Small Group does not include vocational or prevocational services, employment or training provided in facility-based work settings. Supported Employment—Small Group service settings cannot be provider-owned, leased, or operated settings. The settings must be integrated in and support full access of participants to the greater community, including opportunities to learn about and seek IIE or SE, engage in community life, and control their earned income. The IIE or SE shall be consistent with the individual’s personal and career goals. Supported Employment—Small Group services shall be provided in a way that presumes all participants are capable of working in IIE and/or SE. Participants in this service shall be encouraged, on an ongoing basis, to explore and develop their interests, strengths, and abilities relating to IIE and/or SE. In order to reauthorize this service, the PCSP must document that such opportunities are being provided through this service, to the individual, on an on-going basis. The PCSP shall also document and address any barriers to the individual transitioning to IIE or SE if the person is not already participating in IIE or SE. Any individual using this service to supplement part-time IIE or SE shall be offered assistance to increase hours in IIE and/or SE as an alternative or partial alternative to continuing this service.\n\nAs a component part of this service, Supported Employment—Small Group service providers shall support individuals in identifying and pursuing opportunities that will move them into IIE or SE. An individual’s person-centered support plan may include more than one non-residential habilitation service (Supported Employment-Individual Employment Supports; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wrap-Around Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).\n\nTransportation during the provision of these services is included in the rates paid for these services. Transportation of a participant to and from these services is included in the rates paid for these services when such transportation is needed by a participant.\n\nThe Supported Employment—Small Group provider shall be responsible for any personal assistance needs during the hours that Supported Employment-Small Group services are provided; however, the personal assistance services may not comprise the entirety of the Supported Employment—Small Group service.","url":"","verified":"","notes":"","row":4},{"id":"tn-small-group-supported-employment-waiver-service-agency-provi","state":"TN","title":"Small Group Supported Employment – Waiver Service Agency Provider Specifications (Waiver)","name":"Small Group Supported Employment – Waiver Service Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\nStaff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\nAny waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\nStaff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\nStaff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\nWaiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\nAll providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements.\n\nAgency-employed staff delivering Supported Employment-Small Group Employment Supports services shall also be\n\nrequired to meet the following qualifications: 1. The staff person shall have qualified as a Job Coach by either:\n\n(1) qualifying as a Job Developer as defined in TennCare protocol; or\n\n(2) successfully completing a competency-based training course covering best practices in job coaching and consultation,\n\npre-approved by TennCare and covering, at minimum, specific content prescribed in TennCare protocol.\n\nVerification every 12-18 months","url":"","verified":"","notes":"","row":5},{"id":"tn-small-group-supported-employment-legally-responsible-person-","state":"TN","title":"Small Group Supported Employment – Legally Responsible Person Provider Specifications (Waiver)","name":"Small Group Supported Employment – Legally Responsible Person Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\n6. All providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements. Agency-employed staff delivering Supported Employment-Small Group Employment Supports services shall also be required to meet the following qualifications:\n\n1. The staff person shall have qualified as a Job Coach by either:\n\n(1) qualifying as a Job Developer as defined in TennCare protocol; or\n\n(2) successfully completing a competency-based training course covering best practices in job coaching and consultation,\n\npre-approved by TennCare and covering, at minimum, specific content prescribed in TennCare protocol.\n\nVerification every 12-18 months","url":"","verified":"","notes":"","row":6},{"id":"tn-supported-employment-individual-benefits-counseling-waiver","state":"TN","title":"Supported Employment Individual Benefits Counseling (Waiver)","name":"Supported Employment Individual Benefits Counseling","source":"Waiver","category":"employment","topic":"definition","text":"Supported Employment Individual (SE Ind)-Benefits Counseling is designed to inform the individual (and guardian, conservator and/or family, if applicable) of the multiple pathways to ensuring Individualized Integrated Employment (IIE) or Self- Employment (SE), as defined in TennCare Rule, results in increased economic self-sufficiency (net financial benefit) through the use of various work incentives. This service should also repudiate myths and alleviate fears and concerns related to seeking and working in IIE or SE through an accurate, individualized assessment. The service provides information to the individual (and guardian, conservator and/or family, if applicable) regarding the full array of available work incentives for essential benefit programs including SSI, SSDI, Medicaid, Medicare, 1915(c) waivers, housing subsidies, food stamps, etc.\n\nThe service also will provide information and education to the person (and guardian, conservator and/or family, if applicable) regarding income reporting requirements for public benefit programs, including the Social Security Administration.\n\nBenefits Counseling provides work incentives counseling and planning services to persons actively considering or seeking IIE or SE, or career advancement in either of these types of employment.\n\nIn addition to ensuring this service is not otherwise available to the individual under section 110 of the Rehabilitation Act of 1973, or the IDEA (20 U.S.C. 1401 et seq.), the waiver may not fund this service if Benefits Counseling services funded through the Federal Work Incentives Planning and Assistance (WIPA) program are available to the individual.\n\nBenefits Counseling must be provided in a manner that supports the person’s communication style and needs, including, but not limited to, age-appropriate communications, translation/interpretation services for persons of limited English-proficiency or who have other communication needs requiring translation including sign language interpretation, and ability to communicate with a person who uses an assistive communication device.\n\nThese services are designed to support the achievement of IIE and SE outcomes consistent with the individual’s personal and career goals, as determined through Exploration, Discovery and/or other similar career planning processes and which include an introduction to the variety of work incentives available to individuals receiving Supplemental Security Income (SSI) and/or Social Security Disability Insurance (SSDI), Medicaid and/or Medicare.\n\nAs part of the provision of this service, the provider shall be responsible for working with the person, the person’s ISC/Case Manager and Circle of Support (COS) to explore how Enabling Technology (ET) could be used to support the person’s achievement of individualized goals and outcomes and increase the person’s independence in or across environments, including home, community, work, volunteering, and travel; helping to educate the person supported and his/her Conservator, as applicable and COS in order to ensure an informed choice regarding the potential use of ET; and the implementation of ET supports as part of the delivery of this service, as appropriate, when approved as part of the person’s PCSP.\n\nThe SE Ind-Benefits Counseling provider shall be responsible for any Personal Assistance (PA) needs during the time that SE Ind-Benefits Counseling services are provided; however, PA may not comprise the entirety of the SE Ind-Benefits Counseling service(s) being provided.\n\nTransportation during the provision of SE Ind-Benefits Counseling is included in the rates paid for these services. Transportation of the person to and from SE Ind-Benefits Counseling is included in the rates paid for these services when such transportation is needed by the person.\n\nA person's PCSP may include more than one non-residential service (SE Ind services; Supported Employment-Small Group Employment Supports; Community Participation Supports; Intermittent Employment and Community Integration Wrap_x0002_Around Supports; Facility-Based Day Supports); however, they may not be billed for during the same period of time (e.g., the same 15 minute or hour unit of time).","url":"","verified":"","notes":"","row":7},{"id":"tn-supported-employment-individual-benefits-counseling-limits-w","state":"TN","title":"Supported Employment Individual Benefits Counseling - Limits (Waiver)","name":"Supported Employment Individual Benefits Counseling - Limits","source":"Waiver","category":"employment","topic":"limits","text":"Benefits Counseling services are paid for on an hourly basis and limited in the following ways:\n\na. Initial Benefits Counseling for someone actively considering or seeking IIE or SE, or career advancement in these types of employment: up to twenty (20) hours. This service may be authorized no more than once every two (2) years (with a minimum of two 365-day intervals between services).\n\nb. Supplementary Benefits Counseling for someone evaluating an IIE job offer/promotion or SE opportunity: up to an additional six (6) hours. This service may be authorized up to three (3) times per year if needed.\n\nc. PRN (pro re nata/as needed) Problem-Solving services for someone to maintain IIE or SE: up to eight (8) hours per situation requiring PRN assistance. This service may be authorized up to four (4) times per year if necessary for the individual to maintain IIE or SE.\n\nThe Waiver will not cover SE-Ind Benefits Counseling services which are otherwise available to the individual under section 110 of the Rehabilitation Act of 1973, or the IDEA (20 U.S.C. 1401 et seq.). If one or more of these services are authorized, documentation is maintained that the service is not available to the individual under a program funded under section 110 of the Rehabilitation Act of 1973 or the IDEA (20 U.S.C. 1401 et seq.).\n\nSE-Ind Benefits Counseling shall not be provided during the same time period that the person is receiving Personal Assistance, Respite, or services under a 504 Plan or Individual Education Program (IEP), is being homeschooled, or any combination thereof, or as a substitute for education services which are available pursuant to the Individual with Disabilities Education Act (IDEA), but which the person or his/her legal representative has elected to forego. Except for students who have graduated prior to May 2014, employment and day services for school aged persons (i.e., under the age of 22) are limited to regular school break periods.\n\nThese services are only for individuals seeking or engaged in IIE or SE.\n\nThese services do not include supporting paid employment or training in a sheltered workshop or similar facility-based setting. However, those individuals who are currently employed by a provider to fulfill a contract authorized pursuant to TCA 71-4-701 et seq. may continue to receive supported employment services for paid employment or training until the contract expires or the person loses the employment for any other reason. At that point, any supported employment services the person receives must fully align with best practices in competitive integrated employment and the State’s commitment to Employment First and will no longer be used to support employment or training in a business enterprise owned or operated by or affiliated with a provider of these services. In limited circumstances where the person is working in an integrated employment arrangement, but the provider agency is serving as the Employer of Record (EOR), providers will be permitted to bill for Employment Supports while EOR responsibilities are transitioned from the provider to the business/entity offering the integrated employment opportunity, in order to ensure that employment is not disrupted.\n\nThese services do not include payment for supervisory activities rendered as a normal part of the business setting and supports otherwise available to employees without disabilities filling the same or similar positions in the business.\n\nNon-residential habilitation services (SE-Ind (except as noted below); Small Group ES; Community Participation Supports; IE&CI Wrap-Around Supports; FB Day Supports) and either the Residential SNA-Homebound (HB) or the Non-Residential HB Service, when combined, may involve no more than 5,832 quarter hour units/year and no more than 240 quarter hour units in a fourteen-day billing period. The Residential SNA-HB and the Non-Residential HB Service are paid on a per diem basis and each day shall be considered as 24 quarter hour units for the purposes of including this service in the annual and billing period limits. Under SE-Ind, authorizations of Benefits Counseling, Exploration, Discovery, and Job Development are not included in these limits.\n\nThese services will not duplicate other services provided through the Waiver or the Medicaid State Plan.\n\nFederal financial participation is not claimed for incentive payments, subsidies, or unrelated vocational training expenses such as the following:\n\n•Incentive payments made to an employer to encourage or subsidize the employer's participation in supported employment;\n\n•Payments that are passed through to users of supported employment services; or •Payments for training that is not directly related to an individual’s supported employment program. A provider of SE-Ind Benefits Counseling services may also receive Social Security’s Ticket to Work Outcome and Milestone payments. These payments do not conflict with CMS regulatory requirements and do not constitute an overpayment of Federal dollars for services provided","url":"","verified":"","notes":"","row":8},{"id":"tn-supported-employment-individual-benefits-counseling-waiver-s","state":"TN","title":"Supported Employment Individual Benefits Counseling – Waiver Service Agency Provider Specifications (Waiver)","name":"Supported Employment Individual Benefits Counseling – Waiver Service Agency Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check\n\nperformed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\n6. All providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements.\n\nProviders must be certified to provide Benefits Counseling as required in TennCare protocol.\n\nVerification every 12-18 months","url":"","verified":"","notes":"","row":9},{"id":"tn-supported-employment-individual-benefits-counseling-legally-","state":"TN","title":"Supported Employment Individual Benefits Counseling – Legally Responsible Person Provider Specifications (Waiver)","name":"Supported Employment Individual Benefits Counseling – Legally Responsible Person Provider Specifications","source":"Waiver","category":"employment","topic":"provider","text":"The provider must meet the general requirements for all waiver service providers:\n\n1. Staff who have direct contact with or direct responsibility for the service recipient shall be able to effectively read, write, and communicate verbally in English and shall be able to read and understand instructions, perform record-keeping, and write reports.\n\n2. Any waiver service provider who is responsible for transporting a service recipient shall ensure that the driver has a valid driver’s license and automobile liability insurance.\n\n3. Staff who have direct contact with or direct responsibility for the service recipient shall pass a criminal background check performed in accordance with a process approved by the Department of Disability and Aging (DDA).\n\n4. Staff who have direct contact with or direct responsibility for the service recipient shall not be listed in the Tennessee Department of Health Abuse Registry or the National Sexual Offender Registry.\n\n5. Waiver service providers shall not have been excluded from participation in the Medicare or Medicaid programs.\n\nAll providers must comply with TennCare-approved policies, procedures, and rules for waiver service providers, including quality monitoring requirements.\n\nProviders must be certified to provide Benefits Counseling as required in TennCare protocol.\n\nVerification every 12-18 months","url":"","verified":"","notes":"","row":10},{"id":"tn-supported-employment-individual-discovery-waiver","state":"TN","title":"Supported Employment Individual Discovery (waiver)","name":"Supported Employment Individual Discovery","source":"waiver","category":"career","topic":"definition","text":"Supported Employment Individual-Discovery (SE-Ind Discovery) is a time-limited and targeted service for a person who wishes to pursue Individualized Integrated Employment (IIE) or Self-Employment (SE) as defined in TennCare Rule, but for whom more information is needed to determine the following prior to pursuing IIE or SE:\n\no Strongest interests toward one or more specific aspects of the labor market;\n\no Skills, strengths and other contributions likely to be valuable to employers or valuable to the community if offered through SE;\n\no Conditions necessary for successful employment or SE.\n\nDiscovery involves a comprehensive analysis of the person in relation to the three bullets above. Activities include observation of person in familiar places and activities, interviews with family, friends and others who know the person well, observation of the person in an unfamiliar place and activity, identification of the person’s strong interests and existing strengths and skills that are transferable to IIE or SE, Discovery also involves identification of conditions for success based on experience shared by the person and others who know the person well, and observation of the person during the Discovery process. The information developed through Discovery allows for activities of typical life to be translated into possibilities for IIE or SE.\n\nDiscovery results in the production of a detailed written Profile, using a standard template prescribed by DDA, which summarizes the process, learning and recommendations to inform identification of the person’s IIE or SE goal(s) and strategies to be used in securing this employment or SE for the person.\n\nIf Discovery is paid for through the Waiver, the person should be assisted by his or her ISC/DDA Case Manager to apply to Vocational Rehabilitation (VR) for services to obtain IIE or SE. The Discovery Profile will be shared with VR staff to facilitate the expeditious development of an Individual Plan for Employment (IPE). Discovery shall be limited to no more
